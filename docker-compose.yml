# Multi-Agent Orchestrator – Docker Compose Konfiguration
#
# HINWEIS: Die Claude Code CLI ist im Container NICHT verfügbar.
# Der Container stellt nur den Web-Server + API bereit.
# Für vollständige Agent-Orchestrierung muss die Claude CLI
# auf dem Host-System installiert sein.
#
# Starten: docker compose up -d
# Logs:    docker compose logs -f

version: '3.8'
services:
  app:
    build: .
    ports:
      - "${PORT:-3131}:3131"
    volumes:
      - ./projects:/app/projects
    environment:
      - NODE_ENV=production
      - PORT=3131
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3131/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
