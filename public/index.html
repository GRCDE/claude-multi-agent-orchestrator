function resumeProject(id) {
  if (!confirm('Projekt "' + id + '" fortsetzen?')) return;
  authFetch('/api/resume/' + encodeURIComponent(id), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({})
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Fehler'); });
    addBanner('success', 'Projekt wird fortgesetzt...');
  }).catch(function(err) {
    addBanner('error', 'Fortsetzen fehlgeschlagen: ' + err.message);
  });
}

// ── Render: Kalender-View ───────────────────────────────────
function calendarPrev() {
  calendarMonth--;
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  calendarPopupDay = null;
  renderHistory();
}

function calendarNext() {
  calendarMonth++;
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  calendarPopupDay = null;
  renderHistory();
}

function calendarToday() {
  calendarMonth = new Date().getMonth();
  calendarYear = new Date().getFullYear();
  calendarPopupDay = null;
  renderHistory();
}

function toggleCalendarPopup(dayKey) {
  calendarPopupDay = calendarPopupDay === dayKey ? null : dayKey;
  renderHistory();
}

function renderCalendarView() {
  var projects = getFilteredHistory();
  var dayMap = {};
  projects.forEach(function(p) {
    var ts = p.createdAt || 0;
    if (!ts) return;
    var d = new Date(ts);
    var key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (!dayMap[key]) dayMap[key] = [];
    dayMap[key].push(p);
  });

  var monthNames = ['Januar','Februar','M\u00E4rz','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var html = '<div class="cal-nav">' +
    '<button class="cal-nav-btn" onclick="calendarPrev()">&larr;</button>' +
    '<span class="cal-month-label">' + monthNames[calendarMonth] + ' ' + calendarYear + '</span>' +
    '<button class="cal-nav-btn" onclick="calendarNext()">&rarr;</button>' +
    '<button class="cal-nav-btn" onclick="calendarToday()" style="font-size:11px">Heute</button>' +
  '</div>';

  html += '<div class="cal-grid">';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(function(wd) {
    html += '<div class="cal-header">' + wd + '</div>';
  });

  var firstDay = new Date(calendarYear, calendarMonth, 1);
  var startDow = (firstDay.getDay() + 6) % 7;
  var daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
  var today = new Date();
  var todayKey = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

  var prevMonthDays = new Date(calendarYear, calendarMonth, 0).getDate();
  for (var si = startDow - 1; si >= 0; si--) {
    html += '<div class="cal-day other-month"><div class="cal-day-num">' + (prevMonthDays - si) + '</div></div>';
  }

  for (var day = 1; day <= daysInMonth; day++) {
    var dateKey = calendarYear + '-' + String(calendarMonth+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    var dayProjects = dayMap[dateKey] || [];
    var isToday = dateKey === todayKey;
    var hasPrj = dayProjects.length > 0;
    html += '<div class="cal-day' + (isToday ? ' today' : '') + (hasPrj ? ' has-projects' : '') + '"' +
      (hasPrj ? ' onclick="toggleCalendarPopup(\'' + dateKey + '\')"' : '') + '>' +
      '<div class="cal-day-num">' + day + '</div>';
    if (hasPrj) {
      html += '<div class="cal-dots">';
      dayProjects.slice(0, 5).forEach(function(p) {
        var ph = p.phase || '';
        var dotCls = (ph === 'complete' || ph === 'done') ? 'done' : ph === 'error' ? 'error' : (ph === 'partial') ? 'partial' : 'other';
        html += '<div class="cal-dot ' + dotCls + '" title="' + esc(p.title || p.id) + '"></div>';
      });
      if (dayProjects.length > 5) html += '<span style="font-size:9px;color:var(--txt3)">+' + (dayProjects.length - 5) + '</span>';
      html += '</div>';
      if (calendarPopupDay === dateKey) {
        html += '<div class="cal-day-popup" onclick="event.stopPropagation()">';
        dayProjects.forEach(function(p) {
          var ppid = esc(p.id || p);
          html += '<div class="cal-day-popup-item" onclick="loadProject(\'' + ppid + '\')">' +
            '<span class="cal-day-popup-title">' + esc(p.title || ppid) + '</span>' +
            (p.projectScore != null ? scoreBadge(p.projectScore) : '') +
            badge(p.phase || 'unknown') +
          '</div>';
        });
        html += '</div>';
      }
    }
    html += '</div>';
  }

  var totalCells = startDow + daysInMonth;
  var calRemaining = (7 - (totalCells % 7)) % 7;
  for (var cr = 1; cr <= calRemaining; cr++) {
    html += '<div class="cal-day other-month"><div class="cal-day-num">' + cr + '</div></div>';
  }

  html += '</div>';
  return html;
}

// ── Render: Statistik-View ──────────────────────────────────
function renderStatsView() {
  var projects = projectHistory;
  if (projects.length === 0) return '<div class="history-empty">Keine Projektdaten vorhanden.</div>';

  var totalProjects = projects.length;
  var totalAgents = 0, totalFiles = 0, totalDuration = 0, durationCount = 0;
  var scoreSum = 0, scoreCount = 0;
  var doneCount = 0, errorCount = 0;

  projects.forEach(function(p) {
    totalAgents += p.agentCount || 0;
    if (p.projectStats) totalFiles += p.projectStats.totalFiles || 0;
    if (p.totalDuration != null) { totalDuration += p.totalDuration; durationCount++; }
    if (p.projectScore != null) { scoreSum += p.projectScore; scoreCount++; }
    var ph = p.phase || '';
    if (ph === 'complete' || ph === 'done') doneCount++;
    else if (ph === 'error') errorCount++;
  });

  var avgScore = scoreCount > 0 ? Math.round(scoreSum / scoreCount) : 0;
  var avgDuration = durationCount > 0 ? Math.round(totalDuration / durationCount) : 0;
  var avgAgents = totalProjects > 0 ? (totalAgents / totalProjects).toFixed(1) : '0';
  var successRate = totalProjects > 0 ? Math.round((doneCount / totalProjects) * 100) : 0;
  var errorRate = totalProjects > 0 ? Math.round((errorCount / totalProjects) * 100) : 0;
  var otherRate = Math.max(0, 100 - successRate - errorRate);

  var html = '<div class="stats-dashboard">';

  html += '<div class="stats-section-title">Gesamt-Statistiken</div>';
  html += '<div class="stats-row">' +
    '<div class="stats-card"><div class="stats-card-value">' + totalProjects + '</div><div class="stats-card-label">Projekte</div></div>' +
    '<div class="stats-card"><div class="stats-card-value">' + totalAgents + '</div><div class="stats-card-label">Agenten</div></div>' +
    '<div class="stats-card"><div class="stats-card-value">' + totalFiles + '</div><div class="stats-card-label">Dateien</div></div>' +
    '<div class="stats-card"><div class="stats-card-value">' + doneCount + '</div><div class="stats-card-label">Abgeschlossen</div></div>' +
    '<div class="stats-card"><div class="stats-card-value">' + errorCount + '</div><div class="stats-card-label">Fehlgeschlagen</div></div>' +
  '</div>';

  html += '<div class="stats-section-title">Durchschnittliche Metriken</div>';
  html += '<div class="stats-row">' +
    '<div class="stats-card"><div class="stats-card-value">' + avgScore + '</div><div class="stats-card-label">Score</div></div>' +
    '<div class="stats-card"><div class="stats-card-value">' + formatDuration(avgDuration) + '</div><div class="stats-card-label">Dauer</div></div>' +
    '<div class="stats-card"><div class="stats-card-value">' + avgAgents + '</div><div class="stats-card-label">Agents / Projekt</div></div>' +
  '</div>';

  html += '<div class="stats-section-title">Erfolgsrate</div>';
  html += '<div class="stats-success-bar">';
  if (successRate > 0) html += '<div class="stats-success-fill done" style="width:' + successRate + '%">' + successRate + '%</div>';
  if (errorRate > 0) html += '<div class="stats-success-fill error" style="width:' + errorRate + '%">' + errorRate + '%</div>';
  if (otherRate > 0) html += '<div class="stats-success-fill other" style="width:' + otherRate + '%">' + otherRate + '%</div>';
  html += '</div>';
  html += '<div style="display:flex;gap:12px;margin-top:6px;font-size:11px;color:var(--txt3)">' +
    '<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block"></span>Fertig ' + successRate + '%</span>' +
    '<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block"></span>Fehler ' + errorRate + '%</span>' +
    '<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--gray);display:inline-block"></span>Sonstige ' + otherRate + '%</span>' +
  '</div>';

  var scoredProjects = projects.filter(function(p) { return p.projectScore != null; });
  if (scoredProjects.length > 0) {
    var topProjects = scoredProjects.slice().sort(function(a, b) { return (b.projectScore || 0) - (a.projectScore || 0); }).slice(0, 5);
    html += '<div class="stats-section-title">Top-Projekte (h\u00F6chster Score)</div>';
    html += '<ul class="stats-top-list">';
    topProjects.forEach(function(p, idx) {
      html += '<li class="stats-top-item">' +
        '<span style="color:var(--txt3);min-width:20px">#' + (idx + 1) + '</span>' +
        '<span class="stats-top-name" onclick="loadProject(\'' + esc(p.id) + '\')" style="cursor:pointer;color:var(--blue)">' + esc(p.title || p.id) + '</span>' +
        '<span class="stats-top-value">' + scoreBadge(p.projectScore) + '</span>' +
      '</li>';
    });
    html += '</ul>';
  }

  html += '<div class="stats-section-title">Trend: Projekte pro Woche (letzte 8 Wochen)</div>';
  var weekBuckets = [];
  var nowDate = new Date();
  for (var wk = 7; wk >= 0; wk--) {
    var weekStart = new Date(nowDate);
    weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1 - (wk * 7));
    weekStart.setHours(0,0,0,0);
    var weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 7);
    var wCount = 0;
    projects.forEach(function(p) {
      var ts = p.createdAt || 0;
      if (ts >= weekStart.getTime() && ts < weekEnd.getTime()) wCount++;
    });
    weekBuckets.push({ label: weekStart.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit'}), count: wCount });
  }
  var maxWeekCount = Math.max(1, Math.max.apply(null, weekBuckets.map(function(b) { return b.count; })));

  html += '<div class="stats-bar-chart">';
  weekBuckets.forEach(function(b) {
    var pct = Math.round((b.count / maxWeekCount) * 100);
    html += '<div class="stats-bar-col">' +
      '<div class="stats-bar-value">' + b.count + '</div>' +
      '<div class="stats-bar" style="height:' + Math.max(2, pct) + '%"></div>' +
      '<div class="stats-bar-label">' + b.label + '</div>' +
    '</div>';
  });
  html += '</div>';

  if (analyticsData && analyticsData.costEfficiency) {
    var ce = analyticsData.costEfficiency;
    html += '<div class="stats-section-title">Kosten-Effizienz</div>';
    html += '<div class="stats-row">' +
      '<div class="stats-card"><div class="stats-card-value">' + formatTokens(ce.avgTokensPerProject) + '</div><div class="stats-card-label">Tokens / Projekt</div></div>' +
      '<div class="stats-card"><div class="stats-card-value">' + formatTokens(ce.avgTokensPerAgent) + '</div><div class="stats-card-label">Tokens / Agent</div></div>' +
      '<div class="stats-card"><div class="stats-card-value">' + formatCost(ce.avgCostPerProject) + '</div><div class="stats-card-label">Kosten / Projekt</div></div>' +
    '</div>';
  }

  if (analyticsData && analyticsData.distribution) {
    var sb = analyticsData.distribution.scoreBuckets || [];
    var maxBucket = Math.max(1, Math.max.apply(null, sb.map(function(b) { return b.count; })));
    html += '<div class="stats-section-title">Score-Verteilung</div>';
    html += '<div class="stats-bar-chart">';
    sb.forEach(function(b) {
      var pct = Math.round((b.count / maxBucket) * 100);
      html += '<div class="stats-bar-col">' +
        '<div class="stats-bar-value">' + b.count + '</div>' +
        '<div class="stats-bar" style="height:' + Math.max(2, pct) + '%;background:' + (b.range === '81-100' ? 'var(--green)' : b.range === '61-80' ? 'var(--teal)' : b.range === '41-60' ? 'var(--amber)' : 'var(--red)') + '"></div>' +
        '<div class="stats-bar-label">' + b.range + '</div>' +
      '</div>';
    });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

// ── Render: Listen-View (erweitert mit Karten) ──────────────
function renderListView() {
  var filtered = getFilteredHistory();
  if (filtered.length === 0) {
    return '<div class="history-empty">Keine Projekte gefunden (Filter aktiv).</div>';
  }
  var html = '';
  if (projectHistory.length >= 2) {
    if (compareMode) {
      html += '<div class="compare-actions">' +
        '<button class="compare-start-btn" onclick="startComparison()"' + (compareSelected.length !== 2 ? ' disabled' : '') + '>Vergleich starten</button>' +
        '<button class="compare-cancel-btn" onclick="toggleCompareMode()">Abbrechen</button>' +
        '<span class="compare-hint">' + esc(compareSelected.length + ' von 2 ausgew\u00E4hlt') + '</span>' +
      '</div>';
    } else if (bulkSelectMode) {
      var bulkCount = bulkSelected.size;
      html += '<div class="bulk-actions">' +
        '<span class="bulk-count">' + esc(bulkCount + ' ausgew\u00E4hlt') + '</span>' +
        '<button class="bulk-btn bulk-btn-delete" onclick="bulkDelete()"' + (bulkCount === 0 ? ' disabled' : '') + '>Ausgew\u00E4hlte l\u00F6schen</button>' +
        '<button class="bulk-btn bulk-btn-export" onclick="bulkExport()"' + (bulkCount === 0 ? ' disabled' : '') + '>Ausgew\u00E4hlte exportieren</button>' +
        '<button class="bulk-btn bulk-btn-select" onclick="selectAll()">Alle</button>' +
        '<button class="bulk-btn bulk-btn-select" onclick="deselectAll()">Keine</button>' +
        '<button class="bulk-btn bulk-btn-cancel" onclick="toggleBulkSelect()">Abbrechen</button>' +
      '</div>';
    } else {
      html += '<div style="display:flex;gap:6px;margin-bottom:8px">' +
        '<button class="btn-sm" onclick="toggleBulkSelect()" style="font-size:11px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--border);background:var(--bg2);color:var(--txt2);cursor:pointer">Ausw\u00E4hlen</button>' +
        '<button class="btn-sm" onclick="toggleCompareMode()" style="font-size:11px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--border);background:var(--bg2);color:var(--txt2);cursor:pointer">Vergleichen</button>' +
      '</div>';
    }
  }
  filtered.forEach(function(p) {
    html += renderHistoryCard(p);
  });
  html += '<div class="history-actions"><button class="btn-sm" onclick="cleanupProjects()">Alte Projekte aufr\u00E4umen</button></div>';
  return html;
}

// ── renderHistory (Hauptfunktion) ────────────────────────────
function renderHistory() {
  var area = document.getElementById('historyArea');
  if (!area) return;
  if (projectHistory.length === 0) {
    area.innerHTML = '<div class="section-label">Bisherige Projekte</div><div class="history-empty">Noch keine Projekte vorhanden.</div><div class="disk-usage" id="diskUsageInfo"></div>';
    loadDiskUsage();
    return;
  }
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
    '<div class="section-label" style="margin-bottom:0">Bisherige Projekte (' + projectHistory.length + ')</div>' +
  '</div>';
  html += renderHistoryTabs();
  if (historyView === 'list' || historyView === 'calendar') {
    html += renderHistoryFilters();
  }
  if (historyView === 'list') {
    html += renderListView();
  } else if (historyView === 'calendar') {
    html += renderCalendarView();
  } else if (historyView === 'stats') {
    html += renderStatsView();
  }
  html += '<div class="disk-usage" id="diskUsageInfo"></div>';
  area.innerHTML = html;
  loadDiskUsage();
}

function toggleCompareMode() {
  compareMode = !compareMode;
  compareSelected = [];
  bulkSelectMode = false;
  bulkSelected = new Set();
  renderHistory();
}

function toggleBulkSelect() {
  bulkSelectMode = !bulkSelectMode;
  bulkSelected = new Set();
  compareMode = false;
  compareSelected = [];
  renderHistory();
}

function toggleBulkItem(id) {
  if (bulkSelected.has(id)) {
    bulkSelected.delete(id);
  } else {
    bulkSelected.add(id);
  }
  renderHistory();
}

function selectAll() {
  bulkSelected = new Set();
  projectHistory.forEach(function(p) {
    var pid = p.id || p;
    bulkSelected.add(pid);
  });
  renderHistory();
}

function deselectAll() {
  bulkSelected = new Set();
  renderHistory();
}

async function bulkDelete() {
  if (bulkSelected.size === 0) return;
  var ids = Array.from(bulkSelected);
  if (!confirm(ids.length + ' Projekt(e) wirklich l\u00F6schen? Diese Aktion kann nicht r\u00FCckg\u00E4ngig gemacht werden.')) return;
  var successCount = 0;
  var errorCount = 0;
  for (var i = 0; i < ids.length; i++) {
    try {
      var r = await authFetch('/api/projects/' + encodeURIComponent(ids[i]), { method: 'DELETE', headers: authHeadersNoBody() });
      if (!r.ok) throw new Error('Fehler');
      successCount++;
    } catch (e) {
      errorCount++;
    }
  }
  if (successCount > 0) addBanner('success', successCount + ' Projekt(e) gel\u00F6scht.');
  if (errorCount > 0) addBanner('error', errorCount + ' Projekt(e) konnten nicht gel\u00F6scht werden.');
  bulkSelected = new Set();
  bulkSelectMode = false;
  loadHistory();
}

function bulkExport() {
  if (bulkSelected.size === 0) return;
  var ids = Array.from(bulkSelected);
  ids.forEach(function(id) {
    window.open('/api/export/' + encodeURIComponent(id), '_blank');
  });
}

function toggleCompareSelect(pid) {
  var idx = compareSelected.indexOf(pid);
  if (idx !== -1) {
    compareSelected.splice(idx, 1);
  } else if (compareSelected.length < 2) {
    compareSelected.push(pid);
  }
  renderHistory();
}

async function startComparison() {
  if (compareSelected.length !== 2) return;
  try {
    var responses = await Promise.all([
      fetch('/api/projects/' + encodeURIComponent(compareSelected[0])).then(function(r) { if (!r.ok) throw new Error('Projekt nicht gefunden'); return r.json(); }),
      fetch('/api/projects/' + encodeURIComponent(compareSelected[1])).then(function(r) { if (!r.ok) throw new Error('Projekt nicht gefunden'); return r.json(); })
    ]);
    openCompareModal(responses[0], responses[1]);
  } catch (e) {
    addBanner('error', 'Vergleich fehlgeschlagen: ' + e.message);
  }
}

function extractCompareStats(proj) {
  var agents = proj.agents || [];
  var totalRounds = agents.reduce(function(s, a) { return s + (a.rounds || 0); }, 0);
  var totalQuestions = agents.reduce(function(s, a) { return s + (a.questions || 0); }, 0);
  var doneCount = agents.filter(function(a) { return a.status === 'done'; }).length;
  var errorCount = agents.filter(function(a) { return a.status === 'error'; }).length;
  return {
    title: proj.projectTitle || proj.id || '(Unbenannt)',
    phase: proj.phase || 'unbekannt',
    agentCount: agents.length,
    doneCount: doneCount,
    errorCount: errorCount,
    totalRounds: totalRounds,
    totalQuestions: totalQuestions,
    duration: proj.totalDuration,
    agents: agents,
    projectStats: proj.projectStats || null,
    projectScore: proj.projectScore || null
  };
}

function renderCompareCol(stats) {
  var html = '<div class="compare-col">' +
    '<div class="compare-col-title">' + esc(stats.title) + '</div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Status</span><span class="compare-stat-value">' + badge(stats.phase) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Agenten</span><span class="compare-stat-value">' + esc(String(stats.agentCount)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Erfolgreich</span><span class="compare-stat-value">' + esc(String(stats.doneCount)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Fehlgeschlagen</span><span class="compare-stat-value">' + esc(String(stats.errorCount)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Runden gesamt</span><span class="compare-stat-value">' + esc(String(stats.totalRounds)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Fragen gesamt</span><span class="compare-stat-value">' + esc(String(stats.totalQuestions)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Dauer</span><span class="compare-stat-value">' + esc(stats.duration != null ? formatDuration(stats.duration) : '\u2014') + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Qualit\u00E4ts-Score</span><span class="compare-stat-value">' + (stats.projectScore != null ? scoreBadge(stats.projectScore) : '\u2014') + '</span></div>' +
    (stats.projectStats ? '<div class="compare-stat"><span class="compare-stat-label">Dateien</span><span class="compare-stat-value">' + esc(String(stats.projectStats.totalFiles || 0)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Zeilen</span><span class="compare-stat-value">' + esc(String(stats.projectStats.totalLines || 0)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Dateigr\u00F6\u00DFe</span><span class="compare-stat-value">' + formatFileSize(stats.projectStats.totalSize || 0) + '</span></div>' : '');

  if (stats.agents.length > 0) {
    html += '<div class="compare-agents-title">Agenten</div>';
    stats.agents.forEach(function(a, i) {
      html += '<div class="compare-agent-row">' +
        '<span style="color:var(--txt3);font-size:11px;min-width:18px">A' + (i + 1) + '</span>' +
        '<span class="compare-agent-name">' + esc(a.title || '\u2014') + '</span>' +
        (a.score != null ? scoreBadge(a.score) + ' ' : '') +
        badge(a.status || 'waiting') +
      '</div>';
    });
  }
  html += '</div>';
  return html;
}

function openCompareModal(proj1, proj2) {
  closeCompareModal();
  var stats1 = extractCompareStats(proj1);
  var stats2 = extractCompareStats(proj2);

  var overlay = document.createElement('div');
  overlay.id = 'compareModal';
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Projektvergleich');
  overlay.setAttribute('tabindex', '-1');
  overlay.onclick = function(e) { if (e.target === overlay) closeCompareModal(); };

  overlay.innerHTML = '<div class="modal compare-modal">' +
    '<button class="modal-close" aria-label="Dialog schlie\u00DFen" onclick="closeCompareModal()" title="Schlie\u00DFen">\u00D7</button>' +
    '<h3>Projektvergleich</h3>' +
    '<div class="compare-layout">' +
      renderCompareCol(stats1) +
      renderCompareCol(stats2) +
    '</div>' +
  '</div>';

  document.body.appendChild(overlay);
  document.addEventListener('keydown', compareModalKeyHandler);
}

function closeCompareModal() {
  var el = document.getElementById('compareModal');
  if (el) el.remove();
  document.removeEventListener('keydown', compareModalKeyHandler);
}

function compareModalKeyHandler(e) {
  if (e.key === 'Escape') closeCompareModal();
}

function deleteProject(id) {
  if (!confirm('Projekt "' + id + '" wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.')) return;
  authFetch('/api/projects/' + encodeURIComponent(id), { method: 'DELETE', headers: authHeadersNoBody() })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Fehler'); });
      return r.json();
    })
    .then(function() {
      addBanner('success', 'Projekt ' + id + ' gelöscht.');
      loadHistory();
    })
    .catch(function(err) {
      addBanner('error', 'Löschen fehlgeschlagen: ' + err.message);
    });
}

function cleanupProjects() {
  if (!confirm('Alle Projekte löschen, die älter als 7 Tage sind?')) return;
  authFetch('/api/cleanup', { method: 'POST', headers: authHeadersNoBody() })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Fehler'); });
      return r.json();
    })
    .then(function(data) {
      if (data.count > 0) {
        addBanner('success', data.count + ' alte Projekt(e) gelöscht.');
      } else {
        addBanner('info', 'Keine Projekte älter als 7 Tage gefunden.');
      }
      loadHistory();
    })
    .catch(function(err) {
      addBanner('error', 'Aufräumen fehlgeschlagen: ' + err.message);
    });
}

function loadDiskUsage() {
  fetch('/api/disk-usage').then(function(r) {
    if (!r.ok) throw new Error('Fehler');
    return r.json();
  }).then(function(data) {
    var el = document.getElementById('diskUsageInfo');
    if (!el) return;
    el.textContent = 'Speicher: ' + data.projectCount + ' Projekt(e) • ' + data.totalSize + ' belegt';
  }).catch(function() {});
}

function loadProject(id) {
  if (!confirm('Projekt "' + id + '" laden? Das aktuelle Projekt wird dadurch ersetzt.')) return;
  authFetch('/api/load/' + encodeURIComponent(id), { method: 'POST', headers: authHeadersNoBody() })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Fehler'); });
      return r.json();
    })
    .then(function(data) {
      applyState(data);
      render();
    })
    .catch(function(err) {
      addBanner('error', 'Projekt laden fehlgeschlagen: ' + err.message);
    });
}

// ── Actions ──────────────────────────────────────────────────
var _startBusy = false;
async function startProject() {
  var descEl = document.getElementById('desc');
  var desc = descEl ? descEl.value.trim() : '';
  var sliderEl = document.getElementById('countSlider');
  var count = parseInt(sliderEl ? sliderEl.value : '3');
  if (!desc || busy || _startBusy) return;
  _startBusy = true;
  busy = true;
  requestNotificationPermission();
  var startBtn = document.getElementById('startBtn');
  if (startBtn) { startBtn.disabled = true; startBtn.textContent = 'Startet\u2026'; }

  try {
    state.phase = 'running';
    state.projectTitle = '';
    state.projectSummary = '';
    state.coordinator = { status: 'planning', summary: '', activeQuestion: null, log: [], interimReports: [], finalReport: null, adaptations: [] };
    state.agents = [];
    for (var i = 0; i < count; i++) {
      state.agents.push({
        id: i, title: 'Wird geplant\u2026', task: '', deliverable: '',
        status: 'waiting', conversation: [], rounds: 0, questions: 0
      });
    }
    render();

    var approvalEl = document.getElementById('approvalCheck');
    var requireApproval = approvalEl ? approvalEl.checked : false;
    var prioEl = document.getElementById('prioritySelect');
    var priority = prioEl ? parseInt(prioEl.value) : 2;

    await authFetch('/api/start', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ description: desc, agentCount: count, requireApproval: requireApproval, priority: priority })
    });
  } catch (e) {
    addBanner('error', 'Fehler beim Starten: ' + e.message);
    state.phase = 'setup';
    render();
  } finally {
    _startBusy = false;
    busy = false;
    if (startBtn) startBtn.disabled = false;
  }
}

var _abortBusy = false;
async function abortProject() {
  if (!confirm('Laufendes Projekt wirklich abbrechen? Bereits abgeschlossene Agenten-Ergebnisse bleiben erhalten.')) return;
  if (_abortBusy) return;
  _abortBusy = true;
  try {
    var r = await authFetch('/api/abort', { method: 'POST', headers: authHeadersNoBody() });
    if (!r.ok) {
      var d = await r.json();
      throw new Error(d.error || 'Fehler');
    }
    addBanner('warn', 'Projekt wurde abgebrochen.');
  } catch (err) {
    addBanner('error', 'Abbrechen fehlgeschlagen: ' + err.message);
  } finally {
    _abortBusy = false;
  }
}

async function resetProject() {
  if (!confirm('Projekt wirklich zur\u00FCcksetzen?')) return;
  try {
    var r = await authFetch('/api/reset', { method: 'POST', headers: authHeadersNoBody() });
    if (!r.ok) {
      var d = await r.json();
      addBanner('error', d.error || 'Reset fehlgeschlagen');
      return;
    }
  } catch (e) {
    addBanner('error', 'Reset fehlgeschlagen: ' + e.message);
    return;
  }
  state = {
    phase: 'setup', projectTitle: '', projectSummary: '', projectDir: '',
    coordinator: { status: 'idle', summary: '', activeQuestion: null, log: [], interimReports: [], finalReport: null, adaptations: [] },
    agents: [], startedAt: null, completedAt: null, totalDuration: null,
    sharedContextBoard: [],
  };
  banners = [];
  mergedFiles = null;
  sharedContextPanelOpen = false;
  sharedFiles = [];
  compareMode = false;
  compareSelected = [];
  fileTreeOpen = false;
  fileGroupState = {};
  ftFolderState = {};
  fileTreeLastData = null;
  fileTreeLastHash = '';
  agentTimeline = {};
  viewMode = 'cards';
  stopTimelineTimer();
  stopFileTreePolling();
  render();
}

var _cloneBusy = false;
async function cloneProject(projectId) {
  if (_cloneBusy) return;
  // Projekt-ID ermitteln: entweder als Parameter oder aus aktuellem State
  var id = projectId;
  if (!id) {
    var dir = state.projectDir || '';
    id = dir.split('/').pop() || dir.split('\\').pop() || '';
  }
  if (!id || !id.startsWith('proj_')) {
    addBanner('error', 'Keine gültige Projekt-ID gefunden.');
    return;
  }
  _cloneBusy = true;
  try {
    var r = await authFetch('/api/clone/' + encodeURIComponent(id), { method: 'POST', headers: authHeadersNoBody() });
    if (!r.ok) {
      var err = await r.json();
      throw new Error(err.error || 'Fehler beim Klonen');
    }
    var data = await r.json();
    // Reset auf Setup-Ansicht
    await authFetch('/api/reset', { method: 'POST', headers: authHeadersNoBody() });
    state = {
      phase: 'setup', projectTitle: '', projectSummary: '', projectDir: '',
      coordinator: { status: 'idle', summary: '', activeQuestion: null, log: [], interimReports: [], finalReport: null, adaptations: [] },
      agents: [], startedAt: null, completedAt: null, totalDuration: null
    };
    banners = [];
    mergedFiles = null;
    fileTreeOpen = false;
    fileGroupState = {};
    ftFolderState = {};
    fileTreeLastData = null;
    fileTreeLastHash = '';
    stopFileTreePolling();
    render();
    // Formular vorausfüllen
    var descEl = document.getElementById('desc');
    if (descEl && data.description) {
      descEl.value = data.description;
    }
    var sliderEl = document.getElementById('countSlider');
    var displayEl = document.getElementById('countDisplay');
    if (sliderEl && data.agentCount) {
      var count = Math.min(Math.max(2, data.agentCount), 10);
      sliderEl.value = count;
      if (displayEl) displayEl.textContent = count;
    }
    addBanner('success', 'Projekteinstellungen geladen. Du kannst sie anpassen und neu starten.');
  } catch (e) {
    addBanner('error', 'Klonen fehlgeschlagen: ' + e.message);
  } finally {
    _cloneBusy = false;
  }
}

function getProjectId() {
  var dir = state.projectDir || '';
  return dir.split('/').pop() || dir.split('\\').pop() || '';
}

function exportProject() {
  var id = getProjectId();
  if (!id) {
    addBanner('error', 'Keine Projekt-ID gefunden.');
    return;
  }
  window.location = '/api/export/' + encodeURIComponent(id);
}

function exportProjectJSON() {
  var id = getProjectId();
  if (!id) { addBanner('error', 'Keine Projekt-ID verfügbar'); return; }
  window.open('/api/export-json/' + encodeURIComponent(id), '_blank');
}

function exportProjectMarkdown() {
  var id = getProjectId();
  if (!id) { addBanner('error', 'Keine Projekt-ID verfügbar'); return; }
  window.open('/api/export-markdown/' + encodeURIComponent(id), '_blank');
}

function togglePrintPreview() { document.body.classList.toggle('print-preview'); }
function exitPrintPreview() { document.body.classList.remove('print-preview'); }
function printFromPreview() { document.body.classList.remove('print-preview'); setTimeout(function() { window.print(); }, 100); }

// ── Bericht erstellen (Report-Generator) ─────────────────────
function generateReport() {
  var agents = state.agents || [];
  var coord = state.coordinator || {};
  var finalReport = coord.finalReport || null;
  var tokenTotals = getTokenUsageTotals();

// ── Merge-System: Zusammengefuehrte Dateien Sektion rendern ──
function renderMergedFilesSection(mf, borderColor, isPartialMerge) {
  var ms = mf.mergeStats || {};
  var h = '<div class="card fadein merge-section" style="border-color:' + borderColor + ';margin-top:0.5rem">';
  h += '<div class="section-label">' + (isPartialMerge ? 'Zusammengef\u00FChrte Dateien (nur erfolgreiche Agenten)' : 'Zusammengef\u00FChrte Dateien') + '</div>';
  h += '<div style="font-size:12px;color:var(--txt2);margin-bottom:8px">' + esc(mf.dir || '') + '</div>';

  // Merge-Statistiken anzeigen
  if (ms.totalFiles || ms.conflicts !== undefined) {
    h += '<div class="merge-stats">';
    if (ms.totalFiles) h += '<div class="merge-stat"><div class="merge-stat-label">Dateien</div><div class="merge-stat-value">' + ms.totalFiles + '</div></div>';
    if (ms.conflicts !== undefined) h += '<div class="merge-stat"><div class="merge-stat-label">Konflikte</div><div class="merge-stat-value" style="' + (ms.conflicts > 0 ? 'color:var(--amber)' : '') + '">' + ms.conflicts + '</div></div>';
    if (ms.strategy) h += '<div class="merge-stat"><div class="merge-stat-label">Strategie</div><div class="merge-stat-value">' + esc(ms.strategy) + '</div></div>';
    if (ms.scannedAgents) h += '<div class="merge-stat"><div class="merge-stat-label">Agenten</div><div class="merge-stat-value">' + ms.scannedAgents + '</div></div>';
    if (ms.duration) h += '<div class="merge-stat"><div class="merge-stat-label">Dauer</div><div class="merge-stat-value">' + ms.duration + 'ms</div></div>';
    if (ms.totalSize) h += '<div class="merge-stat"><div class="merge-stat-label">Gr\u00F6\u00DFe</div><div class="merge-stat-value">' + (ms.totalSize < 1024 ? ms.totalSize + ' B' : ms.totalSize < 1048576 ? Math.round(ms.totalSize / 1024) + ' KB' : (ms.totalSize / 1048576).toFixed(2) + ' MB') + '</div></div>';
    h += '</div>';
  }

  // Konflikte hervorheben
  if (ms.conflictDetails && ms.conflictDetails.length > 0) {
    h += '<div style="margin:8px 0"><div style="font-size:11px;font-weight:600;color:var(--amber);margin-bottom:4px">Konflikte:</div>';
    for (var ci = 0; ci < ms.conflictDetails.length; ci++) {
      var cd = ms.conflictDetails[ci];
      h += '<div class="merge-conflict">';
      h += '<div class="merge-conflict-file">' + esc(cd.fileName) + '</div>';
      h += '<div class="merge-conflict-agents">Agenten: ' + cd.agents.map(function(a) { return 'Agent ' + a.agentNum + ' (' + esc(a.agentTitle) + ')'; }).join(', ') + '</div>';
      h += '<div class="merge-conflict-resolution">' + esc(cd.resolution) + '</div>';
      h += '</div>';
    }
    h += '</div>';
  }

  // Dateiliste mit Herkunft
  h += '<div style="display:flex;flex-direction:column;gap:4px">';
  var origins = (ms.fileOrigins || []);
  var originMap = {};
  for (var oi = 0; oi < origins.length; oi++) { originMap[origins[oi].name] = origins[oi]; }
  for (var mi = 0; mi < mf.files.length; mi++) {
    var mfItem = mf.files[mi];
    var fname = typeof mfItem === 'string' ? mfItem : mfItem.name;
    var fsize = typeof mfItem === 'object' && mfItem.size ? ' (' + (mfItem.size < 1024 ? mfItem.size + ' B' : Math.round(mfItem.size / 1024) + ' KB') + ')' : '';
    var originInfo = originMap[fname];
    var originBadge = originInfo ? '<span class="merge-file-origin"' + (originInfo.isConflict ? ' style="background:var(--amber)"' : '') + '>Agent ' + originInfo.agentNum + '</span>' : '';
    h += '<div style="font-family:var(--mono);font-size:12px;padding:4px 8px;background:var(--bg2);border-radius:var(--radius-sm)">' + esc(fname) + '<span style="color:var(--txt3)">' + esc(fsize) + '</span>' + originBadge + '</div>';
  }
  h += '</div>';

  // Merge-Report Toggle
  if (mf.mergeReport) {
    h += '<div style="margin-top:8px"><span class="merge-report-toggle" onclick="toggleMergeReport()">Merge-Report anzeigen/verbergen</span>';
    h += '<div class="merge-report-content" id="mergeReportContent">' + esc(mf.mergeReport) + '</div></div>';
  }

  // Re-Merge Buttons
  h += '<div style="margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">';
  h += '<select class="merge-strategy-select" id="mergeStrategySelect">';
  h += '<option value="latest"' + (ms.strategy === 'latest' ? ' selected' : '') + '>Neueste gewinnt</option>';
  h += '<option value="largest"' + (ms.strategy === 'largest' ? ' selected' : '') + '>Gr\u00F6\u00DFte gewinnt</option>';
  h += '<option value="manual"' + (ms.strategy === 'manual' ? ' selected' : '') + '>Alle behalten</option>';
  h += '</select>';
  h += '<button class="btn-outline" onclick="remergeProject()">Erneut mergen</button>';
  h += '</div>';

  h += '</div>';
  return h;
}

function toggleMergeReport() {
  var el = document.getElementById('mergeReportContent');
  if (el) el.classList.toggle('open');
}

async function remergeProject() {
  var id = getProjectId();
  if (!id) { addBanner('error', 'Keine Projekt-ID verf\u00FCgbar'); return; }
  var sel = document.getElementById('mergeStrategySelect');
  var strategy = sel ? sel.value : 'latest';
  try {
    addBanner('info', 'Re-Merge gestartet (Strategie: ' + strategy + ')...');
    var r = await fetch('/api/merge/' + encodeURIComponent(id), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ strategy: strategy })
    });
    var data = await r.json();
    if (!r.ok) {
      addBanner('error', data.error || 'Re-Merge fehlgeschlagen');
      return;
    }
    var msg = 'Re-Merge abgeschlossen: ' + (data.totalFiles || 0) + ' Dateien';
    if (data.conflicts > 0) msg += ', ' + data.conflicts + ' Konflikte';
    addBanner('ok', msg);
    await loadMergedFiles();
  } catch (e) {
    addBanner('error', 'Fehler beim Re-Merge: ' + e.message);
  }
}

async function loadMergedFiles() {
  var dir = state.projectDir || '';
  var id = dir.split('/').pop() || dir.split('\\').pop() || '';
  if (!id) {
    addBanner('error', 'Keine Projekt-ID gefunden.');
    return;
  }
  try {
    var r = await fetch('/api/merged/' + encodeURIComponent(id));
    if (!r.ok) {
      addBanner('warn', 'Zusammengef\u00FChrte Dateien nicht verf\u00FCgbar.');
      return;
    }
    var data = await r.json();
    mergedFiles = data;
    render();
  } catch (e) {
    addBanner('error', 'Fehler beim Laden der zusammengef\u00FChrten Dateien.');
  }
}

async function retryAgent(index) {
  // Show spinner on the button immediately
  var btn = document.querySelector('[data-agent="' + index + '"] .btn-retry');
  if (btn) {
    btn.disabled = true;
    clearEl(btn);
    btn.appendChild(createEl('span', { className: 'retry-spinner' }));
    btn.appendChild(document.createTextNode(' Wiederholen\u2026'));
  }
  // Optimistically update agent status to working
  if (state.agents && state.agents[index]) {
    state.agents[index].status = 'working';
    var card = document.querySelector('[data-agent="' + index + '"]');
    if (card) {
      card.className = 'agent-card working';
      var badgeEl = card.querySelector('.agent-badge');
      if (badgeEl) {
        clearEl(badgeEl);
        if (state.agents[index].score != null) badgeEl.appendChild(scoreBadgeNode(state.agents[index].score));
        badgeEl.appendChild(badgeNode('working'));
      }
    }
  }
  try {
    var r = await authFetch('/api/retry/' + index, { method: 'POST', headers: authHeadersNoBody() });
    if (!r.ok) {
      addBanner('error', 'Agent ' + (index + 1) + ' konnte nicht neu gestartet werden.');
      // Revert status on failure
      if (state.agents && state.agents[index]) {
        state.agents[index].status = 'error';
        updateAgentCard(index);
      }
    }
  } catch (e) {
    addBanner('error', 'Retry fehlgeschlagen: ' + e.message);
    if (state.agents && state.agents[index]) {
      state.agents[index].status = 'error';
      updateAgentCard(index);
    }
  }
}

var _resumeBusy = false;
async function resumeProject() {
  var projectId = getProjectIdFromState();
  if (!projectId) {
    addBanner('error', 'Keine Projekt-ID gefunden.');
    return;
  }
  if (_resumeBusy) return;
  _resumeBusy = true;
  try {
    var r = await authFetch('/api/resume/' + encodeURIComponent(projectId), { method: 'POST', headers: authHeadersNoBody() });
    if (!r.ok) {
      var data = await r.json().catch(function() { return {}; });
      addBanner('error', data.error || 'Fortsetzen fehlgeschlagen.');
    } else {
      addBanner('success', 'Projekt wird fortgesetzt…');
    }
  } catch (e) {
    addBanner('error', 'Fortsetzen fehlgeschlagen: ' + e.message);
  } finally {
    _resumeBusy = false;
  }
}

function updateInterventionHint(index) {
  var sel = document.getElementById('intervention-type-' + index);

  var type = sel.value;
  hint.textContent = INTERVENTION_HINTS[type] || '';
  if (ta) {
    var needsMsg = type === 'redirect' || type === 'inject';
    ta.placeholder = needsMsg ? 'Neue Anweisung oder Hinweis\u2026' : '(Optional) Begr\u00FCndung\u2026';

function openIntervention(index) {
  var card = document.querySelector('[data-agent="' + index + '"]');
  if (!card) return;
  var existing = card.querySelector('.intervention-form');
  if (existing) { existing.remove(); _interventionFormOpen[index] = false; return; }
  _interventionFormOpen[index] = true;
  var form = createEl('div', { className: 'intervention-form', id: 'intervention-form-' + index });
  // Typ-Dropdown
  var sel = document.createElement('select');
  sel.className = 'intervention-type-select';
  sel.id = 'intervention-type-' + index;
  var types = [
    ['redirect', 'Umleitung \u2013 Neue Anweisung'],
    ['inject', 'Kontext \u2013 Zus\u00E4tzliche Info'],
    ['restart', 'Neustart \u2013 Von vorne beginnen'],
    ['skip', '\u00dcberspringen \u2013 Agent auslassen'],
    ['complete', 'Fertig \u2013 Manuell abschlie\u00DFen']
  ];
  types.forEach(function(t) {
    var opt = document.createElement('option');
    opt.value = t[0]; opt.textContent = t[1];
    sel.appendChild(opt);
  });
  (function(idx) { sel.addEventListener('change', function() { updateInterventionHint(idx); }); })(index);
  form.appendChild(sel);
  form.appendChild(createEl('div', { className: 'intervention-type-hint', id: 'intervention-hint-' + index }, INTERVENTION_HINTS.redirect));
  // Textarea
  var ta = document.createElement('textarea');
  ta.id = 'intervention-text-' + index; ta.rows = 3; ta.maxLength = 2000;
  ta.placeholder = 'Neue Anweisung oder Hinweis\u2026';
  (function(idx) { ta.addEventListener('input', function() { updateInterventionCounter(idx); }); })(index);
  form.appendChild(ta);
  form.appendChild(createEl('div', { className: 'intervention-counter', id: 'intervention-counter-' + index }, '0/2000'));
  var errDiv = createEl('div', { className: 'intervention-error', id: 'intervention-error-' + index, role: 'alert' });
  errDiv.style.display = 'none'; form.appendChild(errDiv);
  var actionsDiv = createEl('div', { className: 'intervention-actions' });
  var cancelBtn = createEl('button', { className: 'btn-cancel', 'aria-label': 'Abbrechen' }, 'Abbrechen');
  (function(idx) { cancelBtn.addEventListener('click', function() { cancelIntervention(idx); }); })(index);
  actionsDiv.appendChild(cancelBtn);
  var sendBtn = createEl('button', { className: 'btn-send', id: 'intervention-send-' + index }, 'Senden');
  (function(idx) { sendBtn.addEventListener('click', function() { submitIntervention(idx); }); })(index);
  actionsDiv.appendChild(sendBtn);
  form.appendChild(actionsDiv);
  card.appendChild(form);
  var taEl = document.getElementById('intervention-text-' + index);
  if (taEl) taEl.focus();
}

function cancelIntervention(index) {
  _interventionFormOpen[index] = false;
  var form = document.getElementById('intervention-form-' + index);
  if (form) form.remove();
}

function updateInterventionCounter(index) {
  var ta = document.getElementById('intervention-text-' + index);
  var counter = document.getElementById('intervention-counter-' + index);
  if (ta && counter) {
    var len = ta.value.length;
    counter.textContent = len + '/2000';
    counter.style.color = len > 1900 ? 'var(--red)' : 'var(--txt3)';
  }
}

async function submitIntervention(index) {
  var ta = document.getElementById('intervention-text-' + index);
  var typeSel = document.getElementById('intervention-type-' + index);
  var sendBtn = document.getElementById('intervention-send-' + index);
  var errorEl = document.getElementById('intervention-error-' + index);
  if (!ta) return;
  var message = ta.value.trim();
  var type = typeSel ? typeSel.value : 'redirect';
  var needsMsg = type === 'redirect' || type === 'inject';
  if (needsMsg && !message) {
    if (errorEl) { errorEl.textContent = 'Bitte eine Nachricht eingeben.'; errorEl.style.display = 'block'; }
    return;
  }
  if (message.length > 2000) {
    if (errorEl) { errorEl.textContent = 'Nachricht zu lang (max. 2000 Zeichen).'; errorEl.style.display = 'block'; }
    return;
  }
  var destructive = type === 'skip' || type === 'restart' || type === 'complete';
  if (destructive) {
    var cLabels = { skip: '\u00dcberspringen', restart: 'Neu starten', complete: 'Als fertig markieren' };
    var cDescs = {
      skip: 'Der Agent wird sofort \u00fcbersprungen und als "\u00fcbersprungen" markiert.',
      restart: 'Der Agent wird komplett von vorne gestartet. Bisheriger Fortschritt geht verloren.',
      complete: 'Der Agent wird manuell als fertig markiert.'
    };
    var confirmed = await showConfirmDialog(cLabels[type], cDescs[type]);
    if (!confirmed) return;
  }
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = 'Sende\u2026'; }
  if (errorEl) errorEl.style.display = 'none';
  try {
    var r = await authFetch('/api/intervene/' + index, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ message: message, type: type })
    });
    if (!r.ok) {
      var errData = {};
      try { errData = await r.json(); } catch(e) {}
      var errMsg = errData.error || errData.message || ('Fehler ' + r.status);
      if (errorEl) { errorEl.textContent = errMsg; errorEl.style.display = 'block'; }
      if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = 'Senden'; }
      return;
    }
    _interventionFormOpen[index] = false;
    var isImmediate = type === 'skip' || type === 'complete';
    if (!isImmediate) { _interventionPending[index] = true; }
    var form = document.getElementById('intervention-form-' + index);
    if (form) form.remove();
    var card = document.querySelector('[data-agent="' + index + '"]');
    if (card) {
      var badgeEl = card.querySelector('.agent-badge');
      var agent = state.agents[index];
      if (badgeEl && agent) {
        clearEl(badgeEl);
        if (!isImmediate) {
          badgeEl.appendChild(createEl('span', { className: 'intervention-badge' }, 'Intervention wartend'));
        }
        if (agent.score != null) badgeEl.appendChild(scoreBadgeNode(agent.score));
        badgeEl.appendChild(badgeNode(isImmediate ? (type === 'skip' ? 'skipped' : 'done') : (agent.status || 'working')));
      }
    }
    if (isImmediate) {
      var actionLabel = type === 'skip' ? '\u00fcbersprungen' : 'als fertig markiert';
      addBanner('success', 'Agent ' + (index + 1) + ' wurde ' + actionLabel + '.');
    }
  } catch (e) {
    if (errorEl) { errorEl.textContent = 'Netzwerkfehler: ' + e.message; errorEl.style.display = 'block'; }
    if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = 'Senden'; }
  }
}

// ── Best\u00E4tigungsdialog ──────────────────────────────────────
function showConfirmDialog(title, description) {
  return new Promise(function(resolve) {
    var overlay = createEl('div', { className: 'confirm-overlay', id: 'confirmOverlay' });
    var dialog = createEl('div', { className: 'confirm-dialog' });
    dialog.appendChild(createEl('h3', {}, title));
    dialog.appendChild(createEl('p', {}, description));
    var actions = createEl('div', { className: 'confirm-actions' });
    var cancelBtn = createEl('button', { className: 'confirm-cancel' }, 'Abbrechen');
    cancelBtn.addEventListener('click', function() { overlay.remove(); resolve(false); });
    var okBtn = createEl('button', { className: 'confirm-ok' }, 'Best\u00E4tigen');
    okBtn.addEventListener('click', function() { overlay.remove(); resolve(true); });
    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    dialog.appendChild(actions);
    overlay.appendChild(dialog);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) { overlay.remove(); resolve(false); } });
    document.body.appendChild(overlay);
    okBtn.focus();
  });
}

// ── Quick-Intervention (Button-Klick ohne Formular) ───────────
async function quickIntervene(index, type) {
  var labels = { skip: '\u00dcberspringen', restart: 'Neu starten', complete: 'Als fertig markieren' };
  var descriptions = {
    skip: 'Agent ' + (index + 1) + ' wird sofort \u00fcbersprungen.',
    restart: 'Agent ' + (index + 1) + ' wird komplett von vorne gestartet. Bisheriger Fortschritt geht verloren.',
    complete: 'Agent ' + (index + 1) + ' wird manuell als fertig markiert.'
  };
  var confirmed = await showConfirmDialog(labels[type] || type, descriptions[type] || 'Bist du sicher?');
  if (!confirmed) return;
  try {
    var r = await authFetch('/api/intervene/' + index, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ message: '', type: type })
    });
    if (!r.ok) {
      var errData = {};
      try { errData = await r.json(); } catch(e) {}
      addBanner('error', errData.error || 'Intervention fehlgeschlagen.');
      return;
    }
    var actionLabel = { skip: '\u00fcbersprungen', restart: 'wird neu gestartet', complete: 'als fertig markiert' }[type] || type;
    addBanner('success', 'Agent ' + (index + 1) + ' ' + actionLabel + '.');
    if (type === 'restart') { _interventionPending[index] = true; }
  } catch (e) {
    addBanner('error', 'Intervention fehlgeschlagen: ' + e.message);
  }
}

// ── File Tree ─────────────────────────────────────────────────────
var fileTreeOpen = false;
var fileTreeTimer = null;
var fileGroupState = {}; // track which agent groups are open
var ftFolderState = {}; // track which sub-folders are open
var fileTreeLastData = null; // last fetched file list for change detection
var fileTreeLastHash = ''; // hash of last file list for change detection

// Agent-Farben fuer den Dateibaum
var AGENT_COLORS = [
  '#4A90D9', // Blau
  '#D97B4A', // Orange
  '#6BBF6B', // Gruen
  '#D94A7B', // Rosa
  '#9B59B6', // Lila
  '#1ABC9C', // Tuerkis
  '#F39C12', // Gelb
  '#E74C3C', // Rot
  '#3498DB', // Hellblau
  '#2ECC71', // Hellgruen
  '#E67E22', // Dunkelorange
  '#9B88C4', // Flieder
];

function getAgentColor(agentIndex) {
  return AGENT_COLORS[agentIndex % AGENT_COLORS.length];
}

function getProjectId() {
  var dir = state.projectDir || '';
  return dir.split('/').pop() || dir.split('\\').pop() || '';
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function fileIcon(filename) {
  var ext = (filename.split('.').pop() || '').toLowerCase();
  if (ext === 'md') return '\uD83D\uDCDD';
  if (ext === 'json') return '\uD83D\uDCCB';
  if (ext === 'js' || ext === 'ts' || ext === 'jsx' || ext === 'tsx') return '\uD83D\uDCBB';
  if (ext === 'css' || ext === 'html' || ext === 'htm') return '\uD83C\uDFA8';
  if (ext === 'py') return '\uD83D\uDC0D';
  return '\uD83D\uDCC4';
}

function toggleFileTree() {
  fileTreeOpen = !fileTreeOpen;
  var content = document.getElementById('fileTreeContent');
  var arrow = document.getElementById('fileTreeArrow');
  if (!content || !arrow) return;
  if (fileTreeOpen) {
    arrow.classList.add('open');
    content.style.display = '';
    loadFileTree();
    startFileTreePolling();
  } else {
    arrow.classList.remove('open');
    content.style.display = 'none';
    stopFileTreePolling();
  }
}

function toggleFileGroup(groupName) {
  fileGroupState[groupName] = !fileGroupState[groupName];
  var items = document.getElementById('fg-' + groupName);
  var arrow = document.getElementById('fga-' + groupName);
  if (items) {
    if (fileGroupState[groupName]) {
      items.classList.add('ft-collapsed');
    } else {
      items.classList.remove('ft-collapsed');
      items.style.maxHeight = items.scrollHeight + 'px';
      setTimeout(function() { items.style.maxHeight = ''; }, 300);
    }
  }
  if (arrow) {
    if (fileGroupState[groupName]) arrow.classList.remove('open');
    else arrow.classList.add('open');
  }
}

function toggleFtFolder(folderId) {
  ftFolderState[folderId] = !ftFolderState[folderId];
  var children = document.getElementById('ftc-' + folderId);
  var arrow = document.getElementById('fta-' + folderId);
  if (children) {
    if (ftFolderState[folderId]) {
      children.classList.add('ft-collapsed');
    } else {
      children.classList.remove('ft-collapsed');
      children.style.maxHeight = children.scrollHeight + 'px';
      setTimeout(function() { children.style.maxHeight = ''; }, 250);
    }
  }
  if (arrow) {
    if (ftFolderState[folderId]) arrow.classList.remove('open');
    else arrow.classList.add('open');
  }
}

// Einfacher Hash der Dateiliste fuer Change-Detection
function fileTreeHash(files) {
  if (!files || files.length === 0) return '';
  var parts = [];
  for (var i = 0; i < files.length; i++) {
    parts.push(files[i].path + ':' + files[i].size);
  }
  return parts.join('|');
}

function loadFileTree() {
  var id = getProjectId();
  if (!id) {
    renderFileTree([]);
    return;
  }
  fetch('/api/files/' + encodeURIComponent(id)).then(function(r) {
    if (!r.ok) throw new Error('Fehler');
    return r.json();
  }).then(function(files) {
    var newHash = fileTreeHash(files);
    if (newHash === fileTreeLastHash) return; // Keine Aenderung
    fileTreeLastHash = newHash;
    fileTreeLastData = files;
    renderFileTree(files);
  }).catch(function() {
    renderFileTree([]);
  });
}

// Erkennung: welcher Agent hat die Datei erstellt (anhand des Pfades agent-N/)
function detectAgent(filePath) {
  var match = filePath.match(/^agent-(\d+)\//);
  if (match) return parseInt(match[1], 10);
  return -1;
}

// Verschachtelte Baumstruktur aus flachen Dateipfaden
function buildTree(files) {
  var root = { name: '', children: {}, files: [] };
  for (var i = 0; i < files.length; i++) {
    var parts = files[i].path.split('/');
    var node = root;
    for (var j = 0; j < parts.length - 1; j++) {
      if (!node.children[parts[j]]) {
        node.children[parts[j]] = { name: parts[j], children: {}, files: [] };
      }
      node = node.children[parts[j]];
    }
    node.files.push({ name: parts[parts.length - 1], size: files[i].size, fullPath: files[i].fullPath || files[i].path });
  }
  return root;
}

function renderFileTree(files) {
  var container = document.getElementById('fileTreeContent');
  if (!container) return;

  if (!files || files.length === 0) {
    clearEl(container);
    container.appendChild(createEl('div', { className: 'file-tree-empty' }, 'Noch keine Dateien vorhanden.'));
    return;
  }

  // Erkenne alle beteiligten Agenten
  var agentSet = {};
  var totalSize = 0;
  for (var i = 0; i < files.length; i++) {
    var agentNum = detectAgent(files[i].path);
    if (agentNum >= 0) agentSet[agentNum] = true;
    totalSize += files[i].size || 0;
  }
  var agentNumbers = Object.keys(agentSet).map(Number).sort(function(a,b){ return a-b; });

  // Gruppiere nach Agent-Ordner
  var agentGroups = {};
  var rootFiles = [];
  for (var i = 0; i < files.length; i++) {
    var p = files[i].path;
    var agentMatch = p.match(/^(agent-\d+)\//);
    if (agentMatch) {
      var gName = agentMatch[1];
      if (!agentGroups[gName]) agentGroups[gName] = [];
      agentGroups[gName].push({ path: p.substring(gName.length + 1), size: files[i].size, fullPath: p });
    } else {
      rootFiles.push(files[i]);
    }
  }

  var fragment = document.createDocumentFragment();

  // Legende: welcher Agent hat welche Farbe
  if (agentNumbers.length > 0) {
    var legendDiv = createEl('div', { className: 'file-tree-legend' });
    for (var ai = 0; ai < agentNumbers.length; ai++) {
      var aN = agentNumbers[ai];
      var agentLabel = 'Agent ' + aN;
      if (state.agents && state.agents[aN - 1] && state.agents[aN - 1].title) {
        agentLabel = 'Agent ' + aN + ': ' + state.agents[aN - 1].title;
      }
      var itemDiv = createEl('div', { className: 'file-tree-legend-item' });
      var dot = createEl('span', { className: 'file-tree-legend-dot' });
      dot.style.backgroundColor = getAgentColor(aN - 1);
      itemDiv.appendChild(dot);
      itemDiv.appendChild(document.createTextNode(agentLabel));
      legendDiv.appendChild(itemDiv);
    }
    fragment.appendChild(legendDiv);
  }

  // Statistiken
  var statsDiv = createEl('div', { className: 'file-tree-stats' });
  statsDiv.appendChild(createEl('span', {}, files.length + ' Dateien'));
  statsDiv.appendChild(createEl('span', {}, formatFileSize(totalSize) + ' gesamt'));
  if (agentNumbers.length > 0) {
    statsDiv.appendChild(createEl('span', {}, agentNumbers.length + ' Agent' + (agentNumbers.length !== 1 ? 'en' : '')));
  }
  fragment.appendChild(statsDiv);

  // Agent-Gruppen rendern
  var groupNames = Object.keys(agentGroups).sort(function(a, b) {
    var na = parseInt(a.replace('agent-', ''));
    var nb = parseInt(b.replace('agent-', ''));
    return na - nb;
  });

  for (var gi = 0; gi < groupNames.length; gi++) {
    var gn = groupNames[gi];
    var gFiles = agentGroups[gn];
    var agentIdx = parseInt(gn.replace('agent-', ''));
    var color = getAgentColor(agentIdx - 1);
    var collapsed = fileGroupState[gn] || false;

    var groupDiv = createEl('div', { className: 'file-group' });

    var headerBtn = document.createElement('button');
    headerBtn.className = 'file-group-header';
    headerBtn.style.borderLeftColor = color;
    headerBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    (function(n) { headerBtn.addEventListener('click', function() { toggleFileGroup(n); }); })(gn);

    var arrowSpan = createEl('span', { className: 'arrow' + (collapsed ? '' : ' open'), id: 'fga-' + gn }, '\u25B6');
    headerBtn.appendChild(arrowSpan);

    var agentDot = createEl('span', { className: 'file-agent-dot' });
    agentDot.style.backgroundColor = color;
    headerBtn.appendChild(agentDot);

    headerBtn.appendChild(document.createTextNode(' \uD83D\uDCC1 ' + gn));

    if (state.agents && state.agents[agentIdx - 1] && state.agents[agentIdx - 1].title) {
      var titleSpan = createEl('span', { style: 'font-weight:400;color:var(--txt3);margin-left:6px;font-size:11px' });
      titleSpan.textContent = state.agents[agentIdx - 1].title;
      headerBtn.appendChild(titleSpan);
    }

    headerBtn.appendChild(createEl('span', { className: 'file-group-count' }, gFiles.length + ' Datei' + (gFiles.length !== 1 ? 'en' : '')));
    groupDiv.appendChild(headerBtn);

    var itemsDiv = createEl('div', { className: 'file-group-items' + (collapsed ? ' ft-collapsed' : ''), id: 'fg-' + gn });
    var subTree = buildTree(gFiles);
    renderTreeNode(itemsDiv, subTree, gn, color);
    groupDiv.appendChild(itemsDiv);
    fragment.appendChild(groupDiv);
  }

  // Root-Dateien
  if (rootFiles.length > 0) {
    var rootGroup = createEl('div', { className: 'file-group' });
    var rootCollapsed = fileGroupState['_root'] || false;

    var rootHeader = document.createElement('button');
    rootHeader.className = 'file-group-header';
    rootHeader.setAttribute('aria-expanded', rootCollapsed ? 'false' : 'true');
    rootHeader.addEventListener('click', function() { toggleFileGroup('_root'); });

    rootHeader.appendChild(createEl('span', { className: 'arrow' + (rootCollapsed ? '' : ' open'), id: 'fga-_root' }, '\u25B6'));
    rootHeader.appendChild(document.createTextNode(' \uD83D\uDCC1 Projektdateien'));
    rootHeader.appendChild(createEl('span', { className: 'file-group-count' }, rootFiles.length + ' Datei' + (rootFiles.length !== 1 ? 'en' : '')));
    rootGroup.appendChild(rootHeader);

    var rootItems = createEl('div', { className: 'file-group-items' + (rootCollapsed ? ' ft-collapsed' : ''), id: 'fg-_root' });
    for (var ri = 0; ri < rootFiles.length; ri++) {
      rootItems.appendChild(buildFileItem(rootFiles[ri].path, rootFiles[ri].size, null));
    }
    rootGroup.appendChild(rootItems);
    fragment.appendChild(rootGroup);
  }

  clearEl(container);
  container.appendChild(fragment);
}

// Rekursives Rendern eines Baum-Knotens
function renderTreeNode(parentEl, node, prefix, color) {
  var childNames = Object.keys(node.children).sort();
  for (var ci = 0; ci < childNames.length; ci++) {
    var childName = childNames[ci];
    var child = node.children[childName];
    var folderId = prefix + '-' + childName;
    var collapsed = ftFolderState[folderId] || false;
    var fileCount = countFiles(child);

    var folderDiv = createEl('div', { className: 'ft-folder' });

    var folderBtn = document.createElement('button');
    folderBtn.className = 'ft-folder-row';
    (function(fid) { folderBtn.addEventListener('click', function() { toggleFtFolder(fid); }); })(folderId);

    folderBtn.appendChild(createEl('span', { className: 'arrow' + (collapsed ? '' : ' open'), id: 'fta-' + folderId }, '\u25B6'));
    folderBtn.appendChild(document.createTextNode('\uD83D\uDCC1 ' + childName));
    folderBtn.appendChild(createEl('span', { className: 'file-group-count' }, String(fileCount)));

    folderDiv.appendChild(folderBtn);

    var childrenDiv = createEl('div', { className: 'ft-folder-children' + (collapsed ? ' ft-collapsed' : ''), id: 'ftc-' + folderId });
    renderTreeNode(childrenDiv, child, folderId, color);
    folderDiv.appendChild(childrenDiv);
    parentEl.appendChild(folderDiv);
  }

  var sortedFiles = node.files.slice().sort(function(a, b) { return a.name.localeCompare(b.name); });
  for (var fi = 0; fi < sortedFiles.length; fi++) {
    var f = sortedFiles[fi];
    parentEl.appendChild(buildFileItem(f.fullPath, f.size, color));
  }
}

function countFiles(node) {
  var count = node.files.length;
  var childNames = Object.keys(node.children);
  for (var i = 0; i < childNames.length; i++) {
    count += countFiles(node.children[childNames[i]]);
  }
  return count;
}

function buildFileItem(filePath, size, agentColor) {
  var item = createEl('div', { className: 'file-item file-item-clickable' });
  (function(fp) { item.addEventListener('click', function() { openFileContent(fp); }); })(filePath);

  if (agentColor) {
    var dot = createEl('span', { className: 'file-agent-dot' });
    dot.style.backgroundColor = agentColor;
    item.appendChild(dot);
  }

  var fileName = filePath.split('/').pop();
  item.appendChild(createEl('span', { className: 'file-icon' }, fileIcon(fileName)));
  var nameSpan = createEl('span', { className: 'file-name' }, fileName);
  nameSpan.title = filePath;
  item.appendChild(nameSpan);
  item.appendChild(createEl('span', { className: 'file-size' }, formatFileSize(size)));
  return item;
}


// ── File Content Viewer ──────────────────────────────────────────────
function openFileContent(filePath) {
  var id = getProjectId();
  if (!id) return;

  closeFileModal();

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'fileModal';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Dateiinhalt');
  overlay.setAttribute('tabindex', '-1');
  overlay.onclick = function(e) { if (e.target === overlay) closeFileModal(); };
  overlay.innerHTML = '<div class="modal file-modal">' +
    '<button class="modal-close" aria-label="Dialog schlie\u00DFen" onclick="closeFileModal()" title="Schlie\u00DFen">\u00D7</button>' +
    '<div class="file-modal-header"><div class="file-modal-info"><div class="file-modal-path">' + esc(filePath) + '</div><div class="file-modal-size">Wird geladen\u2026</div></div></div>' +
    '<div class="file-modal-body"><pre><code>Wird geladen\u2026</code></pre></div>' +
  '</div>';
  document.body.appendChild(overlay);
  document.addEventListener('keydown', fileModalKeyHandler);

  var url = '/api/file-content/' + encodeURIComponent(id) + '/' + encodeURIComponent(filePath);
  fetch(url).then(function(r) {
    if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Fehler'); });
    return r.json();
  }).then(function(data) {
    var modal = document.querySelector('#fileModal .modal');
    if (!modal) return;

    var sizeText = formatFileSize(data.size);
    var headerHtml = '<div class="file-modal-info">' +
      '<div class="file-modal-path">' + esc(data.path) + '</div>' +
      '<div class="file-modal-size">' + esc(sizeText) + '</div>' +
    '</div>';

    var bodyHtml;
    if (data.binary) {
      headerHtml += '<div class="file-modal-actions"></div>';
      bodyHtml = '<div class="file-modal-binary">Bin\u00E4rdatei (' + esc(sizeText) + ')</div>';
    } else {
      headerHtml += '<div class="file-modal-actions"><button class="file-modal-copy" onclick="copyFileContent()" title="Inhalt kopieren">Kopieren</button></div>';
      bodyHtml = '<pre><code id="fileContentCode">' + esc(data.content) + '</code></pre>';
    }

    modal.innerHTML = '<button class="modal-close" aria-label="Dialog schlie\u00DFen" onclick="closeFileModal()" title="Schlie\u00DFen">\u00D7</button>' +
      '<div class="file-modal-header">' + headerHtml + '</div>' +
      '<div class="file-modal-body">' + bodyHtml + '</div>';
  }).catch(function(err) {
    var modal = document.querySelector('#fileModal .modal');
    if (!modal) return;
    modal.innerHTML = '<button class="modal-close" aria-label="Dialog schlie\u00DFen" onclick="closeFileModal()" title="Schlie\u00DFen">\u00D7</button>' +
      '<div class="file-modal-header"><div class="file-modal-info"><div class="file-modal-path">' + esc(filePath) + '</div></div></div>' +
      '<div class="file-modal-body"><div class="file-modal-binary">Fehler: ' + esc(err.message) + '</div></div>';
  });
}

function closeFileModal() {
  var modal = document.getElementById('fileModal');
  if (modal) modal.remove();
  document.removeEventListener('keydown', fileModalKeyHandler);
}

function fileModalKeyHandler(e) {
  if (e.key === 'Escape') closeFileModal();
}

function copyFileContent() {
  var codeEl = document.getElementById('fileContentCode');
  if (!codeEl) return;
  navigator.clipboard.writeText(codeEl.textContent).then(function() {
    var btn = document.querySelector('#fileModal .file-modal-copy');
    if (btn) {
      btn.textContent = 'Kopiert!';
      setTimeout(function() { btn.textContent = 'Kopieren'; }, 1500);
    }
  });
}

function startFileTreePolling() {
  stopFileTreePolling();
  if (state.phase === 'running' || state.phase === 'complete' || state.phase === 'partial') {
    fileTreeTimer = setInterval(function() {
      if (fileTreeOpen) loadFileTree();
      if (state.phase !== 'running') stopFileTreePolling();
    }, 5000);
  }
}

function stopFileTreePolling() {
  if (fileTreeTimer) { clearInterval(fileTreeTimer); fileTreeTimer = null; }
}

function togglePromptSection() {
  var body = document.getElementById('promptSectionBody');
  var chevron = document.getElementById('promptChevron');
  if (!body) return;
  if (body.classList.contains('collapsed')) {
    body.classList.remove('collapsed');
    if (chevron) chevron.classList.add('open');
  } else {
    body.classList.add('collapsed');
    if (chevron) chevron.classList.remove('open');
  }
}

function insertPromptVar(promptKey, varName) {
  var ta = document.getElementById('prompt_' + promptKey);
  if (!ta) return;
  var start = ta.selectionStart;
  var end = ta.selectionEnd;
  var text = ta.value;
  var insert = '{' + varName + '}';
  ta.value = text.substring(0, start) + insert + text.substring(end);
  ta.selectionStart = ta.selectionEnd = start + insert.length;
  ta.focus();
}

function savePrompts() {
  var keys = ['coordinator_plan', 'coordinator_answer', 'coordinator_summary', 'agent_system'];
  var payload = {};
  for (var i = 0; i < keys.length; i++) {
    var ta = document.getElementById('prompt_' + keys[i]);
    if (ta) payload[keys[i]] = ta.value;
  }
  var statusEl = document.getElementById('promptStatus');
  if (statusEl) { statusEl.className = 'prompt-status'; statusEl.textContent = ''; }

  authFetch('/api/prompts', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify(payload)
  }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (statusEl) {
        if (res.ok && res.data.ok) {
          statusEl.className = 'prompt-status settings-status ok';
          statusEl.textContent = 'Prompts gespeichert!';
        } else {
          statusEl.className = 'prompt-status settings-status err';
          statusEl.textContent = res.data.error || 'Fehler beim Speichern';
        }
      }
    }).catch(function(e) {
      if (statusEl) {
        statusEl.className = 'prompt-status settings-status err';
        statusEl.textContent = 'Netzwerkfehler: ' + e.message;
      }
    });
}

function resetPrompts() {
  if (!confirm('Prompt-Templates auf Standardwerte zur\u00FCcksetzen?')) return;
  var statusEl = document.getElementById('promptStatus');
  if (statusEl) { statusEl.className = 'prompt-status'; statusEl.textContent = ''; }

  authFetch('/api/prompts/reset', {
    method: 'POST',
    headers: authHeaders()
  }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (res.ok && res.data.ok && res.data.prompts) {
        var keys = ['coordinator_plan', 'coordinator_answer', 'coordinator_summary', 'agent_system'];
        for (var i = 0; i < keys.length; i++) {
          var ta = document.getElementById('prompt_' + keys[i]);
          if (ta && res.data.prompts[keys[i]]) ta.value = res.data.prompts[keys[i]];
        }
        if (statusEl) {
          statusEl.className = 'prompt-status settings-status ok';
          statusEl.textContent = 'Prompts auf Standard zur\u00FCckgesetzt!';
        }
      } else {
        if (statusEl) {
          statusEl.className = 'prompt-status settings-status err';
          statusEl.textContent = res.data.error || 'Fehler';
        }
      }
    }).catch(function(e) {
      if (statusEl) {
        statusEl.className = 'prompt-status settings-status err';
        statusEl.textContent = 'Netzwerkfehler: ' + e.message;
      }
    });
}

function saveSettings() {
  // API-Token lokal speichern
  var tokenInput = document.getElementById('cfg_apiToken');
  if (tokenInput) setApiToken(tokenInput.value.trim());

  // Benachrichtigungs-Einstellungen lokal speichern
  var notifCheck = document.getElementById('cfg_notificationsEnabled');
  if (notifCheck) {
    notificationsEnabled = notifCheck.checked;
    localStorage.setItem('notificationsEnabled', String(notificationsEnabled));
    if (notificationsEnabled) requestNotificationPermission();
  }
  var soundCheck = document.getElementById('cfg_soundEnabled');
  if (soundCheck) {
    soundEnabled = soundCheck.checked;
    localStorage.setItem('soundEnabled', String(soundEnabled));
    applySoundToggle();
  }
  var volSlider = document.getElementById('cfg_alertVolume');
  if (volSlider) {
    alertVolume = parseInt(volSlider.value) / 100;
    localStorage.setItem('alertVolume', String(Math.round(alertVolume * 100)));
  }

  var payload = {};
  for (var i = 0; i < SETTINGS_FIELDS.length; i++) {
    var f = SETTINGS_FIELDS[i];
    var input = document.getElementById('cfg_' + f.key);
    if (input) payload[f.key] = Number(input.value);
  }
  // Budget-Felder hinzufügen
  var budgetFields = ['tokenBudget', 'warnTokenBudget', 'inputCostPerMTok', 'outputCostPerMTok'];
  for (var b = 0; b < budgetFields.length; b++) {
    var bInput = document.getElementById('cfg_' + budgetFields[b]);
    if (bInput) payload[budgetFields[b]] = Number(bInput.value);
  }
  var webhookInput = document.getElementById('cfg_webhookUrl');
  if (webhookInput) payload.webhookUrl = webhookInput.value.trim();
  var statusEl = document.getElementById('settingsStatus');
  if (statusEl) { statusEl.className = 'settings-status'; statusEl.textContent = ''; }

  authFetch('/api/config', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify(payload)
  }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (statusEl) {
        if (res.ok && res.data.ok) {
          statusEl.className = 'settings-status ok';
          statusEl.textContent = 'Einstellungen gespeichert!';
          setTimeout(closeSettings, 1200);
        } else {
          statusEl.className = 'settings-status err';
          statusEl.textContent = res.data.error || 'Fehler beim Speichern';
        }
      }
    }).catch(function(e) {
      if (statusEl) {
        statusEl.className = 'settings-status err';
        statusEl.textContent = 'Netzwerkfehler: ' + e.message;
      }
    });
}

function testWebhook() {
  var urlInput = document.getElementById('cfg_webhookUrl');
  var statusEl = document.getElementById('webhookTestStatus');
  var btn = document.getElementById('testWebhookBtn');
  if (!urlInput || !statusEl) return;

  var url = urlInput.value.trim();
  if (!url) {

    statusEl.textContent = 'Bitte zuerst eine URL eingeben';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sende\u2026';
  statusEl.style.color = 'var(--txt2)';
  statusEl.textContent = '';

  authFetch('/api/test-webhook', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify({ url: url })
  }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (res.ok && res.data.ok) {
        statusEl.style.color = 'var(--green)';
