function toggleActivityFeed() {
  activityFeedOpen = !activityFeedOpen;
  var panel = document.getElementById('activityFeedPanel');
  if (panel) {
    panel.style.display = activityFeedOpen ? 'block' : 'none';
    if (activityFeedOpen) renderActivityFeed();
  }
}

function setActivityFilter(f) {
  activityFilter = f;
  renderActivityFeed();
}

function getActivityIcon(type) {
  switch (type) {
    case 'project_started': return '\u25B6';
    case 'agent_started': return '\u25B6';
    case 'agent_question': return '\u2753';
    case 'agent_answer': return '\u{1F4AC}';
    case 'agent_done': return '\u2714';
    case 'agent_error': return '\u2718';
    case 'agent_message': return '\u2709';
    case 'shared_file': return '\uD83D\uDCC4';
    case 'project_complete': return '\u2714';
    default: return '\u2022';
  }
}

function getActivityText(entry) {
  var d = entry.data || {};
  switch (entry.type) {
    case 'project_started':
      return 'Projekt gestartet: ' + (d.title || '') + ' (' + (d.agentCount || '?') + ' Agenten)';
    case 'agent_started':
      return 'Agent ' + (d.agentNum || '?') + ' gestartet: ' + (d.title || '');
    case 'agent_question':
      return 'Agent ' + (d.agentNum || '?') + ' fragt: ' + (d.question || '').slice(0, 80);
    case 'agent_answer':
      return 'Koordinator antwortet Agent ' + (d.agentNum || '?') + ': ' + (d.answer || '').slice(0, 80);
    case 'agent_done':
      return 'Agent ' + (d.agentNum || '?') + ' fertig (' + (d.rounds || '?') + ' Runden)';
    case 'agent_error':
      return 'Agent ' + (d.agentNum || '?') + ' Fehler: ' + (d.error || 'Unbekannt');
    case 'agent_message':
      return 'Agent ' + (d.fromNum || '?') + ' \u2192 Agent ' + (d.toNum || '?') + ': ' + (d.text || '');
    case 'shared_file':
      return 'Agent ' + ((d.agentNum || (d.agentIndex != null ? d.agentIndex + 1 : '?'))) + ' teilt Datei: ' + (d.fileName || '');
    case 'project_complete':
      return 'Projekt abgeschlossen! ' + (d.agentCount || '?') + ' Agenten, ' + formatDuration(d.totalDuration || 0);
    default:
      return entry.type;
  }
}

function getActivityAgentNum(entry) {
  var d = entry.data || {};
  if (d.agentNum != null) return d.agentNum;
  if (d.agentIndex != null) return d.agentIndex + 1;
  if (d.fromNum != null) return d.fromNum;
  return null;
}

function filterActivity(entries) {
  if (activityFilter === 'alle') return entries;
  return entries.filter(function(e) {
    if (activityFilter === 'agenten') {
      return e.type.startsWith('agent_') && e.type !== 'agent_answer';
    }
    if (activityFilter === 'koordinator') {
      return e.type === 'agent_answer' || e.type === 'project_started' || e.type === 'project_complete';
    }
    if (activityFilter === 'fehler') {
      return e.type === 'agent_error';
    }
    return true;
  });
}

function formatActivityTime(ts) {
  var d = new Date(ts);
  var h = String(d.getHours()).padStart(2, '0');
  var m = String(d.getMinutes()).padStart(2, '0');
  var s = String(d.getSeconds()).padStart(2, '0');
  return h + ':' + m + ':' + s;
}

function renderActivityFeed() {
  var container = document.getElementById('activityFeedContent');
  if (!container) return;

  var filtered = filterActivity(activityEntries);
  var filters = ['alle', 'agenten', 'koordinator', 'fehler'];
  var filterLabels = { alle: 'Alle', agenten: 'Agenten', koordinator: 'Koordinator', fehler: 'Fehler' };

  // Sicher: DOM-Knoten aufbauen statt innerHTML fuer Activity-Texte
  clearEl(container);

  var header = createEl('div', { className: 'activity-feed-header' });
  header.appendChild(createEl('div', { className: 'activity-feed-title' }, 'Aktivit\u00E4ten (' + activityEntries.length + ')'));
  var filtersDiv = createEl('div', { className: 'activity-feed-filters' });
  filters.forEach(function(f) {
    var btn = createEl('button', { className: 'activity-filter-btn' + (activityFilter === f ? ' active' : '') }, filterLabels[f]);
    (function(fv) { btn.addEventListener('click', function() { setActivityFilter(fv); }); })(f);
    filtersDiv.appendChild(btn);
  });
  header.appendChild(filtersDiv);
  container.appendChild(header);

  var feedList = createEl('div', { className: 'activity-feed', id: 'activityFeedList', role: 'log', 'aria-live': 'polite', 'aria-label': 'Aktivit\u00E4ten-Feed' });

  if (filtered.length === 0) {
    feedList.appendChild(createEl('div', { className: 'activity-empty' }, 'Keine Aktivit\u00E4ten vorhanden'));
  } else {
    for (var i = 0; i < filtered.length; i++) {
      var entry = filtered[i];
      var agentNum = getActivityAgentNum(entry);
      var isError = entry.type === 'agent_error';
      var entryDiv = createEl('div', { className: 'activity-entry' + (isError ? ' activity-error' : '') });
      entryDiv.appendChild(createEl('span', { className: 'activity-ts' }, formatActivityTime(entry.ts)));
      entryDiv.appendChild(createEl('span', { className: 'activity-icon' }, getActivityIcon(entry.type)));
      entryDiv.appendChild(createEl('span', { className: 'activity-text' }, getActivityText(entry)));
      if (agentNum != null) {
        entryDiv.appendChild(createEl('span', { className: 'activity-badge' }, 'A' + agentNum));
      }
      feedList.appendChild(entryDiv);
    }
  }

  container.appendChild(feedList);

  // Auto-scroll to bottom
  var list = document.getElementById('activityFeedList');
  if (list) list.scrollTop = list.scrollHeight;
}

function _openAgentByKey(idx) {
  if (state.agents && idx < state.agents.length) {
    var cards = document.querySelectorAll('.agent-card');
    if (cards[idx]) {
      cards[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      cards[idx].focus();
    }
    openAgentModal(idx);
    showToast('Agent ' + (idx + 1) + ' ge\u00F6ffnet');
  }
}

function _navigateAgentCards(dir, e) {
  var cards = document.querySelectorAll('.agent-card');
  if (cards.length === 0) return;
  var currentIdx = -1;
  for (var i = 0; i < cards.length; i++) {
    if (cards[i] === document.activeElement || cards[i].contains(document.activeElement)) {
      currentIdx = i; break;
    }
  }
  var nextIdx = currentIdx + dir;
  if (nextIdx < 0) nextIdx = cards.length - 1;
  if (nextIdx >= cards.length) nextIdx = 0;
  if (cards[nextIdx]) {
    e.preventDefault();
    cards[nextIdx].setAttribute('tabindex', '0');
    cards[nextIdx].focus();
    cards[nextIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function _switchModalTab(dir) {
  var tabs = document.querySelectorAll('.modal-tab');
  if (tabs.length === 0) return;
  var activeIdx = -1;
  for (var i = 0; i < tabs.length; i++) {
    if (tabs[i].classList.contains('active')) { activeIdx = i; break; }
  }
  var nextIdx = activeIdx + dir;
  if (nextIdx < 0) nextIdx = tabs.length - 1;
  if (nextIdx >= tabs.length) nextIdx = 0;
  if (tabs[nextIdx]) tabs[nextIdx].click();
}

function showShortcutsHelp() {
  closeShortcutsHelp();
  var overlay = document.createElement('div');
  overlay.id = 'shortcutsModal';
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Tastenk\u00FCrzel');
  overlay.setAttribute('tabindex', '-1');
  overlay.onclick = function(e) { if (e.target === overlay) closeShortcutsHelp(); };

  // Shortcuts gruppiert nach Kategorie aufbauen
  var categories = {};
  var catOrder = ['Global', 'Schnellzugriff', 'Navigation'];
  for (var i = 0; i < shortcutRegistry.length; i++) {
    var sc = shortcutRegistry[i];
    if (sc._isDigit && sc.key !== '1') continue;
    if (sc._isTab && sc.shift) continue;
    var cat = sc.category || 'Sonstige';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(sc);
  }

  var html = '<div class="modal" style="max-width:480px">' +
    '<button class="modal-close" aria-label="Schlie\u00DFen" onclick="closeShortcutsHelp()" title="Schlie\u00DFen">\u00D7</button>' +
    '<h3 style="font-size:16px;font-weight:600;margin-bottom:1rem">Tastenk\u00FCrzel</h3>' +
    '<div class="shortcuts-grid">';

  for (var ci = 0; ci < catOrder.length; ci++) {
    var catName = catOrder[ci];
    var items = categories[catName];
    if (!items || items.length === 0) continue;
    html += '<div class="shortcuts-category">' + escapeHtml(catName) + '</div>';
    for (var j = 0; j < items.length; j++) {
      var s = items[j];
      var kbdHtml = '';
      if (s.ctrl) kbdHtml += '<kbd>' + _modLabel + '</kbd> + ';
      if (s.shift) kbdHtml += '<kbd>Shift</kbd> + ';
      if (s._isDigit) {
        kbdHtml += '<kbd>1</kbd>\u2013<kbd>9</kbd>';
      } else if (s._isTab) {
        kbdHtml += '<kbd>Tab</kbd> / <kbd>Shift</kbd>+<kbd>Tab</kbd>';
      } else {
        var keyLabel = s.key;
        if (keyLabel === 'Escape') keyLabel = 'Esc';
        if (keyLabel === 'Enter') keyLabel = '\u23CE';
        if (keyLabel === 'ArrowLeft') keyLabel = '\u2190';
        if (keyLabel === 'ArrowRight') keyLabel = '\u2192';
        kbdHtml += '<kbd>' + escapeHtml(keyLabel) + '</kbd>';
      }
      html += '<div>' + kbdHtml + '</div><span class="shortcut-desc">' + escapeHtml(s.desc) + '</span>';
    }
  }

  html += '</div>' +
    '<div class="shortcuts-hint" style="margin-top:14px">' + _modLabel + ' = ' + (_isMac ? 'Cmd (\u2318)' : 'Strg') + ' \u00B7 Shortcuts inaktiv bei Texteingabe (au\u00DFer ' + _modLabel + '-Kombinationen + Esc)</div>' +
    '</div>';

  overlay.innerHTML = html;
  document.body.appendChild(overlay);
}

function closeShortcutsHelp() {
  var el = document.getElementById('shortcutsModal');
  if (el) el.remove();
}

// Zentraler Keyboard-Handler (Registry-basiert)
document.addEventListener('keydown', function(e) {
  var tag = (e.target.tagName || '').toLowerCase();
  var inInput = (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable);
  var hasCtrl = (e.ctrlKey || e.metaKey);
  var hasShift = e.shiftKey;
  var key = e.key;

  for (var i = 0; i < shortcutRegistry.length; i++) {
    var sc = shortcutRegistry[i];
    var keyMatch = (key === sc.key) ||
                   (key.length === 1 && sc.key.length === 1 && key.toLowerCase() === sc.key.toLowerCase());
    if (!keyMatch) continue;

    var wantCtrl = !!sc.ctrl;
    var wantShift = !!sc.shift;
    if (wantCtrl !== hasCtrl) continue;
    if (wantShift !== hasShift) continue;
    if (e.altKey) continue;

    // Input-Felder: nur Escape, Ctrl-Kombinationen und F-Tasten durchlassen
    if (inInput && !sc.alwaysActive && !wantCtrl && key !== 'Escape' && key !== 'F1') continue;

    e.preventDefault();
    sc.action(e);
    return;
  }
});

// ── Queue Manager ─────────────────────────────────────────────
var _queueDragFrom = null; // Drag & Drop State

async function loadQueue() {
  try {
    var resp = await authFetch('/api/queue', { headers: authHeadersNoBody() });
    if (resp.ok) {
      projectQueue = await resp.json();
      updateQueueDisplay();
      updateQueueBadge();
    }
  } catch (e) { /* Queue-API evtl. nicht verfuegbar */ }
}

function queueTimeAgo(ts) {
  if (!ts) return '';
  var diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (diff < 60) return 'vor ' + diff + ' Sek.';
  var mins = Math.floor(diff / 60);
  if (mins < 60) return 'vor ' + mins + ' Min.';
  var hours = Math.floor(mins / 60);
  return 'vor ' + hours + ' Std.';
}

function queuePrioBadge(prio) {
  if (prio === 1) return '\uD83D\uDD34';
  if (prio === 3) return '\uD83D\uDFE2';
  return '\uD83D\uDFE1';
}

function queuePrioLabel(prio) {
  if (prio === 1) return 'Hoch';
  if (prio === 3) return 'Niedrig';
  return 'Mittel';
}

function formatWaitTime(ms) {
  if (!ms || ms <= 0) return '';
  var secs = Math.round(ms / 1000);
  if (secs < 60) return '~' + secs + ' Sek.';
  var mins = Math.round(secs / 60);
  if (mins < 60) return '~' + mins + ' Min.';
  var hours = Math.round(mins / 60);
  return '~' + hours + ' Std.';
}

function renderQueueSection() {
  if (projectQueue.length === 0) return '';
  var html = '<div class="queue-section fadein">' +
    '<div class="queue-header">' +
      '<div class="section-label" style="margin-bottom:0">Warteschlange (' + projectQueue.length + ')</div>' +
      '<button class="btn-outline queue-clear-btn" onclick="clearQueue()">Alle entfernen</button>' +
    '</div>' +
    '<div class="queue-list">';
  for (var i = 0; i < projectQueue.length; i++) {
    var item = projectQueue[i];
    var desc = item.description || '';
    var truncated = desc.length > 80 ? desc.substring(0, 80) + '\u2026' : desc;
    var prio = item.priority || 2;
    var pos = item.position || (i + 1);
    var waitTime = item.estimatedWaitTime ? formatWaitTime(item.estimatedWaitTime) : '';
    html += '<div class="queue-item" draggable="true" data-queue-idx="' + i + '" ' +
      'ondragstart="queueDragStart(event,' + i + ')" ' +
      'ondragover="queueDragOver(event)" ' +
      'ondragenter="queueDragEnter(event)" ' +
      'ondragleave="queueDragLeave(event)" ' +
      'ondrop="queueDrop(event,' + i + ')" ' +
      'ondragend="queueDragEnd(event)">' +
      '<div class="queue-item-drag" title="Ziehen zum Umsortieren">\u22EE\u22EE</div>' +
      '<div class="queue-item-pos">' + pos + '</div>' +
      '<div class="queue-item-prio" title="Priorit\u00E4t: ' + esc(queuePrioLabel(prio)) + '">' + queuePrioBadge(prio) + '</div>' +
      '<div class="queue-item-body">' +
        '<div class="queue-item-desc">' + esc(truncated) + '</div>' +
        '<div class="queue-item-meta">' + esc(String(item.agentCount || '?')) + ' Agenten' +
          ' \u00B7 ' + esc(queuePrioLabel(prio)) +
          (item.requireApproval ? ' \u00B7 Plan pruefen' : '') +
          ' \u00B7 ' + esc(queueTimeAgo(item.queuedAt)) +
        '</div>' +
        (waitTime ? '<div class="queue-item-wait">\u23F3 Gesch\u00E4tzte Wartezeit: ' + esc(waitTime) + '</div>' : '') +
      '</div>' +
      '<button class="btn-icon queue-item-remove" onclick="removeQueueItem(' + i + ')" title="Entfernen">\u00D7</button>' +
    '</div>';
  }
  html += '</div></div>';
  return html;
}

// ── Queue Drag & Drop ──────────────────────────────────────────
function queueDragStart(e, idx) {
  _queueDragFrom = idx;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(idx));
  e.currentTarget.style.opacity = '0.5';
}

function queueDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function queueDragEnter(e) {
  e.preventDefault();
  var el = e.currentTarget;
  if (el.classList) el.classList.add('queue-drag-over');
}

function queueDragLeave(e) {
  var el = e.currentTarget;
  if (el.classList) el.classList.remove('queue-drag-over');
}

function queueDragEnd(e) {
  _queueDragFrom = null;
  e.currentTarget.style.opacity = '';
  var items = document.querySelectorAll('.queue-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.remove('queue-drag-over');
  }
}

async function queueDrop(e, toIdx) {
  e.preventDefault();
  var el = e.currentTarget;
  if (el.classList) el.classList.remove('queue-drag-over');
  var fromIdx = _queueDragFrom;
  _queueDragFrom = null;
  if (fromIdx === null || fromIdx === toIdx) return;
  try {
    await authFetch('/api/queue/reorder', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ from: fromIdx, to: toIdx })
    });
    // Lokales Array umsortieren
    var moved = projectQueue.splice(fromIdx, 1)[0];
    projectQueue.splice(toIdx, 0, moved);
    updateQueueDisplay();
  } catch (err) {
    addBanner('error', 'Fehler beim Umsortieren: ' + err.message);
  }
}

function updateQueueDisplay() {
  var els = document.querySelectorAll('.queue-section-slot');
  for (var i = 0; i < els.length; i++) {
    els[i].innerHTML = renderQueueSection();
  }
}

function updateQueueBadge() {
  var btn = document.getElementById('startBtn');
  if (!btn) return;
  var badge = btn.querySelector('.queue-badge');
  if (projectQueue.length > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'queue-badge';
      btn.appendChild(badge);
    }
    badge.textContent = 'Warteschlange: ' + projectQueue.length;
    btn.style.position = 'relative';
  } else if (badge) {
    badge.remove();
  }
}

async function removeQueueItem(index) {
  try {
    await authFetch('/api/queue/' + index, { method: 'DELETE', headers: authHeadersNoBody() });
    projectQueue.splice(index, 1);
    updateQueueDisplay();
    updateQueueBadge();
  } catch (e) {
    addBanner('error', 'Fehler beim Entfernen: ' + e.message);
  }
}

async function clearQueue() {
  if (!confirm('Alle Eintraege aus der Warteschlange entfernen?')) return;
  try {
    await authFetch('/api/queue/clear', { method: 'POST', headers: authHeadersNoBody() });
    projectQueue = [];
    updateQueueDisplay();
    updateQueueBadge();
  } catch (e) {
    addBanner('error', 'Fehler beim Leeren der Warteschlange: ' + e.message);
  }
}

// ── Analytics Dashboard ────────────────────────────────────────
var _analyticsCache = null;
var _analyticsCacheTime = 0;
var ANALYTICS_CACHE_TTL = 60000;

function openAnalytics() {
  var existing = document.getElementById('analyticsModal');
  if (existing) { closeAnalytics(); return; }
  var overlay = document.createElement('div');
  overlay.id = 'analyticsModal';
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Analytics Dashboard');
  overlay.onclick = function(e) { if (e.target === overlay) closeAnalytics(); };
  overlay.innerHTML = '<div class="modal analytics-modal">' +
    '<button class="modal-close" aria-label="Dialog schlie\u00DFen" onclick="closeAnalytics()" title="Schlie\u00DFen">&times;</button>' +
    '<h3>Analytics Dashboard</h3>' +
    '<div class="analytics-loading"><span class="spin"></span> Daten werden geladen\u2026</div>' +
    '</div>';
  document.body.appendChild(overlay);
  var now = Date.now();
  if (_analyticsCache && (now - _analyticsCacheTime) < ANALYTICS_CACHE_TTL) {
    renderAnalytics(_analyticsCache);
  } else {
    fetch('/api/analytics').then(function(r) { return r.json(); }).then(function(data) {
      _analyticsCache = data;
      _analyticsCacheTime = Date.now();
      renderAnalytics(data);
    }).catch(function() {
      var m = document.querySelector('#analyticsModal .analytics-modal');
      if (m) { var c = m.querySelector('.analytics-loading'); if (c) c.outerHTML = '<div class="analytics-empty">Keine Daten verf\u00FCgbar</div>'; }
    });
  }
}

function closeAnalytics() {
  var el = document.getElementById('analyticsModal');
  if (el) el.remove();
}

function fmtADur(s) {
  if (s == null) return '\u2014';
  if (s < 60) return Math.round(s) + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + Math.round(s % 60) + 's';
  return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
}

function fmtANum(n) {
  if (n == null) return '0';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(Math.round(n));
}

function renderAnalytics(data) {
  var modal = document.querySelector('#analyticsModal .analytics-modal');
  if (!modal) return;
  if (!data || (!data.timeline && !data.roleStats && !data.costEfficiency && !data.topStats && !data.distribution)) {
    modal.innerHTML = '<button class="modal-close" aria-label="Dialog schlie\u00DFen" onclick="closeAnalytics()" title="Schlie\u00DFen">&times;</button><h3>Analytics Dashboard</h3><div class="analytics-empty">Keine Daten verf\u00FCgbar</div>';
    return;
  }
  var h = '<button class="modal-close" aria-label="Dialog schlie\u00DFen" onclick="closeAnalytics()" title="Schlie\u00DFen">&times;</button><h3>Analytics Dashboard</h3>';
  if (data.timeline && data.timeline.length > 0) {
    var mx = 1;
    data.timeline.forEach(function(w) { var t = (w.successCount||0) + (w.failCount||0); if (t > mx) mx = t; });
    var tb = data.timeline.map(function(w) {
      var tot = (w.successCount||0) + (w.failCount||0);
      var sw = tot > 0 ? ((w.successCount||0) / mx * 100) : 0;
      var fw = tot > 0 ? ((w.failCount||0) / mx * 100) : 0;
      return '<div class="analytics-bar-row"><span class="analytics-bar-label" title="'+esc(w.week||'')+'">'+esc(w.week||'')+'</span><div class="analytics-bar-track"><div class="analytics-bar-fill-green" style="width:'+sw.toFixed(1)+'%"></div><div class="analytics-bar-fill-red" style="width:'+fw.toFixed(1)+'%"></div></div><span class="analytics-bar-value">'+tot+'</span></div>';
    }).join('');
    h += '<div class="analytics-section"><div class="analytics-section-title">Timeline (Projekte pro Woche)</div><div class="analytics-bar-chart">'+tb+'</div></div>';
  }
  if (data.roleStats && data.roleStats.length > 0) {
    var rr = data.roleStats.map(function(r) {
      return '<tr><td>'+esc(r.role||'\u2014')+'</td><td>'+(r.count||0)+'</td><td>'+(r.avgScore!=null?r.avgScore.toFixed(1):'\u2014')+'</td><td>'+(r.avgDuration!=null?fmtADur(r.avgDuration):'\u2014')+'</td><td>'+(r.successRate!=null?(r.successRate*100).toFixed(0)+'%':'\u2014')+'</td></tr>';
    }).join('');
    h += '<div class="analytics-section"><div class="analytics-section-title">Rollen-Statistiken</div><table class="analytics-table"><thead><tr><th>Rolle</th><th>Anzahl</th><th>\u00D8 Score</th><th>\u00D8 Dauer</th><th>Erfolgsrate</th></tr></thead><tbody>'+rr+'</tbody></table></div>';
  }
  if (data.costEfficiency) {
    var ce = data.costEfficiency;
    h += '<div class="analytics-section"><div class="analytics-section-title">Kosten\u00FCbersicht</div><div class="analytics-stats-grid">' +
      '<div class="analytics-stat-card"><div class="analytics-stat-value">'+fmtANum(ce.avgTokensPerProject)+'</div><div class="analytics-stat-label">Tokens / Projekt</div></div>' +
      '<div class="analytics-stat-card"><div class="analytics-stat-value">'+fmtANum(ce.avgTokensPerAgent)+'</div><div class="analytics-stat-label">Tokens / Agent</div></div>' +
      '<div class="analytics-stat-card"><div class="analytics-stat-value">'+fmtANum(ce.avgTokensPerFile)+'</div><div class="analytics-stat-label">Tokens / Datei</div></div>' +
      '<div class="analytics-stat-card"><div class="analytics-stat-value">$'+(ce.avgCostPerProject!=null?ce.avgCostPerProject.toFixed(2):'0.00')+'</div><div class="analytics-stat-label">Kosten / Projekt (USD)</div></div>' +
      '</div></div>';
  }
  if (data.topStats) {
    var ts = data.topStats;
    h += '<div class="analytics-section"><div class="analytics-section-title">Top-Projekte</div><div class="analytics-top-cards">';
    if (ts.bestProject) h += '<div class="analytics-top-card"><div class="analytics-top-card-label">Bestes Projekt</div><div class="analytics-top-card-name">'+esc(ts.bestProject.name||ts.bestProject.id||'\u2014')+'</div>'+(ts.bestProject.score!=null?'<div class="analytics-top-card-detail">Score: '+ts.bestProject.score.toFixed(1)+'</div>':'')+'</div>';
    if (ts.worstProject) h += '<div class="analytics-top-card"><div class="analytics-top-card-label">Schlechtestes Projekt</div><div class="analytics-top-card-name">'+esc(ts.worstProject.name||ts.worstProject.id||'\u2014')+'</div>'+(ts.worstProject.score!=null?'<div class="analytics-top-card-detail">Score: '+ts.worstProject.score.toFixed(1)+'</div>':'')+'</div>';
    if (ts.fastestProject) h += '<div class="analytics-top-card"><div class="analytics-top-card-label">Schnellstes Projekt</div><div class="analytics-top-card-name">'+esc(ts.fastestProject.name||ts.fastestProject.id||'\u2014')+'</div>'+(ts.fastestProject.duration!=null?'<div class="analytics-top-card-detail">'+fmtADur(ts.fastestProject.duration)+'</div>':'')+'</div>';
    if (ts.longestProject) h += '<div class="analytics-top-card"><div class="analytics-top-card-label">L\u00E4ngstes Projekt</div><div class="analytics-top-card-name">'+esc(ts.longestProject.name||ts.longestProject.id||'\u2014')+'</div>'+(ts.longestProject.duration!=null?'<div class="analytics-top-card-detail">'+fmtADur(ts.longestProject.duration)+'</div>':'')+'</div>';
    h += '</div></div>';
  }
  if (data.distribution) {
    if (data.distribution.scoreBuckets && data.distribution.scoreBuckets.length > 0) {
      var mxs = 1; data.distribution.scoreBuckets.forEach(function(b) { if (b.count > mxs) mxs = b.count; });
      var sb = data.distribution.scoreBuckets.map(function(b) {
        return '<div class="analytics-bar-row"><span class="analytics-bar-label">'+esc(b.range||'')+'</span><div class="analytics-bar-track"><div class="analytics-bar-fill" style="width:'+(b.count/mxs*100).toFixed(1)+'%"></div></div><span class="analytics-bar-value">'+b.count+'</span></div>';
      }).join('');
      h += '<div class="analytics-section"><div class="analytics-section-title">Score-Verteilung</div><div class="analytics-bar-chart">'+sb+'</div></div>';
    }
    if (data.distribution.durationBuckets && data.distribution.durationBuckets.length > 0) {
      var mxd = 1; data.distribution.durationBuckets.forEach(function(b) { if (b.count > mxd) mxd = b.count; });
      var db = data.distribution.durationBuckets.map(function(b) {
        return '<div class="analytics-bar-row"><span class="analytics-bar-label">'+esc(b.range||'')+'</span><div class="analytics-bar-track"><div class="analytics-bar-fill" style="width:'+(b.count/mxd*100).toFixed(1)+'%"></div></div><span class="analytics-bar-value">'+b.count+'</span></div>';
      }).join('');
      h += '<div class="analytics-section"><div class="analytics-section-title">Dauer-Verteilung</div><div class="analytics-bar-chart">'+db+'</div></div>';
    }
  }
  modal.innerHTML = h;
}

// ── Crash-Recovery ───────────────────────────────────────────
async function checkCrashRecovery() {
  try {
    var resp = await fetch('/api/recovery');
    if (!resp.ok) return;
    var data = await resp.json();
    if (data.hasCrash) {
      recoveryData = data;
      render();
    }
  } catch (e) {
    // Stiller Fehler - Recovery ist optional
  }
}

async function restoreFromCheckpoint() {
  if (!recoveryData) return;
  busy = true;
  render();
  try {
    var resp = await fetch('/api/recovery/restore', {
      method: 'POST',
      headers: authHeaders()
    });
    var data = await resp.json();
    if (data.ok) {
      recoveryData = null;
      showToast('Projekt wird aus Checkpoint wiederhergestellt\u2026');
    } else {
      showToast('Wiederherstellung fehlgeschlagen: ' + (data.error || 'Unbekannter Fehler'), 'error');
    }
  } catch (e) {
    showToast('Wiederherstellung fehlgeschlagen: ' + e.message, 'error');
  } finally {
    busy = false;
    render();
  }
}

async function discardCheckpoint() {
  if (!recoveryData) return;
  try {
    var resp = await fetch('/api/recovery/discard', {
      method: 'POST',
      headers: authHeaders()
    });
    var data = await resp.json();
    if (data.ok) {
      recoveryData = null;
      showToast('Checkpoint verworfen');
    } else {
      showToast('Verwerfen fehlgeschlagen: ' + (data.error || 'Unbekannter Fehler'), 'error');
    }
  } catch (e) {
    showToast('Verwerfen fehlgeschlagen: ' + e.message, 'error');
  }
  render();
}

function renderRecoveryBanner() {
  if (!recoveryData || !recoveryData.hasCrash) return '';
  var d = recoveryData;
  var timeStr = d.createdAtISO ? new Date(d.createdAtISO).toLocaleString('de-DE') : 'unbekannt';
  var phaseStr = d.phase === 'running' ? 'Laufend' : (d.phase === 'awaiting_approval' ? 'Warte auf Genehmigung' : d.phase);
  var agentInfo = (d.completedAgents || 0) + ' von ' + (d.agentCount || '?') + ' Agenten abgeschlossen';
  return '<div class="recovery-banner fadein">' +
    '<div class="recovery-icon">\u26A0\uFE0F</div>' +
    '<div class="recovery-content">' +
      '<div class="recovery-title">Unterbrochenes Projekt gefunden</div>' +
      '<div class="recovery-details">' +
        '<span><strong>Projekt:</strong> ' + esc(d.projectTitle || d.projectId || 'Unbekannt') + '</span>' +
        '<span><strong>Zeitpunkt:</strong> ' + esc(timeStr) + '</span>' +
        '<span><strong>Phase:</strong> ' + esc(phaseStr) + '</span>' +
        '<span><strong>Fortschritt:</strong> ' + esc(agentInfo) + '</span>' +
        '<span><strong>Grund:</strong> ' + esc(d.reason || 'unbekannt') + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="recovery-actions">' +
      '<button class="btn-primary" onclick="restoreFromCheckpoint()" ' + (busy ? 'disabled' : '') + '>Fortsetzen</button>' +
      '<button class="btn-outline" onclick="discardCheckpoint()" ' + (busy ? 'disabled' : '') + '>Verwerfen</button>' +
    '</div>' +
  '</div>';
}

// ── Log-Viewer ────────────────────────────────────────────────
var logViewerOpen = false;
var logViewerFilter = '';      // Level-Filter: '' | 'info' | 'warn' | 'error'
var logViewerCatFilter = '';   // Kategorie-Filter: '' | 'agent' | 'coordinator' | 'system' | 'api'
var logViewerSearch = '';      // Suchtext
var logViewerAutoScroll = true;
var logViewerTimer = null;
var logViewerOffset = 0;
var logViewerTotal = 0;
var logViewerLimit = 100;
var _logExpandedIds = {};      // Welche Eintraege sind expandiert
var _logSearchDebounce = null;

function openLogViewer() {
  logViewerOpen = true;
  logViewerFilter = '';
  logViewerCatFilter = '';
  logViewerSearch = '';
  logViewerOffset = 0;
  _logExpandedIds = {};
  fetchAndRenderLogs();
  logViewerTimer = setInterval(fetchAndRenderLogs, 4000);
}

function closeLogViewer() {
  logViewerOpen = false;
  if (logViewerTimer) { clearInterval(logViewerTimer); logViewerTimer = null; }
  var el = document.getElementById('logViewerOverlay');
  if (el) el.remove();
}

function setLogFilter(level) {
  logViewerFilter = level;
  logViewerOffset = 0;
  fetchAndRenderLogs();
}

function setLogCatFilter(cat) {
  logViewerCatFilter = cat;
  logViewerOffset = 0;
  fetchAndRenderLogs();
}

function setLogSearch(text) {
  logViewerSearch = text;
  logViewerOffset = 0;
  fetchAndRenderLogs();
}

function toggleLogAutoScroll() {
  logViewerAutoScroll = !logViewerAutoScroll;
  fetchAndRenderLogs();
}

function logViewerPrev() {
  logViewerOffset = Math.max(0, logViewerOffset - logViewerLimit);
  fetchAndRenderLogs();
}

function logViewerNext() {
  if (logViewerOffset + logViewerLimit < logViewerTotal) {
    logViewerOffset += logViewerLimit;
    fetchAndRenderLogs();
  }
}

function toggleLogExpand(id) {
  if (_logExpandedIds[id]) { delete _logExpandedIds[id]; }
  else { _logExpandedIds[id] = true; }
  var metaEl = document.getElementById('log-meta-' + id);
  var entryEl = document.getElementById('log-entry-' + id);
  if (metaEl) {
    metaEl.style.display = _logExpandedIds[id] ? 'block' : 'none';
    if (entryEl) {
      if (_logExpandedIds[id]) entryEl.classList.add('expanded');
      else entryEl.classList.remove('expanded');
    }
  }
}

function relativeTime(ts) {
  if (!ts) return '';
  var now = Date.now();
  var then = new Date(ts).getTime();
  var diff = Math.max(0, Math.floor((now - then) / 1000));
  if (diff < 5) return 'gerade';
  if (diff < 60) return 'vor ' + diff + 's';
  if (diff < 3600) return 'vor ' + Math.floor(diff / 60) + 'm';
  if (diff < 86400) return 'vor ' + Math.floor(diff / 3600) + 'h';
  return 'vor ' + Math.floor(diff / 86400) + 'd';
}

function formatLogTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return ts;
  return String(d.getHours()).padStart(2, '0') + ':' +
         String(d.getMinutes()).padStart(2, '0') + ':' +
         String(d.getSeconds()).padStart(2, '0');
}

function fetchAndRenderLogs() {
  if (!logViewerOpen) return;
  var params = [];
  if (logViewerFilter) params.push('level=' + encodeURIComponent(logViewerFilter));
  if (logViewerCatFilter) params.push('category=' + encodeURIComponent(logViewerCatFilter));
  if (logViewerSearch) params.push('search=' + encodeURIComponent(logViewerSearch));
  params.push('offset=' + logViewerOffset);
  params.push('limit=' + logViewerLimit);
  var url = '/api/logs' + (params.length ? '?' + params.join('&') : '');
  fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    logViewerTotal = data.total || 0;
    renderLogViewer(data.entries || []);
  }).catch(function() {
    logViewerTotal = 0;
    renderLogViewer([]);
  });
}

function renderLogViewer(logs) {
  var overlay = document.getElementById('logViewerOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'logViewerOverlay';
    overlay.className = 'log-viewer';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.setAttribute('aria-label', 'Server-Logs');
    overlay.setAttribute('tabindex', '-1');
    overlay.addEventListener('click', function(e) { if (e.target === overlay) closeLogViewer(); });
    document.body.appendChild(overlay);
  }

  clearEl(overlay);
  var panel = createEl('div', { className: 'log-viewer-panel' });

  // Header
  var headerDiv = createEl('div', { className: 'log-viewer-header' });
  var headerLeft = createEl('div', { className: 'log-viewer-header-left' });
  headerLeft.appendChild(createEl('span', { className: 'log-viewer-title' }, 'Server-Logs'));
  headerLeft.appendChild(createEl('span', { className: 'log-viewer-count' }, logViewerTotal + ' Eintr\u00E4ge'));
  headerDiv.appendChild(headerLeft);

  var headerRight = createEl('div', { className: 'log-viewer-header-right' });
  var exportBtn = createEl('a', { className: 'log-export-btn', href: '/api/logs/export', download: '' }, 'Export');
  headerRight.appendChild(exportBtn);
  var logCloseBtn = createEl('button', { className: 'modal-close', 'aria-label': 'Dialog schliessen' }, '\u00D7');
  logCloseBtn.addEventListener('click', closeLogViewer);
  headerRight.appendChild(logCloseBtn);
  headerDiv.appendChild(headerRight);
  panel.appendChild(headerDiv);

  // Toolbar: Filter
  var toolbar = createEl('div', { className: 'log-toolbar' });

  // Level-Filter
  var lvlGroup = createEl('div', { className: 'log-filter-group' });
  lvlGroup.appendChild(createEl('span', { className: 'log-filter-label' }, 'Level'));
  var levels = [
    { key: '', label: 'Alle', activeClass: 'active' },
    { key: 'info', label: 'Info', activeClass: 'active-info' },
    { key: 'warn', label: 'Warnung', activeClass: 'active-warn' },
    { key: 'error', label: 'Fehler', activeClass: 'active-error' }
  ];
  levels.forEach(function(lvl) {
    var isActive = logViewerFilter === lvl.key;
    var cls = 'log-filter-btn' + (isActive ? ' ' + lvl.activeClass : '');
    var btn = createEl('button', { className: cls }, lvl.label);
    (function(l) { btn.addEventListener('click', function() { setLogFilter(l); }); })(lvl.key);
    lvlGroup.appendChild(btn);
  });
  toolbar.appendChild(lvlGroup);

  // Kategorie-Filter
  var catGroup = createEl('div', { className: 'log-filter-group' });
  catGroup.appendChild(createEl('span', { className: 'log-filter-label' }, 'Kat.'));
  var cats = [
    { key: '', label: 'Alle' },
    { key: 'agent', label: 'Agent' },
    { key: 'coordinator', label: 'Koordinator' },
    { key: 'system', label: 'System' },
    { key: 'api', label: 'API' }
  ];
  cats.forEach(function(c) {
    var isActive = logViewerCatFilter === c.key;
    var btn = createEl('button', { className: 'log-filter-btn' + (isActive ? ' active' : '') }, c.label);
    (function(k) { btn.addEventListener('click', function() { setLogCatFilter(k); }); })(c.key);
    catGroup.appendChild(btn);
  });
  toolbar.appendChild(catGroup);

  // Suchfeld
  var searchInput = createEl('input', {
    className: 'log-search-input',
    type: 'text',
    placeholder: 'Suche...',
    value: logViewerSearch
  });
  searchInput.addEventListener('input', function(e) {
    var val = e.target.value;
    if (_logSearchDebounce) clearTimeout(_logSearchDebounce);
    _logSearchDebounce = setTimeout(function() { setLogSearch(val); }, 350);
  });
  toolbar.appendChild(searchInput);

  // Auto-Scroll Toggle
  var scrollBtn = createEl('button', {
    className: 'log-autoscroll-toggle' + (logViewerAutoScroll ? ' active' : '')
  }, logViewerAutoScroll ? 'Auto-Scroll AN' : 'Auto-Scroll AUS');
  scrollBtn.addEventListener('click', toggleLogAutoScroll);
  toolbar.appendChild(scrollBtn);

  panel.appendChild(toolbar);

  // Log-Eintraege
  var entriesDiv = createEl('div', {
    className: 'log-entries',
    id: 'logEntriesContainer',
    role: 'log',
    'aria-live': 'polite',
    'aria-label': 'Server-Log-Eintr\u00E4ge'
  });

  if (logs.length === 0) {
    entriesDiv.appendChild(createEl('div', { className: 'log-empty' }, 'Keine Log-Eintr\u00E4ge vorhanden'));
  } else {
    logs.forEach(function(entry) {
      var rawLevel = (entry.level || 'info').replace(/\u001b?\[[0-9;]*m/g, '');
      var levelClass = rawLevel.indexOf('error') >= 0 ? 'log-error' : rawLevel.indexOf('warn') >= 0 ? 'log-warn' : 'log-info';
      var catClass = entry.category ? 'log-cat-' + entry.category : '';
      var entryId = entry.id || Math.random().toString(36).slice(2);
      var isExpanded = !!_logExpandedIds[entryId];
      var hasMeta = entry.metadata && typeof entry.metadata === 'object' && Object.keys(entry.metadata).length > 0;

      var entryDiv = createEl('div', {
        className: 'log-entry ' + levelClass + (isExpanded ? ' expanded' : ''),
        id: 'log-entry-' + entryId
      });

      // Timestamp + relative Zeit
      var tsSpan = createEl('span', { className: 'log-ts' });
      tsSpan.appendChild(document.createTextNode(formatLogTime(entry.timestamp)));
      var relSpan = createEl('span', { className: 'log-ts-relative' }, relativeTime(entry.timestamp));
      tsSpan.appendChild(relSpan);
      entryDiv.appendChild(tsSpan);

      // Level-Badge
      entryDiv.appendChild(createEl('span', { className: 'log-lvl' }, rawLevel));

      // Kategorie-Badge
      entryDiv.appendChild(createEl('span', { className: 'log-cat ' + catClass }, entry.category || 'system'));

      // Message
      entryDiv.appendChild(createEl('span', { className: 'log-msg' }, entry.message || ''));

      // Klick zum Expandieren (nur wenn Metadata vorhanden)
      if (hasMeta) {
        (function(eid) {
          entryDiv.addEventListener('click', function() { toggleLogExpand(eid); });
          entryDiv.style.cursor = 'pointer';
          entryDiv.title = 'Klicken f\u00FCr Details';
        })(entryId);
      }

      entriesDiv.appendChild(entryDiv);

      // Metadata-Panel
      if (hasMeta) {
        var metaDiv = createEl('div', {
          className: 'log-meta-panel',
          id: 'log-meta-' + entryId
        });
        metaDiv.style.display = isExpanded ? 'block' : 'none';
        try {
          metaDiv.textContent = JSON.stringify(entry.metadata, null, 2);
        } catch(e2) {
          metaDiv.textContent = String(entry.metadata);
        }
        entriesDiv.appendChild(metaDiv);
      }
    });
  }
  panel.appendChild(entriesDiv);

  // Pagination
  var pagDiv = createEl('div', { className: 'log-pagination' });
  var prevBtn = createEl('button', {}, '\u25C0 Neuere');
  prevBtn.disabled = logViewerOffset === 0;
  prevBtn.addEventListener('click', logViewerPrev);
  var infoSpan = createEl('span', {}, (logViewerOffset + 1) + ' - ' + Math.min(logViewerOffset + logViewerLimit, logViewerTotal) + ' von ' + logViewerTotal);
  var nextBtn = createEl('button', {}, '\u00C4ltere \u25B6');
  nextBtn.disabled = logViewerOffset + logViewerLimit >= logViewerTotal;
  nextBtn.addEventListener('click', logViewerNext);
  pagDiv.appendChild(prevBtn);
  pagDiv.appendChild(infoSpan);
  pagDiv.appendChild(nextBtn);
  panel.appendChild(pagDiv);

  overlay.appendChild(panel);

  // Auto-Scroll
  if (logViewerAutoScroll) {
    var container = document.getElementById('logEntriesContainer');
    if (container) container.scrollTop = container.scrollHeight;
  }
}

var _perfTimer = null;

function openPerformance() {
  var existing = document.getElementById('perfModal');
  if (existing) { closePerformance(); return; }

  var overlay = document.createElement('div');
  overlay.id = 'perfModal';
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Performance-Monitoring');
  overlay.onclick = function(e) { if (e.target === overlay) closePerformance(); };

  overlay.innerHTML = '<div class="modal perf-modal">' +
    '<button class="modal-close" aria-label="Schlie\u00DFen" onclick="closePerformance()" title="Schlie\u00DFen">&times;</button>' +
    '<h3>Performance-Monitoring</h3>' +
    '<div id="perfContent"><div style="text-align:center;padding:2rem;color:var(--txt3)">Lade Metriken...</div></div>' +
    '<div class="perf-actions">' +
      '<button class="btn-outline" onclick="resetMetrics()" style="font-size:12px;padding:4px 12px">Metriken zur\u00FCcksetzen</button>' +
      '<button class="btn-outline" onclick="closePerformance()" style="font-size:12px;padding:4px 12px">Schlie\u00DFen</button>' +
    '</div>' +
    '<div class="perf-auto-label">Aktualisiert sich alle 5 Sekunden</div>' +
  '</div>';

  document.body.appendChild(overlay);
  document.addEventListener('keydown', perfKeyHandler);
  loadPerfMetrics();
  _perfTimer = setInterval(loadPerfMetrics, 5000);
}

function closePerformance() {
  var el = document.getElementById('perfModal');
  if (el) el.remove();
  document.removeEventListener('keydown', perfKeyHandler);
  if (_perfTimer) { clearInterval(_perfTimer); _perfTimer = null; }
}

function perfKeyHandler(e) {
  if (e.key === 'Escape') { closePerformance(); e.preventDefault(); }
}

function fmtPerfBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function fmtPerfUptime(sec) {
  var d = Math.floor(sec / 86400);
  var h = Math.floor((sec % 86400) / 3600);
  var m = Math.floor((sec % 3600) / 60);
  var s = Math.floor(sec % 60);
  if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
  if (h > 0) return h + 'h ' + m + 'm ' + s + 's';
  if (m > 0) return m + 'm ' + s + 's';
  return s + 's';
}

function perfBarColor(pct) {
  if (pct < 70) return 'green';
  if (pct < 90) return 'yellow';
  return 'red';
}

function loadPerfMetrics() {
  var container = document.getElementById('perfContent');
  if (!container) return;

  fetch('/api/metrics').then(function(r) { return r.json(); }).then(function(data) {
    if (!document.getElementById('perfContent')) return;

    var heapPct = Math.round((data.memory.heapUsed / data.memory.heapTotal) * 100);
    var rssMB = (data.memory.rss / 1048576).toFixed(1);
    var heapUsedMB = fmtPerfBytes(data.memory.heapUsed);
    var heapTotalMB = fmtPerfBytes(data.memory.heapTotal);

    var html = '';

    // Uebersichtskarten
    html += '<div class="perf-grid">';
    html += '<div class="perf-card">' +
      '<div class="perf-card-label">Uptime</div>' +
      '<div class="perf-card-value">' + esc(fmtPerfUptime(data.uptime)) + '</div>' +
    '</div>';
    html += '<div class="perf-card">' +
      '<div class="perf-card-label">CPU</div>' +
      '<div class="perf-card-value">' + data.cpu + '<span style="font-size:12px">%</span></div>' +
      '<div class="perf-bar-wrap"><div class="perf-bar-fill ' + perfBarColor(data.cpu) + '" style="width:' + Math.min(100, data.cpu) + '%"></div></div>' +
    '</div>';
    html += '<div class="perf-card">' +
      '<div class="perf-card-label">SSE</div>' +
      '<div class="perf-card-value">' + data.connections.sse + '</div>' +
      '<div class="perf-card-unit">Verbindungen</div>' +
    '</div>';
    html += '<div class="perf-card">' +
      '<div class="perf-card-label">WebSocket</div>' +
      '<div class="perf-card-value">' + data.connections.ws + '</div>' +
      '<div class="perf-card-unit">Verbindungen</div>' +
    '</div>';
    html += '</div>';

    // Memory-Sektion
    html += '<div class="perf-section">';
    html += '<div class="perf-section-title">Speicher</div>';
    html += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);margin-bottom:3px">' +
      '<span>Heap: ' + esc(heapUsedMB) + ' / ' + esc(heapTotalMB) + '</span>' +
      '<span>' + heapPct + '%</span>' +
    '</div>';
    html += '<div class="perf-bar-wrap"><div class="perf-bar-fill ' + perfBarColor(heapPct) + '" style="width:' + heapPct + '%"></div></div>';
    html += '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);margin-top:4px">' +
      '<span>RSS: ' + esc(rssMB) + ' MB</span>' +
      '<span>External: ' + esc(fmtPerfBytes(data.memory.external)) + '</span>' +
    '</div>';
    html += '</div>';

    // Endpoint-Tabelle
    if (data.endpoints && data.endpoints.length > 0) {
      html += '<div class="perf-section">';
      html += '<div class="perf-section-title">Top Endpoints (Requests)</div>';
      html += '<table class="perf-table"><thead><tr>' +
        '<th>Endpoint</th><th style="text-align:right">Requests</th><th style="text-align:right">Avg ms</th><th style="text-align:right">Max ms</th>' +
        '</tr></thead><tbody>';
      var top = data.endpoints.slice(0, 10);
      for (var i = 0; i < top.length; i++) {
        var ep = top[i];
        var avgColor = ep.avgMs > 500 ? 'var(--red)' : (ep.avgMs > 100 ? 'var(--amber)' : 'var(--txt)');
        html += '<tr>' +
          '<td class="ep-name" title="' + esc(ep.endpoint) + '">' + esc(ep.endpoint) + '</td>' +
          '<td style="text-align:right">' + ep.count + '</td>' +
          '<td style="text-align:right;color:' + avgColor + '">' + ep.avgMs + '</td>' +
          '<td style="text-align:right">' + ep.maxMs + '</td>' +
        '</tr>';
      }
      html += '</tbody></table>';
      html += '</div>';
    } else {
      html += '<div style="text-align:center;padding:1rem;color:var(--txt3);font-size:12px">Noch keine Endpoint-Daten</div>';
    }

    container.innerHTML = html;
  }).catch(function(e) {
    if (document.getElementById('perfContent')) {
      document.getElementById('perfContent').innerHTML =
        '<div style="text-align:center;padding:1rem;color:var(--red);font-size:12px">Fehler: ' + esc(e.message) + '</div>';
    }
  });
}

function resetMetrics() {
  if (!confirm('Alle Performance-Metriken zur\u00FCcksetzen?')) return;
  authFetch('/api/metrics', {
    method: 'DELETE',
    headers: authHeaders()
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) loadPerfMetrics();
  }).catch(function() {});
}

function acmpGetMetrics(agent) {
  var stats = agent.stats || {};
  var conv = agent.conversation || [];
  var outputLen = 0;
  conv.forEach(function(m) { outputLen += (m.text || '').length; });
  return { score: agent.score != null ? agent.score : null, rounds: agent.rounds || 0, questions: agent.questions || 0, files: stats.filesCreated || 0, lines: stats.linesOfCode || 0, fileSize: stats.totalFileSize || 0, duration: agent.duration != null ? agent.duration : null, outputLen: outputLen, status: agent.status || 'waiting', messages: conv.length };
}

function acmpGetBreakdown(agent) {
  var stats = agent.stats || {};
  var score = agent.score;
  var rounds = agent.rounds || 0;
  var questions = agent.questions || 0;
  return [
    { label: 'Abschluss', value: agent.status === 'done' ? 100 : (agent.status === 'error' ? 20 : 50) },
    { label: 'Dateien', value: stats.filesCreated ? Math.min(100, stats.filesCreated * 20) : 0 },
    { label: 'Qualitaet', value: score != null ? score : 0 },
    { label: 'Effizienz', value: rounds <= 2 ? 100 : rounds <= 5 ? 75 : rounds <= 10 ? 50 : 25 },
    { label: 'Fragen', value: questions === 0 ? 100 : questions <= 2 ? 75 : questions <= 5 ? 50 : 25 }
  ];
}

function acmpFmtCount(n) {
  if (n == null || n === 0) return '0';
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

function acmpBuildContent(idxA, idxB) {
  var agents = state.agents || [];
  var html = '<button class="modal-close" onclick="closeAgentCompareModal()">&times;</button>';
  html += '<h3>Agenten-Vergleich</h3>';
  html += '<div class="compare-tabs">' +
    '<button class="compare-tab' + (_acmpTab === 'vergleich' ? ' active' : '') + '" onclick="acmpSwitchTab(\'vergleich\')">1:1 Vergleich</button>' +
    '<button class="compare-tab' + (_acmpTab === 'uebersicht' ? ' active' : '') + '" onclick="acmpSwitchTab(\'uebersicht\')">Alle Agenten</button>' +
  '</div>';
  html += '<div class="compare-tab-content' + (_acmpTab === 'vergleich' ? ' active' : '') + '" id="acmpTabVergleich">';
  html += '<div class="compare-select-row"><select id="acmpSelectA" onchange="acmpUpdate()">';
  for (var i = 0; i < agents.length; i++) html += '<option value="' + i + '"' + (i === idxA ? ' selected' : '') + '>Agent ' + (i + 1) + ': ' + esc(agents[i].title || 'Ohne Titel') + '</option>';
  html += '</select><span class="compare-vs">vs.</span><select id="acmpSelectB" onchange="acmpUpdate()">';
  for (var j = 0; j < agents.length; j++) html += '<option value="' + j + '"' + (j === idxB ? ' selected' : '') + '>Agent ' + (j + 1) + ': ' + esc(agents[j].title || 'Ohne Titel') + '</option>';
  html += '</select></div>';
  html += acmpBuildDetail(idxA, idxB);
  html += '</div>';
  html += '<div class="compare-tab-content' + (_acmpTab === 'uebersicht' ? ' active' : '') + '" id="acmpTabUebersicht">' + acmpBuildOverview() + '</div>';
  return html;
}

function acmpBuildDetail(idxA, idxB) {
  var agents = state.agents || [];
  var a = agents[idxA], b = agents[idxB];
  if (!a || !b) return '<div style="padding:1rem;color:var(--txt3)">Bitte zwei Agenten auswaehlen.</div>';
  var mA = acmpGetMetrics(a), mB = acmpGetMetrics(b);
  var breakA = acmpGetBreakdown(a), breakB = acmpGetBreakdown(b);
  var html = '<div class="compare-legend">' +
    '<div class="compare-legend-item"><span class="compare-legend-dot a"></span>Agent ' + (idxA + 1) + '</div>' +
    '<div class="compare-legend-item"><span class="compare-legend-dot b"></span>Agent ' + (idxB + 1) + '</div></div>';
  // Side-by-side
  html += '<div class="compare-side-by-side">' + acmpBuildCol(a, mA, idxA) + acmpBuildCol(b, mB, idxB) + '</div>';
  // Score-Breakdown bars
  html += '<div class="compare-bar-section"><div class="compare-bar-section-title">Score-Breakdown</div>';
  for (var k = 0; k < breakA.length; k++) {
    html += '<div class="compare-bar-row"><span class="compare-bar-label">' + breakA[k].label + '</span>' +
      '<div class="compare-bar-pair">' +
        '<div class="compare-bar-track"><div class="compare-bar-fill agent-a" style="width:' + breakA[k].value + '%"></div></div>' +
        '<div class="compare-bar-track"><div class="compare-bar-fill agent-b" style="width:' + breakB[k].value + '%"></div></div>' +
      '</div><span class="compare-bar-val">' + breakA[k].value + ' / ' + breakB[k].value + '</span></div>';
  }
  html += '</div>';
  // Detail table
  html += '<div class="compare-table-section"><div class="compare-bar-section-title">Detailvergleich</div>';
  html += '<table class="compare-table"><thead><tr><th>Metrik</th><th>Agent ' + (idxA + 1) + '</th><th>Agent ' + (idxB + 1) + '</th><th>Differenz</th></tr></thead><tbody>';
  var rows = [
    { label: 'Score', a: mA.score, b: mB.score, fmt: function(v) { return v != null ? v + '/100' : '-'; }, hb: true, dur: false },
    { label: 'Runden', a: mA.rounds, b: mB.rounds, fmt: String, hb: false, dur: false },
    { label: 'Fragen', a: mA.questions, b: mB.questions, fmt: String, hb: false, dur: false },
    { label: 'Dateien', a: mA.files, b: mB.files, fmt: String, hb: true, dur: false },
    { label: 'Codezeilen', a: mA.lines, b: mB.lines, fmt: String, hb: true, dur: false },
    { label: 'Dateigroesse', a: mA.fileSize, b: mB.fileSize, fmt: formatFileSize, hb: true, dur: false },
    { label: 'Dauer', a: mA.duration, b: mB.duration, fmt: function(v) { return v != null ? formatDuration(v) : '-'; }, hb: false, dur: true },
    { label: 'Output-Laenge', a: mA.outputLen, b: mB.outputLen, fmt: acmpFmtCount, hb: true, dur: false },
    { label: 'Nachrichten', a: mA.messages, b: mB.messages, fmt: String, hb: true, dur: false }
  ];
  rows.forEach(function(r) {
    var va = r.a != null ? r.a : 0, vb = r.b != null ? r.b : 0, diff = va - vb;
    var aBetter = r.hb ? va > vb : va < vb, bBetter = r.hb ? vb > va : vb < va;
    var diffStr, diffClass;
    if (diff === 0) { diffStr = '0'; diffClass = 'diff-zero'; }
    else {
      var ad = Math.abs(diff), sign = diff > 0 ? '+' : '-';
      diffStr = r.dur ? sign + formatDuration(ad) : r.label === 'Dateigroesse' ? sign + formatFileSize(ad) : (diff > 0 ? '+' : '') + diff;
      diffClass = ((r.hb && diff > 0) || (!r.hb && diff < 0)) ? 'diff-pos' : 'diff-neg';
    }
    html += '<tr><td>' + r.label + '</td><td class="' + (aBetter ? 'better-cell' : bBetter ? 'worse-cell' : '') + '">' + r.fmt(r.a) + '</td><td class="' + (bBetter ? 'better-cell' : aBetter ? 'worse-cell' : '') + '">' + r.fmt(r.b) + '</td><td class="' + diffClass + '">' + diffStr + '</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function acmpBuildCol(agent, metrics, idx) {
  var html = '<div class="compare-agent-col"><h4>Agent ' + (idx + 1) + ' ' + scoreBadge(agent.score) + '</h4>';
  html += '<div style="font-size:12px;color:var(--txt2);margin-bottom:8px;font-weight:500">' + esc(agent.title || 'Ohne Titel') + '</div>';
  var items = [
    ['Status', agent.status || 'waiting'], ['Score', metrics.score != null ? metrics.score + '/100' : '-'],
    ['Runden', String(metrics.rounds)], ['Fragen', String(metrics.questions)],
    ['Dateien', String(metrics.files)], ['Codezeilen', String(metrics.lines)],
    ['Dauer', metrics.duration != null ? formatDuration(metrics.duration) : '-'],
    ['Output', acmpFmtCount(metrics.outputLen) + ' Zeichen']
  ];
  items.forEach(function(it) {
    html += '<div class="compare-stat-row"><span class="compare-stat-label">' + it[0] + '</span><span class="compare-stat-value neutral">' + esc(it[1]) + '</span></div>';
  });
  return html + '</div>';
}

function acmpUpdate() {
  var selA = document.getElementById('acmpSelectA'), selB = document.getElementById('acmpSelectB');
  if (!selA || !selB) return;
  var modal = document.querySelector('#agentCompareModal .modal');
  if (modal) modal.innerHTML = acmpBuildContent(parseInt(selA.value, 10), parseInt(selB.value, 10));
}

function acmpSwitchTab(tab) {
  _acmpTab = tab;
  var selA = document.getElementById('acmpSelectA'), selB = document.getElementById('acmpSelectB');
  var idxA = selA ? parseInt(selA.value, 10) : 0, idxB = selB ? parseInt(selB.value, 10) : 1;
  var modal = document.querySelector('#agentCompareModal .modal');
  if (modal) modal.innerHTML = acmpBuildContent(idxA, idxB);
}

function acmpBuildOverview() {
  var agents = state.agents || [];
  if (agents.length === 0) return '<div style="padding:1rem;color:var(--txt3)">Keine Agenten vorhanden.</div>';
  var data = agents.map(function(a, i) {
    var m = acmpGetMetrics(a);
    return { idx: i, title: a.title || 'Agent ' + (i + 1), score: m.score, rounds: m.rounds, questions: m.questions, files: m.files, lines: m.lines, duration: m.duration, outputLen: m.outputLen, status: a.status || 'waiting' };
  });
  data.sort(function(x, y) {
    var va = x[_acmpSortCol] != null ? x[_acmpSortCol] : -Infinity, vb = y[_acmpSortCol] != null ? y[_acmpSortCol] : -Infinity;
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return _acmpSortDir === 'asc' ? (va < vb ? -1 : va > vb ? 1 : 0) : (va > vb ? -1 : va < vb ? 1 : 0);
  });
  var bestVals = {}, numCols = { score: true, rounds: false, questions: false, files: true, lines: true, duration: false, outputLen: true };
  Object.keys(numCols).forEach(function(c) {
    var vals = data.map(function(d) { return d[c]; }).filter(function(v) { return v != null && v > -Infinity; });
    bestVals[c] = vals.length === 0 ? null : (numCols[c] ? Math.max.apply(null, vals) : Math.min.apply(null, vals));
  });
  var cols = [
    { k: 'title', l: 'Agent', f: function(d) { return esc('Agent ' + (d.idx + 1) + ': ' + d.title); } },
    { k: 'status', l: 'Status', f: function(d) { return esc(d.status); } },
    { k: 'score', l: 'Score', f: function(d) { return d.score != null ? d.score + '/100' : '-'; } },
    { k: 'rounds', l: 'Runden', f: function(d) { return String(d.rounds); } },
    { k: 'questions', l: 'Fragen', f: function(d) { return String(d.questions); } },
    { k: 'files', l: 'Dateien', f: function(d) { return String(d.files); } },
    { k: 'lines', l: 'Zeilen', f: function(d) { return String(d.lines); } },
    { k: 'duration', l: 'Dauer', f: function(d) { return d.duration != null ? formatDuration(d.duration) : '-'; } },
    { k: 'outputLen', l: 'Output', f: function(d) { return acmpFmtCount(d.outputLen); } }
  ];
  var html = '<table class="compare-overview-table"><thead><tr>';
  cols.forEach(function(c) {
    var sorted = _acmpSortCol === c.k;
    html += '<th class="' + (sorted ? 'sorted' : '') + '" onclick="acmpSort(\'' + c.k + '\')">' + c.l + ' <span class="sort-arrow">' + (sorted ? (_acmpSortDir === 'asc' ? '\u25B2' : '\u25BC') : '\u25B2') + '</span></th>';
  });
  html += '</tr></thead><tbody>';
  data.forEach(function(d) {
    html += '<tr>';
    cols.forEach(function(c) {
      var isBest = (c.k !== 'title' && c.k !== 'status' && bestVals[c.k] != null && d[c.k] != null && d[c.k] === bestVals[c.k] && data.length > 1);
      html += '<td class="' + (c.k === 'title' ? 'agent-name-cell' : '') + (isBest ? ' best-val' : '') + '">' + c.f(d) + '</td>';
    });
    html += '</tr>';
  });
  return html + '</tbody></table>';
}

function acmpSort(col) {
  if (_acmpSortCol === col) _acmpSortDir = _acmpSortDir === 'asc' ? 'desc' : 'asc';
  else { _acmpSortCol = col; _acmpSortDir = 'desc'; }
  var el = document.getElementById('acmpTabUebersicht');
  if (el) el.innerHTML = acmpBuildOverview();
}

// ── Changelog / Diff Ansicht ─────────────────────────────────
var _changelogData = null;
var _changelogFilter = 'alle';
var _changelogDashTab = 'agenten'; // 'agenten' oder 'changelog'

function getChangelogActionLabel(action) {
  var labels = {
    'arbeitet': 'Arbeitet',
    'abgeschlossen': 'Abgeschlossen',
    'frage': 'Frage',
    'koordinator-antwort': 'Koordinator',
    'system': 'System',
    'error': 'Fehler',
    'working': 'In Arbeit',
    'waiting': 'Wartend'
  };
  return labels[action] || action;
}

function formatChangelogTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function loadChangelog(projectId) {
  if (!projectId) {
    projectId = getProjectId();
  }
  if (!projectId) return;
  var container = document.getElementById('changelogContent');
  if (container) container.innerHTML = '<div class="changelog-loading">Changelog wird geladen...</div>';
  fetch('/api/projects/' + encodeURIComponent(projectId) + '/changelog')
    .then(function(r) { if (!r.ok) throw new Error('Fehler'); return r.json(); })
    .then(function(data) {
      _changelogData = data;
      renderChangelog();
    })
    .catch(function(err) {
      var c = document.getElementById('changelogContent');
      if (c) c.innerHTML = '<div class="changelog-empty">Changelog konnte nicht geladen werden: ' + esc(err.message) + '</div>';
    });
}

function renderChangelog() {
  var container = document.getElementById('changelogContent');
  if (!container || !_changelogData) return;

  var filtered = _changelogData;
  if (_changelogFilter !== 'alle') {
    filtered = _changelogData.filter(function(entry) {
      return entry.action === _changelogFilter;
    });
  }

  if (filtered.length === 0) {
    container.innerHTML = '<div class="changelog-empty">Keine Eintr\u00E4ge' + (_changelogFilter !== 'alle' ? ' f\u00FCr diesen Filter' : '') + ' vorhanden.</div>';
    return;
  }

  // Filter-Buttons erstellen
  var actions = {};
  _changelogData.forEach(function(e) { actions[e.action] = (actions[e.action] || 0) + 1; });
  var filterHtml = '<div class="changelog-filter-row">' +
    '<button class="changelog-filter-btn' + (_changelogFilter === 'alle' ? ' active' : '') + '" onclick="setChangelogFilter(\'alle\')">Alle (' + _changelogData.length + ')</button>';
  Object.keys(actions).forEach(function(a) {
    filterHtml += '<button class="changelog-filter-btn' + (_changelogFilter === a ? ' active' : '') + '" onclick="setChangelogFilter(\'' + esc(a) + '\')">' + esc(getChangelogActionLabel(a)) + ' (' + actions[a] + ')</button>';
  });
  filterHtml += '</div>';

  var html = filterHtml + '<div class="changelog-timeline">';
  filtered.forEach(function(entry) {
    var color = getAgentColor(entry.agentIndex);
    html += '<div class="changelog-entry" style="border-left: 3px solid ' + color + '">' +
      '<div style="position:absolute;left:-22px;top:14px;width:10px;height:10px;border-radius:50%;background:' + color + ';border:2px solid var(--bg)"></div>' +
      '<div class="changelog-entry-header">' +
        '<span class="changelog-agent-badge" style="background:' + color + '">' + esc(entry.agentTitle) + '</span>' +
        '<span class="changelog-action changelog-action-' + esc(entry.action) + '">' + esc(getChangelogActionLabel(entry.action)) + '</span>' +
        '<span class="changelog-time">' + esc(formatChangelogTime(entry.timestamp)) + '</span>' +
      '</div>' +
      '<div class="changelog-summary">' + esc(entry.summary) + '</div>';

    if (entry.files && entry.files.length > 0) {
      html += '<div class="changelog-files">';
      entry.files.forEach(function(f) {
        html += '<span class="changelog-file" onclick="openFileFromChangelog(\'' + esc(f) + '\',' + entry.agentIndex + ')" title="' + esc(f) + '">' + esc(f) + '</span>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function setChangelogFilter(filter) {
  _changelogFilter = filter;
  renderChangelog();
}

function openFileFromChangelog(fileName, agentIndex) {
  var projectId = getProjectId();
  if (!projectId) return;
  var filePath = 'agent-' + (agentIndex + 1) + '/' + fileName;
  fetch('/api/file-content/' + encodeURIComponent(projectId) + '/' + encodeURIComponent(filePath))
    .then(function(r) { if (!r.ok) throw new Error('Nicht gefunden'); return r.text(); })
    .then(function(content) {
      if (typeof openFileModal === 'function') {
        openFileModal(fileName, content);
      } else {
        alert(content);
      }
    })
    .catch(function() {
      addBanner('error', 'Datei konnte nicht geladen werden: ' + fileName);
    });
}

function switchDashTab(tab) {
  _changelogDashTab = tab;
  var tabBtns = document.querySelectorAll('.dash-tab-btn');
  tabBtns.forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
  });
  var agentenPanel = document.getElementById('dashAgentsPanel');
  var changelogPanel = document.getElementById('dashChangelogPanel');
  var performancePanel = document.getElementById('dashPerformancePanel');
  if (agentenPanel) agentenPanel.style.display = tab === 'agenten' ? '' : 'none';
  if (changelogPanel) {
    changelogPanel.style.display = tab === 'changelog' ? '' : 'none';
    if (tab === 'changelog' && !_changelogData) {
      loadChangelog();
    }
  }
  if (performancePanel) {
    performancePanel.style.display = tab === 'performance' ? '' : 'none';
    if (tab === 'performance') {
      loadPerformanceDashboard();
    }
  }
}

// ── Erweiterte Vergleichsfunktion mit Diff-API ─────────────────
var _origStartComparison = startComparison;
startComparison = async function() {
  if (compareSelected.length !== 2) return;
  try {
    var results = await Promise.all([
      fetch('/api/projects/' + encodeURIComponent(compareSelected[0])).then(function(r) { if (!r.ok) throw new Error('Projekt nicht gefunden'); return r.json(); }),
      fetch('/api/projects/' + encodeURIComponent(compareSelected[1])).then(function(r) { if (!r.ok) throw new Error('Projekt nicht gefunden'); return r.json(); }),
      fetch('/api/projects/' + encodeURIComponent(compareSelected[0]) + '/diff/' + encodeURIComponent(compareSelected[1])).then(function(r) { if (!r.ok) throw new Error('Diff fehlgeschlagen'); return r.json(); })
    ]);
    openDiffModal(results[0], results[1], results[2]);
  } catch (e) {
    addBanner('error', 'Vergleich fehlgeschlagen: ' + e.message);
  }
};

function openDiffModal(proj1, proj2, diffData) {
  closeDiffModal();
  var stats1 = extractCompareStats(proj1);
  var stats2 = extractCompareStats(proj2);
  var sd = diffData.scoresDiff;

  var overlay = document.createElement('div');
  overlay.id = 'diffModal';
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Projekt-Diff');
  overlay.setAttribute('tabindex', '-1');
  overlay.onclick = function(e) { if (e.target === overlay) closeDiffModal(); };

  var html = '<div class="modal diff-modal">' +
    '<button class="modal-close" aria-label="Dialog schlie\u00DFen" onclick="closeDiffModal()" title="Schlie\u00DFen">\u00D7</button>' +
    '<h3>Projekt-Diff</h3>';

  // Score-Delta
  if (sd.scoreDelta != null) {
    var deltaClass = sd.scoreDelta > 0 ? 'positive' : (sd.scoreDelta < 0 ? 'negative' : 'neutral');
    var deltaSign = sd.scoreDelta > 0 ? '+' : '';
    html += '<div class="diff-delta">' +
      '<div class="diff-delta-value ' + deltaClass + '">' + deltaSign + sd.scoreDelta.toFixed(1) + '</div>' +
      '<div class="diff-delta-label">Score-Differenz</div>' +
    '</div>';
  }

  // Projekte nebeneinander
  html += '<div class="diff-scores">';
  [sd.project1, sd.project2].forEach(function(p) {
    html += '<div class="diff-score-col">' +
      '<div class="diff-score-title">' + esc(p.title) + '</div>' +
      '<div class="diff-score-stat"><span class="diff-score-label">Score</span><span class="diff-score-value">' + (p.score != null ? p.score.toFixed(1) : '\u2014') + '</span></div>' +
      '<div class="diff-score-stat"><span class="diff-score-label">Agenten</span><span class="diff-score-value">' + esc(String(p.agentCount)) + '</span></div>' +
      '<div class="diff-score-stat"><span class="diff-score-label">Dauer</span><span class="diff-score-value">' + (p.duration != null ? esc(formatDuration(p.duration)) : '\u2014') + '</span></div>' +
      '<div class="diff-score-stat"><span class="diff-score-label">Status</span><span class="diff-score-value">' + badge(p.phase) + '</span></div>' +
    '</div>';
  });
  html += '</div>';

  // Neue Agents
  if (diffData.added.length > 0) {
    html += '<div class="diff-section">' +
      '<div class="diff-section-title">Neue Agenten <span class="diff-section-count diff-count-added">+' + diffData.added.length + '</span></div>';
    diffData.added.forEach(function(a) {
      html += '<div class="diff-item" style="border-left:3px solid var(--green)">' +
        '<div class="diff-item-title">' + esc(a.title) + '</div>' +
        '<div class="diff-item-detail">' + esc(a.task) + '</div>' +
      '</div>';
    });
    html += '</div>';
  }

  // Entfernte Agents
  if (diffData.removed.length > 0) {
    html += '<div class="diff-section">' +
      '<div class="diff-section-title">Entfernte Agenten <span class="diff-section-count diff-count-removed">\u2212' + diffData.removed.length + '</span></div>';
    diffData.removed.forEach(function(a) {
      html += '<div class="diff-item" style="border-left:3px solid var(--red)">' +
        '<div class="diff-item-title">' + esc(a.title) + '</div>' +
        '<div class="diff-item-detail">' + esc(a.task) + '</div>' +
      '</div>';
    });
    html += '</div>';
  }

  // Ge\u00e4nderte Agents
  if (diffData.changed.length > 0) {
    html += '<div class="diff-section">' +
      '<div class="diff-section-title">Ge\u00E4nderte Agenten <span class="diff-section-count diff-count-changed">' + diffData.changed.length + '</span></div>';
    diffData.changed.forEach(function(c) {
      html += '<div class="diff-item" style="border-left:3px solid var(--amber)">' +
        '<div class="diff-item-title">' + esc(c.title) + '</div>';
      c.diffs.forEach(function(d) {
        html += '<div class="diff-change-row">' +
          '<span class="diff-field-label">' + esc(d.field) + '</span>' +
          '<span class="diff-from">' + esc(String(d.from != null ? d.from : '\u2014')) + '</span>' +
          '<span class="diff-arrow">\u2192</span>' +
          '<span class="diff-to">' + esc(String(d.to != null ? d.to : '\u2014')) + '</span>' +
        '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
  }

  if (diffData.added.length === 0 && diffData.removed.length === 0 && diffData.changed.length === 0) {
    html += '<div class="diff-empty">Keine Unterschiede bei den Agenten gefunden.</div>';
  }

  // Standard-Vergleich einbetten
  html += '<div class="diff-section" style="margin-top:1.5rem">' +
    '<div class="diff-section-title">Detailvergleich</div>' +
    '<div class="compare-layout">' + renderCompareCol(stats1) + renderCompareCol(stats2) + '</div>' +
  '</div>';

  html += '</div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
  document.addEventListener('keydown', diffModalKeyHandler);
}

function closeDiffModal() {
  var el = document.getElementById('diffModal');
  if (el) el.remove();
  document.removeEventListener('keydown', diffModalKeyHandler);
}

function diffModalKeyHandler(e) {
  if (e.key === 'Escape') closeDiffModal();
}


// ── Globale Projektsuche ──────────────────────────────────────
(function() {
  var searchInput = document.getElementById('globalSearchInput');
  var searchDropdown = document.getElementById('searchDropdown');
  var searchScope = 'all';
  var searchResults = [];
  var searchActiveIdx = -1;
  var searchDebounceTimer = null;
  var searchAbortCtrl = null;
  var searchVisible = false;

  // Debounced Suche
  function onSearchInput() {
    clearTimeout(searchDebounceTimer);
    var q = searchInput.value.trim();
    if (q.length < 2) {
      hideSearchDropdown();
      return;
    }
    searchDebounceTimer = setTimeout(function() {
      executeSearch(q);
    }, 300);
  }

  async function executeSearch(q) {
    if (searchAbortCtrl) { try { searchAbortCtrl.abort(); } catch(ex) {} }
    searchAbortCtrl = new AbortController();

    showSearchLoading();

    try {
      var url = '/api/search?q=' + encodeURIComponent(q) + '&scope=' + encodeURIComponent(searchScope);
      var resp = await fetch(url, { signal: searchAbortCtrl.signal });
      if (!resp.ok) {
        searchResults = [];
        renderSearchResults([]);
        return;
      }
      var data = await resp.json();
      searchResults = data;
      searchActiveIdx = -1;
      renderSearchResults(data);
    } catch(e) {
      if (e.name === 'AbortError') return;
      searchResults = [];
      renderSearchResults([]);
    }
  }

  function showSearchLoading() {
    searchDropdown.innerHTML =
      renderScopeBar() +
      '<div class="search-loading"><span class="spin"></span> Suche l\u00E4uft\u2026</div>';
    showSearchDropdown();
  }

  function renderScopeBar() {
    var scopes = [
      { key: 'all', label: 'Alle' },
      { key: 'titles', label: '\uD83C\uDFF7\uFE0F Titel' },
      { key: 'files', label: '\uD83D\uDCC4 Dateien' },
      { key: 'conversations', label: '\uD83D\uDCAC Gespr\u00E4che' }
    ];
    var html = '<div class="search-scope-bar">';
    for (var i = 0; i < scopes.length; i++) {
      var s = scopes[i];
      html += '<button class="search-scope-btn' + (searchScope === s.key ? ' active' : '') +
              '" data-scope="' + s.key + '">' + s.label + '</button>';
    }
    html += '</div>';
    return html;
  }

  function highlightMatch(text, query) {
    if (!text || !query) return esc(text || '');
    var lower = text.toLowerCase();
    var qLower = query.toLowerCase();
    var idx = lower.indexOf(qLower);
    if (idx === -1) return esc(text);
    var before = text.substring(0, idx);
    var match = text.substring(idx, idx + query.length);
    var after = text.substring(idx + query.length);
    return esc(before) + '<mark>' + esc(match) + '</mark>' + esc(after);
  }

  function renderSearchResults(results) {
    var q = searchInput.value.trim();
    var html = renderScopeBar();

    if (results.length === 0) {
      html += '<div class="search-empty">Keine Ergebnisse f\u00FCr \u201E' + esc(q) + '\u201C gefunden.</div>';
      searchDropdown.innerHTML = html;
      showSearchDropdown();
      bindScopeButtons();
      return;
    }

    // Nach Projekt gruppieren
    var grouped = {};
    var projectOrder = [];
    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      if (!grouped[r.projectId]) {
        grouped[r.projectId] = { title: r.projectTitle, items: [] };
        projectOrder.push(r.projectId);
      }
      grouped[r.projectId].items.push(r);
    }

    var globalIdx = 0;
    for (var pi = 0; pi < projectOrder.length; pi++) {
      var projId = projectOrder[pi];
      var group = grouped[projId];
      html += '<div class="search-group-header">' + esc(group.title) + '</div>';
      for (var ri = 0; ri < group.items.length; ri++) {
        var item = group.items[ri];
        var icon = item.type === 'file' ? '\uD83D\uDCC4' :
                   item.type === 'conversation' ? '\uD83D\uDCAC' : '\uD83C\uDFF7\uFE0F';
        var matchText = item.context && item.context.match ? item.context.match : item.match || '';
        // Kuerzen auf max 150 Zeichen
        if (matchText.length > 150) matchText = matchText.substring(0, 150) + '\u2026';

        html += '<div class="search-result-item' + (globalIdx === searchActiveIdx ? ' active' : '') +
                '" data-idx="' + globalIdx + '" data-project="' + esc(item.projectId) +
                '" data-type="' + esc(item.type) + '" data-path="' + esc(item.path || '') +
                '" role="option">';
        html += '<span class="search-result-icon">' + icon + '</span>';
        html += '<div class="search-result-body">';
        if (item.path) {
          html += '<div class="search-result-path">' + esc(item.path) + '</div>';
        }
        html += '<div class="search-result-match">' + highlightMatch(matchText, q) + '</div>';
        // Kontext anzeigen (Zeile davor/danach)
        if (item.context) {
          var ctx = '';
          if (item.context.before) ctx += esc(item.context.before.substring(0, 100)) + '\n';
          if (item.context.after) ctx += esc(item.context.after.substring(0, 100));
          if (ctx.trim()) {
            html += '<div class="search-result-context">' + ctx + '</div>';
          }
        }
        html += '</div></div>';
        globalIdx++;
      }
    }

    searchDropdown.innerHTML = html;
    showSearchDropdown();
    bindScopeButtons();
  }

  function bindScopeButtons() {
    var btns = searchDropdown.querySelectorAll('.search-scope-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        searchScope = this.getAttribute('data-scope');
        var q = searchInput.value.trim();
        if (q.length >= 2) executeSearch(q);
      });
    }
  }

  function showSearchDropdown() {
    searchDropdown.classList.add('visible');
    searchVisible = true;
  }

  function hideSearchDropdown() {
    searchDropdown.classList.remove('visible');
    searchVisible = false;
    searchActiveIdx = -1;
  }

  // Klick auf Ergebnis
  searchDropdown.addEventListener('click', function(e) {
    var item = e.target.closest('.search-result-item');
    if (!item) return;
    openSearchResult(item);
  });

  function openSearchResult(item) {
    var projectId = item.getAttribute('data-project');
    var type = item.getAttribute('data-type');
    var filePath = item.getAttribute('data-path');

    hideSearchDropdown();
    searchInput.value = '';
    searchInput.blur();

    if (type === 'title' || type === 'conversation') {
      // Projekt laden
      if (typeof loadProject === 'function') {
        loadProject(projectId);
      }
    } else if (type === 'file' && filePath) {
      // Projekt laden und dann Datei oeffnen
      if (typeof loadProject === 'function') {
        loadProject(projectId);
        // Datei-Modal oeffnen nach kurzem Delay (Projekt muss erst geladen sein)
        setTimeout(function() {
          if (typeof openFileContent === 'function') {
            openFileContent(filePath);
          }
        }, 500);
      }
    }
  }

  // Keyboard-Navigation
  searchInput.addEventListener('keydown', function(e) {
    if (!searchVisible) return;

    var items = searchDropdown.querySelectorAll('.search-result-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      searchActiveIdx = Math.min(searchActiveIdx + 1, items.length - 1);
      updateActiveItem(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      searchActiveIdx = Math.max(searchActiveIdx - 1, -1);
      updateActiveItem(items);
    } else if (e.key === 'Enter' && searchActiveIdx >= 0 && items[searchActiveIdx]) {
      e.preventDefault();
      openSearchResult(items[searchActiveIdx]);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      hideSearchDropdown();
      searchInput.blur();
    }
  });

  function updateActiveItem(items) {
    for (var i = 0; i < items.length; i++) {
      if (i === searchActiveIdx) {
        items[i].classList.add('active');
        items[i].scrollIntoView({ block: 'nearest' });
      } else {
        items[i].classList.remove('active');
      }
    }
  }

  // Input-Event
  searchInput.addEventListener('input', onSearchInput);

  // Klick ausserhalb schliesst Dropdown
  document.addEventListener('click', function(e) {
    var wrap = document.getElementById('globalSearchWrap');
    if (wrap && !wrap.contains(e.target)) {
      hideSearchDropdown();
    }
  });

  // Focus oeffnet Dropdown wenn Ergebnisse vorhanden
  searchInput.addEventListener('focus', function() {
    if (searchInput.value.trim().length >= 2 && searchResults.length > 0) {
      renderSearchResults(searchResults);
    }
  });

  // Ctrl+K Shortcut - im shortcutRegistry eintragen
  if (typeof shortcutRegistry !== 'undefined') {
    shortcutRegistry.push({
      key: 'k', ctrl: true, shift: false, category: 'Global', desc: 'Projektsuche oeffnen/fokussieren',
      alwaysActive: true,
      action: function() {
        searchInput.focus();
        searchInput.select();
      }
    });
  }

  // Escape-Handler zum bestehenden Escape-Shortcut hinzufuegen
  var existingEscIdx = -1;
  if (typeof shortcutRegistry !== 'undefined') {
    for (var i = 0; i < shortcutRegistry.length; i++) {
      if (shortcutRegistry[i].key === 'Escape' && !shortcutRegistry[i].ctrl) {
        existingEscIdx = i;
        break;
      }
    }
  }
  if (existingEscIdx >= 0) {
    var origEscAction = shortcutRegistry[existingEscIdx].action;
    shortcutRegistry[existingEscIdx].action = function(e) {
      // Zuerst Suche schliessen, wenn sichtbar
      if (searchVisible) {
        hideSearchDropdown();
        searchInput.blur();
        return;
      }
      origEscAction(e);
    };
  }
})();
