function trackAgentTimeline(idx, agent, prevStatus) {
  if (!agentTimeline[idx]) {
    agentTimeline[idx] = { startTime: null, endTime: null, askingPeriods: [], status: 'waiting' };
  }
  var tl = agentTimeline[idx];

  // Use server-sent startTime/endTime if available
  if (agent.startTime && !tl.startTime) tl.startTime = agent.startTime;
  if (agent.endTime) tl.endTime = agent.endTime;

  // Track status transitions
  if (agent.status && agent.status !== prevStatus) {
    tl.status = agent.status;

    // If agent starts working for the first time, record startTime
    if (agent.status === 'working' && !tl.startTime) {
      tl.startTime = agent.startTime || Date.now();
    }

    // Track asking periods (question/pause segments)
    if (agent.status === 'asking') {
      tl.askingPeriods.push({ start: Date.now(), end: null });
    }
    // End current asking period when status changes from asking
    if (prevStatus === 'asking' && agent.status !== 'asking') {
      var lastAsking = tl.askingPeriods[tl.askingPeriods.length - 1];
      if (lastAsking && !lastAsking.end) lastAsking.end = Date.now();
    }

    // Record end time for done/error
    if ((agent.status === 'done' || agent.status === 'error') && !tl.endTime) {
      tl.endTime = agent.endTime || Date.now();
    }
  }
}

function initTimelineFromState() {
  // Rebuild timeline data from current state (e.g. after page reload)
  var agents = state.agents || [];
  for (var i = 0; i < agents.length; i++) {
    var a = agents[i];
    if (!agentTimeline[i]) {
      agentTimeline[i] = {
        startTime: a.startTime || null,
        endTime: a.endTime || null,
        askingPeriods: [],
        status: a.status || 'waiting'
      };
    } else {
      // Update from state if server values present
      if (a.startTime) agentTimeline[i].startTime = a.startTime;
      if (a.endTime) agentTimeline[i].endTime = a.endTime;
      agentTimeline[i].status = a.status || agentTimeline[i].status;
    }
  }
}

function renderTimeline(agents) {
  if (!agents || agents.length === 0) return '';
  initTimelineFromState();

  var projStart = state.startedAt || Date.now();
  var now = Date.now();
  // Determine total time span
  var maxEnd = now;
  for (var i = 0; i < agents.length; i++) {
    var tl = agentTimeline[i];
    if (tl && tl.endTime && tl.endTime > maxEnd) maxEnd = tl.endTime;
  }
  var totalMs = Math.max(maxEnd - projStart, 1000); // at least 1s
  var totalMinutes = totalMs / 60000;

  // Determine tick interval
  var tickIntervalMin;
  if (totalMinutes <= 2) tickIntervalMin = 0.5;
  else if (totalMinutes <= 5) tickIntervalMin = 1;
  else if (totalMinutes <= 15) tickIntervalMin = 2;
  else if (totalMinutes <= 30) tickIntervalMin = 5;
  else tickIntervalMin = 10;

  var trackWidth = 600; // px for the track area (will be inside scrollable container)

  // Build axis ticks
  var axisHtml = '';
  for (var t = 0; t <= totalMinutes + tickIntervalMin; t += tickIntervalMin) {
    var pctPos = (t / totalMinutes) * 100;
    if (pctPos > 105) break;
    var label = t < 1 ? Math.round(t * 60) + 's' : (Number.isInteger(t) ? t + 'm' : t.toFixed(1) + 'm');
    axisHtml += '<span class="timeline-axis-tick" style="left:' + pctPos + '%">' + label + '</span>';
  }

  // Now indicator line for running projects
  var nowPct = ((now - projStart) / totalMs) * 100;
  var isRunning = state.phase === 'running';

  // Build rows
  var rowsHtml = '';
  for (var i = 0; i < agents.length; i++) {
    var a = agents[i];
    var tl = agentTimeline[i] || { startTime: null, endTime: null, askingPeriods: [], status: a.status || 'waiting' };
    var agentLabel = 'Agent ' + (i + 1) + (a.title ? ': ' + truncate(a.title, 12) : '');

    // Calculate bar position
    var barLeft = 0;
    var barWidth = 0;
    var statusClass = 'tl-pending';
    var barInner = '';

    if (tl.startTime) {
      barLeft = ((tl.startTime - projStart) / totalMs) * 100;
      var end = tl.endTime || now;
      barWidth = ((end - tl.startTime) / totalMs) * 100;
      barWidth = Math.max(barWidth, 0.5); // minimum visible width

      if (a.status === 'done') { statusClass = 'tl-done'; }
      else if (a.status === 'working') { statusClass = 'tl-working'; }
      else if (a.status === 'error') { statusClass = 'tl-error'; }
      else if (a.status === 'asking') { statusClass = 'tl-asking'; }
      else if (a.status === 'retrying') { statusClass = 'tl-retrying'; }
      else if (a.status === 'waiting_deps') { statusClass = 'tl-waiting_deps'; }

      // Duration text inside bar
      var durSec = Math.round((end - tl.startTime) / 1000);
      barInner = '<span class="timeline-bar-inner">' + formatDuration(durSec) + '</span>';
    } else {
      // Not started yet - show a thin pending indicator
      statusClass = 'tl-pending';
      barLeft = 0;
      barWidth = 100;
    }

    // Question segments
    var questionSegs = '';
    if (tl.startTime && tl.askingPeriods.length > 0) {
      for (var q = 0; q < tl.askingPeriods.length; q++) {
        var ask = tl.askingPeriods[q];
        var qLeft = ((ask.start - projStart) / totalMs) * 100;
        var qEnd = ask.end || now;
        var qWidth = ((qEnd - projStart) / totalMs) * 100 - qLeft;
        qWidth = Math.max(qWidth, 0.3);
        questionSegs += '<div class="timeline-segment-question" style="left:' + qLeft + '%;width:' + qWidth + '%" title="Frage/Pause"></div>';
      }
    }

    rowsHtml += '<div class="timeline-row">' +
      '<div class="timeline-label" title="' + esc(agentLabel) + '">' + esc(agentLabel) + '</div>' +
      '<div class="timeline-track">' +
        '<div class="timeline-bar ' + statusClass + '" style="left:' + barLeft + '%;width:' + barWidth + '%">' + barInner + '</div>' +
        questionSegs +
        (isRunning ? '<div class="timeline-now-line" style="left:' + nowPct + '%"></div>' : '') +
      '</div>' +
    '</div>';
  }

  // Elapsed info
  var elapsedText = state.startedAt ? formatDuration(Math.round((now - state.startedAt) / 1000)) : '';

  var html = '<div class="timeline-container" id="timelineContainer" style="margin-top:8px">' +
    '<div class="timeline-header">' +
      '<span class="timeline-header-title">Zeitverlauf</span>' +
      '<span class="timeline-header-elapsed">' + (elapsedText ? 'Laufzeit: ' + esc(elapsedText) : '') + '</span>' +
    '</div>' +
    '<div class="timeline-axis">' + axisHtml + '</div>' +
    rowsHtml +
    '<div class="timeline-legend">' +
      '<div class="timeline-legend-item"><div class="timeline-legend-swatch" style="background:var(--green)"></div>Fertig</div>' +
      '<div class="timeline-legend-item"><div class="timeline-legend-swatch" style="background:var(--blue)"></div>Arbeitet</div>' +
      '<div class="timeline-legend-item"><div class="timeline-legend-swatch" style="background:var(--amber)"></div>Frage/Pause</div>' +
      '<div class="timeline-legend-item"><div class="timeline-legend-swatch" style="background:var(--red)"></div>Fehler</div>' +
      '<div class="timeline-legend-item"><div class="timeline-legend-swatch" style="background:var(--gray);opacity:0.35"></div>Wartend</div>' +
      (isRunning ? '<div class="timeline-legend-item"><div style="width:1.5px;height:10px;background:var(--red);opacity:0.6;flex-shrink:0"></div>Jetzt</div>' : '') +
    '</div>' +
  '</div>';

  return html;
}

function updateTimelineView() {
  var container = document.getElementById('timelineContainer');
  if (!container || viewMode !== 'timeline') return;
  // Re-render just the timeline container content
  var agents = state.agents || [];
  if (agents.length === 0) return;
  var tempDiv = document.createElement('div');
  tempDiv.innerHTML = renderTimeline(agents);
  var newContainer = tempDiv.querySelector('.timeline-container');
  if (newContainer) container.innerHTML = newContainer.innerHTML;
}

function startTimelineTimer() {
  if (_timelineTimer) return;
  _timelineTimer = setInterval(function() {
    if (viewMode === 'timeline' && state.phase === 'running') updateTimelineView();
  }, 2000);
}

function stopTimelineTimer() {
  if (_timelineTimer) { clearInterval(_timelineTimer); _timelineTimer = null; }
}

// ── DAG Graph View (Enhanced with Zoom/Pan/Hover) ────────────
var _dagZoom = 1, _dagPanX = 0, _dagPanY = 0;
var _dagDragging = false, _dagDragStartX = 0, _dagDragStartY = 0, _dagPanStartX = 0, _dagPanStartY = 0;

function renderGraph(agents) {
  if (!agents || agents.length === 0) return '';

  var hasDeps = agents.some(function(a) { return a.depends_on && a.depends_on.length > 0; });

  // Topological sort: assign layers (left-to-right)
  var agentLayer = new Array(agents.length);
  for (var i = 0; i < agents.length; i++) agentLayer[i] = 0;

  if (hasDeps) {
    var changed = true, iterations = 0;
    while (changed && iterations < agents.length) {
      changed = false; iterations++;
      for (var i = 0; i < agents.length; i++) {
        var deps = agents[i].depends_on || [];
        for (var j = 0; j < deps.length; j++) {
          var depIdx = deps[j];
          if (depIdx >= 0 && depIdx < agents.length) {
            var needed = agentLayer[depIdx] + 1;
            if (needed > agentLayer[i]) { agentLayer[i] = needed; changed = true; }
          }
        }
      }
    }
  }

  // Group by layer
  var maxLayer = 0;
  for (var i = 0; i < agents.length; i++) { if (agentLayer[i] > maxLayer) maxLayer = agentLayer[i]; }
  var layers = [];
  for (var l = 0; l <= maxLayer; l++) {
    layers[l] = [];
    for (var i = 0; i < agents.length; i++) { if (agentLayer[i] === l) layers[l].push(i); }
  }

  // Layout: left-to-right
  var nodeW = 180, nodeH = 64;
  var hGap = 60, vGap = 28;
  var padX = 32, padY = 32;

  var maxInLayer = 0;
  for (var l = 0; l <= maxLayer; l++) { if (layers[l].length > maxInLayer) maxInLayer = layers[l].length; }

  var svgW = padX * 2 + (maxLayer + 1) * nodeW + maxLayer * hGap;
  var svgH = Math.max(padY * 2 + maxInLayer * nodeH + (maxInLayer - 1) * vGap, 180);

  // Compute positions (left-to-right: layer = X, index in layer = Y)
  var nodePos = {};
  for (var l = 0; l <= maxLayer; l++) {
    var count = layers[l].length;
    var totalH = count * nodeH + (count - 1) * vGap;
    var startY = (svgH - totalH) / 2;
    for (var k = 0; k < count; k++) {
      var idx = layers[l][k];
      nodePos[idx] = {
        x: padX + l * (nodeW + hGap),
        y: startY + k * (nodeH + vGap)
      };
    }
  }

  // Build edge data (for hover highlighting)
  var edgeList = [];
  for (var i = 0; i < agents.length; i++) {
    var deps = agents[i].depends_on || [];
    for (var j = 0; j < deps.length; j++) {
      var depIdx = deps[j];
      if (depIdx >= 0 && depIdx < agents.length && nodePos[depIdx] && nodePos[i]) {
        edgeList.push({ from: depIdx, to: i });
      }
    }
  }

  // Status label mapping
  var statusLabels = {
    done: 'Fertig', working: 'Arbeitet', asking: 'Frage',
    error: 'Fehler', waiting: 'Wartend', pending: 'Wartend',
    waiting_deps: 'Wartet', skipped: 'Uebersprungen', retrying: 'Retry'
  };

  // Build SVG
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" id="dagSvg" width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '" style="transform:scale(' + _dagZoom + ') translate(' + _dagPanX + 'px,' + _dagPanY + 'px)">';

  // Defs: arrow markers
  svg += '<defs>' +
    '<marker id="dagArrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,3.5 L0,7 Z" class="dag-edge-marker"/>' +
    '</marker>' +
    '<marker id="dagArrowActive" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,3.5 L0,7 Z" fill="var(--blue)"/>' +
    '</marker>' +
  '</defs>';

  // Draw edges
  for (var ei = 0; ei < edgeList.length; ei++) {
    var e = edgeList[ei];
    var from = nodePos[e.from], to = nodePos[e.to];
    var x1 = from.x + nodeW, y1 = from.y + nodeH / 2;
    var x2 = to.x, y2 = to.y + nodeH / 2;
    var cpOffset = Math.min(Math.abs(x2 - x1) * 0.4, 50);

    // Determine if edge is "active" (source done, target working/asking)
    var srcSt = agents[e.from].status || 'waiting';
    var tgtSt = agents[e.to].status || 'waiting';
    var isActive = (srcSt === 'done') && (tgtSt === 'working' || tgtSt === 'asking');
    var edgeCls = 'dag-edge' + (isActive ? ' dag-edge-active' : '');
    var marker = isActive ? 'url(#dagArrowActive)' : 'url(#dagArrow)';
    var strokeClr = isActive ? 'var(--blue)' : 'var(--txt3)';
    var strokeOp = isActive ? '0.9' : '0.4';

    svg += '<path class="' + edgeCls + '" data-from="' + e.from + '" data-to="' + e.to + '" ' +
      'style="stroke:' + strokeClr + ';opacity:' + strokeOp + '" ' +
      'd="M' + x1 + ',' + y1 + ' C' + (x1 + cpOffset) + ',' + y1 + ' ' + (x2 - cpOffset) + ',' + y2 + ' ' + x2 + ',' + y2 + '" ' +
      'marker-end="' + marker + '"/>';
  }

  // Draw nodes
  for (var i = 0; i < agents.length; i++) {
    var a = agents[i];
    var p = nodePos[i];
    if (!p) continue;
    var st = a.status || 'waiting';
    var title = a.title || 'Agent ' + (i + 1);
    if (title.length > 20) title = title.substring(0, 19) + '\u2026';
    var stLabel = statusLabels[st] || st;
    var scoreVal = a.score != null ? a.score : null;

    svg += '<g class="dag-node dag-node-' + esc(st) + '" data-idx="' + i + '" ' +
      'onclick="openAgentModal(' + i + ')" ' +
      'onmouseenter="dagNodeHover(' + i + ',true)" onmouseleave="dagNodeHover(' + i + ',false)" ' +
      'role="button" tabindex="0" aria-label="Agent ' + (i + 1) + ': ' + esc(a.title || '') + '">' +
      '<rect x="' + p.x + '" y="' + p.y + '" width="' + nodeW + '" height="' + nodeH + '"/>' +
      '<text class="dag-label" x="' + (p.x + 10) + '" y="' + (p.y + 18) + '">Agent ' + (i + 1) + '</text>' +
      '<text class="dag-title" x="' + (p.x + 10) + '" y="' + (p.y + 34) + '">' + esc(title) + '</text>' +
      '<text class="dag-label" x="' + (p.x + 10) + '" y="' + (p.y + 50) + '" style="font-size:9px;font-weight:400;opacity:0.8">' + esc(stLabel) + '</text>';

    // Score badge (right side)
    if (scoreVal != null) {
      var scColor = scoreVal > 80 ? 'var(--teal)' : scoreVal >= 50 ? 'var(--amber)' : 'var(--red)';
      svg += '<rect x="' + (p.x + nodeW - 38) + '" y="' + (p.y + 6) + '" width="30" height="16" rx="4" ry="4" fill="' + scColor + '" opacity="0.2"/>' +
        '<text class="dag-score" x="' + (p.x + nodeW - 23) + '" y="' + (p.y + 18) + '" text-anchor="middle" fill="' + scColor + '">' + scoreVal + '</text>';
    }

    svg += '</g>';
  }

  svg += '</svg>';

  var noDepsNote = !hasDeps ? '<div class="dag-no-deps">Keine Abh\u00E4ngigkeiten \u2013 alle Agenten sind unabh\u00E4ngig</div>' : '';

  var controls = '<div class="dag-controls">' +
    '<button onclick="dagZoom(0.15)" title="Vergr\u00F6\u00DFern">+</button>' +
    '<button onclick="dagZoom(-0.15)" title="Verkleinern">&minus;</button>' +
    '<button onclick="dagResetView()" title="Ansicht zur\u00FCcksetzen">&#8634;</button>' +
  '</div>';

  return '<div class="dag-container" id="dagContainer">' + controls + noDepsNote + svg + '</div>';
}

function dagApplyTransform() {
  var svg = document.getElementById('dagSvg');
  if (!svg) return;
  svg.style.transform = 'scale(' + _dagZoom + ') translate(' + _dagPanX + 'px,' + _dagPanY + 'px)';
}

function dagZoom(delta) {
  _dagZoom = Math.max(0.3, Math.min(3, _dagZoom + delta));
  dagApplyTransform();
}

function dagResetView() {
  _dagZoom = 1; _dagPanX = 0; _dagPanY = 0;
  dagApplyTransform();
}

function initDagInteraction() {
  var container = document.getElementById('dagContainer');
  if (!container) return;

  // Mouse wheel zoom
  container.addEventListener('wheel', function(e) {
    e.preventDefault();
    var delta = e.deltaY > 0 ? -0.08 : 0.08;
    _dagZoom = Math.max(0.3, Math.min(3, _dagZoom + delta));
    dagApplyTransform();
  }, { passive: false });

  // Pan with drag
  container.addEventListener('mousedown', function(e) {
    if (e.target.closest('.dag-node') || e.target.closest('.dag-controls') || e.target.closest('button')) return;
    _dagDragging = true;
    _dagDragStartX = e.clientX; _dagDragStartY = e.clientY;
    _dagPanStartX = _dagPanX; _dagPanStartY = _dagPanY;
    container.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!_dagDragging) return;
    var dx = (e.clientX - _dagDragStartX) / _dagZoom;
    var dy = (e.clientY - _dagDragStartY) / _dagZoom;
    _dagPanX = _dagPanStartX + dx;
    _dagPanY = _dagPanStartY + dy;
    dagApplyTransform();
  });
  document.addEventListener('mouseup', function() {
    if (_dagDragging) {
      _dagDragging = false;
      var c = document.getElementById('dagContainer');
      if (c) c.classList.remove('dragging');
    }
  });
}

function dagNodeHover(idx, entering) {
  var svg = document.getElementById('dagSvg');
  if (!svg) return;
  var nodes = svg.querySelectorAll('.dag-node');
  var edges = svg.querySelectorAll('.dag-edge');

  if (!entering) {
    // Remove all highlight/dim classes
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.remove('dag-dimmed', 'dag-highlighted');
    }
    for (var i = 0; i < edges.length; i++) {
      edges[i].classList.remove('dag-dimmed', 'dag-highlighted');
    }
    return;
  }

  // Find connected nodes
  var connected = {}; connected[idx] = true;
  for (var i = 0; i < edges.length; i++) {
    var from = parseInt(edges[i].getAttribute('data-from'));
    var to = parseInt(edges[i].getAttribute('data-to'));
    if (from === idx || to === idx) {
      connected[from] = true; connected[to] = true;
    }
  }

  // Apply dim/highlight
  for (var i = 0; i < nodes.length; i++) {
    var nIdx = parseInt(nodes[i].getAttribute('data-idx'));
    if (connected[nIdx]) {
      nodes[i].classList.remove('dag-dimmed');
      nodes[i].classList.add('dag-highlighted');
    } else {
      nodes[i].classList.remove('dag-highlighted');
      nodes[i].classList.add('dag-dimmed');
    }
  }
  for (var i = 0; i < edges.length; i++) {
    var from = parseInt(edges[i].getAttribute('data-from'));
    var to = parseInt(edges[i].getAttribute('data-to'));
    if (from === idx || to === idx) {
      edges[i].classList.remove('dag-dimmed');
      edges[i].classList.add('dag-highlighted');
    } else {
      edges[i].classList.remove('dag-highlighted');
      edges[i].classList.add('dag-dimmed');
    }
  }
}

function updateGraphView() {
  var container = document.getElementById('dagContainer');
  if (!container || viewMode !== 'graph') return;
  var agents = state.agents || [];
  if (agents.length === 0) return;
  // Save current zoom/pan
  var savedZoom = _dagZoom, savedPanX = _dagPanX, savedPanY = _dagPanY;
  var tempDiv = document.createElement('div');
  tempDiv.innerHTML = renderGraph(agents);
  var newContainer = tempDiv.querySelector('.dag-container');
  if (newContainer) container.innerHTML = newContainer.innerHTML;
  // Restore zoom/pan
  _dagZoom = savedZoom; _dagPanX = savedPanX; _dagPanY = savedPanY;
  dagApplyTransform();
  setTimeout(initDagInteraction, 30);
}

// ── Agent-Farben fuer Shared Context Panel ─────────────────
var AGENT_COLORS = ['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#06B6D4','#F97316','#6366F1','#14B8A6'];
function getAgentColor(idx) { return AGENT_COLORS[idx % AGENT_COLORS.length]; }
function getAgentBgColor(idx) {
  var c = getAgentColor(idx);
  return c + '18'; // Hex alpha fuer leichten Hintergrund
}

function toggleSharedContextPanel() {
  sharedContextPanelOpen = !sharedContextPanelOpen;
  var content = document.getElementById('sharedCtxContent');
  var arrow = document.getElementById('sharedCtxArrow');
  if (content) content.style.display = sharedContextPanelOpen ? 'block' : 'none';
  if (arrow) arrow.className = 'arrow' + (sharedContextPanelOpen ? ' open' : '');
  if (sharedContextPanelOpen) renderSharedContextPanel();
}

function renderSharedContextPanel() {
  var el = document.getElementById('sharedCtxContent');
  if (!el) return;

  var board = state.sharedContextBoard || [];
  var agentMessages = [];

  // Alle Agent-zu-Agent Nachrichten aus Conversations sammeln
  (state.agents || []).forEach(function(agent, idx) {
    (agent.conversation || []).forEach(function(m) {
      if (m.type === 'message') {
        agentMessages.push({
          agentIndex: idx,
          targetAgent: m.targetAgent,
          sourceAgent: m.sourceAgent,
          text: m.text || '',
          ts: m.ts || 0,
          direction: m.targetAgent != null ? 'out' : 'in'
        });
      }
      if (m.type === 'context') {
        // Kontext-Eintraege sind schon im Board
      }
    });
  });

  var html = '';

  // 1. Agent-zu-Agent Nachrichten
  if (agentMessages.length > 0) {
    html += '<div class="shared-ctx-section-label">Agent-Nachrichten</div>';
    agentMessages.forEach(function(msg) {
      var isOut = msg.direction === 'out';
      var label = '';
      var agentIdx = msg.agentIndex;
      if (isOut) {
        label = 'Agent ' + (agentIdx + 1) + ' \u2192 Agent ' + (msg.targetAgent + 1);
      } else {
        var srcIdx = msg.sourceAgent != null ? msg.sourceAgent : -1;
        label = 'Agent ' + (srcIdx + 1) + ' \u2192 Agent ' + (agentIdx + 1);
        agentIdx = srcIdx >= 0 ? srcIdx : agentIdx;
      }
      var color = getAgentColor(agentIdx);
      html += '<div class="shared-ctx-msg-bubble ' + (isOut ? 'msg-out' : 'msg-in') + '" style="border-left: 3px solid ' + esc(color) + '">' +
        '<div class="shared-ctx-msg-label">' + esc(label) + '</div>' +
        '<div>' + esc(msg.text.replace(/^(Von Agent \d+:|→ Agent \d+:)\s*/, '')) + '</div>' +
      '</div>';
    });
  }

  // 2. Shared Context Board Eintraege
  if (board.length > 0) {
    html += '<div class="shared-ctx-section-label">Shared Context Board</div>';
    board.slice().reverse().slice(0, 50).forEach(function(entry) {
      var agentIdx = entry.agentIndex || 0;
      var color = getAgentColor(agentIdx);
      var timeStr = entry.timestamp ? new Date(entry.timestamp).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
      html += '<div class="shared-ctx-entry" style="background: ' + getAgentBgColor(agentIdx) + '">' +
        '<span class="ctx-agent-badge" style="background: ' + esc(color) + '; color: #fff">A' + (agentIdx + 1) + '</span>' +
        '<span class="ctx-key">' + esc(entry.key || '') + ':</span>' +
        '<span class="ctx-value">' + esc(entry.value || '') + '</span>' +
        '<span class="ctx-time">' + esc(timeStr) + '</span>' +
      '</div>';
    });
  }

  // 3. Shared Files
  if (sharedFiles.length > 0) {
    html += '<div class="shared-ctx-section-label">Shared Files</div>';
    sharedFiles.forEach(function(sf) {
      var agentIdx = sf.agentIndex || 0;
      var color = getAgentColor(agentIdx);
      html += '<div class="shared-ctx-file" style="border-left: 3px solid ' + esc(color) + '">' +
        '<span class="file-icon">\uD83D\uDCC4</span>' +
        '<span class="ctx-agent-badge" style="background: ' + esc(color) + '; color: #fff">A' + (agentIdx + 1) + '</span>' +
        '<span>' + esc(sf.fileName || '') + '</span>' +
      '</div>';
    });
  }

  // Leerer Zustand
  if (!html) {
    html = '<div class="shared-ctx-empty">Noch keine geteilten Daten. Agenten k\u00F6nnen per "KONTEXT:", "NACHRICHT AN Agent X:" und "SHARED FILE:" kommunizieren.</div>';
  }

  el.innerHTML = html;
}

// ── Render: Dashboard ────────────────────────────────────────
function renderDashboard() {
  var agents = state.agents || [];
  var coord = state.coordinator || {};
  var done = agents.filter(function(a) { return a.status === 'done'; }).length;
  var total = agents.length;
  var avgProgress = total > 0 ? Math.round(agents.reduce(function(sum, a) { return sum + (a.progress || 0); }, 0) / total) : 0;
  var pct = avgProgress;
  var totalQ = (coord.log || []).length;
  var isComplete = state.phase === 'complete';
  var isPartial = state.phase === 'partial';
  var working = agents.filter(function(a) { return a.status === 'working' || a.status === 'asking'; }).length;

  var html = '<div class="stack" style="padding-top:0.5rem">';

  // Banner area
  html += '<div id="bannerArea"></div>';

  // Complete banner
  if (isComplete) {
    var totalRounds = agents.reduce(function(sum, a) { return sum + (a.rounds || 0); }, 0);
    var totalQuestions = agents.reduce(function(sum, a) { return sum + (a.questions || 0); }, 0);
    var ps = state.projectStats || {};
    var projStatsText = (ps.totalFiles ? ' \u00B7 ' + ps.totalFiles + ' Dateien \u00B7 ' + ps.totalLines + ' Zeilen \u00B7 ' + formatFileSize(ps.totalSize || 0) : '');
    html += '<div class="complete-banner fadein">' +
      '<div style="flex:1">' +
        '<div class="complete-title">\u2713 Alle ' + esc(String(total)) + ' Agenten abgeschlossen' + (state.projectScore != null ? ' <span class="score-project">' + scoreBadge(state.projectScore) + ' Projekt-Score</span>' : '') + '</div>' +
        '<div class="complete-sub">' + esc(String(totalRounds)) + ' Runden \u00B7 ' + esc(String(totalQuestions)) + ' Frage' + (totalQuestions !== 1 ? 'n' : '') + ' \u00B7 ' + esc(String(total)) + ' Agenten' + (state.totalDuration ? ' \u00B7 Gesamtdauer: ' + esc(formatDuration(state.totalDuration)) : '') + projStatsText + (getTokenUsageTotals().totalTokens > 0 ? ' \u00B7 ' + esc(formatTokens(getTokenUsageTotals().totalTokens)) + ' Tokens \u00B7 ' + esc(formatCost(getTokenUsageTotals().estimatedCost)) : '') + '</div>' +
        (state.projectDir ? '<div class="complete-path">' + esc(state.projectDir) + '</div>' : '') +
      '</div>' +
      '<button class="btn-outline" onclick="exportProject()" title="Als ZIP herunterladen">ZIP</button> ' +
      '<button class="btn-outline" onclick="exportProjectJSON()" title="Als JSON herunterladen">JSON</button> ' +
      '<button class="btn-outline" onclick="exportProjectMarkdown()" title="Als Markdown herunterladen">MD</button> ' +
      '<button class="btn-outline btn-print" onclick="window.print()">Drucken</button> ' +
      '<button class="btn-outline btn-print" onclick="togglePrintPreview()">Druckvorschau</button> ' +
      '<button class="btn-outline btn-print" onclick="generateReport()">Bericht erstellen</button> ' +
      '<button class="btn-outline" onclick="loadMergedFiles()">Zusammengef\u00FChrte Dateien</button> ' +
      '<button class="btn-outline" onclick="cloneProject()">Erneut starten</button> ' +
      '<button class="btn-outline" onclick="resetProject()">Neues Projekt</button>' +
    '</div>';

    // Zusammengeführte Dateien anzeigen (erweitertes Merge-System)
    if (mergedFiles && mergedFiles.files && mergedFiles.files.length > 0) {
      html += renderMergedFilesSection(mergedFiles, 'var(--green)', false);
    }
  }

  // Partial banner (teilweiser Erfolg)
  if (isPartial) {
    var successCount = state._successCount || agents.filter(function(a) { return a.status === 'done'; }).length;
    var failedCount = state._failedCount || agents.filter(function(a) { return a.status === 'error'; }).length;
    var failedIdxs = state._failedAgents || agents.map(function(a, i) { return a.status === 'error' ? i : -1; }).filter(function(i) { return i >= 0; });
    var totalRoundsP = agents.reduce(function(sum, a) { return sum + (a.rounds || 0); }, 0);
    var psP = state.projectStats || {};
    var projStatsTextP = (psP.totalFiles ? ' \u00B7 ' + psP.totalFiles + ' Dateien \u00B7 ' + psP.totalLines + ' Zeilen \u00B7 ' + formatFileSize(psP.totalSize || 0) : '');

    html += '<div class="partial-banner fadein">' +
      '<div style="flex:1">' +
        '<div class="partial-title">\u26A0 ' + esc(String(successCount)) + ' von ' + esc(String(total)) + ' Agenten erfolgreich. ' + esc(String(failedCount)) + ' fehlgeschlagen.' + (state.projectScore != null ? ' <span class="score-project">' + scoreBadge(state.projectScore) + ' Projekt-Score</span>' : '') + '</div>' +
        '<div class="partial-sub">' + esc(String(totalRoundsP)) + ' Runden' + (state.totalDuration ? ' \u00B7 Gesamtdauer: ' + esc(formatDuration(state.totalDuration)) : '') + projStatsTextP + (getTokenUsageTotals().totalTokens > 0 ? ' \u00B7 ' + esc(formatTokens(getTokenUsageTotals().totalTokens)) + ' Tokens \u00B7 ' + esc(formatCost(getTokenUsageTotals().estimatedCost)) : '') + '</div>' +
        (state.projectDir ? '<div class="partial-path">' + esc(state.projectDir) + '</div>' : '') +
        '<div class="partial-retry-btns">' +
          failedIdxs.map(function(idx) {
            return '<button class="btn-retry" aria-label="Agent erneut versuchen" onclick="retryAgent(' + idx + ')">Agent ' + (idx + 1) + ' wiederholen</button>';
          }).join(' ') +
        '</div>' +
      '</div>' +
      '<button class="btn-primary" onclick="resumeProject()">Fortsetzen</button> ' +
      '<button class="btn-outline" onclick="exportProject()" title="Als ZIP herunterladen">ZIP</button> ' +
      '<button class="btn-outline" onclick="exportProjectJSON()" title="Als JSON herunterladen">JSON</button> ' +
      '<button class="btn-outline" onclick="exportProjectMarkdown()" title="Als Markdown herunterladen">MD</button> ' +
      '<button class="btn-outline" onclick="loadMergedFiles()">Zusammengef\u00FChrte Dateien</button> ' +
      '<button class="btn-outline" onclick="cloneProject()">Erneut starten</button> ' +
      '<button class="btn-outline" onclick="resetProject()">Neues Projekt</button>' +
    '</div>';

    // Zusammengefuehrte Dateien auch bei partial anzeigen
    if (mergedFiles && mergedFiles.files && mergedFiles.files.length > 0) {
      html += renderMergedFilesSection(mergedFiles, 'var(--amber)', true);
    }
  }

  // Project header
  html += '<div class="card">' +
    '<div class="proj-header">' +
      '<div>' +
        '<div class="proj-title" id="projTitle">' + esc(state.projectTitle || 'Projekt l\u00E4uft\u2026') + '</div>' +
        (state.projectSummary ? '<div class="proj-summary" id="projSummary">' + esc(state.projectSummary) + '</div>' : '<div class="proj-summary" id="projSummary"></div>') +
        '<div class="proj-path" id="projPath">' + esc(state.projectDir) + '</div>' +
      '</div>' +
      '<div class="stats-row">' +
        (isComplete
          ? '<button class="btn-outline" onclick="exportProject()" title="Als ZIP herunterladen">ZIP</button> <button class="btn-outline" onclick="exportProjectJSON()" title="Als JSON herunterladen">JSON</button> <button class="btn-outline" onclick="exportProjectMarkdown()" title="Als Markdown herunterladen">MD</button> <button class="btn-outline" onclick="resetProject()">Neues Projekt</button>'
          : '<div>' +
              '<div class="stat-label" id="statLabel" aria-live="polite">' + esc(done + ' / ' + total + ' fertig') + (working > 0 ? ' \u00B7 ' + esc(String(working)) + ' aktiv' : '') + ' \u00B7 ' + esc(String(totalQ)) + ' Dialoge</div>' +
              '<div style="font-size:11px;color:var(--txt3);margin-bottom:3px" id="elapsedTime">' + (state.startedAt ? esc(formatDuration(getElapsedSeconds())) : '') + '</div>' +
              '<div class="token-compact" id="tokenCompact"' + (getTokenUsageTotals().totalTokens > 0 ? '' : ' style="display:none"') + '><span class="token-icon">&#9677;</span> <span class="token-val">' + esc(formatTokens(getTokenUsageTotals().totalTokens)) + '</span> <span class="token-cost">' + esc(formatCost(getTokenUsageTotals().estimatedCost)) + '</span></div>' +
              renderBudgetBar() +
              '<div class="project-eta-bar" style="width:180px">' +
                '<div class="pbar-wrap"><div class="pbar-fill" id="projectEtaFill" style="width:' + (state._projectPercent || pct) + '%"></div></div>' +
                '<div class="project-eta-text"><span class="project-eta-label" id="projectEtaPct">' + (state._projectPercent || pct) + '%</span><span id="projectEtaText">' + (state._projectEta > 0 ? esc(formatEta(state._projectEta)) : '') + '</span></div>' +
              '</div>' +
              '<button class="btn-outline" style="color:var(--red);border-color:var(--red);margin-top:6px" onclick="abortProject()">Abbrechen</button>' +
            '</div>') +
      '</div>' +
    '</div>' +
  '</div>';

  // Queue section
  html += '<div class="queue-section-slot">' + renderQueueSection() + '</div>';
  // Coordinator
  html += '<div>' +
    '<div class="section-label">Koordinator</div>' +
    '<div class="card card-sm" id="coordinatorCard">' + renderCoordinatorInner(coord) + '</div>' +
  '</div>';

  // Shared Context Panel (Agent-Kommunikation)
  var boardCount = (state.sharedContextBoard || []).length;
  var msgCount = 0;
  (state.agents || []).forEach(function(a) { (a.conversation || []).forEach(function(m) { if (m.type === 'message') msgCount++; }); });
  var sharedCount = boardCount + msgCount + sharedFiles.length;
  html += '<div>' +
    '<div class="section-label">Agent-Kommunikation' + (sharedCount > 0 ? ' <span style="background:var(--purple-bg);color:var(--purple);padding:1px 6px;border-radius:8px;font-size:11px;font-weight:600;margin-left:4px">' + esc(String(sharedCount)) + '</span>' : '') + '</div>' +
    '<div class="card card-sm">' +
      '<button class="shared-ctx-toggle" onclick="toggleSharedContextPanel()">' +
        '<span class="arrow' + (sharedContextPanelOpen ? ' open' : '') + '" id="sharedCtxArrow">\u25B6</span> Shared Context &amp; Nachrichten' +
      '</button>' +
      '<div class="shared-ctx-panel" id="sharedCtxContent" style="display:' + (sharedContextPanelOpen ? 'block' : 'none') + '"></div>' +
    '</div>' +
  '</div>';

  // Token Usage Panel
  var tokenPanelHtml = renderTokenPanel();
  if (tokenPanelHtml) {
    html += '<div>' +
      '<div class="section-label">Token-Verbrauch</div>' +
      '<div class="card card-sm">' + tokenPanelHtml + '</div>' +
    '</div>';
  }

  // Agents
  if (agents.length > 0) {
    var filtered = filterAgents();
    var filterBtns = ['alle','aktiv','fertig','fehler'];
    var filterLabels = { alle: 'Alle', aktiv: 'Aktiv', fertig: 'Fertig', fehler: 'Fehler' };
    html += '<div class="changelog-tab-bar">' +
      '<button class="dash-tab-btn changelog-tab' + (_changelogDashTab === 'agenten' ? ' active' : '') + '" data-tab="agenten" onclick="switchDashTab(\'agenten\')">Agenten (' + esc(String(total)) + ')</button>' +
      '<button class="dash-tab-btn changelog-tab' + (_changelogDashTab === 'changelog' ? ' active' : '') + '" data-tab="changelog" onclick="switchDashTab(\'changelog\')">Changelog</button>' +
      '<button class="dash-tab-btn changelog-tab' + (_changelogDashTab === 'performance' ? ' active' : '') + '" data-tab="performance" onclick="switchDashTab(\'performance\')">Performance</button>' +
    '</div>';
    html += '<div id="dashAgentsPanel"' + (_changelogDashTab !== 'agenten' ? ' style="display:none"' : '') + '>' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<div class="section-label" style="margin-bottom:0">Agenten (' + esc(String(total)) + ')</div>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<div class="view-toggle-group">' +
            '<button class="view-toggle-btn' + (viewMode === 'cards' ? ' active' : '') + '" onclick="setViewMode(\'cards\')" title="Karten-Ansicht">Karten</button>' +
            '<button class="view-toggle-btn' + (viewMode === 'timeline' ? ' active' : '') + '" onclick="setViewMode(\'timeline\')" title="Timeline-Ansicht">Timeline</button>' +
            '<button class="view-toggle-btn' + (viewMode === 'graph' ? ' active' : '') + '" onclick="setViewMode(\'graph\')" title="Graph-Ansicht">Graph</button>' +
          '</div>' +
          (total >= 2 ? '<button class="btn-compare" onclick="openAgentCompareModal()">Agenten vergleichen</button>' : '') +
          (viewMode === 'cards' ? '<button class="btn-outline" id="toggleDetailsBtn" onclick="toggleAllDetails()" style="font-size:11px;padding:4px 10px">' + (allDetailsExpanded ? 'Details ausblenden' : 'Alle Details anzeigen') + '</button>' : '') +
        '</div>' +
      '</div>';
    if (viewMode === 'timeline') {
      html += renderTimeline(agents);
    } else if (viewMode === 'graph') {
      html += renderGraph(agents);
    } else {
      html += '<div class="filter-bar" style="margin-top:8px">' +
        '<input class="filter-input" type="text" placeholder="Agenten durchsuchen\u2026" value="' + esc(agentSearch) + '" oninput="setAgentSearch(this.value)" id="agentSearchInput">' +
        filterBtns.map(function(f) {
          return '<button class="filter-btn' + (agentFilter === f ? ' active' : '') + '" onclick="setAgentFilter(\'' + f + '\')">' + esc(filterLabels[f]) + '</button>';
        }).join('') +
        '<span class="filter-count">' + esc(String(filtered.length)) + ' von ' + esc(String(total)) + '</span>' +
      '</div>' +
      '<div class="agent-grid" style="margin-top:8px">' + filtered.map(function(item) { return renderAgent(item.agent, item.index); }).join('') + '</div>';
    }
    html += '</div>';

    // Changelog Panel
    html += '<div id="dashChangelogPanel" class="changelog-container"' + (_changelogDashTab !== 'changelog' ? ' style="display:none"' : '') + '>' +
      '<div id="changelogContent"><div class="changelog-empty">Klicke auf "Changelog" um die Timeline zu laden.</div></div>' +
    '</div>';

    // Performance Panel
    html += '<div id="dashPerformancePanel"' + (_changelogDashTab !== 'performance' ? ' style="display:none"' : '') + '>' +
      '<div id="perfContent"><div class="perf-loading"><span class="spin"></span> Performance-Daten werden geladen\u2026</div></div>' +
    '</div>';
  }

  // File tree
  var ftCountLabel = fileTreeLastData ? ' <span class="ft-file-count">(' + fileTreeLastData.length + ' Dateien)</span>' : '';
  html += '<div>' +
    '<div class="section-label">Dateien</div>' +
    '<div class="card card-sm">' +
      '<button class="file-tree-toggle" onclick="toggleFileTree()" aria-expanded="' + (fileTreeOpen ? 'true' : 'false') + '">' +
        '<span class="arrow' + (fileTreeOpen ? ' open' : '') + '" id="fileTreeArrow">▶</span> Dateibaum' + ftCountLabel +
      '</button>' +
      '<div class="file-tree" id="fileTreeContent" style="display:' + (fileTreeOpen ? 'block' : 'none') + '"></div>' +
    '</div>' +
  '</div>';

  // Activity feed panel
  html += '<div class="activity-feed-panel" id="activityFeedPanel" style="display:' + (activityFeedOpen ? 'block' : 'none') + '">' +
    '<div id="activityFeedContent"></div>' +
  '</div>';

  html += '</div>';
  return html;
}

function renderCoordinatorInner(c) {
  var log = c.log || [];
  var interimReports = c.interimReports || [];
  var adaptations = c.adaptations || [];
  var finalReport = c.finalReport || null;
  var isActive = c.status === 'thinking' || c.status === 'planning' || c.status === 'summarizing' || c.status === 'interim_report' || c.status === 'adapting';

  var html = '<div class="coord-header">' +
    '<div class="coord-name"><span class="coord-activity-dot' + (isActive ? ' active' : '') + '"></span>Koordinator</div>' +
    badge(c.status || 'idle') +
  '</div>';
  if (c.summary && !finalReport) html += '<div class="coord-summary">' + esc(c.summary) + '</div>';
  if (c.activeQuestion) {
    html += '<div class="active-q">' +
      '<div class="active-q-label">Beantwortet Frage von Agent ' + esc(String(c.activeQuestion.agentIndex + 1)) + ':</div>' +
      esc(truncate(c.activeQuestion.question, 120)) +
    '</div>';
  }

  // Finaler Bericht (ausklappbar)
  if (finalReport) {
    var ratingClass = finalReport.overallRating >= 7 ? 'high' : (finalReport.overallRating >= 4 ? 'mid' : 'low');
    html += '<div class="coord-final-report">' +
      '<div class="coord-final-toggle" onclick="toggleFinalReport()" id="finalReportToggle">' +
        '<span class="arrow" id="finalReportArrow">&#9654;</span> Abschlussbericht' +
        (finalReport.overallRating != null ? ' <span class="coord-rating ' + ratingClass + '">' + esc(String(finalReport.overallRating)) + '/10</span>' : '') +
      '</div>' +
      '<div id="finalReportBody" class="coord-final-body" style="display:none">';

    if (finalReport.summary) {
      html += '<div class="final-section"><div class="final-section-title">Zusammenfassung</div>' + esc(finalReport.summary) + '</div>';
    }
    if (finalReport.achievements && finalReport.achievements.length > 0) {
      html += '<div class="final-section"><div class="final-section-title">Erfolge</div><ul>';
      finalReport.achievements.forEach(function(a) { html += '<li>' + esc(a) + '</li>'; });
      html += '</ul></div>';
    }
    if (finalReport.issues && finalReport.issues.length > 0) {
      html += '<div class="final-section"><div class="final-section-title">Probleme</div><ul>';
      finalReport.issues.forEach(function(a) { html += '<li>' + esc(a) + '</li>'; });
      html += '</ul></div>';
    }
    if (finalReport.openItems && finalReport.openItems.length > 0) {
      html += '<div class="final-section"><div class="final-section-title">Offene Punkte</div><ul>';
      finalReport.openItems.forEach(function(a) { html += '<li>' + esc(a) + '</li>'; });
      html += '</ul></div>';
    }
    if (finalReport.nextSteps && finalReport.nextSteps.length > 0) {
      html += '<div class="final-section"><div class="final-section-title">N\u00E4chste Schritte</div><ul>';
      finalReport.nextSteps.forEach(function(a) { html += '<li>' + esc(a) + '</li>'; });
      html += '</ul></div>';
    }
    if (finalReport.ratingReason) {
      html += '<div class="final-section"><div class="final-section-title">Bewertung</div>' + esc(finalReport.ratingReason) + '</div>';
    }
    html += '</div></div>';
  }

  // Zwischenberichte und Plan-Anpassungen als Timeline
  if (interimReports.length > 0 || adaptations.length > 0) {
    // Alle Einträge chronologisch zusammenführen
    var timelineItems = [];
    interimReports.forEach(function(ir) {
      timelineItems.push({ type: 'interim', ts: ir.timestamp, data: ir });
    });
    adaptations.forEach(function(ad) {
      timelineItems.push({ type: 'adaptation', ts: ad.timestamp, data: ad });
    });
    timelineItems.sort(function(a, b) { return a.ts - b.ts; });

    html += '<div style="margin-top:10px"><div class="section-label">Koordinator-Aktivit\u00E4t (' + timelineItems.length + ')</div>' +
      '<div class="coord-timeline">';
    timelineItems.forEach(function(item) {
      var timeStr = new Date(item.ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      if (item.type === 'interim') {
        var ir = item.data;
        html += '<div class="coord-timeline-item">' +
          '<div class="coord-timeline-time">' + esc(timeStr) + ' \u2013 Zwischenbericht (' + esc(String(ir.completedAgents)) + '/' + esc(String(ir.totalAgents)) + ' Agenten)</div>' +
          esc(truncate(ir.report, 200)) +
        '</div>';
      } else {
        var ad = item.data;
        var actionLabel = ad.adaptation.action === 'redistribute' ? 'Umverteilt' : (ad.adaptation.action === 'skip' ? '\u00DCbersprungen' : 'Akzeptiert');
        html += '<div class="coord-timeline-item adaptation">' +
          '<div class="coord-timeline-time">' + esc(timeStr) + ' \u2013 Plan-Anpassung: Agent ' + esc(String(ad.failedAgentIndex + 1)) + ' ("' + esc(truncate(ad.failedAgentTitle, 30)) + '")</div>' +
          '<strong>' + esc(actionLabel) + '</strong>' + (ad.adaptation.critical ? ' <span style="color:var(--red);font-weight:600">[Kritisch]</span>' : '') +
          '<br>' + esc(truncate(ad.adaptation.reason, 150)) +
          (ad.adaptation.recommendation ? '<br><em>' + esc(truncate(ad.adaptation.recommendation, 150)) + '</em>' : '') +
        '</div>';
      }
    });
    html += '</div></div>';
  }

  // Dialog-Protokoll
  if (log.length > 0) {
    html += '<div style="margin-top:10px">' +
      '<div class="section-label">Dialog-Protokoll</div>' +
      '<div class="proto-scroll">';
    for (var i = log.length - 1; i >= 0; i--) {
      var e = log[i];
      html += '<div class="proto-item">' +
        '<div class="proto-q">Agent ' + esc(String(e.agentIndex + 1)) + ' fragte: ' + esc(truncate(e.question, 80)) + '</div>' +
        '<div class="proto-a">' + esc(truncate(e.answer, 110)) + '</div>' +
      '</div>';
    }
    html += '</div></div>';
  }
  return html;
}

function renderBubble(m) {
  var copyBtn = '<button class="copy-btn" onclick="copyText(this)" title="Kopieren" aria-label="Text kopieren">\u2398</button>';
  if (m.from === 'coordinator') {
    return '<div class="bubble-wrap right fadein"><div class="bubble bubble-coordinator">' + copyBtn +
      '<div class="bubble-label">Koordinator \u2192</div><div class="bubble-text">' + esc(truncate(m.text, 300)) + '</div></div></div>';
  } else if (m.type === 'message') {
    var label = m.targetAgent != null ? '\u2192 Agent ' + (m.targetAgent + 1) : (m.sourceAgent != null ? '\u2190 Agent ' + (m.sourceAgent + 1) : 'Nachricht');
    return '<div class="bubble-wrap fadein"><div class="bubble bubble-message">' + copyBtn +
      '<div class="bubble-label">' + esc(label) + '</div><div class="bubble-text">' + esc(truncate(m.text, 300)) + '</div></div></div>';
  } else if (m.type === 'context') {
    return '<div class="bubble-wrap fadein"><div class="bubble bubble-context">' + copyBtn +
      '<div class="bubble-label">Shared Context</div><div class="bubble-text">' + esc(truncate(m.text, 300)) + '</div></div></div>';
  } else if (m.type === 'question') {
    return '<div class="bubble-wrap fadein"><div class="bubble bubble-question">' + copyBtn +
      '<div class="bubble-label">Frage \u2192</div><div class="bubble-text">' + esc(truncate(m.text, 200)) + '</div></div></div>';
  } else {
    return '<div class="bubble-wrap fadein"><div class="bubble bubble-agent">' + copyBtn +
      '<div class="bubble-text">' + esc(truncate(m.text, 300)) + '</div></div></div>';
  }
}

function renderBubbleFull(m) {
  var copyBtn = '<button class="copy-btn" onclick="copyText(this)" title="Kopieren" aria-label="Text kopieren">\u2398</button>';
  if (m.from === 'coordinator') {
    return '<div class="bubble-wrap right"><div class="bubble bubble-coordinator">' + copyBtn +
      '<div class="bubble-label">Koordinator \u2192</div><div class="bubble-text">' + esc(m.text || '') + '</div></div></div>';
  } else if (m.type === 'message') {
    var labelF = m.targetAgent != null ? '\u2192 Agent ' + (m.targetAgent + 1) : (m.sourceAgent != null ? '\u2190 Agent ' + (m.sourceAgent + 1) : 'Nachricht');
    return '<div class="bubble-wrap"><div class="bubble bubble-message">' + copyBtn +
      '<div class="bubble-label">' + esc(labelF) + '</div><div class="bubble-text">' + esc(m.text || '') + '</div></div></div>';
  } else if (m.type === 'context') {
    return '<div class="bubble-wrap"><div class="bubble bubble-context">' + copyBtn +
      '<div class="bubble-label">Shared Context</div><div class="bubble-text">' + esc(m.text || '') + '</div></div></div>';
  } else if (m.type === 'question') {
    return '<div class="bubble-wrap"><div class="bubble bubble-question">' + copyBtn +
      '<div class="bubble-label">Frage \u2192</div><div class="bubble-text">' + esc(m.text || '') + '</div></div></div>';
  } else {
    return '<div class="bubble-wrap"><div class="bubble bubble-agent">' + copyBtn +
      '<div class="bubble-text">' + esc(m.text || '') + '</div></div></div>';
  }
}

function renderFileChanges(agent) {
  var changes = agent.fileChanges;
  if (!changes || changes.length === 0) {
    return '<div class="file-changes-section">' +
      '<div class="section-label">Dateien</div>' +
      '<div class="file-changes-empty">Keine Datei\u00E4nderungen erkannt.</div>' +
    '</div>';
  }
  var html = '<div class="file-changes-section">' +
    '<div class="section-label">Dateien (' + changes.length + ')</div>';
  changes.forEach(function(fc) {
    var isNew = fc.type === 'created';
    var cls = isNew ? 'file-change-new' : 'file-change-mod';
    var icon = isNew ? '\uD83C\uDD95' : '\u270F\uFE0F';
    var label = isNew ? 'Neu' : 'Ge\u00E4ndert';
    html += '<div class="file-change ' + cls + '">' +
      '<span class="file-change-icon" title="' + label + '">' + icon + '</span>' +
      '<span class="file-change-name">' + esc(fc.path) + '</span>' +
      '<span class="file-change-size">' + formatFileSize(fc.size) + '</span>' +
    '</div>';
  });
  html += '</div>';
  return html;
}

  if (!agent) return;
  closeModal();
  var conv = agent.conversation || [];
  var tl = agentTimeline[idx] || {};

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'agentModal';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');

  overlay.setAttribute('tabindex', '-1');
  overlay.onclick = function(e) { if (e.target === overlay) closeModal(); };

  // -- Header bauen --
  var headerHtml = '<div class="agent-fullview-header">' +
    '<div class="agent-fullview-header-left">' +
      '<div class="agent-fullview-num">Agent ' + esc(String(idx + 1)) + '</div>' +
      '<div class="agent-fullview-title-row">' +
        '<span class="agent-fullview-title">' + esc(agent.title || '\u2014') + '</span>' +
        (agent.role ? '<span class="agent-fullview-role">' + esc(agent.role) + '</span>' : '') +
        badge(agent.status || 'waiting') +
        (agent.score != null ? scoreBadge(agent.score) : '') +
      '</div>' +
      '<div class="agent-fullview-meta">' +
        '<span class="agent-fullview-meta-item">' + esc((agent.rounds || 0) + ' Runden') + '</span>' +
        '<span class="agent-fullview-meta-item">' + esc((agent.questions || 0) + ' Fragen') + '</span>' +
        (agent.duration != null ? '<span class="agent-fullview-meta-item">' + formatDuration(agent.duration) + '</span>' : '') +
        (agent.stats ? '<span class="agent-fullview-meta-item">' + (agent.stats.filesCreated || 0) + ' Dateien</span>' : '') +
        (agent.stats ? '<span class="agent-fullview-meta-item">' + (agent.stats.linesOfCode || 0) + ' Zeilen</span>' : '') +
      '</div>' +
      (agent.task ? '<div class="agent-fullview-task">' + esc(agent.task) + '</div>' : '') +
    '</div>' +
    '<div class="agent-fullview-header-right">' +
      '<button class="afv-copy-all" onclick="afvCopyTranscript(' + idx + ')" title="Gesamten Verlauf kopieren">Kopieren</button>' +
      '<button class="modal-close" aria-label="Dialog schlie\u00DFen" onclick="closeModal()" title="Schlie\u00DFen">\u00D7</button>' +
    '</div>' +
  '</div>';

  // -- Tabs --
  var tabsHtml = '<div class="agent-fullview-tabs">' +
    '<div class="modal-tabs" style="margin-bottom:0">' +
      '<button class="modal-tab active" data-afv-tab="verlauf" onclick="afvSwitchTab(this,' + idx + ')">Verlauf</button>' +
      '<button class="modal-tab" data-afv-tab="dateien" onclick="afvSwitchTab(this,' + idx + ')">Dateien</button>' +
      '<button class="modal-tab" data-afv-tab="statistik" onclick="afvSwitchTab(this,' + idx + ')">Statistik</button>' +
      '<button class="modal-tab" data-afv-tab="prompt-inspector" onclick="afvSwitchTab(this,' + idx + ')">Prompt-Inspector</button>' +

    '<div class="afv-search-bar">' +
      '<input class="afv-search-input" type="text" placeholder="Im Verlauf suchen\u2026" oninput="afvSearchConv(this.value,' + idx + ')" id="afvSearchInput">' +
      '<div class="afv-search-nav">' +
        '<button class="afv-search-nav-btn" onclick="afvSearchPrev()" title="Vorheriger Treffer">\u25B2</button>' +
        '<button class="afv-search-nav-btn" onclick="afvSearchNext()" title="N\u00E4chster Treffer">\u25BC</button>' +
      '</div>' +
      '<span class="afv-search-count" id="afvSearchCount"></span>' +
    '</div>' +
    '<div class="section-label">Vollst\u00E4ndiger Verlauf (' + conv.length + ' Nachrichten)</div>' +
    '<div class="afv-conv" id="afvConvContent">' + bubblesHtml + '</div>' +

    '<div class="section-label">Vom Agent erstellte Dateien</div>' +
    '<div class="afv-files-loading" id="afvFilesLoading">Dateien werden geladen\u2026</div>' +
    '<div class="afv-files-list" id="afvFilesList"></div>' +
