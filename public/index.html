<script>
// ── XSS Schutz ───────────────────────────────────────────────
// escapeHtml: Escaped &, <, >, ", ' fuer sicheres Einsetzen in HTML und Attribute
function escapeHtml(str) {
  var s = String(str == null ? '' : str);
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
// Kurzform-Alias (abwaertskompatibel)
function esc(s) { return escapeHtml(s); }

// ── Sichere DOM-Helper ──────────────────────────────────────────
// Erstellt ein Element mit Attributen, Klassen und optionalem Textinhalt
function createEl(tag, attrs, textContent) {
  var el = document.createElement(tag);
  if (attrs) {
    for (var key in attrs) {
      if (attrs.hasOwnProperty(key)) {
        if (key === 'className') el.className = attrs[key];
        else if (key.substring(0, 2) === 'on' && typeof attrs[key] === 'function') {
          el.addEventListener(key.substring(2), attrs[key]);
        }
        else el.setAttribute(key, attrs[key]);
      }
    }
  }
  if (textContent != null) el.textContent = textContent;
  return el;
}

// Setzt sicher den Textinhalt eines Elements (kein innerHTML noetig)
function safeText(el, text) {
  if (el) el.textContent = (text != null ? text : '');
}

// Leert ein Element sicher (entfernt alle Kind-Elemente)
function clearEl(el) {
  while (el && el.firstChild) el.removeChild(el.firstChild);
}

// Baut Badge/ScoreBadge-HTML sicher als DOM-Fragment
function badgeNode(status) {
  var temp = document.createElement('span');
  temp.innerHTML = badge(status);
  return temp.firstChild;
}
function scoreBadgeNode(score) {
  var temp = document.createElement('span');
  temp.innerHTML = scoreBadge(score);
  return temp.firstChild;
}

// ── State ────────────────────────────────────────────────────
let state = {
  phase: 'setup',
  projectTitle: '', projectSummary: '', projectDir: '',
  coordinator: { status: 'idle', summary: '', activeQuestion: null, log: [], interimReports: [], finalReport: null, adaptations: [] },
  agents: [],
  startedAt: null, completedAt: null, totalDuration: null,
  sharedContextBoard: [],
};
let sharedContextPanelOpen = false;
let sharedFiles = [];
let busy = false;
let lastPhase = 'setup';
let banners = []; // { id, type: 'warn'|'error', text }
let bannerIdCounter = 0;
let mergedFiles = null; // { files: [...], dir: '...' }
let projectHistory = [];
let templates = [];
let taskPresets = [];
let selectedTemplateId = null;
let templateTagFilter = ''; // aktiver Tag-Filter
let cachedRoles = []; // Cache fuer verfuegbare Rollen
let rolesLoaded = false;
let tplEditId = null; // ID des gerade bearbeiteten Templates (null = neues Template)
let milestones = [];
let selectedMilestoneId = null;
let milestoneEditorTasks = [];
let allDetailsExpanded = false;
let agentFilter = 'alle'; // 'alle' | 'aktiv' | 'fertig' | 'fehler'
let agentSearch = '';
let compareMode = false;
let compareSelected = []; // array of project IDs (max 2)
let bulkSelectMode = false;
let bulkSelected = new Set();
let historyView = (function() { try { var v = localStorage.getItem('historyView'); return (v === 'list' || v === 'calendar' || v === 'stats') ? v : 'list'; } catch(e) { return 'list'; } })();
let historyFilterPhase = 'alle';
let historyFilterScore = 'alle';
let historyFilterTime = 'alle';
let historySort = 'datum-desc';
let calendarMonth = new Date().getMonth();
let calendarYear = new Date().getFullYear();
let calendarPopupDay = null;
let analyticsData = null;
let projectTags = (function() { try { return JSON.parse(localStorage.getItem('projectTags') || '{}'); } catch(e) { return {}; } })();
let viewMode = (function() { try { var v = localStorage.getItem('dagViewMode'); return (v === 'cards' || v === 'timeline' || v === 'graph') ? v : 'cards'; } catch(e) { return 'cards'; } })();
let agentTimeline = {}; // Timeline tracking per agent
let _timelineTimer = null;
let activityFeedOpen = false;
let activityFilter = 'alle'; // 'alle' | 'agenten' | 'koordinator' | 'fehler'
let activityEntries = []; // { type, data, ts }
let projectQueue = []; // Queue items: { description, agentCount, requireApproval, queuedAt, position }
let recoveryData = null; // Crash-Recovery Daten

// ── API-Token Authentifizierung ─────────────────────────────
function getApiToken() {
  return localStorage.getItem('apiToken') || '';
}

function setApiToken(token) {
  if (token) {
    localStorage.setItem('apiToken', token);
  } else {
    localStorage.removeItem('apiToken');
  }
}

function authHeaders() {
  var token = getApiToken();
  var headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return headers;
}

function authHeadersNoBody() {
  var token = getApiToken();
  var headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return headers;
}

// Wrapper für fetch: bei 401 automatisch Banner anzeigen
function authFetch(url, options) {
  options = options || {};
  return fetch(url, options).then(function(r) {
    if (r.status === 401) {
      addBanner('error', 'Authentifizierung fehlgeschlagen. Bitte API-Token in den Einstellungen setzen.');
    }
    return r;
  });
}

// ── Dark Mode ────────────────────────────────────────────────
// Migration: alte 'darkMode' Einstellung uebernehmen
(function() {
  var old = localStorage.getItem('darkMode');
  if (old !== null && localStorage.getItem('theme') === null) {
    localStorage.setItem('theme', old === 'true' ? 'dark' : 'light');
    localStorage.removeItem('darkMode');
  }
})();

let darkMode = (function() {
  var saved = localStorage.getItem('theme');
  if (saved === 'dark') return true;
  if (saved === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
})();

function applyTheme() {
  document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  var _ttEl = document.getElementById('themeToggle');
  if (_ttEl) {
    _ttEl.setAttribute('aria-label', darkMode ? 'Zum hellen Modus wechseln' : 'Zum dunklen Modus wechseln');
    _ttEl.textContent = darkMode ? '\u2600\uFE0F' : '\uD83C\uDF19';
  }
}

function toggleDarkMode() {
  darkMode = !darkMode;
  localStorage.setItem('theme', darkMode ? 'dark' : 'light');
  applyTheme();
}

applyTheme();

// ── Benachrichtigungs-Einstellungen (localStorage) ───────────
let soundEnabled = localStorage.getItem('soundEnabled') === 'true';
let notificationsEnabled = localStorage.getItem('notificationsEnabled') === 'true';
let alertVolume = parseInt(localStorage.getItem('alertVolume') || '30', 10) / 100; // 0-1
let doNotDisturb = false; // "Nicht stoeren" Modus (temporaer, nicht gespeichert)
let _audioCtx = null; // Wiederverwendbarer AudioContext (Chrome Policy: nur bei User-Interaktion erstellen)

function _getAudioCtx() {
  if (!_audioCtx || _audioCtx.state === 'closed') {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (_audioCtx.state === 'suspended') { _audioCtx.resume(); }
  return _audioCtx;
}

function _initAudioCtxOnInteraction() {
  // AudioContext darf nur bei User-Interaktion erstellt werden (Chrome Policy)
  function _init() {
    _getAudioCtx();
    document.removeEventListener('click', _init);
    document.removeEventListener('keydown', _init);
  }
  document.addEventListener('click', _init, { once: true });
  document.addEventListener('keydown', _init, { once: true });
}
_initAudioCtxOnInteraction();

function applySoundToggle() {
  var _stEl = document.getElementById('soundToggle');
  if (!_stEl) return;
  _stEl.setAttribute('aria-label', soundEnabled ? 'Benachrichtigungston ausschalten' : 'Benachrichtigungston einschalten');
  _stEl.textContent = soundEnabled ? '\uD83D\uDD14' : '\uD83D\uDD15';
}

function applyDndToggle() {
  var _dndEl = document.getElementById('dndToggle');
  if (!_dndEl) return;
  _dndEl.setAttribute('aria-label', doNotDisturb ? 'Nicht-St\u00F6ren deaktivieren' : 'Nicht-St\u00F6ren aktivieren');
  _dndEl.textContent = doNotDisturb ? '\uD83D\uDD15' : '\uD83C\uDF19';
  _dndEl.title = doNotDisturb ? 'Nicht st\u00F6ren (aktiv) \u2013 klicken zum Deaktivieren' : 'Nicht st\u00F6ren aktivieren';
  _dndEl.style.background = doNotDisturb ? 'var(--amber-bg)' : '';
  _dndEl.style.borderColor = doNotDisturb ? 'var(--amber)' : '';
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem('soundEnabled', String(soundEnabled));
  applySoundToggle();
  if (soundEnabled) requestNotificationPermission();
}

function toggleDoNotDisturb() {
  doNotDisturb = !doNotDisturb;
  applyDndToggle();
}

// ── Sound Notifications (Web Audio API) ──────────────────────
// Erfolg-Sound: aufsteigender Doppelton C5 (523Hz) → E5 (659Hz), je 100ms
function playSuccessBeep() {
  if (!soundEnabled || doNotDisturb) return;
  try {
    var ctx = _getAudioCtx();
    if (!ctx) return;
    var vol = alertVolume;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    gain.gain.setValueAtTime(vol * 0.5, ctx.currentTime);
    // C5 fuer 100ms
    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
    // E5 fuer 100ms
    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(vol * 0.5, ctx.currentTime + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.25);
  } catch (e) { /* Web Audio not available */ }
}

// Fehler-Sound: absteigender Ton A4 (440Hz) → D4 (293Hz), 200ms
function playErrorBeep() {
  if (!soundEnabled || doNotDisturb) return;
  try {
    var ctx = _getAudioCtx();
    if (!ctx) return;
    var vol = alertVolume;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    gain.gain.setValueAtTime(vol * 0.5, ctx.currentTime);
    osc.frequency.setValueAtTime(440, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(293.66, ctx.currentTime + 0.2);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.25);
  } catch (e) { /* Web Audio not available */ }
}

// Frage-Sound: einzelner Ping G5 (784Hz), 150ms
function playQuestionPing() {
  if (!soundEnabled || doNotDisturb) return;
  try {
    var ctx = _getAudioCtx();
    if (!ctx) return;
    var vol = alertVolume;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(783.99, ctx.currentTime);
    gain.gain.setValueAtTime(vol * 0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
  } catch (e) { /* Web Audio not available */ }
}

applySoundToggle();
applyDndToggle();

// ── Browser Notifications (Notification API) ─────────────────
function requestNotificationPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function showNotification(title, body) {
  if (doNotDisturb) return;
  if (!notificationsEnabled) return;
  // Nur anzeigen wenn Seite nicht sichtbar
  if (!document.hidden) return;
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  try {
    var n = new Notification(title, {
      body: body,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">\uD83E\uDD16</text></svg>',
      tag: 'orchestrator-' + Date.now()
    });
    n.onclick = function() {
      window.focus();
      n.close();
    };
    setTimeout(function() { n.close(); }, 8000);
  } catch (e) { /* Notification failed */ }
}

// ── Dual-Mode Connection: WebSocket (primaer) + SSE (Fallback) ─
let es;
let wsConn;
let reconnectAttempts = 0;
let connectionMode = null; // 'ws' | 'sse' | null

function updateConnBar(status, attempt) {
  var bar = document.getElementById('connBar');
  bar.className = 'conn-bar';
  if (status === 'online') {
    bar.classList.add('online');
    bar.classList.remove('visible');
  } else if (status === 'reconnecting') {
    bar.textContent = 'Verbindung wird wiederhergestellt (' + attempt + '/10)\u2026';
    bar.classList.add('reconnecting', 'visible');
  } else if (status === 'offline') {
    bar.textContent = 'Verbindung verloren \u2013 l\u00E4uft server.js?';
    bar.classList.add('offline', 'visible');
  }
}

function updateConnBadge(mode) {
  var badge = document.getElementById('connBadge');
  if (!badge) return;
  badge.className = 'conn-badge';
  if (mode === 'ws') { badge.textContent = 'WS'; badge.classList.add('ws'); badge.title = 'Verbunden via WebSocket'; }
  else if (mode === 'sse') { badge.textContent = 'SSE'; badge.classList.add('sse'); badge.title = 'Verbunden via Server-Sent Events'; }
  else { badge.textContent = '--'; badge.classList.add('offline'); badge.title = 'Nicht verbunden'; }
}

var _eventHandlers = {};
function registerEventHandler(name, fn) { if (!_eventHandlers[name]) _eventHandlers[name] = []; _eventHandlers[name].push(fn); }
function dispatchConnectionEvent(eventName, data) { var h = _eventHandlers[eventName]; if (h) { for (var i = 0; i < h.length; i++) { try { h[i](data); } catch (ex) {} } } }

function connectWs() {
  try {
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    wsConn = new WebSocket(protocol + '//' + location.host + '/ws');
  } catch (e) { connectSse(); return; }
  wsConn.onopen = function() { connectionMode = 'ws'; reconnectAttempts = 0; updateConnBar('online'); updateConnBadge('ws'); };
  wsConn.onmessage = function(e) { try { var m = JSON.parse(e.data); if (m.event && m.data !== undefined) dispatchConnectionEvent(m.event, m.data); } catch (ex) {} };
  wsConn.onclose = function() {
    wsConn = null;
    if (connectionMode === 'ws') {
      connectionMode = null; updateConnBadge(null);
      if (reconnectAttempts < 10) { reconnectAttempts++; updateConnBar('reconnecting', reconnectAttempts); setTimeout(connectWs, Math.min(1000 * Math.pow(1.5, reconnectAttempts), 30000)); }
      else { reconnectAttempts = 0; connectSse(); }
    }
  };
  wsConn.onerror = function() { if (connectionMode === null && reconnectAttempts === 0) { wsConn = null; connectSse(); } };
}

function connectSse() {
  if (es) es.close();
  es = new EventSource('/api/stream');
  es.onopen = function() { connectionMode = 'sse'; reconnectAttempts = 0; updateConnBar('online'); updateConnBadge('sse'); };
  es.onerror = function() {
    if (es.readyState === EventSource.CLOSED && reconnectAttempts < 10) { reconnectAttempts++; updateConnBar('reconnecting', reconnectAttempts); setTimeout(connectSse, Math.min(1000 * Math.pow(1.5, reconnectAttempts), 30000)); }
    else if (reconnectAttempts >= 10) { connectionMode = null; updateConnBar('offline'); updateConnBadge(null); }
  };
  var sseEvents = ['state','phase','coordinator','project_meta','agent','agents_updated','activity','queue_updated','agent_stream','agent_typing','agent_msg','agent_message','rate_limit','auto_retry','agent_intervention_applied','error','merge_complete','merge-start','merge-complete','reconnect_recovery','coordinator-interim','plan-adapted','budget_warning','budget_exceeded','shared_context_update','shared_file','progress-update','project-eta'];
  sseEvents.forEach(function(evt) { es.addEventListener(evt, function(e) { try { dispatchConnectionEvent(evt, JSON.parse(e.data)); } catch (ex) {} }); });
}

function connect() {
  if (typeof WebSocket !== 'undefined') { connectWs(); } else { connectSse(); }
}

// ── Event-Handler registrieren (gemeinsam fuer WS und SSE) ──
registerEventHandler('state', function(d) {
    applyState(d);
    render();
  });

registerEventHandler('phase', function(d) {
    state.phase = d.phase;
    if (d.startedAt) state.startedAt = d.startedAt;
    if (d.totalDuration != null) { state.totalDuration = d.totalDuration; state.completedAt = Date.now(); }
    if (d.phase === 'running') { startElapsedTimer(); startEtaCountdown(); if (viewMode === 'timeline') startTimelineTimer(); if (fileTreeOpen) startFileTreePolling(); }
    if (d.phase === 'awaiting_approval') { stopElapsedTimer(); stopEtaCountdown(); }
    if (d.phase === 'complete' || d.phase === 'error' || d.phase === 'partial') { stopElapsedTimer(); stopEtaCountdown(); stopTimelineTimer(); if (viewMode === 'timeline') updateTimelineView(); if (viewMode === 'graph') updateGraphView(); if (fileTreeOpen) loadFileTree(); }
    // Partial: fehlgeschlagene Agenten merken
    if (d.phase === 'partial' && d.failedAgents) {
      state._failedAgents = d.failedAgents;
      state._successCount = d.successCount;
      state._failedCount = d.failedCount;
    }
    // Projekt-Score aus Phase-Event übernehmen
    if (d.projectScore != null) state.projectScore = d.projectScore;
    // Barrierefreiheit: Phasenwechsel ansagen
    announcePhase(d.phase);
    // Notifications + Sounds
    if (d.phase === 'complete') {
      var agentCount = (state.agents || []).length;
      var projName = state.projectTitle || 'Projekt';
      var scoreText = (state.projectScore != null) ? ' Score: ' + state.projectScore + '/100' : '';
      showNotification('Projekt fertig!' + scoreText, projName + ' \u2013 Alle ' + agentCount + ' Agenten fertig.');
      playSuccessBeep();
    }
    if (d.phase === 'partial') {
      var projName2 = state.projectTitle || 'Projekt';
      showNotification(projName2, (d.successCount || '?') + ' von ' + ((d.successCount || 0) + (d.failedCount || 0)) + ' Agenten erfolgreich.');
      playErrorBeep();
    }
    if (d.phase === 'error') {
      showNotification(state.projectTitle || 'Projekt', 'Ein Fehler ist aufgetreten.');
      playErrorBeep();
    }
    render();
  });

registerEventHandler('coordinator', function(d) {
    state.coordinator = d;
    updateCoordinator();
  });

registerEventHandler('coordinator-interim', function(d) {
    if (!state.coordinator.interimReports) state.coordinator.interimReports = [];
    state.coordinator.interimReports.push(d);
    updateCoordinator();
  });

registerEventHandler('plan-adapted', function(d) {
    if (!state.coordinator.adaptations) state.coordinator.adaptations = [];
    state.coordinator.adaptations.push(d);
    updateCoordinator();
  });

registerEventHandler('project_meta', function(d) {
    state.projectTitle = d.title;
    state.projectSummary = d.summary;
    state.projectDir = d.dir;
    updateProjectHeader();
  });

registerEventHandler('agent', function(d) {
    var data = d;
    var idx = data.index;
    var agent = data.agent;
    var prevStatus = state.agents[idx] ? state.agents[idx].status : null;
    if (state.agents[idx]) {
      state.agents[idx] = Object.assign({}, state.agents[idx], agent);
      // preserve conversation if not in update
      if (!agent.conversation && state.agents[idx].conversation) {
        // keep existing
      }
    }
    // Notifications for status changes
    if (agent.status && agent.status !== prevStatus) {
      var agentLabel = 'Agent ' + (idx + 1);
      var agentTitle = agent.title || (state.agents[idx] && state.agents[idx].title) || '';
      var projName = state.projectTitle || 'Projekt';
      if (agent.status === 'error') {
        showNotification('Agent ' + (idx + 1) + ' fehlgeschlagen', agentTitle ? agentLabel + ': ' + agentTitle : agentLabel + ' ist fehlgeschlagen.');
        playErrorBeep();
      }
      if (agent.status === 'asking') {
        showNotification('Agent ' + (idx + 1) + ' braucht Hilfe', agentLabel + ' hat eine Frage an den Koordinator.');
        playQuestionPing();
      }
    }
    // Timeline tracking
    trackAgentTimeline(idx, agent, prevStatus);
    updateAgent(idx);
    updateProgressBar();
    if (viewMode === 'timeline') updateTimelineView();
    if (viewMode === 'graph') updateGraphView();
  });

registerEventHandler('agents_updated', function(d) {
    state.agents = d.agents || [];
    initTimelineFromState();
    render();
  });

registerEventHandler('activity', function(d) {
    var entry = d;
    activityEntries.push(entry);
    if (activityEntries.length > 200) activityEntries.shift();
    if (activityFeedOpen) renderActivityFeed();
  });

registerEventHandler('queue_updated', function(d) {
    projectQueue = d.items || [];
    updateQueueDisplay();
    updateQueueBadge();
  });

registerEventHandler('agent_stream', function(d) {
    var data = d;
    var index = data.index;
    var chunk = data.chunk;
    // Server sendet bereits den vollstaendigen liveOutput (letzte 2000 Zeichen)
    _streamBuffers[index] = chunk;
    // Nur alle 500ms ins DOM schreiben (max 2 Updates/s)
    if (!_streamTimers[index]) {
      _streamTimers[index] = setTimeout(function() { _flushStreamBuffer(index); }, _STREAM_THROTTLE);
    }
  });

registerEventHandler('agent_typing', function(d) {
    var agentIndex = d.agentIndex;
    var isTyping = d.isTyping;
    _agentTyping[agentIndex] = isTyping;

    // Typing-Indikator auf Agent-Karte aktualisieren
    var card = document.querySelector('[data-agent="' + agentIndex + '"]');
    if (card) {
      var existing = card.querySelector('.typing-indicator');
      if (isTyping && !existing) {
        var indicator = document.createElement('div');
        indicator.className = 'typing-indicator';
        indicator.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
        var convEl = card.querySelector('.agent-conv');
        if (convEl) convEl.parentNode.insertBefore(indicator, convEl);
      } else if (!isTyping && existing) {
        existing.remove();
        // Live-Preview entfernen wenn Agent fertig
        var preview = card.querySelector('.live-preview');
        if (preview) preview.remove();
      }
    }

    // Modal: Live-Badge und Stream-Element aktualisieren
    var modal = document.getElementById('agentModal');
    if (modal && modal._agentIdx === agentIndex) {
      var headerLeft = modal.querySelector('.agent-fullview-header-left');
      if (headerLeft) {
        var liveBadge = headerLeft.querySelector('.live-badge');
        if (isTyping && !liveBadge) {
          var lb = document.createElement('span');
          lb.className = 'live-badge';
          lb.textContent = 'Live';
          var titleRow = headerLeft.querySelector('.agent-fullview-title-row');
          if (titleRow) titleRow.appendChild(lb);
        } else if (!isTyping && liveBadge) {
          liveBadge.remove();
          // Live-Stream-Element entfernen
          var liveEl = document.getElementById('afvLiveStream');
          if (liveEl) liveEl.remove();
        }
      }
    }

    // Stream-Buffer aufräumen wenn Agent fertig
    if (!isTyping) {
      delete _streamBuffers[agentIndex];
      if (_streamTimers[agentIndex]) {
        clearTimeout(_streamTimers[agentIndex]);
        delete _streamTimers[agentIndex];
      }
    }
  });

registerEventHandler('agent_msg', function(d) {
    var data = d;
    var idx = data.index;
    var msg = data.msg;
    // Remove streaming bubble when final message arrives
    var oldStream = document.querySelector('[data-agent="' + idx + '"] .bubble-streaming');
    if (oldStream) oldStream.closest('.bubble-wrap').remove();
    if (state.agents[idx]) {
      state.agents[idx].conversation.push(msg);
      // RAM begrenzen: max 100 Messages pro Agent im Frontend
      if (state.agents[idx].conversation.length > 100) {
        state.agents[idx].conversation = state.agents[idx].conversation.slice(-100);
      }
    }
    appendMessage(idx, msg);
  });

registerEventHandler('agent_message', function(d) {
    var data = d;
    var from = data.from;
    var to = data.to;
    var text = data.text;
    // Nachricht beim Ziel-Agenten als eingehende Nachricht anzeigen
    var inMsg = { from: 'message', text: 'Von Agent ' + (from + 1) + ': ' + text, type: 'message', sourceAgent: from };
    if (state.agents[to]) {
      state.agents[to].conversation.push(inMsg);
    }
    appendMessage(to, inMsg);
  });

registerEventHandler('shared_context_update', function(d) {
    if (!state.sharedContextBoard) state.sharedContextBoard = [];
    state.sharedContextBoard.push(d);
    if (state.sharedContextBoard.length > 200) state.sharedContextBoard = state.sharedContextBoard.slice(-200);
    if (sharedContextPanelOpen) renderSharedContextPanel();
  });

registerEventHandler('shared_file', function(d) {
    sharedFiles.push({ agentIndex: d.agentIndex, fileName: d.fileName, timestamp: Date.now() });
    if (sharedContextPanelOpen) renderSharedContextPanel();
  });

      state.agents[idx].etaSeconds = d.eta;
      state.agents[idx].progress = d.percent;
      state.agents[idx]._roundsLeft = d.roundsLeft;

registerEventHandler('project-eta', function(d) {
    state._projectEta = d.eta;
    state._projectPercent = d.percent;
    state._activeAgentsCount = d.activeAgents;
    state._doneAgentsCount = d.doneAgents;

registerEventHandler('rate_limit', function(d) {
    var text = 'Claude API \u00FCberlastet, warte ' + (d.waitSeconds || '?') + 's\u2026 (Versuch ' + (d.attempt || '?') + '/' + (d.maxAttempts || 5) + ')';
    addBanner('warn', text);
  });

registerEventHandler('auto_retry', function(d) {
    var agentNum = (d.index != null ? d.index + 1 : '?');
    var text = 'Agent ' + agentNum + ' fehlgeschlagen. Automatischer Neuversuch in 10s\u2026 (Grund: ' + (d.reason || 'Unbekannt') + ')';
    addBanner('warn', text);
    // Update agent status in state
    if (d.index != null && state.agents[d.index]) {
      state.agents[d.index].status = 'retrying';

registerEventHandler('agent_intervention_applied', function(d) {
    var idx = d.index != null ? d.index : d.agentIndex;
    if (idx != null) {
      _interventionPending[idx] = false;
      _interventionFormOpen[idx] = false;
      // Update badge to remove "Intervention wartend"
      var card = document.querySelector('[data-agent="' + idx + '"]');
      if (card) {
        var badgeEl = card.querySelector('.agent-badge');
        var agent = state.agents[idx];
        if (badgeEl && agent) {
          clearEl(badgeEl);
          if (agent.score != null) badgeEl.appendChild(scoreBadgeNode(agent.score));
          badgeEl.appendChild(badgeNode(agent.status || 'working'));
        }
      }
    }
  });

registerEventHandler('auto_intervention_warning', function(d) {
    var agentNum = d.agentNum || (d.agentIndex != null ? d.agentIndex + 1 : '?');
    var reason = d.reason === 'repeated_output' ? 'wiederholt sich' : 'hat ' + (d.round || '?') + ' Runden ohne FERTIG';
    addBanner('warn', 'Agent ' + agentNum + ' ' + reason + '. Intervention empfohlen.');
  });

registerEventHandler('error', function(d) {
    if (d && d.message) {
      addBanner('error', d.message);
    }
  });

registerEventHandler('merge_complete', function(d) {
    mergedFiles = d;
    render();
  });

registerEventHandler('merge-start', function(d) {
    addBanner('info', 'Merge gestartet (Strategie: ' + (d && d.strategy || 'latest') + ')...');
  });

registerEventHandler('merge-complete', function(d) {
    if (d && d.error) {
      addBanner('error', 'Merge fehlgeschlagen: ' + d.error);
    } else if (d) {
      var msg = 'Merge abgeschlossen: ' + (d.totalFiles || 0) + ' Dateien';
      if (d.conflicts > 0) msg += ', ' + d.conflicts + ' Konflikte';
      msg += ' (Strategie: ' + (d.strategy || 'latest') + ')';
      addBanner('ok', msg);
      loadMergedFiles();
    }
  });

registerEventHandler('budget_warning', function(d) {
    if (d && d.message) {
      addBanner('warn', d.message);
    }
    if (state.budget) { state.budget.warned = true; }
    updateBudgetDisplay();
  });

registerEventHandler('budget_exceeded', function(d) {
    if (d && d.message) {
      addBanner('error', d.message);
    }
    if (state.budget) { state.budget.exceeded = true; }
    updateBudgetDisplay();
  });

function applyState(s) {
  state.phase = s.phase || 'idle';
  state.coordinator = s.coordinator || state.coordinator;
  state.agents = s.agents || [];
  state.projectTitle = s.projectTitle || '';
  state.projectSummary = s.projectSummary || '';
  state.projectDir = s.projectDir || '';
  state.startedAt = s.startedAt || null;
  state.completedAt = s.completedAt || null;
  state.totalDuration = s.totalDuration || null;
  state.tasks = s.tasks || [];
  state.projectStats = s.projectStats || null;
  state.projectScore = s.projectScore || null;
  state.totalTokenUsage = s.totalTokenUsage || null;
  state.budget = s.budget || null;
  state.sharedContextBoard = s.sharedContextBoard || [];
  // Restore activity log from state
  if (s.activityLog && Array.isArray(s.activityLog)) {
    activityEntries = s.activityLog.slice();
  }
  // Initialize timeline tracking from restored state
  initTimelineFromState();
}

// ── Banner Management ────────────────────────────────────────
function addBanner(type, text) {
  var id = ++bannerIdCounter;
  banners.push({ id: id, type: type, text: text });
  // auto-dismiss warn after 15s
  if (type === 'warn') {
    setTimeout(function() { dismissBanner(id); }, 15000);
  }
  renderBanners();
}

function dismissBanner(id) {
  banners = banners.filter(function(b) { return b.id !== id; });
  renderBanners();
}

function renderBanners() {
  var container = document.getElementById('bannerArea');
  if (!container) return;
  // Sicher: Banner-Texte ueber textContent statt innerHTML
  clearEl(container);
  banners.forEach(function(b) {
    var cls = b.type === 'warn' ? 'banner-warn' : 'banner-error';
    var bannerDiv = createEl('div', { className: 'banner ' + cls, role: 'alert' });
    bannerDiv.appendChild(createEl('span', {}, b.text));
    var dismissBtn = createEl('button', { className: 'dismiss', 'aria-label': 'Meldung schlie\u00DFen' }, '\u00D7');
    (function(id) { dismissBtn.addEventListener('click', function() { dismissBanner(id); }); })(b.id);
    bannerDiv.appendChild(dismissBtn);
    container.appendChild(bannerDiv);
  });
}

// ── Badge helper ─────────────────────────────────────────────
var BADGE_MAP = {
  idle:     ['Bereit',    false],
  planning: ['Plant\u2026',   true],
  ready:    ['Bereit',   false],
  thinking: ['Denkt\u2026',  true],
  awaiting_approval: ['Pr\u00FCfung', false],
  waiting:  ['Wartend',  false],
  working:  ['Arbeitet', true],
  asking:   ['Fragt\u2026',   true],
  retrying: ['Retry\u2026',  true],
  done:     ['Fertig',   false],
  waiting_deps: ['Wartet\u2026', true],
  error:    ['Fehler',   false],
  skipped:  ['\u00dcbersprungen', false],
  partial:  ['Teilweise', false],
  complete: ['Fertig',   false],
  summarizing: ['Zusammenfassung\u2026', true],
  interim_report: ['Zwischenbericht\u2026', true],
  adapting: ['Passt Plan an\u2026', true]
};

function badge(s) {
  var key = BADGE_MAP[s] ? s : 'idle';
  var entry = BADGE_MAP[key];
  var label = entry[0], spinning = entry[1];
  var indicator = spinning
    ? '<span class="spinner spin" aria-hidden="true"></span>'
    : '<span class="dot" aria-hidden="true"></span>';
  var info = STATUS_EXPLANATIONS[key] || '';
  var infoAttr = info ? ' data-status-info="' + esc(info) + '" onmouseenter="showStatusTooltip(event)" onmouseleave="hideStatusTooltip(event)"' : '';
  return '<span class="badge badge-' + key + '"' + infoAttr + ' role="status">' + indicator + esc(label) + '</span>';
}

function scoreBadge(score) {
  if (score == null) return '';
  var cls = score > 80 ? 'score-green' : score >= 50 ? 'score-amber' : 'score-red';
  return '<span class="score-badge ' + cls + '" title="Qualit\u00E4ts-Score: ' + score + '/100">' + score + '</span>';
}

function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + '\u2026' : (s || ''); }

// -- Zeitformatierung --
function formatDuration(seconds) {
  if (seconds == null) return '';
  seconds = Math.round(seconds);
  if (seconds < 60) return seconds + 's';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm ' + (seconds % 60) + 's';
  var h = Math.floor(seconds / 3600);
  var m = Math.floor((seconds % 3600) / 60);
  return h + 'h ' + m + 'm';
}

function formatEta(seconds) {
  if (seconds == null || seconds <= 0) return '';
  seconds = Math.round(seconds);
  if (seconds < 10) return 'Gleich fertig';
  if (seconds < 60) return '~' + seconds + ' Sek verbleibend';
  if (seconds < 3600) { var em = Math.ceil(seconds / 60); return '~' + em + ' Min verbleibend'; }
  var eh = Math.floor(seconds / 3600); var em2 = Math.ceil((seconds % 3600) / 60);
  return '~' + eh + 'h ' + em2 + 'm verbleibend';
}
function progressColorClass(pct) {
  if (pct >= 100) return 'p-done'; if (pct >= 60) return 'p-high'; if (pct >= 30) return 'p-mid'; return 'p-low';
}
function updateAgentEta(idx) {
  var agent = state.agents[idx]; if (!agent) return;
  var etaEl = document.getElementById('agentEta-' + idx);
  if (etaEl) {
    var isAct = agent.status === 'working' || agent.status === 'asking' || agent.status === 'retrying';
    var etaT = isAct && agent.etaSeconds > 0 ? formatEta(agent.etaSeconds) : '';
    var rlT = isAct && agent._roundsLeft > 0 ? agent._roundsLeft + ' Runde' + (agent._roundsLeft > 1 ? 'n' : '') + ' verbl.' : '';
    etaEl.innerHTML = (etaT ? '<span class="agent-eta-countdown">' + esc(etaT) + '</span>' : '') + (rlT ? '<span>' + esc(rlT) + '</span>' : '');
  }
  var fillEl = document.getElementById('agentProgressFill-' + idx);
  if (fillEl) { fillEl.style.width = (agent.progress || 0) + '%'; fillEl.className = 'agent-progress-fill ' + progressColorClass(agent.progress || 0); }
}
function updateProjectEta() {
  var etaEl = document.getElementById('projectEtaText');
  var fillEl = document.getElementById('projectEtaFill');
  var pctEl = document.getElementById('projectEtaPct');
  if (etaEl && state._projectEta != null) { etaEl.textContent = state._projectEta > 0 ? 'Geschaetzte Restzeit: ' + formatEta(state._projectEta).replace(/^~/, '') : 'Berechne...'; }
  if (fillEl && state._projectPercent != null) fillEl.style.width = state._projectPercent + '%';
  if (pctEl && state._projectPercent != null) pctEl.textContent = state._projectPercent + '%';
}
var _etaCountdownTimer = null;
function startEtaCountdown() {
  if (_etaCountdownTimer) return;
  _etaCountdownTimer = setInterval(function() {
    var ags = state.agents || [];
    for (var ei = 0; ei < ags.length; ei++) {
      var ea = ags[ei];
      if (ea && ea.etaSeconds > 0 && (ea.status === 'working' || ea.status === 'asking' || ea.status === 'retrying')) { ea.etaSeconds = Math.max(0, ea.etaSeconds - 1); updateAgentEta(ei); }
    }
    if (state._projectEta > 0) { state._projectEta = Math.max(0, state._projectEta - 1); updateProjectEta(); }
  }, 1000);
}
function stopEtaCountdown() { if (_etaCountdownTimer) { clearInterval(_etaCountdownTimer); _etaCountdownTimer = null; } }

function formatTokens(n) {
  if (n == null || n === 0) return '0';
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

function formatCost(c) {
  if (c == null || c === 0) return '$0.00';
  if (c < 0.01) return '<$0.01';
  return '$' + c.toFixed(2);
}

function getTokenUsageTotals() {
  var agents = state.agents || [];
  var coord = state.coordinator || {};
  var coordTu = coord.tokenUsage || { inputTokens: 0, outputTokens: 0, totalTokens: 0, estimatedCost: 0 };
  var totalInput = coordTu.inputTokens || 0;
  var totalOutput = coordTu.outputTokens || 0;
  var totalCost = coordTu.estimatedCost || 0;
  for (var i = 0; i < agents.length; i++) {
    var tu = agents[i].tokenUsage;
    if (tu) {
      totalInput += tu.inputTokens || 0;
      totalOutput += tu.outputTokens || 0;
      totalCost += tu.estimatedCost || 0;
    }
  }
  if (state.totalTokenUsage && state.totalTokenUsage.totalTokens > 0) {
    return state.totalTokenUsage;
  }
  return { inputTokens: totalInput, outputTokens: totalOutput, totalTokens: totalInput + totalOutput, estimatedCost: totalCost };
}

function toggleTokenPanel() {

    '</tr></thead><tbody>';

    '<td>&mdash;</td><td>Koordinator</td>' +

  for (var i = 0; i < agents.length; i++) {
    var a = agents[i];

    html += '<tr>' +
      '<td>' + esc(String(i + 1)) + '</td>' +
      '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(a.title || a.role || 'Agent ' + (i + 1)) + '</td>' +
      '<td class="token-num">' + esc(formatTokens(tu.inputTokens)) + '</td>' +
      '<td class="token-num">' + esc(formatTokens(tu.outputTokens)) + '</td>' +
      '<td class="token-num">' + esc(formatTokens((tu.inputTokens || 0) + (tu.outputTokens || 0))) + '</td>' +
      '<td class="token-cost-cell">' + esc(formatCost(tu.estimatedCost)) + '</td>' +

  }

  html += '<tr class="token-row-total">' +
    '<td></td><td>Gesamt</td>' +

    '<td class="token-num">' + esc(formatTokens(totals.outputTokens)) + '</td>' +
    '<td class="token-num">' + esc(formatTokens(totals.totalTokens)) + '</td>' +
    '<td class="token-cost-cell">' + esc(formatCost(totals.estimatedCost)) + '</td>' +
    '</tr>';

  html += '</tbody></table>';

  if (totals.totalTokens > 0) {
    html += '<div class="token-bar-stack">';
    var coordTotal = (coordTu.inputTokens || 0) + (coordTu.outputTokens || 0);
    if (coordTotal > 0) {
      var coordPct = (coordTotal / totals.totalTokens * 100).toFixed(1);
      html += '<div class="token-bar-segment" style="width:' + coordPct + '%;background:var(--blue)" title="Koordinator: ' + esc(formatTokens(coordTotal)) + ' (' + coordPct + '%)"></div>';
    }
    for (var j = 0; j < agents.length; j++) {
      var atu = agents[j].tokenUsage;
      var agentTotal = atu ? ((atu.inputTokens || 0) + (atu.outputTokens || 0)) : 0;
      if (agentTotal > 0) {
        var agentPct = (agentTotal / totals.totalTokens * 100).toFixed(1);
        var color = _tokenBarColors[j % _tokenBarColors.length];
        html += '<div class="token-bar-segment" style="width:' + agentPct + '%;background:' + color + '" title="Agent ' + (j + 1) + ': ' + esc(formatTokens(agentTotal)) + ' (' + agentPct + '%)"></div>';
      }

    html += '</div>';
    html += '<div class="token-bar-legend">';
    if (coordTotal > 0) {
      html += '<div class="token-bar-legend-item"><span class="token-bar-legend-dot" style="background:var(--blue)"></span>Koordinator</div>';

// ── Budget-Anzeige ────────────────────────────────────────────
function renderBudgetBar() {
  var budget = state.budget;
  var totals = getTokenUsageTotals();
  if (!budget || !budget.maxTokenBudget || budget.maxTokenBudget <= 0) {
    // Kein Budget gesetzt: nur Kosten anzeigen wenn Tokens vorhanden
    if (totals.totalTokens > 0) {
      return '<div class="budget-bar-wrap" id="budgetBarWrap">' +
        '<div class="budget-bar-header">' +
          '<span class="budget-bar-label">Kein Token-Budget gesetzt</span>' +
          '<span class="budget-cost">' + esc(formatCost(totals.estimatedCost)) + '</span>' +
        '</div>' +
      '</div>';
    }
    return '';
  }
  var max = budget.maxTokenBudget;
  var total = totals.totalTokens;
  var percent = Math.min(100, Math.round(total / max * 100));
  var colorClass = percent < 70 ? 'green' : (percent < 90 ? 'yellow' : 'red');
  var html = '<div class="budget-bar-wrap" id="budgetBarWrap">' +
    '<div class="budget-bar-header">' +
      '<span class="budget-bar-label">Token-Budget</span>' +
      '<span class="budget-bar-value">' + esc(formatTokens(total)) + ' / ' + esc(formatTokens(max)) + ' (' + percent + '%)</span>' +
    '</div>' +
    '<div class="budget-bar"><div class="budget-bar-fill ' + colorClass + '" style="width:' + percent + '%"></div></div>' +
    '<div class="budget-cost">Gesch. Kosten: ' + esc(formatCost(totals.estimatedCost)) + '</div>';
  if (budget.exceeded) {
    html += '<div class="budget-exceeded-banner">Budget \u00FCberschritten \u2013 neue Agenten werden gestoppt</div>';
  } else if (budget.warned) {
    html += '<div class="budget-warning-banner">Warnschwelle erreicht (' + esc(formatTokens(budget.warnTokenBudget)) + ' Tokens)</div>';
  }
  html += '</div>';
  return html;
}

function updateBudgetDisplay() {
  var el = document.getElementById('budgetBarWrap');
  if (el) {
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = renderBudgetBar();
    var newEl = tempDiv.querySelector('.budget-bar-wrap');
    if (newEl) {
      el.parentNode.replaceChild(newEl, el);
    }

}

function renderAgentTokenInfo(agent) {

  return '<span class="agent-token-info">' +
    '<span class="at-label">In:</span><span class="at-val">' + esc(formatTokens(tu.inputTokens)) + '</span>' +

function getElapsedSeconds() {
  if (!state.startedAt) return null;
  if (state.completedAt) return Math.round((state.completedAt - state.startedAt) / 1000);
  return Math.round((Date.now() - state.startedAt) / 1000);
}

var elapsedTimer = null;
function startElapsedTimer() {
  if (elapsedTimer) return;
  elapsedTimer = setInterval(function() {
    var el = document.getElementById('elapsedTime');
    if (el && state.startedAt && !state.completedAt) {
      el.textContent = formatDuration(getElapsedSeconds());
    }
  }, 1000);
}
function stopElapsedTimer() {
  if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
}

// ── Copy Button ──────────────────────────────────────────────
function copyText(btn) {
  var bubble = btn.closest('.bubble');
  var textEl = bubble.querySelector('.bubble-text');
  var text = textEl ? textEl.textContent : bubble.textContent;
  navigator.clipboard.writeText(text).then(function() {
    btn.textContent = '\u2713';
    setTimeout(function() { btn.textContent = '\u2398'; }, 1500);
  });
}

// ── Render (Full) ────────────────────────────────────────────
function render() {
  var app = document.getElementById('app');
  if (state.phase === 'setup' || state.phase === 'idle') {
    app.innerHTML = renderSetup();
    var descTA = document.getElementById('desc');
    if (descTA) descTA.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); startProject(); }
    });
    loadHistory();
    updateQueueBadge();
  } else if (state.phase === 'awaiting_approval') {
    app.innerHTML = renderApproval();
  } else {
    app.innerHTML = renderDashboard();
    renderBanners();
    scrollConvos();
    if (sharedContextPanelOpen) renderSharedContextPanel();
    if (activityFeedOpen) renderActivityFeed();
    if (fileTreeOpen && fileTreeLastData) renderFileTree(fileTreeLastData);
    if (viewMode === 'graph') setTimeout(initDagInteraction, 50);
    if (state.phase === 'running') { startElapsedTimer(); startEtaCountdown(); }
    else { stopElapsedTimer(); stopEtaCountdown(); }
  }
  lastPhase = state.phase;
}

function scrollConvos() {
  document.querySelectorAll('.agent-conv').forEach(function(el) { el.scrollTop = el.scrollHeight; });
}

// ── Incremental Updates ──────────────────────────────────────
function updateAgent(index) {
  var agent = state.agents[index];
  if (!agent) return;
  var card = document.querySelector('[data-agent="' + index + '"]');
  if (!card) { render(); return; }
  // update badge (include intervention badge if pending)
  var badgeEl = card.querySelector('.agent-badge');
  if (badgeEl) {
    clearEl(badgeEl);
    if (_interventionPending[index]) {
      var ivBadge = createEl('span', { className: 'intervention-badge' }, 'Intervention wartend');
      badgeEl.appendChild(ivBadge);
    }
    if (agent.score != null) badgeEl.appendChild(scoreBadgeNode(agent.score));
    badgeEl.appendChild(badgeNode(agent.status));
  }
  // update footer (include intervene button for working agents)
  var foot = card.querySelector('.agent-foot');
  if (foot) {
    clearEl(foot);
    var footInfoSpan = document.createElement('span');
    var footInfoText = (agent.rounds || 0) + ' Runden \u00B7 ' + (agent.questions || 0) + ' Fragen';
    if (agent.duration != null) footInfoText += ' \u00B7 ' + formatDuration(agent.duration);
    if (agent.status === 'done' && agent.stats) {
      footInfoText += ' \u00B7 ' + (agent.stats.filesCreated || 0) + ' Dateien \u00B7 ' + (agent.stats.linesOfCode || 0) + ' Zeilen \u00B7 ' + formatFileSize(agent.stats.totalFileSize || 0);
    }
    footInfoSpan.textContent = footInfoText;
    foot.appendChild(footInfoSpan);
    var footBtnSpan = document.createElement('span');
    if (agent.status === 'working') {
      var interveneBtn = createEl('button', { className: 'btn-intervene' }, 'Eingreifen');
      (function(idx) { interveneBtn.addEventListener('click', function() { openIntervention(idx); }); })(index);
      footBtnSpan.appendChild(interveneBtn);
    }
    // Quick-Action Buttons
    var isActive = agent.status === 'working' || agent.status === 'asking' || agent.status === 'waiting' || agent.status === 'waiting_deps' || agent.status === 'retrying';
    if (isActive) {
      var skipBtn = createEl('button', { className: 'btn-quick skip', title: '\u00dcberspringen' }, '\u00dcberspringen');
      (function(idx) { skipBtn.addEventListener('click', function() { quickIntervene(idx, 'skip'); }); })(index);
      footBtnSpan.appendChild(skipBtn);
      var restartBtn = createEl('button', { className: 'btn-quick restart', title: 'Neu starten' }, 'Neu starten');
      (function(idx) { restartBtn.addEventListener('click', function() { quickIntervene(idx, 'restart'); }); })(index);
      footBtnSpan.appendChild(restartBtn);
      var completeBtn = createEl('button', { className: 'btn-quick complete', title: 'Fertig markieren' }, 'Fertig markieren');
      (function(idx) { completeBtn.addEventListener('click', function() { quickIntervene(idx, 'complete'); }); })(index);
      footBtnSpan.appendChild(completeBtn);
    } else if (agent.status === 'error') {
      var skipBtn2 = createEl('button', { className: 'btn-quick skip', title: '\u00dcberspringen' }, '\u00dcberspringen');
      (function(idx) { skipBtn2.addEventListener('click', function() { quickIntervene(idx, 'skip'); }); })(index);
      footBtnSpan.appendChild(skipBtn2);
      var completeBtn2 = createEl('button', { className: 'btn-quick complete', title: 'Fertig markieren' }, 'Fertig markieren');
      (function(idx) { completeBtn2.addEventListener('click', function() { quickIntervene(idx, 'complete'); }); })(index);
      footBtnSpan.appendChild(completeBtn2);
    }
    if (agent.status === 'error') {
      var retryBtn = createEl('button', { className: 'btn-retry' }, 'Wiederholen');
      (function(idx) { retryBtn.addEventListener('click', function() { retryAgent(idx); }); })(index);
      footBtnSpan.appendChild(retryBtn);
    }
    foot.appendChild(footBtnSpan);
  }
  // update card class for border color
  card.className = 'agent-card ' + (agent.status || 'waiting');
  // update title if changed
  var titleEl = card.querySelector('.agent-title');
  if (titleEl && agent.title) titleEl.textContent = agent.title;
  // remove intervention form and pending badge if agent is no longer working
  if (agent.status !== 'working') {
    _interventionFormOpen[index] = false;
    var existingForm = card.querySelector('.intervention-form');
    if (existingForm) existingForm.remove();
  }
}

function appendMessage(index, msg) {
  var conv = document.querySelector('[data-agent="' + index + '"] .agent-conv');
  if (!conv) { render(); return; }
  // remove empty placeholder
  var empty = conv.querySelector('.bubble-empty');
  if (empty) empty.remove();
  // Sicher: Bubble als DOM-Element erstellen statt insertAdjacentHTML
  conv.appendChild(buildBubbleNode(msg, true));
  conv.scrollTop = conv.scrollHeight;
}

// Erstellt eine Bubble als sicheres DOM-Element (kein innerHTML fuer dynamische Daten)
function buildBubbleNode(m, truncated) {
  var maxLen = truncated ? 300 : 0;
  var text = m.text || '';
  if (truncated && m.type === 'question') maxLen = 200;
  var displayText = maxLen > 0 ? truncate(text, maxLen) : text;

  var wrap = document.createElement('div');
  wrap.className = 'bubble-wrap' + (m.from === 'coordinator' ? ' right' : '') + (truncated ? ' fadein' : '');

  var bubble = document.createElement('div');
  var bubbleClass = 'bubble ';
  if (m.from === 'coordinator') bubbleClass += 'bubble-coordinator';
  else if (m.type === 'message') bubbleClass += 'bubble-message';
  else if (m.type === 'context') bubbleClass += 'bubble-context';
  else if (m.type === 'question') bubbleClass += 'bubble-question';
  else bubbleClass += 'bubble-agent';
  bubble.className = bubbleClass;

  // Copy-Button (statisches HTML, kein User-Input)
  var copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.title = 'Kopieren';
  copyBtn.setAttribute('aria-label', 'Text kopieren');
  copyBtn.textContent = '\u2398';
  copyBtn.addEventListener('click', function() { copyText(this); });
  bubble.appendChild(copyBtn);

  // Label
  var label = null;
  if (m.from === 'coordinator') label = 'Koordinator \u2192';
  else if (m.type === 'message') {
    if (m.targetAgent != null) label = '\u2192 Agent ' + (m.targetAgent + 1);
    else if (m.sourceAgent != null) label = '\u2190 Agent ' + (m.sourceAgent + 1);
    else label = 'Nachricht';
  } else if (m.type === 'context') label = 'Shared Context';
  else if (m.type === 'question') label = 'Frage \u2192';

  if (label) {
    var labelEl = createEl('div', { className: 'bubble-label' }, label);
    bubble.appendChild(labelEl);
  }

  // Text (sicher via textContent)
  var textEl = createEl('div', { className: 'bubble-text' }, displayText);
  bubble.appendChild(textEl);

  wrap.appendChild(bubble);
  return wrap;
}

async function approvePlan() {
  if (_approveBusy) return;

  try {
    var r = await authFetch('/api/approve', { method: 'POST', headers: authHeadersNoBody() });
    if (!r.ok) {
      var d = await r.json();
      addBanner('error', d.error || 'Genehmigung fehlgeschlagen');
    }
  } catch (e) {
    addBanner('error', 'Fehler: ' + e.message);
  } finally {
    _approveBusy = false;
  }
}

var _modifyBusy = false;
async function modifyAndApprove() {
  if (_modifyBusy) return;
  var agents = state.agents || [];
  var tasks = agents.map(function(a, i) {
    var textarea = document.getElementById('approvalTask' + i);
    var roleSelect = document.getElementById('approvalRole' + i);
    return {
      title: a.title || '',
      task: textarea ? textarea.value.trim() : (a.task || ''),
      deliverable: a.deliverable || '',
      role: roleSelect ? roleSelect.value : (a.role || ''),
      depends_on: a.depends_on || []
    };
  });
  // Validierung
  for (var i = 0; i < tasks.length; i++) {
    if (!tasks[i].task) {
      addBanner('error', 'Aufgabe f\u00FCr Agent ' + (i + 1) + ' darf nicht leer sein.');
      return;
    }
  }
  _modifyBusy = true;
  try {
    var r = await authFetch('/api/modify-plan', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ tasks: tasks })
    });
    if (!r.ok) {
      var d = await r.json();
      addBanner('error', d.error || '\u00C4nderung fehlgeschlagen');
    }
  } catch (e) {
    addBanner('error', 'Fehler: ' + e.message);
  } finally {
    _modifyBusy = false;
  }
}

// ── Agent Filter ──────────────────────────────────────────────
function filterAgents() {
  var agents = state.agents || [];
  var result = [];
  for (var i = 0; i < agents.length; i++) {
    var a = agents[i];
    // Status filter
    if (agentFilter === 'aktiv' && a.status !== 'working' && a.status !== 'asking' && a.status !== 'waiting' && a.status !== 'waiting_deps') continue;
    if (agentFilter === 'fertig' && a.status !== 'done') continue;
    if (agentFilter === 'fehler' && a.status !== 'error') continue;
    // Search filter
    if (agentSearch) {
      var q = agentSearch.toLowerCase();
      var titleMatch = (a.title || '').toLowerCase().indexOf(q) !== -1;
      var taskMatch = (a.task || '').toLowerCase().indexOf(q) !== -1;
      var convMatch = false;
      var conv = a.conversation || [];
      for (var j = 0; j < conv.length; j++) {
        if ((conv[j].text || '').toLowerCase().indexOf(q) !== -1) { convMatch = true; break; }
      }
      if (!titleMatch && !taskMatch && !convMatch) continue;
    }
    result.push({ agent: a, index: i });
  }
  return result;
}

function setAgentFilter(f) {
  agentFilter = f;
  render();
}
