    font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--txt); }
  .file-modal-binary { display: flex; align-items: center; justify-content: center;
    min-height: 120px; color: var(--txt3); font-size: 14px; }

  /* ── Approval screen ─────────────────────────────────── */
  .approval-box { max-width: 720px; margin: 2rem auto; }
  .approval-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .approval-summary { font-size: 13px; color: var(--txt2); margin-bottom: 1.25rem; line-height: 1.6; }
  .approval-task { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 10px; }
  .approval-task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .approval-task-num { font-size: 11px; color: var(--txt3); font-weight: 500; }
  .approval-task-title { font-size: 13px; font-weight: 600; }
  .approval-task textarea { min-height: 60px; font-size: 12px; margin-top: 4px; }
  .approval-task-del { font-size: 11px; color: var(--txt3); margin-top: 4px; }
  .approval-actions { display: flex; gap: 10px; margin-top: 1rem; }
  .task-presets { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .task-preset-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px;
    font-size: 11px; border-radius: 999px; border: 0.5px solid var(--border); background: var(--bg1);
    color: var(--txt2); cursor: pointer; transition: background var(--transition), border-color var(--transition); white-space: nowrap; }
  .task-preset-pill:hover { background: var(--bg3); border-color: var(--blue); color: var(--txt); }
  .task-preset-pill .preset-icon { font-size: 12px; }

  /* ── Settings modal ──────────────────────────────────────── */
  .settings-modal { max-width: 640px; }
  .settings-modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1rem; }
  .settings-field { margin-bottom: 12px; }
  .settings-field label { font-size: 12px; color: var(--txt2); margin-bottom: 4px; display: block; }
  .settings-field input[type=number], .settings-field input[type=text] {
    width: 100%; padding: 7px 10px; background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); color: var(--txt); font-family: var(--mono); font-size: 13px;
    transition: border-color var(--transition);
  }
  .settings-field input:focus { outline: none; border-color: var(--border2); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
  .settings-field .hint { font-size: 10px; color: var(--txt3); margin-top: 2px; }
  .settings-field input[readonly] { opacity: 0.5; cursor: not-allowed; }
  .settings-actions { display: flex; gap: 8px; margin-top: 1rem; }
  .settings-status { font-size: 12px; margin-top: 8px; min-height: 18px; }
  .settings-status.ok { color: var(--green); }
  .settings-status.err { color: var(--red); }

  /* ── Prompt Studio (inside settings modal) ──────────────── */
  .prompt-section { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 14px; }
  .prompt-section-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
  .prompt-section-header h4 { font-size: 13px; font-weight: 600; margin: 0; }
  .prompt-section-header .chevron { font-size: 12px; color: var(--txt3); transition: transform 0.2s; }
  .prompt-section-header .chevron.open { transform: rotate(90deg); }
  .prompt-section-body { margin-top: 10px; }
  .prompt-section-body.collapsed { display: none; }
  .prompt-field { margin-bottom: 14px; }
  .prompt-field label { font-size: 12px; color: var(--txt2); margin-bottom: 4px; display: block; font-weight: 500; }
  .prompt-field textarea {
    width: 100%; padding: 7px 10px; background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); color: var(--txt); font-family: var(--mono); font-size: 12px;
    line-height: 1.5; resize: vertical; transition: border-color var(--transition);
    box-sizing: border-box;
  }
  .prompt-field textarea:focus { outline: none; border-color: var(--border2); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
  .prompt-vars { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .prompt-var-badge {
    display: inline-block; padding: 1px 7px; font-size: 10px; font-family: var(--mono);
    background: var(--blue-bg); color: var(--blue); border-radius: 99px; cursor: pointer;
    transition: background 0.15s;
  }
  .prompt-var-badge:hover { opacity: 0.8; }
  .prompt-actions { display: flex; gap: 8px; margin-top: 10px; }
  .prompt-status { font-size: 12px; margin-top: 6px; min-height: 18px; }

  /* ── Webhook-Verwaltung (Settings Tab) ─────────────────── */
  .webhook-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .webhook-item { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .webhook-item.inactive { opacity: 0.55; }
  .webhook-item-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .webhook-item-url { font-family: var(--mono); font-size: 12px; font-weight: 600; word-break: break-all; flex: 1; min-width: 0; }
  .webhook-item-status { font-size: 10px; padding: 1px 8px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
  .webhook-item-status.active { background: rgba(0,180,80,0.1); color: var(--green); }
  .webhook-item-status.paused { background: rgba(220,180,0,0.1); color: #b8860b; }
  [data-theme="dark"] .webhook-item-status.paused { color: #d4a017; }
  .webhook-item-events { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
  .webhook-event-badge { display: inline-block; padding: 1px 6px; font-size: 9px; font-family: var(--mono); background: var(--blue-bg); color: var(--blue); border-radius: 99px; }
  .webhook-item-actions { display: flex; gap: 5px; margin-top: 6px; }
  .webhook-item-actions button { font-size: 11px; padding: 3px 10px; border: 0.5px solid var(--border); background: var(--bg1); border-radius: var(--radius-sm); cursor: pointer; color: var(--txt2); }
  .webhook-item-actions button:hover { background: var(--bg3); color: var(--txt); }
  .webhook-item-actions button.btn-danger { color: var(--red); }
  .webhook-item-actions button.btn-danger:hover { background: rgba(220,50,50,0.08); }
  .webhook-deliveries { margin-top: 6px; max-height: 120px; overflow-y: auto; }
  .webhook-deliveries table { width: 100%; border-collapse: collapse; font-size: 10px; font-family: var(--mono); }
  .webhook-deliveries th { text-align: left; font-size: 9px; color: var(--txt3); font-weight: 600; padding: 2px 4px; border-bottom: 1px solid var(--border); }
  .webhook-deliveries td { padding: 2px 4px; color: var(--txt2); border-bottom: 1px solid var(--bg3, #eee); }
  .webhook-deliveries .delivery-ok { color: var(--green); }
  .webhook-deliveries .delivery-err { color: var(--red); }
  .webhook-form { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; }
  .webhook-form .settings-field { margin-bottom: 8px; }
  .webhook-form .wh-events-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; margin-top: 4px; }
  .webhook-form .wh-events-grid label { font-size: 11px; display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--txt2); }
  .webhook-form .wh-events-grid input[type=checkbox] { accent-color: var(--blue); width: 14px; height: 14px; cursor: pointer; }
  .webhook-empty { font-size: 12px; color: var(--txt3); text-align: center; padding: 20px 10px; }

  /* ── Modal Tab Bar ─────────────────────────────────────── */
  .modal-tabs { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .modal-tab { padding: 8px 18px; font-size: 13px; font-weight: 500; cursor: pointer;
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--txt3); transition: color var(--transition), border-color var(--transition); font-family: var(--font); }
  .modal-tab:hover { color: var(--txt2); }
  .modal-tab.active { color: var(--txt); border-bottom-color: var(--blue); }
  .modal-tab-content { display: none; }
  .modal-tab-content.active { display: block; }

  /* ── Prompt Inspector ──────────────────────────────────── */
  .pi-stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 14px;
    background: var(--bg2); border-radius: var(--radius-sm); border: 0.5px solid var(--border); }
  .pi-stat { font-size: 12px; color: var(--txt2); }
  .pi-stat strong { color: var(--txt); font-weight: 600; }
  .pi-loading { text-align: center; padding: 2rem; color: var(--txt3); font-size: 13px; }
  .pi-empty { text-align: center; padding: 2rem; color: var(--txt3); font-size: 13px; }
  .pi-round { border: 0.5px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; overflow: hidden; }
  .pi-round-header { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--bg2); cursor: pointer; font-size: 12px; user-select: none;
    transition: background var(--transition); }
  .pi-round-header:hover { background: var(--bg3); }
  .pi-round-arrow { font-size: 10px; transition: transform 0.2s; color: var(--txt3); }
  .pi-round.open .pi-round-arrow { transform: rotate(90deg); }
  .pi-round-title { font-weight: 600; color: var(--txt); }
  .pi-round-meta { color: var(--txt3); font-size: 11px; margin-left: auto; }
  .pi-round-body { display: none; padding: 0; }
  .pi-round.open .pi-round-body { display: block; }
  .pi-section { border-top: 0.5px solid var(--border); }
  .pi-section-header { display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    cursor: pointer; font-size: 12px; font-weight: 500; color: var(--txt2);
    background: var(--bg); transition: background var(--transition); }
  .pi-section-header:hover { background: var(--bg2); }
  .pi-section-arrow { font-size: 9px; transition: transform 0.2s; color: var(--txt3); }
  .pi-section.open .pi-section-arrow { transform: rotate(90deg); }
  .pi-section-body { display: none; position: relative; }
  .pi-section.open .pi-section-body { display: block; }
  .pi-pre { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    background: var(--bg2); color: var(--txt2); max-height: 400px; overflow-y: auto; }
  .pi-copy-btn { position: absolute; top: 6px; right: 8px; padding: 3px 10px;
    font-size: 11px; background: var(--bg3); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); cursor: pointer; color: var(--txt2);
    font-family: var(--font); transition: background var(--transition); }
  .pi-copy-btn:hover { background: var(--bg); color: var(--txt); }

  /* ── Score badge ──────────────────────────────────────── */
  .score-badge {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; min-width: 32px; height: 20px;
    padding: 0 6px; border-radius: 99px; line-height: 1;
    font-family: var(--mono);
  }
  .score-badge.score-green { background: var(--teal-bg); color: var(--teal); }
  .score-badge.score-amber { background: var(--amber-bg); color: var(--amber); }
  .score-badge.score-red { background: var(--red-bg); color: var(--red); }
  .score-project {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 600; margin-left: 8px;
  }

  /* ── Filter bar ───────────────────────────────────────── */
  .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .filter-input { padding: 6px 10px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); color: var(--txt); font-size: 13px; flex: 1; min-width: 200px; font-family: var(--font); }
  .filter-input:focus { outline: none; border-color: var(--border2); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
  .filter-btn { padding: 5px 12px; font-size: 12px; border-radius: 99px; border: 0.5px solid var(--border); background: var(--bg2); color: var(--txt2); cursor: pointer; transition: all var(--transition); }
  .filter-btn:hover { background: var(--bg3); }
  .filter-btn.active { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
  .filter-count { font-size: 11px; color: var(--txt3); white-space: nowrap; }
  .modal-search { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .modal-search-input { flex: 1; padding: 6px 10px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); color: var(--txt); font-size: 13px; font-family: var(--font); }
  .modal-search-input:focus { outline: none; border-color: var(--border2); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
  .modal-search-count { font-size: 11px; color: var(--txt3); white-space: nowrap; }
  mark { background: var(--amber-bg); color: var(--amber-dark); border-radius: 2px; padding: 0 1px; }
  mark.current { background: var(--amber); color: var(--bg); }

  /* ── Agent Vollansicht Modal ─────────────────────────── */
  .agent-fullview-modal {
    max-width: 90vw; width: 90vw; max-height: 90vh; height: 90vh;
    display: flex; flex-direction: column; padding: 0; overflow: hidden;
  }
  .agent-fullview-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 1.25rem 1.5rem 0; gap: 12px; flex-shrink: 0;
  }
  .agent-fullview-header-left { flex: 1; min-width: 0; }
  .agent-fullview-header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 4px; }
  .agent-fullview-num { font-size: 11px; color: var(--txt2); font-weight: 500; }
  .agent-fullview-title-row { display: flex; align-items: center; gap: 10px; margin: 2px 0 4px; flex-wrap: wrap; }
  .agent-fullview-title { font-size: 18px; font-weight: 700; }
  .agent-fullview-role { font-size: 11px; color: var(--txt3); background: var(--bg2); border-radius: 4px; padding: 2px 8px; }
  .agent-fullview-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--txt2); flex-wrap: wrap; }
  .agent-fullview-meta-item { display: inline-flex; align-items: center; gap: 4px; }
  .agent-fullview-task { font-size: 13px; color: var(--txt2); line-height: 1.6;
    border-left: 3px solid var(--blue); padding: 6px 10px; margin: 8px 0 0;
    background: var(--bg2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .agent-fullview-tabs { padding: 0 1.5rem; flex-shrink: 0; }
  .agent-fullview-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .agent-fullview-tab-panel { flex: 1; overflow-y: auto; padding: 0 1.5rem 1.25rem; }
  .agent-fullview-tab-panel.hidden { display: none; }

  /* Verlauf-Tab */
  .afv-search-bar { display: flex; gap: 8px; align-items: center; padding: 10px 0; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .afv-search-input { flex: 1; padding: 7px 12px; background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); color: var(--txt); font-size: 13px; font-family: var(--font); }
  .afv-search-input:focus { outline: none; border-color: var(--border2); box-shadow: 0 0 0 3px rgba(24,95,165,0.1); }
  .afv-search-nav { display: flex; align-items: center; gap: 4px; }
  .afv-search-nav-btn { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--txt2); transition: background var(--transition); line-height: 1; }
  .afv-search-nav-btn:hover { background: var(--bg3); color: var(--txt); }
  .afv-search-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .afv-search-count { font-size: 11px; color: var(--txt3); white-space: nowrap; min-width: 70px; text-align: center; }
  .afv-conv { display: flex; flex-direction: column; gap: 10px; padding-bottom: 1rem; }
  .afv-bubble-wrap { display: flex; }
  .afv-bubble-wrap.right { justify-content: flex-end; }
  .afv-bubble-wrap.center { justify-content: center; }
  .afv-bubble { max-width: 80%; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; position: relative; }
  .afv-bubble-agent { background: var(--bg3); color: var(--txt); }
  .afv-bubble-coordinator { background: var(--blue-bg); color: var(--blue-dark); }
  .afv-bubble-question { background: var(--amber-bg); color: var(--amber-dark); }
  .afv-bubble-message { background: var(--purple-bg); color: var(--purple); }
  .afv-bubble-system { background: var(--gray-bg); color: var(--gray); font-style: italic; font-size: 11.5px; }
  .afv-bubble-label { font-size: 10px; opacity: 0.7; margin-bottom: 3px; font-weight: 500; }
  .afv-bubble-time { font-size: 10px; opacity: 0.5; margin-top: 4px; text-align: right; }
  .afv-bubble .copy-btn { position: absolute; top: 4px; right: 4px; background: none; border: none;
    cursor: pointer; font-size: 12px; opacity: 0; transition: opacity 0.15s; color: inherit; padding: 2px 4px; border-radius: 3px; }
  .afv-bubble:hover .copy-btn { opacity: 0.5; }
  .afv-bubble .copy-btn:hover { opacity: 1; background: rgba(128,128,128,0.15); }
  .afv-copy-all { padding: 6px 14px; background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; color: var(--txt2);
    transition: background var(--transition); white-space: nowrap; }
  .afv-copy-all:hover { background: var(--bg3); color: var(--txt); }

  /* Dateien-Tab */
  .afv-files-list { display: flex; flex-direction: column; gap: 2px; }
  .afv-file-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    border-radius: var(--radius-sm); cursor: pointer; transition: background var(--transition);
    font-size: 12px; color: var(--txt2); }
  .afv-file-item:hover { background: var(--bg2); }
  .afv-file-item.active { background: var(--blue-bg); color: var(--blue); }
  .afv-file-icon { font-size: 14px; flex-shrink: 0; width: 20px; text-align: center; }
  .afv-file-name { flex: 1; font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .afv-file-size { font-size: 10px; color: var(--txt3); font-family: var(--mono); flex-shrink: 0; }
  .afv-file-preview { margin-top: 10px; background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); overflow: hidden; }
  .afv-file-preview-header { display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: var(--bg3); border-bottom: 0.5px solid var(--border); }
  .afv-file-preview-path { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  .afv-file-preview-copy { padding: 3px 10px; background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); font-size: 11px; cursor: pointer; color: var(--txt2); }
  .afv-file-preview-copy:hover { background: var(--bg); color: var(--txt); }
  .afv-file-preview-body { padding: 10px 12px; max-height: 400px; overflow-y: auto; }
  .afv-file-preview-body pre { margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--txt); }
  .afv-files-empty { color: var(--txt3); font-size: 12px; font-style: italic; padding: 1rem 0; }
  .afv-files-loading { color: var(--txt3); font-size: 12px; padding: 1rem 0; }

  /* Statistik-Tab */
  .afv-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .afv-stat-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 14px; text-align: center; }
  .afv-stat-value { font-size: 22px; font-weight: 700; color: var(--txt); font-family: var(--mono); }
  .afv-stat-label { font-size: 11px; color: var(--txt3); margin-top: 2px; }
  .afv-score-section { margin-bottom: 1.25rem; }
  .afv-score-title { font-size: 13px; font-weight: 600; color: var(--txt2); margin-bottom: 10px;
    border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .afv-score-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .afv-score-bar-label { flex: 0 0 100px; text-align: right; color: var(--txt2); }
  .afv-score-bar-track { flex: 1; height: 18px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .afv-score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .afv-score-bar-value { flex: 0 0 40px; font-size: 11px; color: var(--txt3); font-family: var(--mono); }
  .afv-timeline-section { margin-bottom: 1rem; }
  .afv-timeline-row { display: flex; align-items: center; gap: 10px; font-size: 12px; padding: 4px 0; }
  .afv-timeline-label { flex: 0 0 100px; text-align: right; color: var(--txt2); font-weight: 500; }
  .afv-timeline-value { color: var(--txt); font-family: var(--mono); font-size: 12px; }

  @media (max-width: 768px) {
    .agent-fullview-modal { max-width: 98vw; width: 98vw; max-height: 95vh; height: 95vh; }
    .agent-fullview-header { padding: 1rem 1rem 0; }
    .agent-fullview-tabs { padding: 0 1rem; }
    .agent-fullview-tab-panel { padding: 0 1rem 1rem; }
    .afv-bubble { max-width: 95%; }
    .afv-stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .agent-fullview-modal { max-width: 100vw; width: 100vw; max-height: 100vh; height: 100vh; border-radius: 0; }
    .agent-fullview-title { font-size: 15px; }
    .afv-stats-grid { grid-template-columns: 1fr 1fr; }
  }



  /* -- File changes (Diff-Ansicht) -------------------- */
  .file-changes-section { margin-top: 1rem; margin-bottom: 0.5rem; }
  .file-change { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12px; }
  .file-change-new { color: var(--green); }
  .file-change-mod { color: var(--amber); }
  .file-change-icon { flex-shrink: 0; font-size: 13px; }
  .file-change-name { font-family: var(--mono); font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-change-size { font-family: var(--mono); font-size: 10px; color: var(--txt3); flex-shrink: 0; }
  .file-changes-empty { font-size: 11.5px; color: var(--txt3); font-style: italic; padding: 3px 0; }

  /* -- Shortcuts modal ------------------------------ */
  .shortcuts-grid {
    display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center;
  }
  .shortcuts-grid kbd {
    display: inline-block; background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 4px; padding: 2px 8px; font-family: var(--mono); font-size: 12px;
    font-weight: 600; color: var(--txt); min-width: 28px; text-align: center;
    box-shadow: 0 1px 0 var(--border);
  }
  .shortcuts-grid .shortcut-desc {
    font-size: 13px; color: var(--txt2);
  }
  .shortcuts-category {
    grid-column: 1 / -1; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--txt3); margin-top: 10px; padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .shortcuts-category:first-child { margin-top: 0; }
  .shortcuts-hint {
    font-size: 11px; color: var(--txt3); text-align: center; margin-top: 12px;
  }

  /* -- Toast Notifications ------------------------------ */
  .shortcut-toast {
    position: fixed; bottom: 40px; right: 16px; z-index: 9999;
    background: var(--txt); color: var(--bg); padding: 8px 16px;
    border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-md); pointer-events: none;
    animation: toast-in 0.2s ease, toast-out 0.3s ease 1.2s forwards;
    max-width: 320px; word-break: break-word;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

  /* ── Queue Manager ─────────────────────────────────────── */
  .queue-section { margin-top: 12px; }
  .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .queue-clear-btn { font-size: 11px; padding: 3px 10px; }
  .queue-list { display: flex; flex-direction: column; gap: 4px; }
  .queue-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--bg2); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); transition: background var(--transition);
  }
  .queue-item:hover { background: var(--bg3); }
  .queue-item-pos {
    flex-shrink: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    background: var(--blue-bg); color: var(--blue); border-radius: 50%;
    font-size: 11px; font-weight: 600;
  }
  .queue-item-body { flex: 1; min-width: 0; }
  .queue-item-desc { font-size: 13px; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-item-meta { font-size: 11px; color: var(--txt3); margin-top: 2px; }
  .queue-item-remove {
    flex-shrink: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; color: var(--txt3); font-size: 16px;
    cursor: pointer; border-radius: 4px; transition: background var(--transition), color var(--transition);
  }
  .queue-item-remove:hover { background: var(--red-bg); color: var(--red); }
  .queue-item.queue-drag-over { border-color: var(--blue); background: var(--blue-bg); }
  .queue-item-drag {
    flex-shrink: 0; cursor: grab; color: var(--txt3); font-size: 14px;
    user-select: none; padding: 2px 0; line-height: 1;
  }
  .queue-item-drag:active { cursor: grabbing; }
  .queue-item-prio {
    flex-shrink: 0; font-size: 12px; width: 20px; text-align: center;
  }
  .queue-item-wait { font-size: 11px; color: var(--amber); margin-top: 1px; }
  .queue-prio-select {
    font-size: 12px; padding: 4px 8px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--bg2); color: var(--txt);
    cursor: pointer; margin-top: 6px;
  }
  .queue-badge {
    position: absolute; top: -8px; right: -8px;
    background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber);
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px;
    white-space: nowrap; pointer-events: none;
  }

  /* ── Compare modal ─────────────────────────────────────── */
  .compare-modal { max-width: 860px; }
  .compare-modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1rem; }
  .compare-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .compare-col { display: flex; flex-direction: column; gap: 8px; }
  .compare-col-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .compare-stat { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 13px; }
  .compare-stat-label { color: var(--txt2); }
  .compare-stat-value { font-weight: 600; font-family: var(--mono); font-size: 12px; }
  .compare-agents-title { font-size: 12px; font-weight: 600; color: var(--txt2); margin-top: 8px; margin-bottom: 4px; }
  .compare-agent-row { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 0; }
  .compare-agent-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .compare-check { margin-right: 6px; cursor: pointer; accent-color: var(--blue); }
  .compare-actions { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .compare-start-btn { padding: 5px 14px; font-size: 12px; border-radius: 6px;
    border: none; background: var(--blue-bg); color: var(--blue);
    cursor: pointer; font-weight: 500; transition: opacity var(--transition); }
  .compare-start-btn:hover { opacity: 0.8; }
  .compare-start-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .compare-cancel-btn { padding: 5px 14px; font-size: 12px; border-radius: 6px;
    border: 0.5px solid var(--border); background: var(--bg2); color: var(--txt2);
    cursor: pointer; transition: all var(--transition); }
  .compare-cancel-btn:hover { background: var(--bg3); }
  .compare-hint { font-size: 11px; color: var(--txt3); margin-left: 8px; }
  @media (max-width: 600px) {
    .compare-layout { grid-template-columns: 1fr; }
  }

  /* ── Tablet responsive (768px–1024px) ─────────────────── */
  @media (max-width: 1024px) and (min-width: 769px) {
    .agent-grid { grid-template-columns: repeat(2, 1fr); }
    .template-grid { grid-template-columns: repeat(2, 1fr); }
    .filter-bar { flex-wrap: wrap; }
    .analytics-stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ── Mobile responsive (max-width: 768px) ───────────────── */
  @media (max-width: 768px) {
    #app { padding: 1rem; }

    /* Agent-Cards: Single-Column Stack */
    .agent-grid { grid-template-columns: 1fr; gap: 10px; }
    .template-grid { grid-template-columns: repeat(2, 1fr); }

    /* Header und Controls */
    .proj-header { flex-direction: column; gap: 0.75rem; }
    .stats-row { width: 100%; text-align: left; flex-wrap: wrap; }

    /* Setup-Formular: volle Breite */
    .setup-box { padding: 1.5rem; margin: 1rem auto; max-width: 100%; }
    .row { flex-direction: column; }
    .count-box { flex: none; width: 100%; }

    /* Eingabefelder volle Breite */
    textarea, input[type=text], input[type=number], .filter-input { width: 100%; min-width: 0; }
    .filter-bar { flex-direction: column; gap: 8px; }
    .filter-input { min-width: 0; }

    /* Touch-freundliche Button-Groessen (min 44x44px) */
    .btn-primary { min-height: 44px; padding: 12px 24px; font-size: 15px; }
    .btn-outline { min-height: 44px; padding: 10px 16px; }
    .btn-retry { min-height: 44px; padding: 10px 14px; font-size: 12px; }
    .btn-intervene { min-height: 44px; padding: 8px 12px; font-size: 11px; }
    .btn-icon { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    .top-controls { top: 8px; right: 8px; gap: 4px; }
    .top-btn { min-width: 44px; min-height: 44px; padding: 8px; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }

    /* Filter-Buttons touch-freundlich */
    .filter-btn { min-height: 38px; padding: 8px 14px; font-size: 13px; }
    .activity-filter-btn { min-height: 36px; padding: 6px 12px; font-size: 11px; }
    .log-filter-btn { min-height: 36px; padding: 6px 12px; }

    /* Modal: volle Breite auf Mobile */
    .modal { width: 98%; max-width: 98vw; max-height: 90vh; padding: 1rem; }
    .modal-close { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }

    /* Timeline anpassen */
    .timeline-label { flex: 0 0 80px; font-size: 10px; }
    .timeline-axis { margin-left: 80px; }

    /* Approval-Bereich */
    .approval-box { margin: 1rem auto; }
    .approval-actions { flex-direction: column; }
    .approval-actions .btn-primary, .approval-actions .btn-outline { width: 100%; min-height: 44px; }

    /* History-Aktionen */
    .history-actions { flex-direction: column; }
    .history-item { padding: 10px; }
    .history-delete, .history-clone { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }

    /* Bulk-Aktionen */
    .bulk-actions { flex-direction: column; align-items: stretch; }
    .bulk-actions .bulk-btn { min-height: 40px; }

    /* Vergleichs-Layout */
    .compare-layout { grid-template-columns: 1fr; }

    /* Analytics */
    .analytics-stats-grid { grid-template-columns: repeat(2, 1fr); }
    .analytics-modal { max-width: 98vw; }

    /* Token-Panel */
    .token-panel-header { min-height: 44px; }

    /* Settings-Modal */
    .settings-modal { max-width: 98vw; }
    .settings-actions { flex-direction: column; }
    .settings-actions .btn-primary, .settings-actions .btn-outline { width: 100%; min-height: 44px; }

    /* Queue-Elemente */
    .queue-item { padding: 10px; }
    .queue-item-remove { min-width: 44px; min-height: 44px; }

    /* Prompt Studio */
    .prompt-actions { flex-direction: column; }
    .prompt-actions .btn-primary, .prompt-actions .btn-outline { width: 100%; min-height: 44px; }

    /* Font-Size Anpassung */
    .setup-title { font-size: 20px; }
    .proj-title { font-size: 16px; }
    .coord-name { font-size: 13px; }
  }

  /* ── Kleines Mobile (<480px) ──────────────────────────────── */
  @media (max-width: 480px) {
    #app { padding: 0.75rem; }
    body { font-size: 13px; }

    /* Cards kompakter */
    .card { padding: 0.85rem; border-radius: 10px; }
    .card-sm { padding: 0.75rem; }

    /* Agent-Cards Single-Column */
    .agent-grid { grid-template-columns: 1fr; gap: 8px; }
    .template-grid { grid-template-columns: 1fr; }

    /* Modal fast Fullscreen */
    .modal { max-width: 100vw; width: 100vw; max-height: 100vh; border-radius: 0; padding: 0.85rem; }
    .modal-overlay { align-items: flex-end; }

    /* Setup */
    .setup-title { font-size: 18px; }
    .setup-sub { font-size: 12px; }
    .setup-box { margin: 0.5rem auto; padding: 1rem; }
    .count-num { font-size: 24px; }

    /* Projekt-Header */
    .proj-title { font-size: 15px; }
    .proj-summary { font-size: 12px; }

    /* Abschluss-Banner */
    .complete-banner { flex-wrap: wrap; padding: 0.85rem 1rem; }
    .partial-banner { flex-wrap: wrap; padding: 0.85rem 1rem; }

    /* Buttons noch groesser fuer kleine Bildschirme */
    .btn-primary { font-size: 15px; padding: 12px 20px; }

    /* Top-Controls kompakter */
    .top-controls { top: 6px; right: 6px; gap: 2px; }
    .top-btn { min-width: 40px; min-height: 40px; font-size: 14px; }

    /* Agent-Card Inhalte */
    .agent-title { font-size: 12px; }
    .agent-task { font-size: 11px; }
    .agent-conv { max-height: 160px; min-height: 50px; }

    /* Badge */
    .badge { font-size: 10px; padding: 2px 8px; }

    /* Log-Viewer */
    .log-viewer-panel { width: 100%; max-width: 100vw; border-radius: 0; max-height: 100vh; }

    /* File-Modal */
    .file-modal { width: 100vw; max-width: 100vw; max-height: 100vh; border-radius: 0; }

    /* Shortcuts-Grid */
    .shortcuts-grid { gap: 6px 10px; }

    /* Intervention-Form */
    .intervention-actions { flex-direction: column; }
    .intervention-actions .btn-send, .intervention-actions .btn-cancel { width: 100%; min-height: 40px; }

    /* Font-Anpassungen */
    .section-label { font-size: 9px; }
    label { font-size: 12px; }
    textarea { font-size: 14px; } /* groesser fuer bessere Lesbarkeit auf kleinen Screens */
  }

  /* ── Log-Viewer (erweitert) ──────────────────────────────── */
  .log-viewer {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    animation: modal-fadein 0.2s ease;
  }
  .log-viewer-panel {
    background: var(--bg); border: 0.5px solid var(--border);
    border-radius: var(--radius); max-width: 860px; width: 95%;
    max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: var(--shadow-md); animation: fadein 0.2s ease;
    padding: 1.25rem;
  }
  .log-viewer-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .log-viewer-header-left { display: flex; align-items: center; gap: 10px; }
  .log-viewer-title { font-size: 15px; font-weight: 600; }
  .log-viewer-count { font-size: 11px; color: var(--txt3); font-family: var(--mono); }
  .log-viewer-header-right { display: flex; align-items: center; gap: 6px; }
  .log-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }
  .log-filter-group { display: flex; gap: 4px; align-items: center; }
  .log-filter-label { font-size: 10px; color: var(--txt3); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; margin-right: 2px; }
  .log-filter-btn {
    padding: 4px 10px; font-size: 11px; border-radius: 99px;

  .log-warn .log-lvl { color: #fff; background: var(--amber); }

  .log-pagination { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; font-size: 11px; color: var(--txt3); }
  .log-pagination button { padding: 3px 10px; font-size: 11px; border-radius: 99px; border: 0.5px solid var(--border); background: var(--bg2); color: var(--txt2); cursor: pointer; }
  .log-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .log-pagination button:hover:not(:disabled) { background: var(--bg3); }

  /* ── Timeline / Gantt ──────────────────────────────────── */
  .timeline-container {
    background: var(--bg); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.25rem;
    overflow-x: auto; box-shadow: var(--shadow-sm);
    transition: background var(--transition), border-color var(--transition);
  }
  .timeline-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .timeline-header-title { font-size: 13px; font-weight: 600; color: var(--txt2); }
  .timeline-header-elapsed { font-size: 11px; color: var(--txt3); font-family: var(--mono); }
  .timeline-axis {
    display: flex; position: relative; height: 22px;
    border-bottom: 1px solid var(--border); margin-left: 130px; margin-bottom: 4px;
  }
  .timeline-axis-tick {
    position: absolute; top: 0; font-size: 10px; color: var(--txt3);
    font-family: var(--mono); transform: translateX(-50%);
    white-space: nowrap;
  }
  .timeline-axis-tick::after {
    content: ''; display: block; width: 1px; height: 6px;
    background: var(--border2); margin: 2px auto 0;
  }
  .timeline-row {
    display: flex; align-items: center; height: 32px; gap: 0;
    position: relative;
  }
  .timeline-row:not(:last-child) {
    border-bottom: 1px solid var(--border);
  }
  .timeline-label {
    flex: 0 0 130px; font-size: 11px; color: var(--txt2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding-right: 8px; font-weight: 500;
  }
  .timeline-track {
    flex: 1; position: relative; height: 20px; min-width: 0;
  }
  .timeline-bar {
    position: absolute; top: 2px; height: 16px;
    border-radius: 3px; min-width: 3px;
    transition: width 0.4s ease, left 0.3s ease;
    display: flex; align-items: center; overflow: hidden;
  }
  .timeline-bar-inner {
    font-size: 9px; color: var(--bg); padding: 0 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 1px rgba(0,0,0,0.2);
  }
  .timeline-bar.tl-done { background: var(--green); }
  .timeline-bar.tl-working { background: var(--blue); }
  .timeline-bar.tl-error { background: var(--red); }
  .timeline-bar.tl-pending { background: var(--gray); opacity: 0.35; }
  .timeline-bar.tl-asking { background: var(--amber); }
  .timeline-bar.tl-retrying { background: var(--amber); opacity: 0.7; }
  .timeline-bar.tl-waiting_deps { background: var(--gray); opacity: 0.35; }
  .timeline-segment-question {
    position: absolute; top: 2px; height: 16px;
    background: var(--amber); opacity: 0.7; border-radius: 2px;
    min-width: 2px;
  }
  .timeline-legend {
    display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap;
  }
  .timeline-legend-item {
    display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--txt3);
  }
  .timeline-legend-swatch {
    width: 12px; height: 8px; border-radius: 2px; flex-shrink: 0;
  }
  .timeline-now-line {
    position: absolute; top: 0; bottom: 0; width: 1.5px;
    background: var(--red); opacity: 0.6; z-index: 2;
  }
  .view-toggle-group {
    display: inline-flex; border: 0.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
  }
  .view-toggle-btn {
    padding: 4px 12px; font-size: 11px; border: none; background: var(--bg2);
    color: var(--txt2); cursor: pointer; transition: background var(--transition), color var(--transition);
    font-family: var(--font);
  }
  .view-toggle-btn:not(:last-child) { border-right: 0.5px solid var(--border); }
  .view-toggle-btn:hover { background: var(--bg3); }
  .view-toggle-btn.active { background: var(--blue-bg); color: var(--blue); font-weight: 600; }

  /* ── DAG Graph View (Enhanced) ─────────────────────────── */
  .dag-container {
    background: var(--bg); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 0;
    overflow: hidden; box-shadow: var(--shadow-sm);
    transition: background var(--transition), border-color var(--transition);
    margin-top: 8px; position: relative; cursor: grab;
    min-height: 200px;
  }
  .dag-container.dragging { cursor: grabbing; }
  .dag-container svg { display: block; transform-origin: 0 0; }
  .dag-controls {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    display: flex; gap: 4px;
  }
  .dag-controls button {
    width: 28px; height: 28px; border-radius: 6px; border: 0.5px solid var(--border);
    background: var(--bg); color: var(--txt2); cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition); box-shadow: var(--shadow-sm);
  }
  .dag-controls button:hover { background: var(--bg3); color: var(--txt); }
  .dag-node { cursor: pointer; }
  .dag-node rect {
    stroke-width: 1.5; rx: 10; ry: 10;
    transition: fill 0.2s, stroke 0.2s, stroke-width 0.15s, opacity 0.2s;
  }
  .dag-node text { font-family: var(--font); pointer-events: none; }
  .dag-node .dag-label { font-size: 11px; font-weight: 600; }
  .dag-node .dag-title { font-size: 10px; }
  .dag-node .dag-score { font-size: 9px; font-weight: 700; }
  .dag-node .dag-status-icon { font-size: 13px; }
  .dag-edge { fill: none; stroke-width: 1.5; transition: stroke 0.2s, opacity 0.2s, stroke-width 0.15s; }
  .dag-edge-marker { fill: var(--txt3); transition: fill 0.2s; }
  .dag-no-deps {
    color: var(--txt3); font-size: 12px; text-align: center;
    padding: 12px 0 4px; font-style: italic;
  }

  /* DAG node status colors */
  .dag-node-done rect { fill: var(--teal-bg); stroke: var(--teal); }
  .dag-node-done .dag-label, .dag-node-done .dag-title, .dag-node-done .dag-score { fill: var(--teal); }
  .dag-node-working rect { fill: var(--blue-bg); stroke: var(--blue); stroke-width: 2.5; }
  .dag-node-working .dag-label, .dag-node-working .dag-title { fill: var(--blue); }
  .dag-node-asking rect { fill: var(--amber-bg); stroke: var(--amber); }
  .dag-node-asking .dag-label, .dag-node-asking .dag-title { fill: var(--amber); }
  .dag-node-error rect { fill: var(--red-bg); stroke: var(--red); stroke-width: 2; }
  .dag-node-error .dag-label, .dag-node-error .dag-title { fill: var(--red); }
  .dag-node-waiting rect, .dag-node-pending rect, .dag-node-waiting_deps rect {
    fill: var(--gray-bg); stroke: var(--gray); stroke-dasharray: 6 3;
  }
  .dag-node-waiting .dag-label, .dag-node-waiting .dag-title,
  .dag-node-pending .dag-label, .dag-node-pending .dag-title,
  .dag-node-waiting_deps .dag-label, .dag-node-waiting_deps .dag-title { fill: var(--gray); }
  .dag-node-skipped rect { fill: var(--gray-bg); stroke: var(--gray); stroke-dasharray: 4 4; opacity: 0.6; }
  .dag-node-skipped .dag-label, .dag-node-skipped .dag-title { fill: var(--gray); opacity: 0.6; }
  .dag-node-retrying rect { fill: var(--amber-bg); stroke: var(--amber); stroke-dasharray: 6 3; }
  .dag-node-retrying .dag-label, .dag-node-retrying .dag-title { fill: var(--amber); }
  .dag-node .dag-status-icon { fill: var(--txt2); }
  /* Pulsing animation for working nodes */
  @keyframes dagPulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.4; } }
  .dag-node-working rect { animation: dagPulse 1.8s ease-in-out infinite; }
  /* Animated dashed edge for active connections */
  @keyframes dagDash { to { stroke-dashoffset: -20; } }
  .dag-edge-active { stroke-dasharray: 8 4; animation: dagDash 0.8s linear infinite; stroke-width: 2; }
  /* Dimmed state for non-highlighted elements */
  .dag-node.dag-dimmed rect { opacity: 0.25; }
  .dag-node.dag-dimmed text { opacity: 0.25; }
  .dag-edge.dag-dimmed { opacity: 0.1; }
  .dag-edge.dag-highlighted { stroke-width: 2.5; opacity: 1; }
  .dag-node.dag-highlighted rect { stroke-width: 3; filter: drop-shadow(0 0 4px rgba(0,0,0,0.15)); }
  /* DAG responsive: horizontal scroll on small screens */
  @media (max-width: 768px) {
    .dag-container { overflow-x: auto; overflow-y: auto; -webkit-overflow-scrolling: touch; max-height: 70vh; }
    .dag-container svg { min-width: 500px; }
  }

  /* ── Activity Feed ─────────────────────────────────────── */
  .activity-feed {
    border-top: 1px solid var(--border); margin-top: 1rem;
    max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
    padding-top: 8px; transition: max-height 0.3s ease;

    display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;

    cursor: pointer; transition: all var(--transition);

  .activity-entry {

  .activity-icon { flex-shrink: 0; font-size: 13px; width: 18px; text-align: center; }

  /* ── Druckansicht ───────────────────────────────────────── */
  @media print {
    /* Verstecke interaktive Elemente */
    .top-controls, .conn-bar, .conn-badge, .global-search-wrap,
    .btn-primary, .btn-outline, .btn-retry, .btn-intervene, .btn-quick, .btn-milestone,
    .filter-bar, .shortcuts-hint, #historyArea, .btn-print,
    .activity-feed-panel, .modal-overlay, .confirm-overlay,
    .intervention-form, .intervention-actions, .intervention-badge,
    .recovery-banner, .banner, .template-grid, .template-manage-bar, .template-filter-tags,
    .setup-box, .btn-icon, .copy-btn, .details-link, .agent-title-link,
    .milestone-actions, .merge-strategy-select, .merge-report-toggle,
    .changelog-filter-row, .changelog-tab-bar,
    .bulk-actions, .history-actions, .history-filters, .history-tabs,
    .partial-retry-btns, .quick-actions,
    #bannerArea, .print-no-print { display: none !important; }

    /* Basis */
    body { background: #fff !important; color: #000 !important; font-size: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #app { max-width: 100%; padding: 0.5cm; }

    /* Karten */
    .card { box-shadow: none !important; border: 1px solid #ccc !important; break-inside: avoid; background: #fff !important; }
    .agent-card { box-shadow: none !important; border: 1px solid #999 !important; break-inside: avoid; background: #fff !important; animation: none !important; }

    /* Seitenumbrüche */
    .agent-card { page-break-inside: avoid; }
    .agent-grid { display: block !important; }
    .agent-grid .agent-card { margin-bottom: 12px; }
    .coord-final-report { page-break-before: always; }
    .complete-banner, .partial-banner { page-break-before: always; }

    /* Konversationen komplett sichtbar */
    .agent-conv { max-height: none !important; overflow: visible !important; }
    .proto-scroll { max-height: none !important; overflow: visible !important; }

    /* Finaler Bericht immer offen */
    #finalReportBody { display: block !important; }
    .coord-final-toggle .arrow { display: none !important; }

    /* Badge als Text statt farbigem Hintergrund */
    .badge { background: transparent !important; border: 1px solid #999 !important; color: #000 !important; }
    .badge .dot { background: #666 !important; }
    .badge .spinner { display: none !important; }

    /* Score-Badges druckfreundlich */
    .score-badge, .coord-rating { background: transparent !important; border: 1px solid #666 !important; color: #000 !important; }

    /* Monochrome-freundlich */
    .bubble { background: #f5f5f5 !important; color: #000 !important; border: 1px solid #ddd !important; }
    .bubble-label { color: #555 !important; }
    .bubble-question { background: #f0f0e0 !important; border-color: #ccc !important; }
    .bubble-coordinator { background: #e8e8f0 !important; border-color: #ccc !important; }

    /* Agent-Status als lesbarer Text */
    .agent-card.working { border-color: #333 !important; }
    .agent-card.done { border-color: #666 !important; }
    .agent-card.error { border-color: #999 !important; border-style: dashed !important; }
    .agent-card.skipped { opacity: 0.6; }

    /* Fortschrittsbalken druckbar */
    .pbar-fill, .agent-progress-fill { background: #333 !important; }
    .pbar-wrap, .agent-progress { background: #eee !important; }

    /* Token-Panel immer offen */
    .token-panel-body { display: block !important; }

    /* Bubble break-inside vermeiden */
    .bubble { page-break-inside: avoid; }

    /* Links nicht unterstreichen */
    a { color: #000 !important; text-decoration: none !important; }

    /* Projekt-Header */
    .proj-header { border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 12px; }
    .proj-title { font-size: 20px; }
    .proj-summary { color: #333 !important; }
  }

  /* ── Changelog Timeline ───────────────────────────────────── */

  .changelog-action-system { background: var(--gray-bg); color: var(--gray); }
  .changelog-action-error { background: var(--red-bg); color: var(--red); }
  .changelog-action-working { background: var(--blue-bg); color: var(--blue); }
  .changelog-action-waiting { background: var(--gray-bg); color: var(--gray); }
  .changelog-time { font-size: 10px; color: var(--txt3); font-family: var(--mono); margin-left: auto; }
  .changelog-summary { font-size: 12px; color: var(--txt2); line-height: 1.5; word-break: break-word; }
  .changelog-files { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .changelog-file { font-size: 10px; font-family: var(--mono); padding: 2px 6px; background: var(--bg3); border-radius: 4px; color: var(--blue); cursor: pointer; transition: background var(--transition); }
  .changelog-file:hover { background: var(--blue-bg); }
  .changelog-empty { color: var(--txt3); font-size: 12px; font-style: italic; padding: 1rem 0; }
  .changelog-loading { color: var(--txt3); font-size: 12px; padding: 1rem 0; }
  .changelog-tab-bar { display: flex; gap: 0; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .changelog-tab { padding: 8px 16px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; background: none; color: var(--txt2); border-bottom: 2px solid transparent; transition: color var(--transition), border-color var(--transition); }
  .changelog-tab:hover { color: var(--txt); }
  .changelog-tab.active { color: var(--txt); border-bottom-color: var(--blue); }
  .changelog-filter-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .changelog-filter-btn { font-size: 10px; padding: 3px 10px; border-radius: 99px; border: 0.5px solid var(--border); background: var(--bg2); color: var(--txt2); cursor: pointer; transition: all var(--transition); }
  .changelog-filter-btn.active { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }

  /* ── Diff-Modal (Projektvergleich erweitert) ──────────────── */
  .diff-modal { max-width: 960px; width: 95%; max-height: 85vh; overflow-y: auto; }
  .diff-modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1rem; }
  .diff-section { margin-bottom: 1.25rem; }
  .diff-section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--txt3); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .diff-section-count { font-size: 10px; padding: 1px 7px; border-radius: 99px; font-weight: 600; }
  .diff-count-added { background: var(--teal-bg); color: var(--teal); }
  .diff-count-removed { background: var(--red-bg); color: var(--red); }
  .diff-count-changed { background: var(--amber-bg); color: var(--amber); }
  .diff-item { padding: 8px 12px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 6px; }
  .diff-item-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .diff-item-detail { font-size: 11px; color: var(--txt2); }
  .diff-change-row { display: flex; align-items: center; gap: 8px; font-size: 11px; padding: 3px 0; }
  .diff-field-label { font-weight: 600; color: var(--txt3); min-width: 60px; text-transform: capitalize; }
  .diff-from { color: var(--red); text-decoration: line-through; }
  .diff-to { color: var(--green); }
  .diff-arrow { color: var(--txt3); }
  .diff-scores { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
  .diff-score-col { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
  .diff-score-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .diff-score-stat { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
  .diff-score-label { color: var(--txt2); }
  .diff-score-value { font-weight: 600; font-family: var(--mono); }
  .diff-delta { text-align: center; padding: 8px; background: var(--bg2); border-radius: var(--radius-sm); border: 0.5px solid var(--border); margin-bottom: 1rem; }
  .diff-delta-value { font-size: 20px; font-weight: 700; font-family: var(--mono); }
  .diff-delta-value.positive { color: var(--green); }
  .diff-delta-value.negative { color: var(--red); }
  .diff-delta-value.neutral { color: var(--txt3); }
  .diff-delta-label { font-size: 10px; color: var(--txt3); text-transform: uppercase; letter-spacing: 0.05em; }
  .diff-empty { color: var(--txt3); font-size: 12px; font-style: italic; }
  @media (max-width: 640px) {
    .diff-scores { grid-template-columns: 1fr; }
  }

  /* ── Performance-Monitoring Modal ───────────────────────────── */
  .perf-modal { max-width: 700px; }
  .perf-modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1rem; }
  .perf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1rem; }
  .perf-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; text-align: center; }
  .perf-card-label { font-size: 10px; color: var(--txt3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .perf-card-value { font-size: 22px; font-weight: 700; color: var(--txt); font-family: var(--mono); }
  .perf-card-unit { font-size: 11px; color: var(--txt2); margin-top: 2px; }
  .perf-bar-wrap { height: 10px; background: var(--bg3); border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .perf-bar-fill { height: 100%; border-radius: 5px; transition: width 0.5s ease, background 0.3s ease; }
  .perf-bar-fill.green { background: var(--green); }
  .perf-bar-fill.yellow { background: var(--amber); }
  .perf-bar-fill.red { background: var(--red); }
  .perf-section { margin-bottom: 1rem; }
  .perf-section-title { font-size: 12px; font-weight: 600; color: var(--txt2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .perf-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .perf-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--txt3); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .perf-table td { padding: 5px 8px; border-bottom: 0.5px solid var(--border); color: var(--txt); font-family: var(--mono); font-size: 11px; }
  .perf-table tr:hover td { background: var(--bg2); }
  .perf-table .ep-name { font-family: var(--font); color: var(--txt2); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .perf-auto-label { font-size: 10px; color: var(--txt3); margin-top: 8px; text-align: right; }
  .perf-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }

  /* ── Agent-Vergleichsansicht ─────────────────────────────── */
  .compare-modal { max-width: 960px; width: 95%; max-height: 85vh; }
  .compare-modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1rem; }
  .compare-select-row { display: flex; gap: 12px; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .compare-select-row select { padding: 6px 10px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); color: var(--txt); font-size: 13px; font-family: var(--font); min-width: 180px; }
  .compare-select-row select:focus { outline: none; border-color: var(--border2); }
  .compare-select-row .compare-vs { font-size: 13px; font-weight: 600; color: var(--txt3); }
  .compare-side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 1.5rem; }
  .compare-agent-col { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
  .compare-agent-col h4 { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .compare-stat-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 12px; border-bottom: 0.5px solid var(--border); }
  .compare-stat-row:last-child { border-bottom: none; }
  .compare-stat-label { color: var(--txt2); }
  .compare-stat-value { font-weight: 600; font-family: var(--mono); font-size: 12px; }
  .compare-stat-value.better { color: var(--green); }
  .compare-stat-value.worse { color: var(--red); }
  .compare-stat-value.neutral { color: var(--txt); }
  .compare-bar-section { margin-bottom: 1.5rem; }
  .compare-bar-section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--txt2); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .compare-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .compare-bar-label { flex: 0 0 90px; text-align: right; color: var(--txt2); }
  .compare-bar-pair { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .compare-bar-track { height: 16px; background: var(--bg3); border-radius: 3px; overflow: hidden; display: flex; align-items: center; position: relative; }
  .compare-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
  .compare-bar-fill.agent-a { background: var(--blue); }
  .compare-bar-fill.agent-b { background: var(--purple); }
  .compare-bar-val { flex: 0 0 40px; font-size: 10px; color: var(--txt3); font-family: var(--mono); text-align: right; }
  .compare-table-section { margin-bottom: 1.5rem; }
  .compare-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .compare-table th { text-align: left; padding: 7px 10px; font-weight: 600; color: var(--txt2); border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .compare-table td { padding: 7px 10px; border-bottom: 0.5px solid var(--border); color: var(--txt); }
  .compare-table tr:last-child td { border-bottom: none; }
  .compare-table tr:hover td { background: var(--bg2); }
  .compare-table td.better-cell { background: rgba(29,158,117,0.08); }
  .compare-table td.worse-cell { background: rgba(163,45,45,0.06); }
  .compare-table .diff-pos { color: var(--green); font-weight: 500; }
  .compare-table .diff-neg { color: var(--red); font-weight: 500; }
  .compare-table .diff-zero { color: var(--txt3); }
  .compare-legend { display: flex; gap: 14px; margin-bottom: 12px; font-size: 11px; color: var(--txt2); }
  .compare-legend-item { display: flex; align-items: center; gap: 5px; }
  .compare-legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  .compare-legend-dot.a { background: var(--blue); }
  .compare-legend-dot.b { background: var(--purple); }
  /* Alle-Agenten Uebersichtstabelle */
  .compare-overview-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .compare-overview-table th { text-align: left; padding: 7px 10px; font-weight: 600; color: var(--txt2); border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; user-select: none; white-space: nowrap; }
  .compare-overview-table th:hover { color: var(--txt); background: var(--bg2); }
  .compare-overview-table th .sort-arrow { font-size: 9px; margin-left: 3px; opacity: 0.5; }
  .compare-overview-table th.sorted .sort-arrow { opacity: 1; color: var(--blue); }
  .compare-overview-table td { padding: 6px 10px; border-bottom: 0.5px solid var(--border); color: var(--txt); font-family: var(--mono); font-size: 11px; }
  .compare-overview-table tr:hover td { background: var(--bg2); }
  .compare-overview-table td.best-val { background: rgba(29,158,117,0.12); color: var(--green); font-weight: 600; }
  .compare-overview-table td.agent-name-cell { font-family: var(--font); font-weight: 500; font-size: 12px; }
  .btn-compare { padding: 4px 12px; background: var(--purple-bg); border: 0.5px solid var(--purple);
    border-radius: var(--radius-sm); font-size: 11px; cursor: pointer; color: var(--purple);
    transition: opacity var(--transition); display: inline-flex; align-items: center; gap: 4px; }
  .btn-compare:hover { opacity: 0.8; }
  .compare-tabs { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 1px solid var(--border); }
  .compare-tab { padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--txt3); transition: color var(--transition), border-color var(--transition); font-family: var(--font); }
  .compare-tab:hover { color: var(--txt2); }
  .compare-tab.active { color: var(--txt); border-bottom-color: var(--purple); }
  .compare-tab-content { display: none; }
  .compare-tab-content.active { display: block; }
  @media (max-width: 600px) {
    .compare-side-by-side { grid-template-columns: 1fr; }
    .compare-select-row select { min-width: 120px; }
  }

  /* ── Globale Suchleiste ──────────────────────────────────── */
  .global-search-wrap {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 150; width: 420px; max-width: calc(100vw - 240px);
  }
  .global-search-input-wrap {
    position: relative; display: flex; align-items: center;
  }
  .global-search-input {
    width: 100%; padding: 8px 14px 8px 34px;
    background: var(--bg); border: 0.5px solid var(--border2);
    border-radius: 99px; font-size: 13px; color: var(--txt);
    font-family: var(--font); outline: none; box-shadow: var(--shadow-md);
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
  }
  .global-search-input:focus {
    border-color: var(--blue); box-shadow: 0 4px 16px rgba(24,95,165,0.15);
  }
  .global-search-input::placeholder { color: var(--txt3); }
  .global-search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; color: var(--txt3); pointer-events: none;
  }
  .global-search-kbd {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-size: 10px; color: var(--txt3); background: var(--bg2);
    border: 0.5px solid var(--border); border-radius: 4px; padding: 1px 6px;
    font-family: var(--mono); pointer-events: none;
  }
  .global-search-input:focus ~ .global-search-kbd { display: none; }

  /* ── Such-Ergebnisse Dropdown ────────────────────────────── */
  .search-dropdown {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--bg); border: 0.5px solid var(--border2);
    border-radius: var(--radius); box-shadow: var(--shadow-md);
    max-height: 420px; overflow-y: auto; display: none;
    animation: fadein 0.15s ease;
  }
  .search-dropdown.visible { display: block; }
  .search-scope-bar {
    display: flex; gap: 4px; padding: 8px 12px; border-bottom: 0.5px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 1;
  }
  .search-scope-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 99px;
    border: 0.5px solid var(--border); background: var(--bg2);
    color: var(--txt2); cursor: pointer; font-family: var(--font);
    transition: all var(--transition); white-space: nowrap;
  }
  .search-scope-btn:hover { background: var(--bg3); color: var(--txt); }
  .search-scope-btn.active {
    background: var(--blue); color: #fff; border-color: var(--blue);
  }
  .search-group-header {
    font-size: 11px; font-weight: 600; color: var(--txt3);
    padding: 8px 14px 4px; text-transform: uppercase; letter-spacing: 0.05em;
    position: sticky; top: 40px; background: var(--bg); z-index: 1;
  }
  .search-result-item {
    display: flex; gap: 10px; padding: 8px 14px; cursor: pointer;
    transition: background var(--transition); align-items: flex-start;
  }
  .search-result-item:hover, .search-result-item.active {
    background: var(--bg2);
  }
  .search-result-icon {
    flex-shrink: 0; font-size: 14px; margin-top: 2px; width: 20px; text-align: center;
  }
  .search-result-body { flex: 1; min-width: 0; }
  .search-result-path {
    font-size: 11px; color: var(--txt3); font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .search-result-match {
    font-size: 12px; color: var(--txt); margin-top: 2px; line-height: 1.4;
  }
  .search-result-match mark {
    background: var(--amber-bg); color: var(--amber-dark);
    border-radius: 2px; padding: 0 2px;
  }
  .search-result-context {
    font-size: 11px; color: var(--txt3); margin-top: 2px;
    font-family: var(--mono); line-height: 1.4;
    max-height: 48px; overflow: hidden;
  }
  .search-empty {
    padding: 20px 14px; text-align: center; color: var(--txt3); font-size: 12px;
  }
  .search-loading {
    padding: 16px 14px; text-align: center; color: var(--txt3); font-size: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .search-loading .spin {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%;
  }
  @media (max-width: 768px) {
    .global-search-wrap { width: 260px; max-width: calc(100vw - 180px); }
    .global-search-input { font-size: 12px; padding: 7px 12px 7px 30px; }
  }
  @media (max-width: 480px) {
    .global-search-wrap { width: 180px; max-width: calc(100vw - 140px); }
  }
  /* Merge-System Styles */
  .merge-section { margin-top: 0.5rem; }
  .merge-stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
  .merge-stat { background: var(--bg2); border-radius: var(--radius-sm); padding: 6px 12px; font-size: 12px; font-family: var(--mono); }
  .merge-stat-label { color: var(--txt3); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
  .merge-stat-value { color: var(--txt); font-weight: 600; }
  .merge-conflict { background: rgba(238,184,104,0.1); border-left: 3px solid var(--amber); padding: 6px 10px; margin: 4px 0; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 12px; }
  .merge-conflict-file { font-family: var(--mono); font-weight: 600; color: var(--amber); }
  .merge-conflict-agents { color: var(--txt2); font-size: 11px; margin-top: 2px; }
  .merge-conflict-resolution { color: var(--txt3); font-size: 11px; font-style: italic; }
  .merge-file-origin { display: inline-block; background: var(--blue); color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-left: 6px; font-family: var(--mono); }
  .merge-strategy-select { font-size: 12px; padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--txt); margin-right: 6px; }
  .merge-report-toggle { cursor: pointer; color: var(--blue); font-size: 12px; text-decoration: underline; margin-left: 8px; }
  .merge-report-content { background: var(--bg2); border-radius: var(--radius-sm); padding: 12px; margin-top: 8px; font-size: 12px; white-space: pre-wrap; font-family: var(--mono); max-height: 300px; overflow-y: auto; display: none; }
  .merge-report-content.open { display: block; }

  /* ── Onboarding Tour ────────────────────────────────────── */
  .tour-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 10000; pointer-events: none; }
  .tour-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); z-index: 9998; pointer-events: auto; transition: opacity 0.3s ease; }
  .tour-highlight { position: absolute; z-index: 9999; border-radius: var(--radius); box-shadow: 0 0 0 4000px rgba(0,0,0,0.45), 0 0 0 3px var(--blue), 0 0 16px rgba(24,95,165,0.4); pointer-events: none; transition: all 0.35s ease; }
  .tour-tooltip { position: absolute; z-index: 10001; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius); padding: 18px 20px; max-width: 360px; width: 90vw; box-shadow: var(--shadow-md); pointer-events: auto; animation: fadein 0.25s ease; }
  .tour-tooltip-step { font-size: 10px; font-weight: 600; color: var(--blue); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .tour-tooltip-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: var(--txt); }
  .tour-tooltip-desc { font-size: 13px; color: var(--txt2); line-height: 1.6; margin-bottom: 14px; }
  .tour-tooltip-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .tour-tooltip-actions .tour-skip { background: none; border: none; color: var(--txt3); font-size: 12px; cursor: pointer; padding: 6px 10px; }
  .tour-tooltip-actions .tour-skip:hover { color: var(--txt2); text-decoration: underline; }
  .tour-tooltip-actions .tour-next { padding: 7px 18px; background: var(--txt); color: var(--bg); border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity var(--transition); }

  .ctx-help-tooltip { position: absolute; z-index: 500; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 14px; max-width: 280px; width: max-content; box-shadow: var(--shadow-md); font-size: 12px; color: var(--txt2); line-height: 1.5; font-weight: 400; pointer-events: none; animation: fadein 0.15s ease; left: 50%; transform: translateX(-50%); bottom: calc(100% + 8px); white-space: normal; }

  .help-panel { width: 420px; max-width: 95vw; height: 100vh; background: var(--bg); border-left: 1px solid var(--border2); box-shadow: -4px 0 20px rgba(0,0,0,0.15); display: flex; flex-direction: column; animation: helpSlideIn 0.25s ease; overflow: hidden; }
  @keyframes helpSlideIn { from { transform: translateX(100%); } to { transform: none; } }
  .help-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }

  .help-section-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; cursor: pointer; background: var(--bg2); font-size: 13px; font-weight: 600; color: var(--txt); user-select: none; transition: background var(--transition); }

  /* ── Performance Dashboard ──────────��───────────────────── */

  /* CSS Bar Chart */
  .perf-bar-chart { display: flex; flex-direction: column; gap: 8px; }
  .perf-bar-row { display: flex; align-items: center; gap: 8px; }
  .perf-bar-label { flex: 0 0 120px; font-size: 11px; color: var(--txt2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }

  .perf-bar-fill-blue { background: linear-gradient(90deg, var(--blue-bg), var(--blue)); }

  .perf-bar-val-out { flex: 0 0 60px; font-size: 10px; color: var(--txt3); font-family: var(--mono); text-align: right; }

  /* CSS Circle / Donut */
  .perf-circle-wrap { display: flex; align-items: center; gap: 16px; }

  .perf-sparkline { display: flex; align-items: flex-end; gap: 2px; height: 32px; }
  .perf-spark-bar { flex: 1; min-width: 4px; max-width: 16px; background: var(--blue); border-radius: 2px 2px 0 0; transition: height 0.3s ease, background 0.2s; opacity: 0.7; }

  .perf-rt-agents { display: flex; flex-direction: column; gap: 6px; }

  .perf-rt-agent-name { flex: 1; color: var(--txt2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .perf-rt-agent-bar { flex: 0 0 80px; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .perf-rt-agent-fill { height: 100%; background: var(--blue); border-radius: 3px; transition: width 0.5s ease; }
  .perf-rt-agent-pct { flex: 0 0 35px; font-size: 10px; font-family: var(--mono); color: var(--txt3); text-align: right; }

  /* History Table */
  .perf-history-table { width: 100%; border-collapse: collapse; font-size: 11px; }

  .perf-history-table th:hover { color: var(--txt); }
  .perf-history-table th .sort-arrow { font-size: 9px; margin-left: 3px; opacity: 0.5; }
  .perf-history-table th.sorted .sort-arrow { opacity: 1; color: var(--blue); }
  .perf-history-table td { padding: 6px 8px; border-bottom: 0.5px solid var(--border); color: var(--txt2); white-space: nowrap; }
  .perf-history-table tr:last-child td { border-bottom: none; }
  .perf-history-table tr:hover td { background: var(--bg2); }
  .perf-history-table .mono { font-family: var(--mono); }
  .perf-history-table .perf-phase { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 10px; font-weight: 500; }
  .perf-phase-complete { background: var(--teal-bg); color: var(--teal); }
  .perf-phase-error { background: var(--red-bg); color: var(--red); }
  .perf-phase-partial { background: var(--amber-bg); color: var(--amber); }

  /* Budget Bar */
  .perf-budget-bar { margin-top: 8px; }
  .perf-budget-track { height: 12px; background: var(--bg3); border-radius: 6px; overflow: hidden; position: relative; }
  .perf-budget-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; }
  .perf-budget-marker { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--amber); border-radius: 1px; }

  /* Section label */

  }
