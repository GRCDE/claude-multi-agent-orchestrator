var WEBHOOK_EVENTS = [
  { key: 'project-started', label: 'Projekt gestartet' },
  { key: 'project-done', label: 'Projekt fertig' },
  { key: 'project-error', label: 'Projekt Fehler' },
  { key: 'agent-done', label: 'Agent fertig' },
  { key: 'agent-error', label: 'Agent Fehler' },
  { key: 'plan-created', label: 'Plan erstellt' },
  { key: 'plan-adapted', label: 'Plan angepasst' },
  { key: 'budget-warning', label: 'Budget Warnung' },
  { key: 'budget-exceeded', label: 'Budget ueberschritten' }
];

var _webhooksCache = [];

function openWebhooksTab() {
  var container = document.getElementById('webhooksTabContent');
  if (!container) return;
  container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--txt3)">Lade Webhooks...</div>';

  authFetch('/api/webhooks', { headers: authHeaders() })
    .then(function(r) { return r.json(); })

      _webhooksCache = hooks;
      renderWebhooksTab(hooks);
    })
    .catch(function(e) {
      if (container) container.innerHTML = '<div class="webhook-empty">Fehler beim Laden: ' + esc(e.message) + '</div>';
    });
}

function renderWebhooksTab(hooks) {
  var container = document.getElementById('webhooksTabContent');
  if (!container) return;

  var html = '';

  html += '<div class="webhook-form" id="webhookFormWrap">' +
    '<div style="font-size:13px;font-weight:600;margin-bottom:8px">Neuer Webhook</div>' +
    '<div class="settings-field">' +
      '<label for="wh_url">URL</label>' +
      '<input type="text" id="wh_url" placeholder="https://example.com/webhook" style="width:100%;padding:7px 10px;background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--radius-sm);color:var(--txt);font-family:var(--mono);font-size:12px">' +
    '</div>' +
    '<div class="settings-field">' +
      '<label>Events</label>' +
      '<div class="wh-events-grid">';
  for (var wi = 0; wi < WEBHOOK_EVENTS.length; wi++) {
    var wev = WEBHOOK_EVENTS[wi];
    html += '<label><input type="checkbox" class="wh-event-cb" value="' + wev.key + '" checked> ' + esc(wev.label) + '</label>';
  }
  html += '</div></div>' +
    '<div class="settings-field">' +
      '<label for="wh_secret">Secret (min. 8 Zeichen)</label>' +
      '<input type="password" id="wh_secret" placeholder="Geheimes Token" style="width:100%;padding:7px 10px;background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--radius-sm);color:var(--txt);font-family:var(--mono);font-size:12px">' +
    '</div>' +
    '<div style="display:flex;gap:8px;align-items:center">' +
      '<button class="btn-primary" onclick="addWebhook()" style="font-size:12px;padding:5px 14px">Registrieren</button>' +
      '<span id="webhookFormStatus" style="font-size:11px;min-height:16px"></span>' +
    '</div>' +
  '</div>';

  if (hooks.length === 0) {
    html += '<div class="webhook-empty">Noch keine Webhooks registriert.</div>';
  } else {
    html += '<div style="font-size:13px;font-weight:600;margin-bottom:6px">Registrierte Webhooks (' + hooks.length + '/10)</div>';
    html += '<div class="webhook-list">';
    for (var wh = 0; wh < hooks.length; wh++) {
      var hook = hooks[wh];
      var isActive = hook.active !== false;
      html += '<div class="webhook-item' + (isActive ? '' : ' inactive') + '">' +
        '<div class="webhook-item-header">' +
          '<div class="webhook-item-url">' + esc(hook.url) + '</div>' +
          '<span class="webhook-item-status ' + (isActive ? 'active' : 'paused') + '">' + (isActive ? 'Aktiv' : 'Pausiert') + '</span>' +
        '</div>' +
        '<div class="webhook-item-events">';
      for (var we = 0; we < (hook.events || []).length; we++) {
        html += '<span class="webhook-event-badge">' + esc(hook.events[we]) + '</span>';
      }
      html += '</div>' +
        '<div class="webhook-item-actions">' +
          "<button onclick=\"testWebhookById('" + esc(hook.id) + "')\" title=\"Test-Ping senden\">Test</button>" +
          "<button onclick=\"toggleWebhookActive('" + esc(hook.id) + "')\">" + (isActive ? 'Pausieren' : 'Aktivieren') + '</button>' +
          "<button class=\"btn-danger\" onclick=\"deleteWebhook('" + esc(hook.id) + "')\">L\u00F6schen</button>" +
          "<button onclick=\"toggleWebhookDeliveries('" + esc(hook.id) + "')\">Auslieferungen</button>" +
        '</div>';

      var deliveries = hook.deliveries || [];
      html += '<div class="webhook-deliveries" id="whDeliveries_' + hook.id + '" style="display:none">';
      if (deliveries.length === 0) {
        html += '<div style="font-size:10px;color:var(--txt3);padding:6px 0">Keine Auslieferungen vorhanden.</div>';
      } else {
        html += '<table><thead><tr><th>Zeit</th><th>Event</th><th>Status</th><th>Fehler</th></tr></thead><tbody>';
        for (var wd = deliveries.length - 1; wd >= Math.max(0, deliveries.length - 20); wd--) {
          var wdel = deliveries[wd];
          var wdTime = wdel.timestamp ? new Date(wdel.timestamp).toLocaleTimeString('de-DE') : '-';
          var wdStatus = wdel.statusCode ? String(wdel.statusCode) : '-';
          var wdClass = wdel.success ? 'delivery-ok' : 'delivery-err';
          html += '<tr><td>' + wdTime + '</td><td>' + esc(wdel.event || '-') + '</td>' +
            '<td class="' + wdClass + '">' + wdStatus + '</td>' +
            '<td>' + esc(wdel.error || '-') + '</td></tr>';
        }
        html += '</tbody></table>';
      }
      html += '</div></div>';
    }
    html += '</div>';
  }

  container.innerHTML = html;

function addWebhook() {
  var urlEl = document.getElementById('wh_url');
  var secretEl = document.getElementById('wh_secret');
  var statusEl = document.getElementById('webhookFormStatus');
  if (!urlEl || !secretEl) return;

  var whUrl = urlEl.value.trim();
  var whSecret = secretEl.value;
  var checkboxes = document.querySelectorAll('.wh-event-cb:checked');
  var whEvents = [];
  for (var ci = 0; ci < checkboxes.length; ci++) {
    whEvents.push(checkboxes[ci].value);
  }

  if (!whUrl) { if (statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'URL ist erforderlich'; } return; }
  if (whEvents.length === 0) { if (statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Mindestens ein Event auswaehlen'; } return; }
  if (!whSecret || whSecret.length < 8) { if (statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Secret: mindestens 8 Zeichen'; } return; }

  if (statusEl) { statusEl.style.color = 'var(--txt3)'; statusEl.textContent = 'Registriere...'; }

  authFetch('/api/webhooks', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify({ url: whUrl, events: whEvents, secret: whSecret })
  }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (res.ok && res.data.ok) {
        if (statusEl) { statusEl.style.color = 'var(--green)'; statusEl.textContent = 'Webhook registriert!'; }
        urlEl.value = '';
        secretEl.value = '';
        openWebhooksTab();
      } else {
        if (statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = res.data.error || 'Fehler'; }
      }
    }).catch(function(e) {
      if (statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Netzwerkfehler: ' + e.message; }
    });
}

function deleteWebhook(whId) {
  if (!confirm('Webhook wirklich l\u00F6schen?')) return;
  authFetch('/api/webhooks/' + encodeURIComponent(whId), {
    method: 'DELETE',
    headers: authHeaders()
  }).then(function(r) { return r.json(); })
    .then(function() { openWebhooksTab(); })
    .catch(function(e) { alert('Fehler: ' + e.message); });
}

function testWebhookById(whId) {
  authFetch('/api/webhooks/' + encodeURIComponent(whId) + '/test', {
    method: 'POST',
    headers: authHeaders()
  }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (res.ok && res.data.ok) {
        alert('Test erfolgreich! HTTP ' + res.data.statusCode);
      } else {
        alert('Test fehlgeschlagen: ' + (res.data.error || 'Unbekannter Fehler'));
      }
      openWebhooksTab();
    }).catch(function(e) {
      alert('Netzwerkfehler: ' + e.message);
    });
}

function toggleWebhookActive(whId) {
  authFetch('/api/webhooks/' + encodeURIComponent(whId) + '/toggle', {
    method: 'POST',
    headers: authHeaders()
  }).then(function(r) { return r.json(); })
    .then(function() { openWebhooksTab(); })
    .catch(function(e) { alert('Fehler: ' + e.message); });
}

function toggleWebhookDeliveries(whId) {
  var el = document.getElementById('whDeliveries_' + whId);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ── Settings-Modal um Webhooks-Tab erweitern ────────────────
var _origOpenSettings_wh = openSettings;
openSettings = function() {
  _origOpenSettings_wh();
  setTimeout(function() {
    var modal = document.querySelector('#settingsModal .settings-modal');
    if (!modal) return;
    if (modal.querySelector('.settings-tab-bar')) return;

    var tabBar = document.createElement('div');
    tabBar.className = 'modal-tabs settings-tab-bar';
    tabBar.innerHTML =
      '<button class="modal-tab active" onclick="switchSettingsTab(\'general\')">Allgemein</button>' +
      '<button class="modal-tab" onclick="switchSettingsTab(\'webhooks\')">Webhooks</button>' +
      '<button class="modal-tab" onclick="switchSettingsTab(\'profiles\')">Profile</button>' +
      '<button class="modal-tab" onclick="switchSettingsTab(\'snapshots\')">Snapshots</button>';

    var h3 = modal.querySelector('h3');
    var closeBtn = modal.querySelector('.modal-close');

    var generalContent = document.createElement('div');
    generalContent.id = 'settingsTabGeneral';
    generalContent.className = 'settings-tab-content';

    var children = Array.from(modal.children);
    var afterH3 = false;
    for (var si = 0; si < children.length; si++) {
      var child = children[si];
      if (child === h3) { afterH3 = true; continue; }
      if (child === closeBtn) continue;
      if (child === tabBar) continue;
      if (afterH3) {
        generalContent.appendChild(child);
      }
    }

    var webhooksContent = document.createElement('div');
    webhooksContent.id = 'webhooksTabContent';
    webhooksContent.className = 'settings-tab-content';
    webhooksContent.style.display = 'none';

    var profilesContent = document.createElement('div');
    profilesContent.id = 'profilesTabContent';
    profilesContent.className = 'settings-tab-content';
    profilesContent.style.display = 'none';

    var snapshotsContent = document.createElement('div');
    snapshotsContent.id = 'snapshotsTabContent';
    snapshotsContent.className = 'settings-tab-content';
    snapshotsContent.style.display = 'none';

    if (h3 && h3.nextSibling) {
      modal.insertBefore(tabBar, h3.nextSibling);
    } else {
      modal.appendChild(tabBar);
    }
    modal.appendChild(generalContent);
    modal.appendChild(webhooksContent);
    modal.appendChild(profilesContent);
    modal.appendChild(snapshotsContent);
  }, 150);
};

function switchSettingsTab(tab) {
  var generalEl = document.getElementById('settingsTabGeneral');
  var webhooksEl = document.getElementById('webhooksTabContent');
  var profilesEl = document.getElementById('profilesTabContent');
  var snapshotsEl = document.getElementById('snapshotsTabContent');
  var tabs = document.querySelectorAll('.settings-tab-bar .modal-tab');

  var panels = [generalEl, webhooksEl, profilesEl, snapshotsEl];
  for (var pi = 0; pi < panels.length; pi++) {
    if (panels[pi]) panels[pi].style.display = 'none';
  }
  for (var ti = 0; ti < tabs.length; ti++) {
    tabs[ti].classList.remove('active');
  }

  if (tab === 'webhooks') {
    if (webhooksEl) webhooksEl.style.display = 'block';
    if (tabs[1]) tabs[1].classList.add('active');
    openWebhooksTab();
  } else if (tab === 'profiles') {
    if (profilesEl) profilesEl.style.display = 'block';
    if (tabs[2]) tabs[2].classList.add('active');
    openProfilesTab();
  } else if (tab === 'snapshots') {
    if (snapshotsEl) snapshotsEl.style.display = 'block';
    if (tabs[3]) tabs[3].classList.add('active');
    openSnapshotsTab();
  } else {
    if (generalEl) generalEl.style.display = 'block';
    if (tabs[0]) tabs[0].classList.add('active');
  }
}

function openProfilesTab() {
  var container = document.getElementById('profilesTabContent');
  if (!container) return;
  container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--txt3)">Lade Profile...</div>';

function renderProfilesTab(data) {
  var container = document.getElementById('profilesTabContent');

  html += '<div style="display:flex;gap:8px;margin-bottom:16px">';

  html += '<input id="profileDescInput" type="text" placeholder="Beschreibung (optional)" style="flex:2;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--txt)">';
  html += '<button onclick="saveCurrentProfile()" style="padding:6px 14px;border-radius:6px;background:var(--accent);color:#fff;border:none;cursor:pointer;white-space:nowrap">Aktuelle Config speichern</button>';

    html += '<div style="display:flex;flex-direction:column;gap:8px">';

  html += '</div>';
  html += '</div>';
  container.innerHTML = html;
}

function saveCurrentProfile() {
  var name = document.getElementById('profileNameInput');
  var desc = document.getElementById('profileDescInput');
  if (!name || !name.value.trim()) { alert('Bitte Profilnamen eingeben'); return; }
  authFetch('/api/profiles/save-current', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({ name: name.value.trim(), description: (desc && desc.value.trim()) || '' })
  }).then(function(r) { return r.json(); }).then(function() { openProfilesTab(); })
    .catch(function(e) { alert('Fehler: ' + e.message); });
}

function applyProfile(name) {
  authFetch('/api/profiles/' + encodeURIComponent(name) + '/apply', {
    method: 'POST', headers: authHeaders()
  }).then(function(r) { return r.json(); }).then(function() { openProfilesTab(); })
    .catch(function(e) { alert('Fehler: ' + e.message); });
}

function deleteProfile(name) {
  if (!confirm('Profil "' + name + '" wirklich loeschen?')) return;
  authFetch('/api/profiles/' + encodeURIComponent(name), {
    method: 'DELETE', headers: authHeaders()
  }).then(function() { openProfilesTab(); })
    .catch(function(e) { alert('Fehler: ' + e.message); });
}

function exportProfile(name) {
  window.open('/api/profiles/' + encodeURIComponent(name) + '/export', '_blank');
}

function importProfile(input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      authFetch('/api/profiles/import', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify(data)
      }).then(function() { openProfilesTab(); })
        .catch(function(err) { alert('Import-Fehler: ' + err.message); });
    } catch (err) { alert('Ungueltige JSON-Datei'); }
  };
  reader.readAsText(input.files[0]);
}

function renderSnapshotsTab(data) {
  var container = document.getElementById('snapshotsTabContent');

var _snapshotCompareId = null;

function createSnapshot() {
  var name = document.getElementById('snapshotNameInput');
  var desc = document.getElementById('snapshotDescInput');
  if (!name || !name.value.trim()) { alert('Bitte Snapshot-Namen eingeben'); return; }
  authFetch('/api/snapshots', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({ name: name.value.trim(), description: (desc && desc.value.trim()) || '' })
  }).then(function(r) { return r.json(); }).then(function() { openSnapshotsTab(); })
    .catch(function(e) { alert('Fehler: ' + e.message); });
}

function restoreSnapshot(id) {
  if (!confirm('Snapshot wirklich wiederherstellen? Der aktuelle Zustand wird ueberschrieben.')) return;
  authFetch('/api/snapshots/' + encodeURIComponent(id) + '/restore', {
    method: 'POST', headers: authHeaders()
  }).then(function(r) { return r.json(); }).then(function() {
    alert('Snapshot wiederhergestellt');
    openSnapshotsTab();
  }).catch(function(e) { alert('Fehler: ' + e.message); });
}

function deleteSnapshot(id) {
  if (!confirm('Snapshot wirklich loeschen?')) return;
  authFetch('/api/snapshots/' + encodeURIComponent(id), {
    method: 'DELETE', headers: authHeaders()
  }).then(function() { openSnapshotsTab(); })
    .catch(function(e) { alert('Fehler: ' + e.message); });
}

function startSnapshotCompare(id, name) {
  if (_snapshotCompareId && _snapshotCompareId !== id) {
    authFetch('/api/snapshots/' + encodeURIComponent(_snapshotCompareId) + '/compare/' + encodeURIComponent(id), { headers: authHeaders() })
      .then(function(r) { return r.json(); })
      .then(function(diff) { showSnapshotDiff(diff); })
      .catch(function(e) { alert('Vergleich fehlgeschlagen: ' + e.message); });
    _snapshotCompareId = null;
    var bar = document.getElementById('snapshotCompareBar');
    if (bar) bar.style.display = 'none';
  } else {
    _snapshotCompareId = id;
    var bar = document.getElementById('snapshotCompareBar');
    var label = document.getElementById('snapshotCompareLabel');
    if (bar) bar.style.display = 'block';
    if (label) label.textContent = name + ' — jetzt zweiten Snapshot waehlen';
  }
}

function cancelSnapshotCompare() {
  _snapshotCompareId = null;
  var bar = document.getElementById('snapshotCompareBar');
  if (bar) bar.style.display = 'none';
}

function showSnapshotDiff(diff) {
  var html = '<div style="padding:16px;max-height:400px;overflow-y:auto">';
  html += '<h4 style="margin:0 0 12px">Snapshot-Vergleich</h4>';
  if (diff.changes && diff.changes.length > 0) {
    html += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
    html += '<tr style="border-bottom:1px solid var(--border)"><th style="text-align:left;padding:4px 8px">Feld</th><th style="text-align:left;padding:4px 8px">Snapshot 1</th><th style="text-align:left;padding:4px 8px">Snapshot 2</th></tr>';
    for (var i = 0; i < diff.changes.length; i++) {
      var c = diff.changes[i];
      html += '<tr style="border-bottom:1px solid var(--border)">';
      html += '<td style="padding:4px 8px;font-weight:bold">' + esc(c.field || c.key || '') + '</td>';
      html += '<td style="padding:4px 8px;color:var(--err)">' + esc(String(c.old || c.value1 || '-')) + '</td>';
      html += '<td style="padding:4px 8px;color:var(--ok)">' + esc(String(c.new || c.value2 || '-')) + '</td>';
      html += '</tr>';
    }
    html += '</table>';
  } else {
    html += '<div style="color:var(--txt3);text-align:center;padding:16px">Keine Unterschiede gefunden.</div>';
  }
  html += '</div>';

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.zIndex = '2000';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = '<div class="modal" style="max-width:700px"><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&times;</button>' + html + '</div>';
  document.body.appendChild(overlay);
}

function toggleCtxHelp(el) {
  var existing = el.querySelector('.ctx-help-tooltip');

  var tip = document.createElement('div');

var _tourActive = false;
var _tourStep = 0;

var TOUR_STEPS = [
  { target: '.setup-box', fallbackTarget: '#app', title: 'Willkommen beim Agent Orchestrator!', desc: 'Hier richtest du dein Projekt ein. Beschreibe was du bauen m\u00F6chtest und der Koordinator erstellt automatisch einen Plan mit Teilaufgaben f\u00FCr die Agenten.', position: 'bottom' },

  { target: '#tourAgentConfig', fallbackTarget: '.setup-box', title: 'Agent-Konfiguration', desc: 'W\u00E4hle die Anzahl der Agenten (2\u201310). Mehr Agenten k\u00F6nnen parallel arbeiten, aber jeder Agent verbraucht Ressourcen. Nach dem Start siehst du ein Dashboard mit dem Fortschritt.', position: 'bottom' },
  { target: '.top-controls', title: 'Werkzeugleiste & Shortcuts', desc: 'Hier findest du Einstellungen, Dark Mode, Analytics und die Hilfe. Dr\u00FCcke ? f\u00FCr Tastenk\u00FCrzel oder F1 f\u00FCr das Hilfe-Panel. Mit Strg+Enter startest du sofort ein Projekt.', position: 'left' }

function checkFirstRun() {
  if (!localStorage.getItem('orchestrator_tour_done')) {
    setTimeout(function() { startTour(); }, 800);
  }
}

function startTour() {
  if (state.phase !== 'setup' && state.phase !== 'idle') return;
  _tourActive = true;
  _tourStep = 0;
  showTourStep();
}

function endTour() {
  _tourActive = false;
  _tourStep = 0;
  localStorage.setItem('orchestrator_tour_done', '1');
  var ol = document.getElementById('tourOverlay');
  if (ol) ol.remove();
  var bd = document.getElementById('tourBackdrop');
  if (bd) bd.remove();
}

function showTourStep() {
  if (!_tourActive || _tourStep >= TOUR_STEPS.length) { endTour(); return; }
  var step = TOUR_STEPS[_tourStep];
  var targetEl = document.querySelector(step.target);
  if (!targetEl && step.fallbackTarget) targetEl = document.querySelector(step.fallbackTarget);
  var oldOl = document.getElementById('tourOverlay');
  if (oldOl) oldOl.remove();
  var oldBd = document.getElementById('tourBackdrop');
  if (oldBd) oldBd.remove();
  if (!targetEl) { _tourStep++; showTourStep(); return; }

  var bd2 = document.createElement('div');
  bd2.id = 'tourBackdrop';
  bd2.className = 'tour-backdrop';
  bd2.style.background = 'transparent';
  document.body.appendChild(bd2);

  var ol2 = document.createElement('div');
  ol2.id = 'tourOverlay';
  ol2.className = 'tour-overlay';
  document.body.appendChild(ol2);

  var rect = targetEl.getBoundingClientRect();
  var pad = 8;
  var hl = document.createElement('div');
  hl.className = 'tour-highlight';
  hl.style.top = (rect.top - pad + window.scrollY) + 'px';
  hl.style.left = (rect.left - pad) + 'px';
  hl.style.width = (rect.width + pad * 2) + 'px';
  hl.style.height = (rect.height + pad * 2) + 'px';
  ol2.appendChild(hl);

  targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

  var tt = document.createElement('div');
  tt.className = 'tour-tooltip';
  var dotsH = '<div class="tour-tooltip-dots">';
  for (var di = 0; di < TOUR_STEPS.length; di++) {
    dotsH += '<div class="tour-tooltip-dot' + (di === _tourStep ? ' active' : '') + '"></div>';
  }
  dotsH += '</div>';
  var isLast = _tourStep === TOUR_STEPS.length - 1;
  tt.innerHTML =
    '<div class="tour-tooltip-step">Schritt ' + (_tourStep + 1) + ' von ' + TOUR_STEPS.length + '</div>' +
    '<div class="tour-tooltip-title">' + esc(step.title) + '</div>' +
    '<div class="tour-tooltip-desc">' + esc(step.desc) + '</div>' +
    '<div class="tour-tooltip-actions">' + dotsH +
      '<button class="tour-skip" onclick="endTour()">' + (isLast ? '' : '\u00DCberspringen') + '</button>' +
      '<button class="tour-next" onclick="nextTourStep()">' + (isLast ? 'Fertig!' : 'Weiter') + '</button>' +
    '</div>';

  var arr = document.createElement('div');
  arr.className = 'tour-tooltip-arrow';
  var pos = step.position || 'bottom';
  if (pos === 'bottom') {
    tt.style.top = (rect.bottom + pad + 16 + window.scrollY) + 'px';
    tt.style.left = Math.max(10, rect.left - 10) + 'px';
    arr.className += ' bottom';
    tt.insertBefore(arr, tt.firstChild);
  } else if (pos === 'top') {
    tt.style.left = Math.max(10, rect.left - 10) + 'px';
    arr.className += ' top';
    tt.appendChild(arr);
    ol2.appendChild(tt);
    tt.style.top = (rect.top - pad - 16 - tt.offsetHeight + window.scrollY) + 'px';
  } else if (pos === 'left') {
    tt.style.top = (rect.top + window.scrollY) + 'px';
    tt.style.left = Math.max(10, rect.left - 380) + 'px';
    arr.className += ' left';
    tt.appendChild(arr);
  }
  if (pos !== 'top') ol2.appendChild(tt);
  bd2.onclick = function() { endTour(); };
}

function nextTourStep() {
  _tourStep++;
  if (_tourStep >= TOUR_STEPS.length) endTour();
  else showTourStep();
}

var HELP_SECTIONS = [
  { id: 'quickstart', title: 'Kurzanleitung', content: '<p><strong>So startest du dein erstes Projekt:</strong></p><ol><li>Beschreibe dein Projekt im Textfeld (z.B. "Erstelle eine REST API mit Express")</li><li>W\u00E4hle die Anzahl der Agenten (2\u201310)</li><li>Klicke "Projekt starten" oder dr\u00FCcke <code>Strg+Enter</code></li><li>Der Koordinator plant die Aufgaben und die Agenten arbeiten los</li><li>Beobachte den Fortschritt im Dashboard</li><li>Nach Abschluss kannst du die Ergebnisse als ZIP herunterladen</li></ol><p>Tipp: Aktiviere "Plan vor Start pr\u00FCfen" um den Plan zu sehen, bevor die Agenten loslegen.</p>' },
  { id: 'faq', title: 'H\u00E4ufige Fragen (FAQ)', content: '<dl><dt>Was passiert, wenn ein Agent einen Fehler hat?</dt><dd>Du kannst den Agent \u00FCber den "Wiederholen"-Button neu starten. Falls das nicht hilft, kannst du ihn \u00FCberspringen oder manuell als fertig markieren.</dd><dt>Kann ich w\u00E4hrend der Ausf\u00FChrung eingreifen?</dt><dd>Ja! Klicke auf "Eingreifen" bei einem laufenden Agenten. Du kannst die Richtung \u00E4ndern, den Agenten \u00FCberspringen, neu starten oder als fertig markieren.</dd><dt>Wo landen die erstellten Dateien?</dt><dd>Alle Dateien werden im <code>projects/</code>-Ordner gespeichert. Jeder Agent hat seinen eigenen Unterordner.</dd><dt>Was sind Abh\u00E4ngigkeiten?</dt><dd>Agenten k\u00F6nnen voneinander abh\u00E4ngen. Agent B wartet z.B. bis Agent A fertig ist, bevor er startet.</dd><dt>Was ist der Qualit\u00E4ts-Score?</dt><dd>Der Koordinator bewertet die Ergebnisse jedes Agenten auf einer Skala von 0\u2013100. Gr\u00FCn (&gt;80) ist gut, Gelb (50\u201380) akzeptabel, Rot (&lt;50) verbesserungsw\u00FCrdig.</dd><dt>Wie funktioniert das Budget?</dt><dd>Das Budget begrenzt die Token-Nutzung pro Projekt. Du kannst es in den Einstellungen konfigurieren. Bei \u00DCberschreitung wird gewarnt.</dd><dt>Was ist eine Merge-Strategie?</dt><dd>Wenn mehrere Agenten die gleiche Datei bearbeiten, bestimmt die Merge-Strategie wie Konflikte gel\u00F6st werden (z.B. letzter Agent gewinnt, manuell, oder intelligent zusammenf\u00FChren).</dd></dl>' },
  { id: 'glossary', title: 'Glossar', content: '<dl><dt>Agent</dt><dd>Eine unabh\u00E4ngige Claude Code Instanz, die eine spezifische Teilaufgabe bearbeitet. Jeder Agent arbeitet in seinem eigenen Verzeichnis.</dd><dt>Koordinator</dt><dd>Die zentrale Instanz, die das Projekt plant, Aufgaben verteilt, R\u00FCckfragen beantwortet und den Gesamtfortschritt \u00FCberwacht.</dd><dt>Meilenstein</dt><dd>Ein vordefinierter Satz von Aufgaben, der als Vorlage geladen werden kann. N\u00FCtzlich f\u00FCr wiederkehrende Projekttypen.</dd><dt>Intervention</dt><dd>Ein manueller Eingriff in die Arbeit eines Agenten. Typen: Richtungs\u00E4nderung, \u00DCberspringen, Neustart, Fertig markieren, Zusatzinformation.</dd><dt>Vorlage (Template)</dt><dd>Eine gespeicherte Projektbeschreibung, die schnell wiederverwendet werden kann.</dd><dt>Zwischenbericht</dt><dd>Ein Bericht des Koordinators w\u00E4hrend der Ausf\u00FChrung \u00FCber den bisherigen Fortschritt.</dd><dt>R\u00FCckfrage</dt><dd>Wenn ein Agent unsicher ist, stellt er eine Frage an den Koordinator. Dieser antwortet automatisch basierend auf dem Projektkontext.</dd><dt>Warteschlange (Queue)</dt><dd>Mehrere Projekte k\u00F6nnen in die Warteschlange gestellt werden und werden nacheinander abgearbeitet.</dd><dt>Token</dt><dd>Die Grundeinheit der KI-Textverarbeitung. Mehr Tokens = l\u00E4ngere Texte und h\u00F6here Kosten.</dd></dl>' },
  { id: 'shortcuts', title: 'Tastenk\u00FCrzel', content: '<ul><li><code>?</code> \u2013 Tastenk\u00FCrzel-\u00DCbersicht</li><li><code>F1</code> \u2013 Hilfe-Panel \u00F6ffnen/schlie\u00DFen</li><li><code>Strg+Enter</code> \u2013 Projekt starten</li><li><code>Strg+D</code> \u2013 Dark/Light Mode</li><li><code>Strg+E</code> \u2013 ZIP exportieren</li><li><code>Strg+K</code> \u2013 Suche \u00F6ffnen</li><li><code>Strg+Shift+A</code> \u2013 Projekt abbrechen</li><li><code>Strg+Shift+R</code> \u2013 Projekt zur\u00FCcksetzen</li><li><code>D</code> \u2013 Dark Mode umschalten</li><li><code>S</code> \u2013 Ton ein/aus</li><li><code>M</code> \u2013 Nicht st\u00F6ren</li><li><code>A</code> \u2013 Aktivit\u00E4ten-Feed</li><li><code>Esc</code> \u2013 Modal/Panel schlie\u00DFen</li></ul>' },
  { id: 'interventions', title: 'Interventions-Typen', content: '<dl><dt>Richtung \u00E4ndern (redirect)</dt><dd>Gibt dem Agenten neue Anweisungen oder korrigiert seine Arbeitsrichtung, ohne ihn neu zu starten.</dd><dt>\u00DCberspringen (skip)</dt><dd>Beendet den Agenten sofort und markiert ihn als \u00FCbersprungen. N\u00FCtzlich wenn eine Aufgabe nicht mehr relevant ist.</dd><dt>Neustart (restart)</dt><dd>Startet den Agenten komplett von vorne. Bisherige Arbeit wird verworfen.</dd><dt>Fertig markieren (complete)</dt><dd>Markiert den Agenten als erfolgreich abgeschlossen, unabh\u00E4ngig vom aktuellen Zustand.</dd><dt>Information hinzuf\u00FCgen (inject)</dt><dd>Sendet zus\u00E4tzliche Informationen an den Agenten, die er bei seiner n\u00E4chsten Runde ber\u00FCcksichtigt.</dd></dl>' }
];

function openHelpPanel() {
  if (_helpPanelOpen) { closeHelpPanel(); return; }
  _helpPanelOpen = true;
  var overlay = document.createElement('div');
  overlay.id = 'helpPanelOverlay';
  overlay.className = 'help-panel-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) closeHelpPanel(); };
  var sectionsHtml = '';
  for (var i = 0; i < HELP_SECTIONS.length; i++) {
    var sec = HELP_SECTIONS[i];
    var searchable = (sec.title + ' ' + sec.content.replace(/<[^>]+>/g, ' ')).toLowerCase();
    sectionsHtml +=
      '<div class="help-section" data-help-id="' + sec.id + '" data-search-text="' + esc(searchable) + '">' +
        '<div class="help-section-header" onclick="toggleHelpSection(this)">' +
          '<span>' + esc(sec.title) + '</span>' +
          '<span class="help-arrow">\u25B6</span>' +
        '</div>' +
        '<div class="help-section-body">' + sec.content + '</div>' +
      '</div>';
  }
  overlay.innerHTML =
    '<div class="help-panel">' +
      '<div class="help-panel-header"><h3>Hilfe</h3>' +
        '<button class="help-panel-close" onclick="closeHelpPanel()" aria-label="Schlie\u00DFen">\u00D7</button>' +
      '</div>' +
      '<div class="help-panel-search">' +
        '<input type="text" id="helpSearchInput" placeholder="Hilfe durchsuchen\u2026" oninput="filterHelpSections(this.value)" autocomplete="off" />' +
      '</div>' +
      '<div class="help-panel-body">' + sectionsHtml +
        '<button class="help-tour-btn" onclick="closeHelpPanel();startTour()">Tour erneut starten</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  setTimeout(function() { var inp = document.getElementById('helpSearchInput'); if (inp) inp.focus(); }, 100);
}

function closeHelpPanel() {
  _helpPanelOpen = false;
  var ol = document.getElementById('helpPanelOverlay');
  if (ol) ol.remove();
}

function toggleHelpPanel() {
  if (_helpPanelOpen) closeHelpPanel(); else openHelpPanel();
}

function toggleHelpSection(header) {
  var body = header.nextElementSibling;
  var arrow = header.querySelector('.help-arrow');
  if (body.classList.contains('open')) {
    body.classList.remove('open');
    if (arrow) arrow.classList.remove('open');
  } else {
    body.classList.add('open');
    if (arrow) arrow.classList.add('open');
  }
}

function filterHelpSections(query) {
  var q = (query || '').toLowerCase().trim();
  var secs = document.querySelectorAll('.help-section[data-help-id]');
  for (var i = 0; i < secs.length; i++) {
    var sec = secs[i];
    if (!q) { sec.classList.remove('hidden'); continue; }
    var st = sec.getAttribute('data-search-text') || '';
    if (st.indexOf(q) >= 0) {
      sec.classList.remove('hidden');
      var b = sec.querySelector('.help-section-body');
      var a = sec.querySelector('.help-arrow');
      if (b && !b.classList.contains('open')) { b.classList.add('open'); if (a) a.classList.add('open'); }
    } else {
      sec.classList.add('hidden');
    }
  }
}

// ── Performance Dashboard ─────────────────────────────────────
var _perfData = null;
var _perfHistory = null;
var _perfAgents = null;
var _perfRealtime = null;
var _perfRealtimeTimer = null;
var _perfHistorySortCol = 'createdAt';
var _perfHistorySortDir = 'desc';

function perfFormatDuration(ms) {
  if (!ms) return '-';
  if (ms < 1000) return ms + 'ms';
  var sec = Math.round(ms / 1000);
  if (sec < 60) return sec + 's';
  var min = Math.floor(sec / 60);
  var s = sec % 60;
  if (min < 60) return min + 'm ' + s + 's';
  var h = Math.floor(min / 60);
  return h + 'h ' + (min % 60) + 'm';
}

function perfFormatTokens(n) {
  if (!n) return '0';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return String(n);
}

function perfFormatCost(c) {
  if (!c) return '$0.00';
  return '$' + c.toFixed(4);
}

function perfFormatDate(ts) {
  if (!ts) return '-';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '-';
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

function loadPerformanceDashboard() {
  var el = document.getElementById('perfContent');
  if (!el) return;
  el.innerHTML = '<div class="perf-loading"><span class="spin"></span> Performance-Daten werden geladen\u2026</div>';

  Promise.all([
    fetch('/api/performance').then(function(r) { return r.json(); }),
    fetch('/api/performance/history').then(function(r) { return r.json(); }),
    fetch('/api/performance/agents').then(function(r) { return r.json(); }),
    fetch('/api/performance/realtime').then(function(r) { return r.json(); })
  ]).then(function(results) {
    _perfData = results[0];
    _perfHistory = results[1];
    _perfAgents = results[2];
    _perfRealtime = results[3];
    renderPerformanceDashboard();
    startPerfRealtimePolling();
  }).catch(function(e) {
    el.innerHTML = '<div class="perf-empty">Performance-Daten konnten nicht geladen werden.</div>';
  });
}

function startPerfRealtimePolling() {
  stopPerfRealtimePolling();
  if (_perfRealtime && _perfRealtime.phase === 'running') {
    _perfRealtimeTimer = setInterval(function() {
      if (_changelogDashTab !== 'performance') { stopPerfRealtimePolling(); return; }
      fetch('/api/performance/realtime').then(function(r) { return r.json(); }).then(function(data) {
        _perfRealtime = data;
        renderPerfRealtimeSection();
      }).catch(function() {});
    }, 3000);
  }
}

function stopPerfRealtimePolling() {
  if (_perfRealtimeTimer) { clearInterval(_perfRealtimeTimer); _perfRealtimeTimer = null; }
}

function renderPerformanceDashboard() {
  var el = document.getElementById('perfContent');
  if (!el) return;
  var d = _perfData;
  if (!d) { el.innerHTML = '<div class="perf-empty">Keine Performance-Daten vorhanden.</div>'; return; }

  var html = '';

  // ── Overview Cards ──
  html += '<div class="perf-section">' +
    '<div class="perf-section-title">Gesamt\u00FCbersicht</div>' +
    '<div class="perf-overview">' +
      '<div class="perf-card">' +
        '<div class="perf-card-label">Projekte</div>' +
        '<div class="perf-card-value">' + esc(String(d.projectCount)) + '</div>' +
        '<div class="perf-card-sub">Erfolgsrate: ' + esc(String(d.successRate.rate)) + '%</div>' +
      '</div>' +
      '<div class="perf-card">' +
        '<div class="perf-card-label">\u00D8 Agent-Dauer</div>' +
        '<div class="perf-card-value">' + esc(perfFormatDuration(d.avgAgentDuration)) + '</div>' +
        '<div class="perf-card-sub">pro Runde</div>' +
      '</div>' +
      '<div class="perf-card">' +
        '<div class="perf-card-label">\u00D8 Fragen/Agent</div>' +
        '<div class="perf-card-value">' + esc(String(d.avgQuestionsPerAgent)) + '</div>' +
        '<div class="perf-card-sub">R\u00FCckfragen an Koordinator</div>' +
      '</div>' +
      '<div class="perf-card">' +
        '<div class="perf-card-label">Gesamtlaufzeit</div>' +
        '<div class="perf-card-value">' + esc(perfFormatDuration(d.totalRuntime)) + '</div>' +
        '<div class="perf-card-sub">aller Projekte</div>' +
      '</div>' +
    '</div>' +
  '</div>';

  // ── Success Rate Donut ──
  var sr = d.successRate;
  var compPct = sr.total > 0 ? Math.round((sr.completed / sr.total) * 100) : 0;
  var failPct = sr.total > 0 ? Math.round((sr.failed / sr.total) * 100) : 0;
  var partPct = sr.total > 0 ? Math.round((sr.partial / sr.total) * 100) : 0;
  var restPct = 100 - compPct - failPct - partPct;
  if (restPct < 0) restPct = 0;
  var conicGrad = 'conic-gradient(' +
    'var(--green) 0% ' + compPct + '%, ' +
    'var(--amber) ' + compPct + '% ' + (compPct + partPct) + '%, ' +
    'var(--red) ' + (compPct + partPct) + '% ' + (compPct + partPct + failPct) + '%, ' +
    'var(--bg3) ' + (compPct + partPct + failPct) + '% 100%)';

  html += '<div class="perf-section">' +
    '<div class="perf-section-title">Erfolgsquote</div>' +
    '<div class="perf-circle-wrap">' +
      '<div class="perf-circle" style="background:' + conicGrad + '">' +
        '<div class="perf-circle-inner">' + esc(String(sr.rate)) + '%</div>' +
      '</div>' +
      '<div class="perf-circle-legend">' +
        '<div class="perf-circle-legend-item"><div class="perf-circle-dot" style="background:var(--green)"></div> Erfolgreich: ' + esc(String(sr.completed)) + '</div>' +
        '<div class="perf-circle-legend-item"><div class="perf-circle-dot" style="background:var(--amber)"></div> Teilweise: ' + esc(String(sr.partial)) + '</div>' +
        '<div class="perf-circle-legend-item"><div class="perf-circle-dot" style="background:var(--red)"></div> Fehlgeschlagen: ' + esc(String(sr.failed)) + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';

  // ── Fastest / Slowest Agent ──
  if (d.fastestAgent || d.slowestAgent) {
    html += '<div class="perf-section">' +
      '<div class="perf-section-title">Schnellster / Langsamster Agent</div>' +
      '<div class="perf-overview" style="grid-template-columns:1fr 1fr">' +
        (d.fastestAgent ? '<div class="perf-card" style="border-left:3px solid var(--green)">' +
          '<div class="perf-card-label">Schnellster</div>' +
          '<div class="perf-card-value">' + esc(perfFormatDuration(d.fastestAgent.duration)) + '</div>' +
          '<div class="perf-card-sub">' + esc(d.fastestAgent.title) + ' &middot; ' + esc(d.fastestAgent.project) + '</div>' +
        '</div>' : '') +
        (d.slowestAgent ? '<div class="perf-card" style="border-left:3px solid var(--red)">' +
          '<div class="perf-card-label">Langsamster</div>' +
          '<div class="perf-card-value">' + esc(perfFormatDuration(d.slowestAgent.duration)) + '</div>' +
          '<div class="perf-card-sub">' + esc(d.slowestAgent.title) + ' &middot; ' + esc(d.slowestAgent.project) + '</div>' +
        '</div>' : '') +
      '</div>' +
    '</div>';
  }

  // ── Token Trend Sparkline ──
  if (d.tokenTrend && d.tokenTrend.length > 0) {
    var maxTrend = Math.max.apply(null, d.tokenTrend.map(function(t) { return t.tokens; }));
    if (maxTrend === 0) maxTrend = 1;
    html += '<div class="perf-section">' +
      '<div class="perf-section-title">Token-Verbrauch Trend</div>' +
      '<div class="perf-sparkline">';
    d.tokenTrend.forEach(function(t) {
      var h = Math.max(2, Math.round((t.tokens / maxTrend) * 32));
      html += '<div class="perf-spark-bar" style="height:' + h + 'px" title="' + esc(t.project) + ': ' + perfFormatTokens(t.tokens) + ' Tokens"></div>';
    });
    html += '</div></div>';
  }

  // ── Agent Token Bar Chart ──
  if (_perfAgents && _perfAgents.length > 0) {
    var maxTokens = Math.max.apply(null, _perfAgents.map(function(a) { return a.tokens; }));
    if (maxTokens === 0) maxTokens = 1;
    var displayAgents = _perfAgents.slice(0, 15);
    html += '<div class="perf-section">' +
      '<div class="perf-section-title">Token-Verbrauch pro Agent</div>' +
      '<div class="perf-bar-chart">';
    displayAgents.forEach(function(a) {
      var pct = Math.round((a.tokens / maxTokens) * 100);
      html += '<div class="perf-bar-row">' +
        '<div class="perf-bar-label" title="' + esc(a.title) + '">' + esc(a.title) + '</div>' +
        '<div class="perf-bar-track"><div class="perf-bar-fill perf-bar-fill-blue" style="width:' + pct + '%"></div><div class="perf-bar-val">' + perfFormatTokens(a.tokens) + '</div></div>' +
        '<div class="perf-bar-val-out">' + perfFormatCost(a.estimatedCost) + '</div>' +
      '</div>';
    });
    html += '</div></div>';

    // ── Agent Duration Bar Chart ──
    var maxDur = Math.max.apply(null, _perfAgents.map(function(a) { return a.duration; }));
    if (maxDur === 0) maxDur = 1;
    html += '<div class="perf-section">' +
      '<div class="perf-section-title">Agent-Dauer</div>' +
      '<div class="perf-bar-chart">';
    displayAgents.forEach(function(a) {
      var pct = Math.round((a.duration / maxDur) * 100);
      var color = a.status === 'done' ? 'perf-bar-fill-green' : (a.status === 'error' ? 'perf-bar-fill-amber' : 'perf-bar-fill-purple');
      html += '<div class="perf-bar-row">' +
        '<div class="perf-bar-label" title="' + esc(a.title) + '">' + esc(a.title) + '</div>' +
        '<div class="perf-bar-track"><div class="perf-bar-fill ' + color + '" style="width:' + pct + '%"></div><div class="perf-bar-val">' + perfFormatDuration(a.duration) + '</div></div>' +
        '<div class="perf-bar-val-out">' + esc(String(a.rounds)) + ' Rdn</div>' +
      '</div>';
    });
    html += '</div></div>';
  }

  // ── Cost Tracker / Budget Bar ──
  var budget = state.budget || {};
  var totalUsage = state.totalTokenUsage || { totalTokens: 0, estimatedCost: 0 };
  if (budget.maxTokenBudget > 0) {
    var budgetPct = Math.min(100, Math.round(totalUsage.totalTokens / budget.maxTokenBudget * 100));
    var warnPct = budget.warnTokenBudget > 0 ? Math.round(budget.warnTokenBudget / budget.maxTokenBudget * 100) : 0;
    var fillColor = budgetPct > 90 ? 'var(--red)' : (budgetPct > 70 ? 'var(--amber)' : 'var(--green)');
    html += '<div class="perf-section">' +
      '<div class="perf-section-title">Kosten-Tracker</div>' +
      '<div class="perf-card">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">' +
          '<div class="perf-card-label" style="margin:0">Verbrauch</div>' +
          '<div style="font-size:13px;font-weight:600;color:var(--txt)">' + perfFormatCost(totalUsage.estimatedCost) + '</div>' +
        '</div>' +
        '<div class="perf-budget-bar">' +
          '<div class="perf-budget-track">' +
            '<div class="perf-budget-fill" style="width:' + budgetPct + '%;background:' + fillColor + '"></div>' +
            (warnPct > 0 ? '<div class="perf-budget-marker" style="left:' + warnPct + '%"></div>' : '') +
          '</div>' +
          '<div class="perf-budget-labels">' +
            '<span>0</span>' +
            (warnPct > 0 ? '<span style="position:absolute;left:' + warnPct + '%;transform:translateX(-50%)">Warnung</span>' : '') +
            '<span>' + perfFormatTokens(budget.maxTokenBudget) + ' Tokens</span>' +
          '</div>' +
        '</div>' +
        '<div class="perf-card-sub" style="margin-top:6px">' + perfFormatTokens(totalUsage.totalTokens) + ' / ' + perfFormatTokens(budget.maxTokenBudget) + ' Tokens (' + budgetPct + '%)</div>' +
      '</div>' +
    '</div>';
  }

  // ── Realtime Section ──
  html += '<div class="perf-section">' +
    '<div class="perf-section-title">Echtzeit' + (_perfRealtime && _perfRealtime.phase === 'running' ? ' <span style="color:var(--green);font-size:10px;font-weight:400">\u25CF Live</span>' : '') + '</div>' +
    '<div id="perfRealtimeContent">' + renderPerfRealtimeHtml() + '</div>' +
  '</div>';

  // ── History Table ──
  html += '<div class="perf-section">' +
    '<div class="perf-section-title">Letzte Projekte</div>' +
    '<div id="perfHistoryTable">' + renderPerfHistoryTable() + '</div>' +
  '</div>';

  el.innerHTML = html;
}

function renderPerfRealtimeHtml() {
  var rt = _perfRealtime;
  if (!rt) return '<div class="perf-empty">Keine Echtzeit-Daten verf\u00FCgbar.</div>';

  var html = '<div class="perf-realtime">' +
    '<div class="perf-rt-card">' +
      '<div class="perf-rt-label">Status</div>' +
      '<div class="perf-rt-value">' + esc(rt.phase || 'idle') + '</div>' +
      '<div class="perf-rt-sub">' + esc(String(rt.completedCount || 0)) + '/' + esc(String(rt.totalAgents || 0)) + ' Agenten fertig</div>' +
    '</div>' +
    '<div class="perf-rt-card">' +
      '<div class="perf-rt-label">Token/Sekunde</div>' +
      '<div class="perf-rt-value">' + esc(String(rt.tokensPerSecond || 0)) + '</div>' +
      '<div class="perf-rt-sub">' + perfFormatTokens(rt.totalTokens || 0) + ' gesamt</div>' +
    '</div>' +
    '<div class="perf-rt-card">' +
      '<div class="perf-rt-label">Aktuelle Kosten</div>' +
      '<div class="perf-rt-value">' + perfFormatCost(rt.currentCost || 0) + '</div>' +
      '<div class="perf-rt-sub">Gesch\u00E4tzt Rest: ' + perfFormatCost(rt.estimatedRemainingCost || 0) + '</div>' +
    '</div>' +
    '<div class="perf-rt-card">' +
      '<div class="perf-rt-label">Fortschritt</div>' +
      '<div class="perf-rt-value">' + esc(String(rt.progress || 0)) + '<span class="perf-unit">%</span></div>' +
      '<div class="perf-rt-sub">Laufzeit: ' + perfFormatDuration(rt.elapsedMs || 0) + '</div>' +
    '</div>' +
  '</div>';

  // Active agents list
  if (rt.activeAgents && rt.activeAgents.length > 0) {
    html += '<div class="perf-rt-agents">';
    rt.activeAgents.forEach(function(a) {
      html += '<div class="perf-rt-agent">' +
        '<div class="perf-rt-agent-name">' + esc(a.title) + '</div>' +
        '<div class="perf-rt-agent-bar"><div class="perf-rt-agent-fill" style="width:' + (a.progress || 0) + '%"></div></div>' +
        '<div class="perf-rt-agent-pct">' + esc(String(a.progress || 0)) + '%</div>' +
      '</div>';
    });
    html += '</div>';
  }

  return html;
}

function renderPerfRealtimeSection() {
  var el = document.getElementById('perfRealtimeContent');
  if (el) el.innerHTML = renderPerfRealtimeHtml();
}

function renderPerfHistoryTable() {
  var history = _perfHistory;
  if (!history || history.length === 0) return '<div class="perf-empty">Keine Projekthistorie vorhanden.</div>';

  // Sort
  var sorted = history.slice().sort(function(a, b) {
    var valA = a[_perfHistorySortCol], valB = b[_perfHistorySortCol];
    if (valA == null) valA = 0;
    if (valB == null) valB = 0;
    if (typeof valA === 'string') valA = valA.toLowerCase();
    if (typeof valB === 'string') valB = valB.toLowerCase();
    var cmp = valA < valB ? -1 : (valA > valB ? 1 : 0);
    return _perfHistorySortDir === 'desc' ? -cmp : cmp;
  });

  var cols = [
    { key: 'title', label: 'Projekt' },
    { key: 'phase', label: 'Status' },
    { key: 'agentCount', label: 'Agenten' },
    { key: 'totalDuration', label: 'Dauer' },
    { key: 'totalTokens', label: 'Tokens' },
    { key: 'estimatedCost', label: 'Kosten' },
    { key: 'score', label: 'Score' },
    { key: 'createdAt', label: 'Datum' }
  ];

  var html = '<div style="overflow-x:auto"><table class="perf-history-table"><thead><tr>';
  cols.forEach(function(col) {
    var isSorted = _perfHistorySortCol === col.key;
    var arrow = isSorted ? (_perfHistorySortDir === 'asc' ? '\u25B2' : '\u25BC') : '\u25B4';
    html += '<th class="' + (isSorted ? 'sorted' : '') + '" onclick="perfSortHistory(\'' + col.key + '\')">' + esc(col.label) + ' <span class="sort-arrow">' + arrow + '</span></th>';
  });
  html += '</tr></thead><tbody>';

  sorted.slice(0, 10).forEach(function(p) {
    var phaseClass = p.phase === 'complete' ? 'perf-phase-complete' : (p.phase === 'error' ? 'perf-phase-error' : (p.phase === 'partial' ? 'perf-phase-partial' : ''));
    html += '<tr>' +
      '<td title="' + esc(p.title) + '" style="max-width:180px;overflow:hidden;text-overflow:ellipsis">' + esc(p.title) + '</td>' +
      '<td><span class="perf-phase ' + phaseClass + '">' + esc(p.phase) + '</span></td>' +
      '<td class="mono">' + esc(String(p.agentCount)) + ' (' + esc(String(p.completedAgents || 0)) + '/' + esc(String(p.failedAgents || 0)) + ')</td>' +
      '<td class="mono">' + perfFormatDuration(p.totalDuration) + '</td>' +
      '<td class="mono">' + perfFormatTokens(p.totalTokens) + '</td>' +
      '<td class="mono">' + perfFormatCost(p.estimatedCost) + '</td>' +
      '<td class="mono">' + (p.score != null ? esc(String(p.score)) : '-') + '</td>' +
      '<td>' + perfFormatDate(p.createdAt) + '</td>' +
    '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

function perfSortHistory(col) {
  if (_perfHistorySortCol === col) {
    _perfHistorySortDir = _perfHistorySortDir === 'desc' ? 'asc' : 'desc';
  } else {
    _perfHistorySortCol = col;
    _perfHistorySortDir = 'desc';
  }
  var el = document.getElementById('perfHistoryTable');
  if (el) el.innerHTML = renderPerfHistoryTable();
}

</script>
</body>
</html>
