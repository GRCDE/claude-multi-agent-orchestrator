// ── Agent Vollansicht: Konversation rendern ──────────────
function afvRenderConversation(conv, agent, idx) {
  if (conv.length === 0) {
    var depsInfo = '';
    if ((agent.status === 'waiting' || agent.status === 'waiting_deps') && agent.depends_on && agent.depends_on.length > 0) {
      depsInfo = 'Wartet auf ' + agent.depends_on.map(function(d) { return 'Agent ' + (d + 1); }).join(', ');
    }
    return '<div class="bubble-empty">' + (depsInfo || (agent.status === 'waiting' ? 'Wartet auf Zuweisung\u2026' : 'Noch keine Nachrichten.')) + '</div>';
  }
  return conv.map(function(m, i) {
    var copyBtn = '<button class="copy-btn" onclick="copyText(this)" title="Kopieren" aria-label="Text kopieren">\u2398</button>';
    var timeStr = m.ts ? '<div class="afv-bubble-time">' + new Date(m.ts).toLocaleTimeString('de-DE') + '</div>' : '';
    if (m.from === 'coordinator') {
      return '<div class="afv-bubble-wrap right"><div class="afv-bubble afv-bubble-coordinator">' + copyBtn +
        '<div class="afv-bubble-label">Koordinator \u2192</div><div class="bubble-text">' + esc(m.text || '') + '</div>' + timeStr + '</div></div>';
    } else if (m.type === 'message') {
      var labelF = m.targetAgent != null ? '\u2192 Agent ' + (m.targetAgent + 1) : (m.sourceAgent != null ? '\u2190 Agent ' + (m.sourceAgent + 1) : 'Nachricht');
      return '<div class="afv-bubble-wrap"><div class="afv-bubble afv-bubble-message">' + copyBtn +
        '<div class="afv-bubble-label">' + esc(labelF) + '</div><div class="bubble-text">' + esc(m.text || '') + '</div>' + timeStr + '</div></div>';
    } else if (m.type === 'question') {
      return '<div class="afv-bubble-wrap"><div class="afv-bubble afv-bubble-question">' + copyBtn +
        '<div class="afv-bubble-label">Frage \u2192</div><div class="bubble-text">' + esc(m.text || '') + '</div>' + timeStr + '</div></div>';
    } else if (m.type === 'system') {
      return '<div class="afv-bubble-wrap center"><div class="afv-bubble afv-bubble-system">' +
        '<div class="bubble-text">' + esc(m.text || '') + '</div>' + timeStr + '</div></div>';
    } else {
      return '<div class="afv-bubble-wrap"><div class="afv-bubble afv-bubble-agent">' + copyBtn +
        '<div class="bubble-text">' + esc(m.text || '') + '</div>' + timeStr + '</div></div>';
    }
  }).join('');
}

// ── Agent Vollansicht: Statistik rendern ────────────────
function afvRenderStats(agent, idx, tl) {
  var rounds = agent.rounds || 0;
  var questions = agent.questions || 0;
  var duration = agent.duration;
  var stats = agent.stats || {};
  var score = agent.score;

  // Token-Schaetzung: ca. 750 Tokens pro Nachricht (grobe Schaetzung)
  var conv = agent.conversation || [];
  var estTokens = 0;
  conv.forEach(function(m) {
    var text = m.text || '';
    estTokens += Math.ceil(text.length / 4); // ~4 chars per token
  });

  var html = '<div class="section-label">Kennzahlen</div>';
  html += '<div class="afv-stats-grid">';
  html += '<div class="afv-stat-card"><div class="afv-stat-value">' + rounds + '</div><div class="afv-stat-label">Runden</div></div>';
  html += '<div class="afv-stat-card"><div class="afv-stat-value">' + questions + '</div><div class="afv-stat-label">Fragen</div></div>';
  html += '<div class="afv-stat-card"><div class="afv-stat-value">' + conv.length + '</div><div class="afv-stat-label">Nachrichten</div></div>';
  html += '<div class="afv-stat-card"><div class="afv-stat-value">' + formatTokenCount(estTokens) + '</div><div class="afv-stat-label">Token (gesch.)</div></div>';
  if (duration != null) {
    html += '<div class="afv-stat-card"><div class="afv-stat-value">' + formatDuration(duration) + '</div><div class="afv-stat-label">Dauer</div></div>';
  }
  if (stats.filesCreated != null) {
    html += '<div class="afv-stat-card"><div class="afv-stat-value">' + (stats.filesCreated || 0) + '</div><div class="afv-stat-label">Dateien erstellt</div></div>';
  }
  if (stats.linesOfCode != null) {
    html += '<div class="afv-stat-card"><div class="afv-stat-value">' + (stats.linesOfCode || 0) + '</div><div class="afv-stat-label">Codezeilen</div></div>';
  }
  if (stats.totalFileSize != null) {
    html += '<div class="afv-stat-card"><div class="afv-stat-value">' + formatFileSize(stats.totalFileSize || 0) + '</div><div class="afv-stat-label">Dateigr\u00F6\u00DFe</div></div>';
  }
  html += '</div>';

  // Score-Breakdown
  if (score != null) {
    html += '<div class="afv-score-section">';
    html += '<div class="afv-score-title">Score-Breakdown</div>';
    // Versuche die Score-Komponenten zu schaetzen basierend auf vorhandenen Daten
    var scoreItems = [];
    // Completion: basierend auf Status
    var completionScore = agent.status === 'done' ? 100 : (agent.status === 'error' ? 20 : 50);
    scoreItems.push({ label: 'Abschluss', value: completionScore, color: 'var(--green)' });
    // File: basierend auf erstellten Dateien
    var fileScore = stats.filesCreated ? Math.min(100, stats.filesCreated * 20) : 0;
    scoreItems.push({ label: 'Dateien', value: fileScore, color: 'var(--blue)' });
    // Quality: Gesamtscore als Naeherung
    scoreItems.push({ label: 'Qualit\u00E4t', value: score, color: 'var(--purple)' });
    // Efficiency: basierend auf Runden (weniger = besser)
    var effScore = rounds <= 2 ? 100 : rounds <= 5 ? 75 : rounds <= 10 ? 50 : 25;
    scoreItems.push({ label: 'Effizienz', value: effScore, color: 'var(--teal)' });
    // Questions: weniger Fragen = besser
    var qScore = questions === 0 ? 100 : questions <= 2 ? 75 : questions <= 5 ? 50 : 25;
    scoreItems.push({ label: 'Fragen', value: qScore, color: 'var(--amber)' });

    scoreItems.forEach(function(item) {
      html += '<div class="afv-score-bar-row">' +
        '<span class="afv-score-bar-label">' + item.label + '</span>' +
        '<div class="afv-score-bar-track"><div class="afv-score-bar-fill" style="width:' + item.value + '%;background:' + item.color + '"></div></div>' +
        '<span class="afv-score-bar-value">' + item.value + '</span>' +
      '</div>';
    });
    html += '<div style="margin-top:12px;text-align:center">' +
      '<span style="font-size:11px;color:var(--txt3)">Gesamt-Score: </span>' + scoreBadge(score) +
    '</div>';
    html += '</div>';
  }

  // Timeline
  html += '<div class="afv-timeline-section">';
  html += '<div class="afv-score-title">Zeitverlauf</div>';
  if (tl.startTime) {
    html += '<div class="afv-timeline-row"><span class="afv-timeline-label">Gestartet</span><span class="afv-timeline-value">' + new Date(tl.startTime).toLocaleString('de-DE') + '</span></div>';
  }
  if (tl.endTime) {
    html += '<div class="afv-timeline-row"><span class="afv-timeline-label">Beendet</span><span class="afv-timeline-value">' + new Date(tl.endTime).toLocaleString('de-DE') + '</span></div>';
  }
  if (tl.startTime && tl.endTime) {
    var durSec = Math.round((tl.endTime - tl.startTime) / 1000);
    html += '<div class="afv-timeline-row"><span class="afv-timeline-label">Gesamtdauer</span><span class="afv-timeline-value">' + formatDuration(durSec) + '</span></div>';
  }
  if (tl.askingPeriods && tl.askingPeriods.length > 0) {
    var totalAskTime = 0;
    tl.askingPeriods.forEach(function(p) {
      if (p.start && p.end) totalAskTime += (p.end - p.start);
    });
    if (totalAskTime > 0) {
      html += '<div class="afv-timeline-row"><span class="afv-timeline-label">Wartezeit (Fragen)</span><span class="afv-timeline-value">' + formatDuration(Math.round(totalAskTime / 1000)) + '</span></div>';
    }
  }
  if (!tl.startTime && !tl.endTime) {
    html += '<div style="font-size:12px;color:var(--txt3);font-style:italic;padding:4px 0">Noch keine Zeitdaten verf\u00FCgbar.</div>';
  }
  html += '</div>';

  return html;
}

// ── Agent Vollansicht: Tab wechseln ──────────────────────
function afvSwitchTab(btn, agentIdx) {
  var tabName = btn.getAttribute('data-afv-tab');
  var modal = document.getElementById('agentModal');
  if (!modal) return;
  // Update tab buttons
  var tabs = modal.querySelectorAll('.modal-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i] === btn);
  }
  // Update tab panels
  var panels = modal.querySelectorAll('.agent-fullview-tab-panel');
  for (var i = 0; i < panels.length; i++) {
    var panelId = panels[i].id;
    var panelTab = panelId.replace('afvTab', '').toLowerCase();
    if (panelTab === tabName.replace('-', '').toLowerCase() || panelId === 'afvTab' + tabName.charAt(0).toUpperCase() + tabName.slice(1).replace(/-./g, function(m) { return m[1].toUpperCase(); })) {
      panels[i].classList.remove('hidden');
    } else {
      panels[i].classList.add('hidden');
    }
  }
  // Map tab names to panel IDs
  var panelMap = {
    'verlauf': 'afvTabVerlauf',
    'dateien': 'afvTabDateien',
    'statistik': 'afvTabStatistik',
    'prompt-inspector': 'afvTabPromptInspector'
  };
  for (var key in panelMap) {
    var panel = document.getElementById(panelMap[key]);
    if (panel) {
      if (key === tabName) panel.classList.remove('hidden');
      else panel.classList.add('hidden');
    }
  }

  // Lazy-load Dateien
  if (tabName === 'dateien' && !modal._filesLoaded) {
    modal._filesLoaded = true;
    afvLoadFiles(agentIdx);
  }
  // Lazy-load Prompt Inspector
  if (tabName === 'prompt-inspector' && !modal._piLoaded) {
    modal._piLoaded = true;
    loadPromptInspector(agentIdx);
  }
}

// ── Agent Vollansicht: Dateien laden ────────────────────
function afvLoadFiles(agentIdx) {
  var id = getProjectId();
  var loadingEl = document.getElementById('afvFilesLoading');
  var listEl = document.getElementById('afvFilesList');
  if (!id) {
    if (loadingEl) loadingEl.style.display = 'none';
    if (listEl) listEl.innerHTML = '<div class="afv-files-empty">Keine Projekt-ID gefunden.</div>';
    return;
  }
  fetch('/api/files/' + encodeURIComponent(id)).then(function(r) {
    if (!r.ok) throw new Error('Fehler');
    return r.json();
  }).then(function(files) {
    if (loadingEl) loadingEl.style.display = 'none';
    if (!listEl) return;
    // Filter: nur Dateien von diesem Agenten (agent-N/)
    var agentPrefix = 'agent-' + agentIdx + '/';
    var agentFiles = files.filter(function(f) { return f.path && f.path.startsWith(agentPrefix); });
    if (agentFiles.length === 0) {
      listEl.innerHTML = '<div class="afv-files-empty">Keine Dateien von diesem Agenten gefunden.</div>';
      return;
    }
    listEl.innerHTML = agentFiles.map(function(f) {
      var name = f.path.replace(agentPrefix, '');
      return '<div class="afv-file-item" onclick="afvLoadFileContent(this,\'' + esc(f.path).replace(/'/g, "\\'") + '\')" title="' + esc(f.path) + '">' +
        '<span class="afv-file-icon">' + fileIcon(name) + '</span>' +
        '<span class="afv-file-name">' + esc(name) + '</span>' +
        '<span class="afv-file-size">' + formatFileSize(f.size || 0) + '</span>' +
      '</div>';
    }).join('');
  }).catch(function(err) {
    if (loadingEl) loadingEl.style.display = 'none';
    if (listEl) listEl.innerHTML = '<div class="afv-files-empty">Fehler beim Laden: ' + esc(err.message || '') + '</div>';
  });
}

// ── Agent Vollansicht: Dateiinhalt anzeigen ──────────────
function afvLoadFileContent(itemEl, filePath) {
  var id = getProjectId();
  if (!id) return;
  // Active-State setzen
  var list = document.getElementById('afvFilesList');
  if (list) {
    var items = list.querySelectorAll('.afv-file-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
  }
  if (itemEl) itemEl.classList.add('active');

  var previewEl = document.getElementById('afvFilePreview');
  if (!previewEl) return;
  previewEl.innerHTML = '<div class="afv-file-preview">' +
    '<div class="afv-file-preview-header">' +
      '<span class="afv-file-preview-path">' + esc(filePath) + '</span>' +
      '<span class="afv-files-loading">Wird geladen\u2026</span>' +
    '</div>' +
    '<div class="afv-file-preview-body"><pre>Wird geladen\u2026</pre></div>' +
  '</div>';

  var url = '/api/file-content/' + encodeURIComponent(id) + '/' + encodeURIComponent(filePath);
  fetch(url).then(function(r) {
    if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Fehler'); });
    return r.json();
  }).then(function(data) {
    if (!previewEl) return;
    var bodyHtml;
    if (data.binary) {
      bodyHtml = '<div style="padding:2rem;text-align:center;color:var(--txt3)">Bin\u00E4rdatei (' + formatFileSize(data.size) + ')</div>';
    } else {
      bodyHtml = '<pre>' + esc(data.content || '') + '</pre>';
    }
    previewEl.innerHTML = '<div class="afv-file-preview">' +
      '<div class="afv-file-preview-header">' +
        '<span class="afv-file-preview-path">' + esc(data.path || filePath) + '</span>' +
        '<div style="display:flex;gap:6px;align-items:center">' +
          '<span style="font-size:10px;color:var(--txt3)">' + formatFileSize(data.size || 0) + '</span>' +
          (!data.binary ? '<button class="afv-file-preview-copy" onclick="afvCopyFileContent()">Kopieren</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="afv-file-preview-body" id="afvFileContentBody">' + bodyHtml + '</div>' +
    '</div>';
  }).catch(function(err) {
    if (previewEl) {
      previewEl.innerHTML = '<div class="afv-file-preview"><div class="afv-file-preview-body"><pre style="color:var(--red)">Fehler: ' + esc(err.message || '') + '</pre></div></div>';
    }
  });
}

function afvCopyFileContent() {
  var body = document.getElementById('afvFileContentBody');
  if (!body) return;
  var pre = body.querySelector('pre');
  if (!pre) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(pre.textContent || '');
  }
}

// ── Agent Vollansicht: Suche im Transcript ──────────────
function afvSearchConv(query, idx) {
  var modal = document.getElementById('agentModal');
  if (!modal) return;
  var convEl = document.getElementById('afvConvContent');
  var countEl = document.getElementById('afvSearchCount');
  if (!convEl) return;

  var conv = modal._conv || [];
  modal._searchMatches = [];
  modal._searchCurrentIdx = -1;

  if (!query || query.trim() === '') {
    // Restore original conversation
    var agent = state.agents[idx];
    convEl.innerHTML = afvRenderConversation(conv, agent || {}, idx);
    if (countEl) countEl.textContent = '';
    return;
  }

  var matchCount = 0;
  var agent = state.agents[idx] || {};
  // Re-render with highlighting
  var html = conv.map(function(m, i) {
    var text = m.text || '';
    var escaped = esc(text);
    var highlighted = highlightText(escaped, query);
    if (highlighted !== escaped) {
      // Count matches in this message
      var lowerEsc = escaped.toLowerCase();
      var lowerQ = esc(query).toLowerCase();
      var tmpIdx = 0;
      while ((tmpIdx = lowerEsc.indexOf(lowerQ, tmpIdx)) !== -1) { matchCount++; tmpIdx += lowerQ.length; }
    }
    var copyBtn = '<button class="copy-btn" onclick="copyText(this)" title="Kopieren" aria-label="Text kopieren">\u2398</button>';
    var timeStr = m.ts ? '<div class="afv-bubble-time">' + new Date(m.ts).toLocaleTimeString('de-DE') + '</div>' : '';
    if (m.from === 'coordinator') {
      return '<div class="afv-bubble-wrap right"><div class="afv-bubble afv-bubble-coordinator">' + copyBtn +
        '<div class="afv-bubble-label">Koordinator \u2192</div><div class="bubble-text">' + highlighted + '</div>' + timeStr + '</div></div>';
    } else if (m.type === 'message') {
      var labelF = m.targetAgent != null ? '\u2192 Agent ' + (m.targetAgent + 1) : (m.sourceAgent != null ? '\u2190 Agent ' + (m.sourceAgent + 1) : 'Nachricht');
      return '<div class="afv-bubble-wrap"><div class="afv-bubble afv-bubble-message">' + copyBtn +
        '<div class="afv-bubble-label">' + esc(labelF) + '</div><div class="bubble-text">' + highlighted + '</div>' + timeStr + '</div></div>';
    } else if (m.type === 'question') {
      return '<div class="afv-bubble-wrap"><div class="afv-bubble afv-bubble-question">' + copyBtn +
        '<div class="afv-bubble-label">Frage \u2192</div><div class="bubble-text">' + highlighted + '</div>' + timeStr + '</div></div>';
    } else {
      return '<div class="afv-bubble-wrap"><div class="afv-bubble afv-bubble-agent">' + copyBtn +
        '<div class="bubble-text">' + highlighted + '</div>' + timeStr + '</div></div>';
    }
  }).join('');

  convEl.innerHTML = html;
  if (countEl) countEl.textContent = matchCount > 0 ? matchCount + ' Treffer' : 'Keine Treffer';

  // Collect all mark elements for navigation
  modal._searchMatches = convEl.querySelectorAll('mark');
  if (modal._searchMatches.length > 0) {
    modal._searchCurrentIdx = 0;
    afvHighlightCurrent();
  }
}

function afvHighlightCurrent() {
  var modal = document.getElementById('agentModal');
  if (!modal || !modal._searchMatches || modal._searchMatches.length === 0) return;
  // Remove current class from all
  for (var i = 0; i < modal._searchMatches.length; i++) {
    modal._searchMatches[i].classList.remove('current');
  }
  var idx = modal._searchCurrentIdx;
  if (idx >= 0 && idx < modal._searchMatches.length) {
    modal._searchMatches[idx].classList.add('current');
    modal._searchMatches[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  var countEl = document.getElementById('afvSearchCount');
  if (countEl) countEl.textContent = (idx + 1) + ' / ' + modal._searchMatches.length + ' Treffer';
}

function afvSearchNext() {
  var modal = document.getElementById('agentModal');
  if (!modal || !modal._searchMatches || modal._searchMatches.length === 0) return;
  modal._searchCurrentIdx = (modal._searchCurrentIdx + 1) % modal._searchMatches.length;
  afvHighlightCurrent();
}

function afvSearchPrev() {
  var modal = document.getElementById('agentModal');
  if (!modal || !modal._searchMatches || modal._searchMatches.length === 0) return;
  modal._searchCurrentIdx = (modal._searchCurrentIdx - 1 + modal._searchMatches.length) % modal._searchMatches.length;
  afvHighlightCurrent();
}

// ── Agent Vollansicht: Transcript kopieren ──────────────
function afvCopyTranscript(idx) {
  var agent = state.agents[idx];
  if (!agent) return;
  var conv = agent.conversation || [];
  var lines = [];
  lines.push('=== Agent ' + (idx + 1) + ': ' + (agent.title || '') + ' ===');
  lines.push('Status: ' + (agent.status || 'unbekannt'));
  lines.push('Rolle: ' + (agent.role || '-'));
  if (agent.task) lines.push('Aufgabe: ' + agent.task);
  lines.push('Runden: ' + (agent.rounds || 0) + ' | Fragen: ' + (agent.questions || 0));
  if (agent.duration != null) lines.push('Dauer: ' + formatDuration(agent.duration));
  if (agent.score != null) lines.push('Score: ' + agent.score + '/100');
  lines.push('');
  lines.push('--- Verlauf (' + conv.length + ' Nachrichten) ---');
  lines.push('');
  conv.forEach(function(m, i) {
    var prefix = '';
    if (m.from === 'coordinator') prefix = '[Koordinator] ';
    else if (m.type === 'question') prefix = '[Frage] ';
    else if (m.type === 'message') prefix = '[Nachricht] ';
    else prefix = '[Agent] ';
    var ts = m.ts ? '[' + new Date(m.ts).toLocaleString('de-DE') + '] ' : '';
    lines.push(ts + prefix + (m.text || ''));
    lines.push('');
  });
  var text = lines.join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      var btn = document.querySelector('.afv-copy-all');
      if (btn) {
        var orig = btn.textContent;
        btn.textContent = 'Kopiert!';
        setTimeout(function() { btn.textContent = orig; }, 1500);
      }
    });
  }
}


// ── Prompt Inspector Tab Logic ──────────────────────────────────
function switchModalTab(btn, agentIdx) {
  // Legacy: redirect to new afv tab system if in fullview modal
  var modal = document.getElementById('agentModal');
  if (modal && modal.querySelector('.agent-fullview-modal')) {
    afvSwitchTab(btn, agentIdx);
    return;
  }
  var tabName = btn.getAttribute('data-tab');
  if (!modal) return;
  var tabs = modal.querySelectorAll('.modal-tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle('active', tabs[i] === btn);
  }
  var verlauf = document.getElementById('modalTabVerlauf');
  var inspector = document.getElementById('modalTabPromptInspector');
  if (verlauf) verlauf.classList.toggle('active', tabName === 'verlauf');
  if (inspector) inspector.classList.toggle('active', tabName === 'prompt-inspector');
  if (tabName === 'prompt-inspector' && !modal._piLoaded) {
    modal._piLoaded = true;
    loadPromptInspector(agentIdx);
  }
}
function getProjectIdFromState() {
  var dir = state.projectDir || '';
  var parts = dir.replace(/\\/g, '/').split('/');
  return parts.pop() || '';
}

function loadPromptInspector(agentIdx) {
  var projectId = getProjectIdFromState();
  var loadingEl = document.getElementById('piLoading');
  var contentEl = document.getElementById('piContent');
  if (!projectId) {
    if (loadingEl) loadingEl.style.display = 'none';
    if (contentEl) { clearEl(contentEl); contentEl.appendChild(createEl('div', { className: 'pi-empty' }, 'Keine Projekt-ID gefunden.')); }
    return;
  }
  var url = '/api/agent-prompts/' + encodeURIComponent(projectId) + '/' + encodeURIComponent(agentIdx);
  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (loadingEl) loadingEl.style.display = 'none';
      if (!contentEl) return;
      if (!data || !Array.isArray(data) || data.length === 0) {
        clearEl(contentEl); contentEl.appendChild(createEl('div', { className: 'pi-empty' }, 'Keine Prompt-Daten vorhanden.'));
        return;
      }
      contentEl.innerHTML = renderPromptInspector(data);
    })
    .catch(function(err) {
      if (loadingEl) loadingEl.style.display = 'none';
      if (contentEl) { clearEl(contentEl); contentEl.appendChild(createEl('div', { className: 'pi-empty' }, 'Fehler beim Laden: ' + (err.message || ''))); }
    });
}

function renderPromptInspector(rounds) {
  var totalPromptTokens = 0;
  var totalResponseTokens = 0;
  for (var i = 0; i < rounds.length; i++) {
    totalPromptTokens += rounds[i].promptTokens || 0;
    totalResponseTokens += rounds[i].responseTokens || 0;
  }
  var html = '<div class="pi-stats">' +
    '<div class="pi-stat"><strong>' + rounds.length + '</strong> Runden</div>' +
    '<div class="pi-stat">Prompt: <strong>' + formatTokenCount(totalPromptTokens) + '</strong> Tokens</div>' +
    '<div class="pi-stat">Response: <strong>' + formatTokenCount(totalResponseTokens) + '</strong> Tokens</div>' +
  '</div>';

  for (var i = 0; i < rounds.length; i++) {
    var r = rounds[i];
    var ts = r.ts ? new Date(r.ts).toLocaleString('de-DE') : '';
    var pTokens = r.promptTokens || 0;
    var rTokens = r.responseTokens || 0;
    html += '<div class="pi-round">' +
      '<div class="pi-round-header" onclick="togglePiRound(this)">' +
        '<span class="pi-round-arrow">▶</span>' +
        '<span class="pi-round-title">Runde ' + esc(String(r.round)) + '</span>' +
        (ts ? '<span style="color:var(--txt3);font-size:11px">' + esc(ts) + '</span>' : '') +
        '<span class="pi-round-meta">Prompt: ' + formatTokenCount(pTokens) + ' | Response: ' + formatTokenCount(rTokens) + '</span>' +
      '</div>' +
      '<div class="pi-round-body">' +
        '<div class="pi-section">' +
          '<div class="pi-section-header" onclick="togglePiSection(this)">' +
            '<span class="pi-section-arrow">▶</span>' +
            '<span>Prompt</span>' +
          '</div>' +
          '<div class="pi-section-body">' +
            '<button class="pi-copy-btn" onclick="piCopyText(this)">Kopieren</button>' +
            '<pre class="pi-pre">' + esc(r.prompt || '') + '</pre>' +
          '</div>' +
        '</div>' +
        '<div class="pi-section">' +
          '<div class="pi-section-header" onclick="togglePiSection(this)">' +
            '<span class="pi-section-arrow">▶</span>' +
            '<span>Response</span>' +
          '</div>' +
          '<div class="pi-section-body">' +
            '<button class="pi-copy-btn" onclick="piCopyText(this)">Kopieren</button>' +
            '<pre class="pi-pre">' + esc(r.response || '') + '</pre>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  return html;
}

function formatTokenCount(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function togglePiRound(headerEl) {
  var round = headerEl.parentElement;
  if (round) round.classList.toggle('open');
}

function togglePiSection(headerEl) {
  var section = headerEl.parentElement;
  if (section) section.classList.toggle('open');
}

function piCopyText(btn) {
  var pre = btn.parentElement.querySelector('.pi-pre');
  if (!pre) return;
  var text = pre.textContent || '';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      var orig = btn.textContent;
      btn.textContent = 'Kopiert!';
      setTimeout(function() { btn.textContent = orig; }, 1500);
    });
  }
}

function closeModal() {
  var modal = document.getElementById('agentModal');
  if (modal) modal.remove();
  document.removeEventListener('keydown', modalKeyHandler);
}

function modalKeyHandler(e) {
  if (e.key === 'Escape') closeModal();
}


function searchModalConv(query) {
  var modal = document.getElementById('agentModal');
  if (!modal) return;
  var idx = modal._agentIdx;
  if (idx != null) afvSearchConv(query, idx);
}
function highlightText(escapedHtml, query) {
  if (!query) return escapedHtml;
  var escapedQuery = esc(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  var regex = new RegExp('(' + escapedQuery + ')', 'gi');
  return escapedHtml.replace(regex, '<mark>$1</mark>');
}

function toggleAllDetails() {
  allDetailsExpanded = !allDetailsExpanded;
  var btn = document.getElementById('toggleDetailsBtn');
  if (btn) btn.textContent = allDetailsExpanded ? 'Details ausblenden' : 'Alle Details anzeigen';
  document.querySelectorAll('.agent-conv').forEach(function(el) {
    el.style.maxHeight = allDetailsExpanded ? 'none' : '220px';
  });
}

// ── Live-Streaming: Puffer und Throttle ──────────────────────
var _streamBuffers = {};    // index -> letzter Output-Text
var _streamTimers = {};     // index -> setTimeout-ID
var _STREAM_THROTTLE = 500; // ms zwischen DOM-Updates
var _agentTyping = {};      // index -> true/false

function _flushStreamBuffer(index) {
  _streamTimers[index] = null;
  var text = _streamBuffers[index] || '';
  if (!text) return;

  // Auf letzte 2000 Zeichen begrenzen
  if (text.length > 2000) text = text.slice(-2000);

  // Agent-Karte: Live-Preview aktualisieren
  var card = document.querySelector('[data-agent="' + index + '"]');
  if (card) {
    var preview = card.querySelector('.live-preview');
    if (!preview) {
      preview = document.createElement('div');
      preview.className = 'live-preview';
      var convEl = card.querySelector('.agent-conv');
      if (convEl) convEl.parentNode.insertBefore(preview, convEl);
    }
    // Nur letzte 4 Zeilen anzeigen
    var lines = text.split('\n');
    var lastLines = lines.slice(-4).join('\n');
    preview.textContent = lastLines;
    preview.scrollTop = preview.scrollHeight;
  }

  // Modal: Live-Update wenn offen und dieser Agent angezeigt wird
  var modal = document.getElementById('agentModal');
  if (modal && modal._agentIdx === index) {
    var liveEl = document.getElementById('afvLiveStream');
    if (!liveEl) {
      var convContent = document.getElementById('afvConvContent');
      if (convContent) {
        liveEl = document.createElement('div');
        liveEl.id = 'afvLiveStream';
        liveEl.className = 'afv-live-stream';
        convContent.appendChild(liveEl);
      }
    }
    if (liveEl) {
      var modalLines = text.split('\n').slice(-20).join('\n');
      liveEl.textContent = modalLines;
      // Smooth-Scroll im Modal
      var convContent2 = document.getElementById('afvConvContent');
      if (convContent2) {
        convContent2.scrollTo({ top: convContent2.scrollHeight, behavior: 'smooth' });
      }
    }
  }
}

// ── Lazy Loading: Nachrichten-Limit pro Agent ────────────────
var _CONV_PAGE_SIZE = 10;
var _convVisibleCount = {}; // idx -> Anzahl sichtbarer Nachrichten
var _interventionPending = {}; // idx -> true wenn Intervention gesendet, wartet auf Anwendung
var _interventionFormOpen = {}; // idx -> true wenn Formular offen

function loadOlderMessages(idx) {
  _convVisibleCount[idx] = (_convVisibleCount[idx] || _CONV_PAGE_SIZE) + _CONV_PAGE_SIZE;
  var agent = state.agents[idx];
  if (!agent) return;
  var conv = agent.conversation || [];
  var visible = _convVisibleCount[idx] || _CONV_PAGE_SIZE;
  var startAt = Math.max(0, conv.length - visible);
  var convEl = document.querySelector('[data-agent="' + idx + '"] .agent-conv');
  if (!convEl) return;
  // Sicher: DOM-Knoten aufbauen statt innerHTML
  clearEl(convEl);
  if (startAt > 0) {
    var loadMoreDiv = document.createElement('div');
    loadMoreDiv.style.cssText = 'text-align:center;margin-bottom:4px';
    var loadMoreBtn = createEl('button', { className: 'btn-outline', style: 'font-size:11px;padding:3px 10px' }, 'Aeltere Nachrichten laden (' + startAt + ' weitere)');
    (function(i) { loadMoreBtn.addEventListener('click', function() { loadOlderMessages(i); }); })(idx);
    loadMoreDiv.appendChild(loadMoreBtn);
    convEl.appendChild(loadMoreDiv);
  }
  for (var i = startAt; i < conv.length; i++) {
    convEl.appendChild(buildBubbleNode(conv[i], true));
  }
  convEl.scrollTop = convEl.scrollHeight;
}

function renderAgent(agent, idx) {
  var conv = agent.conversation || [];
  var bubbles = '';
  if (conv.length === 0) {
    var depsInfo = '';
    if ((agent.status === 'waiting' || agent.status === 'waiting_deps') && agent.depends_on && agent.depends_on.length > 0) {
      depsInfo = 'Wartet auf ' + agent.depends_on.map(function(d) { return 'Agent ' + (d + 1); }).join(', ');
    }
    bubbles = '<div class="bubble-empty">' + (depsInfo || (agent.status === 'waiting' || agent.status === 'waiting_deps' ? 'Wartet auf Zuweisung\u2026' : 'Startet\u2026')) + '</div>';
  } else {
    // Lazy Loading: nur die letzten N Nachrichten rendern
    var visible = _convVisibleCount[idx] || _CONV_PAGE_SIZE;
    var startAt = Math.max(0, conv.length - visible);
    if (startAt > 0) {
      bubbles += '<div style="text-align:center;margin-bottom:4px"><button class="btn-outline" style="font-size:11px;padding:3px 10px" onclick="loadOlderMessages(' + idx + ')">Aeltere Nachrichten laden (' + startAt + ' weitere)</button></div>';
    }
    for (var i = startAt; i < conv.length; i++) {
      bubbles += renderBubble(conv[i]);
    }
  }

  var retryBtn = agent.status === 'error' ? ' <button class="btn-retry" aria-label="Agent erneut versuchen" onclick="retryAgent(' + idx + ')">Wiederholen</button>' : '';

  var interveneBtn = agent.status === 'working' ? ' <button class="btn-intervene" onclick="openIntervention(' + idx + ')">Eingreifen</button>' : '';
  var interventionBadgeHtml = _interventionPending[idx] ? '<span class="intervention-badge">Intervention wartend</span>' : '';

  // Quick-Action Buttons
  var quickActions = '';
  var isActive = agent.status === 'working' || agent.status === 'asking' || agent.status === 'waiting' || agent.status === 'waiting_deps' || agent.status === 'retrying';
  if (isActive) {
    quickActions += ' <button class="btn-quick skip" title="\u00dcberspringen" onclick="quickIntervene(' + idx + ',\'skip\')">Überspringen</button>';

  } else if (agent.status === 'error') {
    quickActions += ' <button class="btn-quick skip" title="\u00dcberspringen" onclick="quickIntervene(' + idx + ',\'skip\')">Überspringen</button>';
    quickActions += ' <button class="btn-quick complete" title="Als fertig markieren" onclick="quickIntervene(' + idx + ',\'complete\')">Fertig markieren</button>';
  }

  // Intervention-History anzeigen
  var historyHtml = '';
  var ivHistory = agent.interventionHistory || [];
  if (ivHistory.length > 0) {
    historyHtml = '<div class="intervention-history"><div class="intervention-history-title">Interventionen (' + ivHistory.length + ')</div>';
    for (var h = ivHistory.length - 1; h >= Math.max(0, ivHistory.length - 5); h--) {

      var ivTypeLabel = { redirect: 'Umleitung', skip: '\u00dcberspringen', restart: 'Neustart', inject: 'Kontext', complete: 'Fertig' }[iv.type] || iv.type;
      historyHtml += '<div class="intervention-history-item">' +
        '<span class="intervention-history-type ' + esc(iv.type || '') + '">' + esc(ivTypeLabel) + '</span>' +

        '<span class="intervention-history-time">R' + (iv.round || 0) + ' ' + ivTime + '</span>' +
      '</div>';
    }
    if (ivHistory.length > 5) {
      historyHtml += '<div style="font-size:10px;color:var(--txt3);text-align:center;margin-top:3px">' + (ivHistory.length - 5) + ' weitere\u2026</div>';
    }
    historyHtml += '</div>';
  }

  // Intervention-Formular (mit Typ-Dropdown)
  var interventionFormHtml = _interventionFormOpen[idx] ?
    '<div class="intervention-form" id="intervention-form-' + idx + '">' +

        '<option value="redirect">Umleitung \u2013 Neue Anweisung</option>' +
        '<option value="inject">Kontext \u2013 Zusätzliche Info</option>' +
        '<option value="restart">Neustart \u2013 Von vorne beginnen</option>' +
        '<option value="skip">\u00dcberspringen \u2013 Agent auslassen</option>' +
        '<option value="complete">Fertig \u2013 Manuell abschließen</option>' +
      '</select>' +
      '<div class="intervention-type-hint" id="intervention-hint-' + idx + '">Agent bekommt eine neue Anweisung f\u00FCr die n\u00E4chste Runde.</div>' +
      '<textarea id="intervention-text-' + idx + '" rows="3" maxlength="2000" placeholder="Neue Anweisung oder Hinweis\u2026" oninput="updateInterventionCounter(' + idx + ')"></textarea>' +
      '<div class="intervention-counter" id="intervention-counter-' + idx + '">0/2000</div>' +
      '<div class="intervention-error" role="alert" id="intervention-error-' + idx + '" style="display:none"></div>' +

  return '<div class="agent-card ' + esc(agent.status || 'waiting') + '" data-agent="' + idx + '">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
      '<div>' +
        '<div class="agent-num">Agent ' + esc(String(idx + 1)) + '</div>' +
        (function() { var rm = getRoleMeta(agent.role); return rm ? '<div class="agent-role" style="' + roleColorStyle(agent.role) + '">' + esc(rm.name) + '</div>' : (agent.role ? '<div class="agent-role" style="background:var(--bg2);color:var(--txt3)">' + esc(agent.role) + '</div>' : ''); })() +
        '<div class="agent-title"><a class="agent-title-link" onclick="openAgentModal(' + idx + ')">' + esc(agent.title || '\u2014') + '</a></div>' +
      '</div>' +

    (agent.task ? '<div class="agent-task">' + esc(truncate(agent.task, 90)) + '</div>' : '') +
    '<div class="agent-conv" role="log" aria-live="polite" aria-label="Agent-Konversation"' + (allDetailsExpanded ? ' style="max-height:none"' : '') + '>' + bubbles + '</div>' +
    '<div class="agent-foot"><span>' + esc((agent.rounds || 0) + ' Runden \u00B7 ' + (agent.questions || 0) + ' Fragen' + (agent.duration != null ? ' \u00B7 ' + formatDuration(agent.duration) : '')) + (agent.status === 'done' && agent.stats ? ' \u00B7 ' + (agent.stats.filesCreated || 0) + ' Dateien \u00B7 ' + (agent.stats.linesOfCode || 0) + ' Zeilen \u00B7 ' + formatFileSize(agent.stats.totalFileSize || 0) : '') + renderAgentTokenInfo(agent) + '</span><span>' + interveneBtn + quickActions + retryBtn + ' <a class="details-link" onclick="openAgentModal(' + idx + ')">Details</a></span></div>' +
    historyHtml +
    interventionFormHtml +
  '</div>';
}

// ── Templates (CRUD) ────────────────────────────────────────
function loadTemplates() {
  fetch('/api/templates').then(function(r) {
    if (!r.ok) throw new Error('not found');
    return r.json();
  }).then(function(data) {
    if (Array.isArray(data)) {
      templates = data;
      taskPresets = [];
    } else {
      templates = (data && data.templates) || [];
      taskPresets = (data && data.taskPresets) || [];
    }
    if (state.phase === 'setup' || state.phase === 'idle') render();
  }).catch(function() {
    templates = [];
    taskPresets = [];
  });
}

function selectTemplate(id) {
  var tpl = templates.find(function(t) { return t.id === id; });
  if (!tpl) return;
  if (selectedTemplateId === id) {
    selectedTemplateId = null;
    var descEl = document.getElementById('desc');
    if (descEl) descEl.value = '';
    var slider = document.getElementById('countSlider');
    var display = document.getElementById('countDisplay');
    if (slider) { slider.value = '3'; }
    if (display) { display.textContent = '3'; }
    document.querySelectorAll('.template-card').forEach(function(c) { c.classList.remove('selected'); });
    return;
  }
  selectedTemplateId = id;
  var descEl = document.getElementById('desc');
  if (descEl) descEl.value = tpl.description;
  var count = Math.max(2, Math.min(10, tpl.suggestedAgents || 3));
  var slider = document.getElementById('countSlider');
  var display = document.getElementById('countDisplay');
  if (slider) { slider.value = String(count); }
  if (display) { display.textContent = String(count); }
  document.querySelectorAll('.template-card').forEach(function(c) { c.classList.remove('selected'); });
  var clicked = document.querySelector('.template-card[onclick*="' + id + '"]');
  if (clicked) clicked.classList.add('selected');
}

function getTagClass(tag) {
  var t = tag.toLowerCase();
  if (t === 'web' || t === 'website') return 'web';
  if (t === 'api' || t === 'rest') return 'api';
  if (t === 'refactoring' || t === 'refactor') return 'refactoring';
  if (t === 'frontend' || t === 'ui' || t === 'react' || t === 'vue') return 'frontend';
  if (t === 'backend' || t === 'server' || t === 'node') return 'backend';
  if (t === 'devops' || t === 'docker' || t === 'ci/cd' || t === 'deploy') return 'devops';
  if (t === 'testing' || t === 'test' || t === 'tests') return 'testing';
  if (t === 'ml' || t === 'ai' || t === 'machine learning' || t === 'python') return 'ml';
  return 'default';
}

function filterTemplatesByTag(tag) {
  templateTagFilter = tag;
  render();
}

function saveTemplateForm() {
  var titleVal = (document.getElementById('tplFormTitle').value || '').trim();
  var desc = (document.getElementById('tplFormDesc').value || '').trim();
  var agents = parseInt(document.getElementById('tplFormAgents').value) || 3;
  var icon = (document.getElementById('tplFormIcon').value || '').trim();
  var tagsRaw = (document.getElementById('tplFormTags').value || '').trim();
  var tags = tagsRaw ? tagsRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];
  var statusEl = document.getElementById('tplFormStatus');
  if (!titleVal) { if (statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Titel ist erforderlich'; } return; }
  if (!desc) { if (statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Beschreibung ist erforderlich'; } return; }
  var url = tplEditId ? '/api/templates/' + encodeURIComponent(tplEditId) : '/api/templates';
  var method = tplEditId ? 'PUT' : 'POST';
  var reqBody = { title: titleVal, description: desc, agentCount: agents, icon: icon || '\uD83D\uDCC4', tags: tags };
  if (statusEl) { statusEl.style.color = 'var(--txt3)'; statusEl.textContent = 'Speichern...'; }
  authFetch(url, {
    method: method,
    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
    body: JSON.stringify(reqBody)
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.ok) {
      var modal = document.getElementById('tplFormModal');
      if (modal) modal.remove();
      loadTemplates();
    } else {
      if (statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = data.error || 'Fehler beim Speichern'; }
    }
  }).catch(function(e) {
    if (statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Netzwerkfehler: ' + e.message; }
  });
}

function importTemplatesDialog() {
  closeTemplateManager();
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.style.display = 'none';
  input.onchange = function() {
    if (!input.files || !input.files[0]) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var imported = JSON.parse(e.target.result);
        if (!imported.templates || !Array.isArray(imported.templates)) {
          alert('Ungueltiges Format: Die JSON-Datei muss ein "templates" Array enthalten.');
          return;
        }
        if (!confirm(imported.templates.length + ' Vorlagen importieren?')) return;
        authFetch('/api/templates/import', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
          body: JSON.stringify(imported)
        }).then(function(r) { return r.json(); }).then(function(data) {
          if (data.ok) {
            alert(data.imported + ' Vorlagen importiert. Gesamt: ' + data.total);
            loadTemplates();
          } else {
            alert('Import-Fehler: ' + (data.error || 'Unbekannt'));
          }
        }).catch(function(err) { alert('Netzwerkfehler: ' + err.message); });
      } catch (parseErr) {
        alert('JSON-Parsing-Fehler: ' + parseErr.message);
      }
    };
    reader.readAsText(input.files[0]);
  };
  document.body.appendChild(input);
  input.click();
  setTimeout(function() { input.remove(); }, 60000);
}

// ── Meilensteine ──────────────────────────────────────────────
function loadMilestones() {
  fetch('/api/milestones').then(function(r) {
    if (!r.ok) throw new Error('not found');
    return r.json();
  }).then(function(data) {
    milestones = (data && data.milestones) || [];
  }).catch(function() {
    milestones = [];
  });
}

function openMilestoneModal() {
  loadMilestones();
  setTimeout(function() { renderMilestoneModal(); }, 200);
}

function renderMilestoneModal() {
  var existing = document.getElementById('milestoneOverlay');
  if (existing) existing.remove();

  var overlay = document.createElement('div');
  overlay.id = 'milestoneOverlay';
  overlay.className = 'modal-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) closeMilestoneModal(); };

  var h = '<div class="modal" style="max-width:780px">' +
    '<button class="modal-close" onclick="closeMilestoneModal()" aria-label="Schliessen">&times;</button>' +
    '<div style="font-size:18px;font-weight:600;margin-bottom:4px">Meilensteine</div>' +
    '<div style="font-size:12px;color:var(--txt2);margin-bottom:1rem">Vordefinierte Projektvorlagen mit fertigen Aufgaben. Klicke einen Meilenstein an, um die Tasks zu bearbeiten.</div>';

  if (milestones.length === 0) {
    h += '<div style="padding:2rem;text-align:center;color:var(--txt3)">Keine Meilensteine vorhanden.<br>Erstelle eine <code>milestones.json</code> im Projektordner.</div>';
  } else {
    h += '<div class="milestone-grid">';
    milestones.forEach(function(m) {
      var sel = selectedMilestoneId === m.id ? ' selected' : '';
      h += '<div class="milestone-card' + sel + '" onclick="selectMilestone(\'' + esc(m.id) + '\')">' +
        '<div class="milestone-title">' + esc(m.title) + '</div>' +
        '<div class="milestone-desc">' + esc(m.description) + '</div>' +
        '<div class="milestone-meta">' + m.tasks.length + ' Aufgaben &middot; ' + m.agentCount + ' Agenten</div>' +
      '</div>';
    });
    h += '</div>';
  }

  if (selectedMilestoneId && milestoneEditorTasks.length > 0) {
    h += '<div class="milestone-editor">' +
      '<div style="font-size:14px;font-weight:600;margin-bottom:8px">Aufgaben bearbeiten</div>';
    milestoneEditorTasks.forEach(function(t, i) {
      h += '<div class="milestone-task-row" data-task-idx="' + i + '">' +
        '<div class="task-num">#' + (i + 1) + '</div>' +
        '<div class="task-fields">' +
          '<input type="text" placeholder="Titel" value="' + esc(t.title) + '" onchange="updateMilestoneTask(' + i + ',\'title\',this.value)">' +
          '<textarea placeholder="Aufgabe" onchange="updateMilestoneTask(' + i + ',\'task\',this.value)">' + esc(t.task) + '</textarea>' +
          '<input type="text" placeholder="Lieferergebnis" value="' + esc(t.deliverable) + '" onchange="updateMilestoneTask(' + i + ',\'deliverable\',this.value)">' +
          (t.depends_on && t.depends_on.length > 0 ? '<div style="font-size:11px;color:var(--amber)">Abh\u00E4ngig von: ' + t.depends_on.map(function(d) { return 'Agent ' + (d + 1); }).join(', ') + '</div>' : '') +
        '</div>' +
        (milestoneEditorTasks.length > 2 ? '<button class="milestone-task-remove" onclick="removeMilestoneTask(' + i + ')" title="Task entfernen">&times;</button>' : '') +
      '</div>';
    });
    h += '<div style="margin-top:6px">' +
      '<button class="btn-outline" onclick="addMilestoneTask()" style="font-size:12px;padding:4px 12px">+ Task hinzuf\u00FCgen</button>' +
    '</div>';
    h += '<div class="milestone-actions">' +
      '<button class="btn-outline" onclick="closeMilestoneModal()">Abbrechen</button>' +
      '<button class="btn-outline" onclick="applyMilestoneToSetup()">In Formular \u00FCbernehmen</button>' +
      '<button class="btn-primary" onclick="startMilestoneProject()" style="flex:none;padding:8px 20px">Meilenstein starten</button>' +
    '</div>';
    h += '</div>';
  }

  h += '</div>';
  overlay.innerHTML = h;
  document.body.appendChild(overlay);
}

function closeMilestoneModal() {
  var overlay = document.getElementById('milestoneOverlay');
  if (overlay) overlay.remove();
  selectedMilestoneId = null;
  milestoneEditorTasks = [];
}

function selectMilestone(id) {
  var m = milestones.find(function(ms) { return ms.id === id; });
  if (!m) return;

  if (selectedMilestoneId === id) {
    selectedMilestoneId = null;
    milestoneEditorTasks = [];
  } else {
    selectedMilestoneId = id;
    milestoneEditorTasks = m.tasks.map(function(t) {
      return { title: t.title, task: t.task, deliverable: t.deliverable, depends_on: t.depends_on ? t.depends_on.slice() : [] };
    });
  }
  renderMilestoneModal();
}

function updateMilestoneTask(idx, field, value) {
  if (milestoneEditorTasks[idx]) {
    milestoneEditorTasks[idx][field] = value;
  }
}

function removeMilestoneTask(idx) {
  if (milestoneEditorTasks.length <= 2) return;
  milestoneEditorTasks.splice(idx, 1);
  milestoneEditorTasks.forEach(function(t) {
    if (t.depends_on && t.depends_on.length > 0) {
      t.depends_on = t.depends_on.filter(function(d) { return d !== idx; }).map(function(d) { return d > idx ? d - 1 : d; });
    }
  });
  renderMilestoneModal();
}

function addMilestoneTask() {
  if (milestoneEditorTasks.length >= 10) {
    addBanner('warn', 'Maximal 10 Tasks pro Meilenstein erlaubt.');
    return;
  }
  milestoneEditorTasks.push({ title: '', task: '', deliverable: '', depends_on: [] });
  renderMilestoneModal();
}

function applyMilestoneToSetup() {
  var m = milestones.find(function(ms) { return ms.id === selectedMilestoneId; });
  if (!m) return;

  var desc = m.title + ': ' + m.description + '\n\n' +
    milestoneEditorTasks.map(function(t, i) {
      return (i + 1) + '. ' + t.title + ' \u2013 ' + t.task + ' (Lieferergebnis: ' + t.deliverable + ')';
    }).join('\n');

  closeMilestoneModal();

  setTimeout(function() {
    var descEl = document.getElementById('desc');
    if (descEl) descEl.value = desc;
    var count = Math.max(2, Math.min(10, milestoneEditorTasks.length));
    var slider = document.getElementById('countSlider');
    var display = document.getElementById('countDisplay');
    if (slider) { slider.value = String(count); slider.setAttribute('aria-valuenow', String(count)); }
    if (display) display.textContent = String(count);
  }, 100);
}

var _milestoneBusy = false;
async function startMilestoneProject() {
  if (!selectedMilestoneId || _milestoneBusy || busy) return;
  _milestoneBusy = true;

  var hasEmpty = milestoneEditorTasks.some(function(t) { return !t.title.trim() || !t.task.trim(); });
  if (hasEmpty) {
    addBanner('warn', 'Alle Tasks brauchen mindestens Titel und Aufgabe.');
    _milestoneBusy = false;
    return;
  }

  busy = true;
  requestNotificationPermission();

  try {
    state.phase = 'running';
    state.projectTitle = '';
    state.projectSummary = '';
    state.coordinator = { status: 'planning', summary: '', activeQuestion: null, log: [], interimReports: [], finalReport: null, adaptations: [] };
    state.agents = [];
    for (var i = 0; i < milestoneEditorTasks.length; i++) {
      state.agents.push({
        id: i, title: milestoneEditorTasks[i].title, task: milestoneEditorTasks[i].task,
        deliverable: milestoneEditorTasks[i].deliverable,
        status: 'waiting', conversation: [], rounds: 0, questions: 0
      });
    }

    var msId = selectedMilestoneId;
    var msTasks = milestoneEditorTasks.slice();
    closeMilestoneModal();
    render();

    await authFetch('/api/start-milestone', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ milestoneId: msId, tasks: msTasks })
    });
  } catch (e) {
    addBanner('error', 'Fehler beim Starten: ' + e.message);
    state.phase = 'setup';
    render();
  } finally {
    _milestoneBusy = false;
    busy = false;
  }
}

// ── History ──────────────────────────────────────────────────
function loadHistory() {
  fetch('/api/projects').then(function(r) {
    if (!r.ok) throw new Error('not found');
    return r.json();
  }).then(function(data) {
    projectHistory = data || [];
    renderHistory();
  }).catch(function() {
    projectHistory = [];
    renderHistory();
  });
  // Analytics parallel laden
  fetch('/api/analytics').then(function(r) {
    if (!r.ok) throw new Error('analytics error');
    return r.json();
  }).then(function(data) {
    analyticsData = data;
    if (historyView === 'stats') renderHistory();
  }).catch(function() {
    analyticsData = null;
  });
}

// ── Historie filtern und sortieren ──────────────────────────
function getFilteredHistory() {
  var list = projectHistory.slice();
  if (historyFilterPhase !== 'alle') {
    list = list.filter(function(p) {
      var ph = p.phase || 'unknown';
      if (historyFilterPhase === 'done') return ph === 'complete' || ph === 'done';
      if (historyFilterPhase === 'error') return ph === 'error';
      if (historyFilterPhase === 'partial') return ph === 'partial' || ph === 'running' || ph === 'idle' || ph === 'setup' || ph === 'unknown';
      return true;
    });
  }
  if (historyFilterScore !== 'alle') {
    list = list.filter(function(p) {
      var sc = p.projectScore;
      if (sc == null) return false;
      if (historyFilterScore === '0-25') return sc >= 0 && sc <= 25;
      if (historyFilterScore === '25-50') return sc > 25 && sc <= 50;
      if (historyFilterScore === '50-75') return sc > 50 && sc <= 75;
      if (historyFilterScore === '75-100') return sc > 75 && sc <= 100;
      return true;
    });
  }
  if (historyFilterTime !== 'alle') {
    var startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
    var startOfWeek = new Date(startOfDay); startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay() + 1);
    if (startOfWeek > startOfDay) startOfWeek.setDate(startOfWeek.getDate() - 7);
    var startOfMonth = new Date(startOfDay.getFullYear(), startOfDay.getMonth(), 1);
    list = list.filter(function(p) {
      var ts = p.createdAt || 0;
      if (historyFilterTime === 'heute') return ts >= startOfDay.getTime();
      if (historyFilterTime === 'woche') return ts >= startOfWeek.getTime();
      if (historyFilterTime === 'monat') return ts >= startOfMonth.getTime();
      return true;
    });
  }
  list.sort(function(a, b) {
    if (historySort === 'datum-desc') return (b.createdAt || 0) - (a.createdAt || 0);
    if (historySort === 'datum-asc') return (a.createdAt || 0) - (b.createdAt || 0);
    if (historySort === 'score-desc') return (b.projectScore || 0) - (a.projectScore || 0);
    if (historySort === 'score-asc') return (a.projectScore || 0) - (b.projectScore || 0);
    if (historySort === 'dauer-desc') return (b.totalDuration || 0) - (a.totalDuration || 0);
    if (historySort === 'dauer-asc') return (a.totalDuration || 0) - (b.totalDuration || 0);
    if (historySort === 'agents-desc') return (b.agentCount || 0) - (a.agentCount || 0);
    if (historySort === 'agents-asc') return (a.agentCount || 0) - (b.agentCount || 0);
    return 0;
  });
  return list;
}

function setHistoryView(v) {
  historyView = v;
  try { localStorage.setItem('historyView', v); } catch(e) {}
  calendarPopupDay = null;
  renderHistory();
}

function setHistoryFilter(type, value) {
  if (type === 'phase') historyFilterPhase = value;
  if (type === 'score') historyFilterScore = value;
  if (type === 'time') historyFilterTime = value;
  calendarPopupDay = null;
  renderHistory();
}

function setHistorySort(value) {
  historySort = value;
  renderHistory();
}

// ── Tags verwalten ──────────────────────────────────────────
function saveProjectTags() {
  try { localStorage.setItem('projectTags', JSON.stringify(projectTags)); } catch(e) {}
}

function addProjectTag(pid) {
  var tag = prompt('Tag eingeben:');
  if (!tag || !tag.trim()) return;
  tag = tag.trim().toLowerCase().slice(0, 20);
  if (!projectTags[pid]) projectTags[pid] = [];
  if (projectTags[pid].indexOf(tag) === -1) {
    projectTags[pid].push(tag);
    saveProjectTags();
    renderHistory();
  }
}

function removeProjectTag(pid, tag) {
  if (!projectTags[pid]) return;
  projectTags[pid] = projectTags[pid].filter(function(t) { return t !== tag; });
  if (projectTags[pid].length === 0) delete projectTags[pid];
  saveProjectTags();
  renderHistory();
}

// ── Render: Projekt-Karte (erweitert) ───────────────────────

  }
