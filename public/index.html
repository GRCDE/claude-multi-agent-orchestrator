// ── Templates ────────────────────────────────────────────────
function loadTemplates() {
  fetch('/api/templates').then(function(r) {
    if (!r.ok) throw new Error('not found');
    return r.json();
  }).then(function(data) {
    templates = data || [];
    // Re-render setup if we're on that screen
    if (state.phase === 'setup' || state.phase === 'idle') render();
  }).catch(function() {
    templates = [];
  });
}

function selectTemplate(id) {
  var tpl = templates.find(function(t) { return t.id === id; });
  if (!tpl) return;

  // Toggle: clicking the same template deselects it
  if (selectedTemplateId === id) {
    selectedTemplateId = null;
    // Clear textarea and reset slider
    var descEl = document.getElementById('desc');
    if (descEl) descEl.value = '';
    var slider = document.getElementById('countSlider');
    var display = document.getElementById('countDisplay');
    if (slider) { slider.value = '3'; }
    if (display) { display.textContent = '3'; }
    // Update card highlights
    document.querySelectorAll('.template-card').forEach(function(c) { c.classList.remove('selected'); });
    return;
  }

  selectedTemplateId = id;

  // Fill textarea with template description
  var descEl = document.getElementById('desc');
  if (descEl) descEl.value = tpl.description;

  // Set agent slider to suggested count (clamped to slider range 2-5)
  var count = Math.max(2, Math.min(10, tpl.suggestedAgents || 3));
  var slider = document.getElementById('countSlider');
  var display = document.getElementById('countDisplay');
  if (slider) { slider.value = String(count); }
  if (display) { display.textContent = String(count); }

  // Update card highlights
  document.querySelectorAll('.template-card').forEach(function(c) { c.classList.remove('selected'); });
  var clicked = document.querySelector('.template-card[onclick*="' + id + '"]');
  if (clicked) clicked.classList.add('selected');
}

// ── History ──────────────────────────────────────────────────
function loadHistory() {
  fetch('/api/projects').then(function(r) {
    if (!r.ok) throw new Error('not found');
    return r.json();
  }).then(function(data) {
    projectHistory = data || [];
    renderHistory();
  }).catch(function() {
    // endpoint may not exist yet
    projectHistory = [];
    renderHistory();
  });
}

function renderHistory() {
  var area = document.getElementById('historyArea');
  if (!area) return;
  if (projectHistory.length === 0) {
    area.innerHTML = '<div class="section-label">Bisherige Projekte</div><div class="history-empty">Noch keine Projekte vorhanden.</div><div class="disk-usage" id="diskUsageInfo"></div>';
    loadDiskUsage();
    return;
  }
  var html = '<div style="display:flex;justify-content:space-between;align-items:center">' +
    '<div class="section-label" style="margin-bottom:0">Bisherige Projekte</div>';
  if (projectHistory.length >= 2) {
    if (compareMode) {
      html += '<div class="compare-actions">' +
        '<button class="compare-start-btn" onclick="startComparison()"' + (compareSelected.length !== 2 ? ' disabled' : '') + '>Vergleich starten</button>' +
        '<button class="compare-cancel-btn" onclick="toggleCompareMode()">Abbrechen</button>' +
        '<span class="compare-hint">' + esc(compareSelected.length + ' von 2 ausgew\u00E4hlt') + '</span>' +
      '</div>';
    } else {
      html += '<button class="btn-sm" onclick="toggleCompareMode()" style="font-size:11px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--border);background:var(--bg2);color:var(--txt2);cursor:pointer">Vergleichen</button>';
    }
  }
  html += '</div>';
  projectHistory.forEach(function(p) {
    var pid = esc(p.id || p);
    var isChecked = compareSelected.indexOf(pid) !== -1;
    html += '<div class="history-item">';
    if (compareMode) {
      html += '<input type="checkbox" class="compare-check"' + (isChecked ? ' checked' : '') + ' onclick="event.stopPropagation();toggleCompareSelect(\'' + pid + '\')"' + (!isChecked && compareSelected.length >= 2 ? ' disabled' : '') + '>';
    }
    html += '<span class="history-title" onclick="loadProject(\'' + pid + '\')">' + esc(p.title || p.id || p) + (p.totalDuration ? ' (' + formatDuration(p.totalDuration) + ')' : '') + '</span>' +
      '<span class="history-id">' + pid + '</span>' +
      '<button class="history-clone" onclick="event.stopPropagation();cloneProject(\'' + pid + '\')" title="Projekt wiederholen">\u21BB</button>' +
      '<button class="history-delete" onclick="event.stopPropagation();deleteProject(\'' + pid + '\')" title="Projekt l\u00F6schen">\u2715</button>' +
    '</div>';
  });
  html += '<div class="history-actions"><button class="btn-sm" onclick="cleanupProjects()">Alte Projekte aufr\u00E4umen</button></div>';
  html += '<div class="disk-usage" id="diskUsageInfo"></div>';
  area.innerHTML = html;
  loadDiskUsage();
}

function toggleCompareMode() {
  compareMode = !compareMode;
  compareSelected = [];
  renderHistory();
}

function toggleCompareSelect(pid) {
  var idx = compareSelected.indexOf(pid);
  if (idx !== -1) {
    compareSelected.splice(idx, 1);
  } else if (compareSelected.length < 2) {
    compareSelected.push(pid);
  }
  renderHistory();
}

async function startComparison() {
  if (compareSelected.length !== 2) return;
  try {
    var responses = await Promise.all([
      fetch('/api/projects/' + encodeURIComponent(compareSelected[0])).then(function(r) { if (!r.ok) throw new Error('Projekt nicht gefunden'); return r.json(); }),
      fetch('/api/projects/' + encodeURIComponent(compareSelected[1])).then(function(r) { if (!r.ok) throw new Error('Projekt nicht gefunden'); return r.json(); })
    ]);
    openCompareModal(responses[0], responses[1]);
  } catch (e) {
    addBanner('error', 'Vergleich fehlgeschlagen: ' + e.message);
  }
}

function extractCompareStats(proj) {
  var agents = proj.agents || [];
  var totalRounds = agents.reduce(function(s, a) { return s + (a.rounds || 0); }, 0);
  var totalQuestions = agents.reduce(function(s, a) { return s + (a.questions || 0); }, 0);
  var doneCount = agents.filter(function(a) { return a.status === 'done'; }).length;
  var errorCount = agents.filter(function(a) { return a.status === 'error'; }).length;
  return {
    title: proj.projectTitle || proj.id || '(Unbenannt)',
    phase: proj.phase || 'unbekannt',
    agentCount: agents.length,
    doneCount: doneCount,
    errorCount: errorCount,
    totalRounds: totalRounds,
    totalQuestions: totalQuestions,
    duration: proj.totalDuration,
    agents: agents
  };
}

function renderCompareCol(stats) {
  var html = '<div class="compare-col">' +
    '<div class="compare-col-title">' + esc(stats.title) + '</div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Status</span><span class="compare-stat-value">' + badge(stats.phase) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Agenten</span><span class="compare-stat-value">' + esc(String(stats.agentCount)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Erfolgreich</span><span class="compare-stat-value">' + esc(String(stats.doneCount)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Fehlgeschlagen</span><span class="compare-stat-value">' + esc(String(stats.errorCount)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Runden gesamt</span><span class="compare-stat-value">' + esc(String(stats.totalRounds)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Fragen gesamt</span><span class="compare-stat-value">' + esc(String(stats.totalQuestions)) + '</span></div>' +
    '<div class="compare-stat"><span class="compare-stat-label">Dauer</span><span class="compare-stat-value">' + esc(stats.duration != null ? formatDuration(stats.duration) : '\u2014') + '</span></div>';

  if (stats.agents.length > 0) {
    html += '<div class="compare-agents-title">Agenten</div>';
    stats.agents.forEach(function(a, i) {
      html += '<div class="compare-agent-row">' +
        '<span style="color:var(--txt3);font-size:11px;min-width:18px">A' + (i + 1) + '</span>' +
        '<span class="compare-agent-name">' + esc(a.title || '\u2014') + '</span>' +
        badge(a.status || 'waiting') +
      '</div>';
    });
  }
  html += '</div>';
  return html;
}

function openCompareModal(proj1, proj2) {
  closeCompareModal();
  var stats1 = extractCompareStats(proj1);
  var stats2 = extractCompareStats(proj2);

  var overlay = document.createElement('div');
  overlay.id = 'compareModal';
  overlay.className = 'modal-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) closeCompareModal(); };

  overlay.innerHTML = '<div class="modal compare-modal">' +
    '<button class="modal-close" onclick="closeCompareModal()" title="Schlie\u00DFen">\u00D7</button>' +
    '<h3>Projektvergleich</h3>' +
    '<div class="compare-layout">' +
      renderCompareCol(stats1) +
      renderCompareCol(stats2) +
    '</div>' +
  '</div>';

  document.body.appendChild(overlay);
  document.addEventListener('keydown', compareModalKeyHandler);
}

function closeCompareModal() {
  var el = document.getElementById('compareModal');
  if (el) el.remove();
  document.removeEventListener('keydown', compareModalKeyHandler);
}

function compareModalKeyHandler(e) {
  if (e.key === 'Escape') closeCompareModal();
}

function deleteProject(id) {
  if (!confirm('Projekt "' + id + '" wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.')) return;
  fetch('/api/projects/' + encodeURIComponent(id), { method: 'DELETE' })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Fehler'); });
      return r.json();
    })
    .then(function() {
      addBanner('success', 'Projekt ' + id + ' gelöscht.');
      loadHistory();
    })
    .catch(function(err) {
      addBanner('error', 'Löschen fehlgeschlagen: ' + err.message);
    });
}

function cleanupProjects() {
  if (!confirm('Alle Projekte löschen, die älter als 7 Tage sind?')) return;
  fetch('/api/cleanup', { method: 'POST' })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Fehler'); });
      return r.json();
    })
    .then(function(data) {
      if (data.count > 0) {
        addBanner('success', data.count + ' alte Projekt(e) gelöscht.');
      } else {
        addBanner('info', 'Keine Projekte älter als 7 Tage gefunden.');
      }
      loadHistory();
    })
    .catch(function(err) {
      addBanner('error', 'Aufräumen fehlgeschlagen: ' + err.message);
    });
}

function loadDiskUsage() {
  fetch('/api/disk-usage').then(function(r) {
    if (!r.ok) throw new Error('Fehler');
    return r.json();
  }).then(function(data) {
    var el = document.getElementById('diskUsageInfo');
    if (!el) return;
    el.textContent = 'Speicher: ' + data.projectCount + ' Projekt(e) • ' + data.totalSize + ' belegt';
  }).catch(function() {});
}

function loadProject(id) {
  fetch('/api/projects/' + encodeURIComponent(id)).then(function(r) {
    if (!r.ok) throw new Error('Projekt nicht gefunden');
    return r.json();
  }).then(function(data) {
    applyState(data);
    render();
  }).catch(function(err) {
    addBanner('error', 'Projekt laden fehlgeschlagen: ' + err.message);
  });
}

// ── Actions ──────────────────────────────────────────────────
async function startProject() {
  var descEl = document.getElementById('desc');
  var desc = descEl ? descEl.value.trim() : '';
  var sliderEl = document.getElementById('countSlider');
  var count = parseInt(sliderEl ? sliderEl.value : '3');
  if (!desc || busy) return;
  busy = true;
  requestNotificationPermission();
  var btn = document.getElementById('startBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Startet\u2026'; }

  try {
    state.phase = 'running';
    state.projectTitle = '';
    state.projectSummary = '';
    state.coordinator = { status: 'planning', summary: '', activeQuestion: null, log: [] };
    state.agents = [];
    for (var i = 0; i < count; i++) {
      state.agents.push({
        id: i, title: 'Wird geplant\u2026', task: '', deliverable: '',
        status: 'waiting', conversation: [], rounds: 0, questions: 0
      });
    }
    render();

    var approvalEl = document.getElementById('approvalCheck');
    var requireApproval = approvalEl ? approvalEl.checked : false;

    await fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc, agentCount: count, requireApproval: requireApproval })
    });
  } catch (e) {
    addBanner('error', 'Fehler beim Starten: ' + e.message);
    state.phase = 'setup';
    render();
  } finally {
    busy = false;
  }
}

async function resetProject() {
  if (!confirm('Projekt wirklich zur\u00FCcksetzen?')) return;
  await fetch('/api/reset', { method: 'POST' });
  state = {
    phase: 'setup', projectTitle: '', projectSummary: '', projectDir: '',
    coordinator: { status: 'idle', summary: '', activeQuestion: null, log: [] },
    agents: [], startedAt: null, completedAt: null, totalDuration: null
  };
  banners = [];
  mergedFiles = null;
  compareMode = false;
  compareSelected = [];
  fileTreeOpen = false;
  fileGroupState = {};
  stopFileTreePolling();
  render();
}

async function cloneProject(projectId) {
  // Projekt-ID ermitteln: entweder als Parameter oder aus aktuellem State
  var id = projectId;
  if (!id) {
    var dir = state.projectDir || '';
    id = dir.split('/').pop() || dir.split('\').pop() || '';
  }
  if (!id || !id.startsWith('proj_')) {
    addBanner('error', 'Keine gültige Projekt-ID gefunden.');
    return;
  }
  try {
    var r = await fetch('/api/clone/' + encodeURIComponent(id), { method: 'POST' });
    if (!r.ok) {
      var err = await r.json();
      throw new Error(err.error || 'Fehler beim Klonen');
    }
    var data = await r.json();
    // Reset auf Setup-Ansicht
    await fetch('/api/reset', { method: 'POST' });
    state = {
      phase: 'setup', projectTitle: '', projectSummary: '', projectDir: '',
      coordinator: { status: 'idle', summary: '', activeQuestion: null, log: [] },
      agents: [], startedAt: null, completedAt: null, totalDuration: null
    };
    banners = [];
    mergedFiles = null;
    fileTreeOpen = false;
    fileGroupState = {};
    stopFileTreePolling();
    render();
    // Formular vorausfüllen
    var descEl = document.getElementById('desc');
    if (descEl && data.description) {
      descEl.value = data.description;
    }
    var sliderEl = document.getElementById('countSlider');
    var displayEl = document.getElementById('countDisplay');
    if (sliderEl && data.agentCount) {
      var count = Math.min(Math.max(2, data.agentCount), 10);
      sliderEl.value = count;
      if (displayEl) displayEl.textContent = count;
    }
    addBanner('success', 'Projekteinstellungen geladen. Du kannst sie anpassen und neu starten.');
  } catch (e) {
    addBanner('error', 'Klonen fehlgeschlagen: ' + e.message);
  }
}

function exportProject() {
  var dir = state.projectDir || '';
  var id = dir.split('/').pop() || dir.split('\\').pop() || '';
  if (!id) {
    addBanner('error', 'Keine Projekt-ID gefunden.');
    return;
  }
  window.location = '/api/export/' + encodeURIComponent(id);
}

async function loadMergedFiles() {
  var dir = state.projectDir || '';
  var id = dir.split('/').pop() || dir.split('\\').pop() || '';
  if (!id) {
    addBanner('error', 'Keine Projekt-ID gefunden.');
    return;
  }
  try {
    var r = await fetch('/api/merged/' + encodeURIComponent(id));
    if (!r.ok) {
      addBanner('warn', 'Zusammengef\u00FChrte Dateien nicht verf\u00FCgbar.');
      return;
    }
    var data = await r.json();
    mergedFiles = data;
    render();
  } catch (e) {
    addBanner('error', 'Fehler beim Laden der zusammengef\u00FChrten Dateien.');
  }
}

async function retryAgent(index) {
  try {
    var r = await fetch('/api/retry/' + index, { method: 'POST' });
    if (!r.ok) {
      addBanner('error', 'Agent ' + (index + 1) + ' konnte nicht neu gestartet werden.');
    }
  } catch (e) {
    addBanner('error', 'Retry fehlgeschlagen: ' + e.message);
  }
}

// ── File Tree ─────────────────────────────────────────────────
var fileTreeOpen = false;
var fileTreeTimer = null;
var fileGroupState = {}; // track which groups are open

function getProjectId() {
  var dir = state.projectDir || '';
  return dir.split('/').pop() || dir.split('\\').pop() || '';
}

function formatFileSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function fileIcon(filename) {
  var ext = (filename.split('.').pop() || '').toLowerCase();
  if (ext === 'md') return '\uD83D\uDCDD';
  if (ext === 'json') return '\uD83D\uDCCB';
  if (ext === 'js' || ext === 'ts' || ext === 'jsx' || ext === 'tsx') return '\uD83D\uDCBB';
  if (ext === 'css' || ext === 'html' || ext === 'htm') return '\uD83C\uDFA8';
  if (ext === 'py') return '\uD83D\uDC0D';
  return '\uD83D\uDCC4';
}

function toggleFileTree() {
  fileTreeOpen = !fileTreeOpen;
  var content = document.getElementById('fileTreeContent');
  var arrow = document.getElementById('fileTreeArrow');
  if (!content || !arrow) return;
  if (fileTreeOpen) {
    arrow.classList.add('open');
    content.style.display = '';
    loadFileTree();
    startFileTreePolling();
  } else {
    arrow.classList.remove('open');
    content.style.display = 'none';
    stopFileTreePolling();
  }
}

function toggleFileGroup(groupName) {
  fileGroupState[groupName] = !fileGroupState[groupName];
  var items = document.getElementById('fg-' + groupName);
  var arrow = document.getElementById('fga-' + groupName);
  if (items) items.style.display = fileGroupState[groupName] ? 'none' : '';
  if (arrow) {
    if (fileGroupState[groupName]) arrow.classList.remove('open');
    else arrow.classList.add('open');
  }
}

function loadFileTree() {
  var id = getProjectId();
  if (!id) {
    renderFileTree([]);
    return;
  }
  fetch('/api/files/' + encodeURIComponent(id)).then(function(r) {
    if (!r.ok) throw new Error('Fehler');
    return r.json();
  }).then(function(files) {
    renderFileTree(files);
  }).catch(function() {
    renderFileTree([]);
  });
}

function renderFileTree(files) {
  var container = document.getElementById('fileTreeContent');
  if (!container) return;

  if (!files || files.length === 0) {
    container.innerHTML = '<div class="file-tree-empty">Noch keine Dateien vorhanden.</div>';
    return;
  }

  // Group files by first directory component
  var groups = {};
  var rootFiles = [];
  files.forEach(function(f) {
    var p = f.path || f;
    var size = f.size || 0;
    var parts = p.split('/');
    if (parts.length > 1) {
      var group = parts[0];
      if (!groups[group]) groups[group] = [];
      groups[group].push({ path: parts.slice(1).join('/'), size: size });
    } else {
      rootFiles.push({ path: p, size: size });
    }
  });

  var html = '';
  var groupNames = Object.keys(groups).sort();

  groupNames.forEach(function(name) {
    var items = groups[name];
    var collapsed = fileGroupState[name] || false;
    html += '<div class="file-group">' +
      '<button class="file-group-header" onclick="toggleFileGroup(\'' + esc(name) + '\')">' +
        '<span class="arrow' + (collapsed ? '' : ' open') + '" id="fga-' + esc(name) + '">\u25B6</span> ' +
        '\uD83D\uDCC1 ' + esc(name) +
        '<span class="file-group-count">' + esc(String(items.length)) + ' Datei' + (items.length !== 1 ? 'en' : '') + '</span>' +
      '</button>' +
      '<div class="file-group-items" id="fg-' + esc(name) + '"' + (collapsed ? ' style="display:none"' : '') + '>';
    items.forEach(function(f) {
      var fullPath = name + '/' + f.path;
      html += '<div class="file-item file-item-clickable" onclick="openFileContent(\'' + esc(fullPath).replace(/'/g, "\\'") + '\')">' +
        '<span class="file-icon">' + fileIcon(f.path) + '</span>' +
        '<span class="file-name" title="' + esc(f.path) + '">' + esc(f.path) + '</span>' +
        '<span class="file-size">' + esc(formatFileSize(f.size)) + '</span>' +
      '</div>';
    });
    html += '</div></div>';
  });

  // Root-level files
  if (rootFiles.length > 0) {
    rootFiles.forEach(function(f) {
      html += '<div class="file-item file-item-clickable" onclick="openFileContent(\'' + esc(f.path).replace(/'/g, "\\'") + '\')">' +
        '<span class="file-icon">' + fileIcon(f.path) + '</span>' +
        '<span class="file-name" title="' + esc(f.path) + '">' + esc(f.path) + '</span>' +
        '<span class="file-size">' + esc(formatFileSize(f.size)) + '</span>' +
      '</div>';
    });
  }

  container.innerHTML = html;
}


// ── File Content Viewer ──────────────────────────────────────
function openFileContent(filePath) {
  var id = getProjectId();
  if (!id) return;

  closeFileModal();

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'fileModal';
  overlay.onclick = function(e) { if (e.target === overlay) closeFileModal(); };
  overlay.innerHTML = '<div class="modal file-modal">' +
    '<button class="modal-close" onclick="closeFileModal()" title="Schlie\u00DFen">\u00D7</button>' +
    '<div class="file-modal-header"><div class="file-modal-info"><div class="file-modal-path">' + esc(filePath) + '</div><div class="file-modal-size">Wird geladen\u2026</div></div></div>' +
    '<div class="file-modal-body"><pre><code>Wird geladen\u2026</code></pre></div>' +
  '</div>';
  document.body.appendChild(overlay);
  document.addEventListener('keydown', fileModalKeyHandler);

  var url = '/api/file-content/' + encodeURIComponent(id) + '/' + encodeURIComponent(filePath);
  fetch(url).then(function(r) {
    if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Fehler'); });
    return r.json();
  }).then(function(data) {
    var modal = document.querySelector('#fileModal .modal');
    if (!modal) return;

    var sizeText = formatFileSize(data.size);
    var headerHtml = '<div class="file-modal-info">' +
      '<div class="file-modal-path">' + esc(data.path) + '</div>' +
      '<div class="file-modal-size">' + esc(sizeText) + '</div>' +
    '</div>';

    var bodyHtml;
    if (data.binary) {
      headerHtml += '<div class="file-modal-actions"></div>';
      bodyHtml = '<div class="file-modal-binary">Bin\u00E4rdatei (' + esc(sizeText) + ')</div>';
    } else {
      headerHtml += '<div class="file-modal-actions"><button class="file-modal-copy" onclick="copyFileContent()" title="Inhalt kopieren">Kopieren</button></div>';
      bodyHtml = '<pre><code id="fileContentCode">' + esc(data.content) + '</code></pre>';
    }

    modal.innerHTML = '<button class="modal-close" onclick="closeFileModal()" title="Schlie\u00DFen">\u00D7</button>' +
      '<div class="file-modal-header">' + headerHtml + '</div>' +
      '<div class="file-modal-body">' + bodyHtml + '</div>';
  }).catch(function(err) {
    var modal = document.querySelector('#fileModal .modal');
    if (!modal) return;
    modal.innerHTML = '<button class="modal-close" onclick="closeFileModal()" title="Schlie\u00DFen">\u00D7</button>' +
      '<div class="file-modal-header"><div class="file-modal-info"><div class="file-modal-path">' + esc(filePath) + '</div></div></div>' +
      '<div class="file-modal-body"><div class="file-modal-binary">Fehler: ' + esc(err.message) + '</div></div>';
  });
}

function closeFileModal() {
  var modal = document.getElementById('fileModal');
  if (modal) modal.remove();
  document.removeEventListener('keydown', fileModalKeyHandler);
}

function fileModalKeyHandler(e) {
  if (e.key === 'Escape') closeFileModal();
}

function copyFileContent() {
  var codeEl = document.getElementById('fileContentCode');
  if (!codeEl) return;
  navigator.clipboard.writeText(codeEl.textContent).then(function() {
    var btn = document.querySelector('#fileModal .file-modal-copy');
    if (btn) {
      btn.textContent = 'Kopiert!';
      setTimeout(function() { btn.textContent = 'Kopieren'; }, 1500);
    }
  });
}

function startFileTreePolling() {
  stopFileTreePolling();
  if (state.phase === 'running' || state.phase === 'complete' || state.phase === 'partial') {
    fileTreeTimer = setInterval(function() {
      if (fileTreeOpen) loadFileTree();
      if (state.phase !== 'running') stopFileTreePolling();
    }, 5000);
  }
}

function stopFileTreePolling() {
  if (fileTreeTimer) { clearInterval(fileTreeTimer); fileTreeTimer = null; }
}
// ── Settings Panel ────────────────────────────────────────────
var SETTINGS_FIELDS = [
  { key: 'agentTimeout',   label: 'Agent-Timeout (ms)',           hint: 'Min: 30.000 / Max: 1.800.000', min: 30000, max: 1800000 },
  { key: 'maxRetries',     label: 'Max. Wiederholungen',          hint: 'Min: 0 / Max: 20',             min: 0,     max: 20 },
  { key: 'retryBaseDelay', label: 'Retry-Basisverz\u00F6gerung (ms)', hint: 'Min: 1.000 / Max: 60.000', min: 1000,  max: 60000 },
  { key: 'maxAgents',      label: 'Max. Agenten',                 hint: 'Min: 1 / Max: 50',             min: 1,     max: 50 },
  { key: 'concurrency',    label: 'Parallelit\u00E4t',            hint: 'Min: 1 / Max: 20',             min: 1,     max: 20 },
  { key: 'maxRounds',      label: 'Max. Runden pro Agent',        hint: 'Min: 1 / Max: 20',             min: 1,     max: 20 },
];

function openSettings() {
  closeSettings();
  fetch('/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
    var overlay = document.createElement('div');
    overlay.id = 'settingsModal';
    overlay.className = 'modal-overlay';
    overlay.onclick = function(e) { if (e.target === overlay) closeSettings(); };

    var fieldsHtml = '';
    for (var i = 0; i < SETTINGS_FIELDS.length; i++) {
      var f = SETTINGS_FIELDS[i];
      var val = cfg[f.key] !== undefined ? cfg[f.key] : '';
      fieldsHtml += '<div class="settings-field">' +
        '<label for="cfg_' + f.key + '">' + esc(f.label) + '</label>' +
        '<input type="number" id="cfg_' + f.key + '" value="' + esc(String(val)) + '" min="' + f.min + '" max="' + f.max + '" step="1">' +
        '<div class="hint">' + esc(f.hint) + '</div>' +
        '</div>';
    }
    fieldsHtml += '<div class="settings-field">' +
      '<label for="cfg_webhookUrl">Webhook URL</label>' +
      '<input type="text" id="cfg_webhookUrl" value="' + esc(cfg.webhookUrl || '(nicht gesetzt)') + '" readonly>' +
      '<div class="hint">Nur per Umgebungsvariable WEBHOOK_URL \u00E4nderbar</div>' +
      '</div>';

    overlay.innerHTML = '<div class="modal settings-modal">' +
      '<button class="modal-close" onclick="closeSettings()" title="Schlie\u00DFen">&times;</button>' +
      '<h3>Einstellungen</h3>' +
      fieldsHtml +
      '<div class="settings-actions">' +
        '<button class="btn-primary" onclick="saveSettings()">Speichern</button>' +
        '<button class="btn-outline" onclick="closeSettings()">Abbrechen</button>' +
      '</div>' +
      '<div class="settings-status" id="settingsStatus"></div>' +
    '</div>';

    document.body.appendChild(overlay);
    document.addEventListener('keydown', settingsKeyHandler);
  }).catch(function(e) {
    console.error('Einstellungen laden fehlgeschlagen', e);
  });
}

function closeSettings() {
  var el = document.getElementById('settingsModal');
  if (el) el.remove();
  document.removeEventListener('keydown', settingsKeyHandler);
}

function settingsKeyHandler(e) {
  if (e.key === 'Escape') closeSettings();
}

function saveSettings() {
  var payload = {};
  for (var i = 0; i < SETTINGS_FIELDS.length; i++) {
    var f = SETTINGS_FIELDS[i];
    var input = document.getElementById('cfg_' + f.key);
    if (input) payload[f.key] = Number(input.value);
  }
  var statusEl = document.getElementById('settingsStatus');
  if (statusEl) { statusEl.className = 'settings-status'; statusEl.textContent = ''; }

  fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
    .then(function(res) {
      if (statusEl) {
        if (res.ok && res.data.ok) {
          statusEl.className = 'settings-status ok';
          statusEl.textContent = 'Einstellungen gespeichert!';
          setTimeout(closeSettings, 1200);
        } else {
          statusEl.className = 'settings-status err';
          statusEl.textContent = res.data.error || 'Fehler beim Speichern';
        }
      }
    }).catch(function(e) {
      if (statusEl) {
        statusEl.className = 'settings-status err';
        statusEl.textContent = 'Netzwerkfehler: ' + e.message;
      }
    });
}



// -- Keyboard Shortcuts ----------------------------------------
function showShortcutsHelp() {
  // Close any existing shortcuts modal
  closeShortcutsHelp();
  var overlay = document.createElement('div');
  overlay.id = 'shortcutsModal';
  overlay.className = 'modal-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) closeShortcutsHelp(); };

  overlay.innerHTML = '<div class="modal" style="max-width:420px">' +
    '<button class="modal-close" onclick="closeShortcutsHelp()" title="Schließen">×</button>' +
    '<h3 style="font-size:16px;font-weight:600;margin-bottom:1rem">Tastenkürzel</h3>' +
    '<div class="shortcuts-grid">' +
      '<kbd>?</kbd><span class="shortcut-desc">Diese Hilfe anzeigen</span>' +
      '<kbd>F1</kbd><span class="shortcut-desc">Diese Hilfe anzeigen</span>' +
      '<kbd>Esc</kbd><span class="shortcut-desc">Modal schließen</span>' +
      '<kbd>d</kbd><span class="shortcut-desc">Dark/Light Mode umschalten</span>' +
      '<kbd>s</kbd><span class="shortcut-desc">Benachrichtigungston ein/aus</span>' +
      '<kbd>r</kbd><span class="shortcut-desc">Projekt zurücksetzen (nur wenn fertig)</span>' +
      '<kbd>1-9</kbd><span class="shortcut-desc">Agent-Details öffnen</span>' +
      '<kbd>f</kbd><span class="shortcut-desc">Suchfeld fokussieren</span>' +
      '<kbd>e</kbd><span class="shortcut-desc">ZIP exportieren (nur wenn fertig)</span>' +
    '</div>' +
  '</div>';

  document.body.appendChild(overlay);
}

function closeShortcutsHelp() {
  var el = document.getElementById('shortcutsModal');
  if (el) el.remove();
}

document.addEventListener('keydown', function(e) {
  // Ignore when typing in input or textarea
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;

  // Ignore if modifier keys are held (except shift for ?)
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  var key = e.key;

  // ? or F1 - show shortcuts help
  if (key === '?' || key === 'F1') {
    e.preventDefault();
    showShortcutsHelp();
    return;
  }

  // Escape - close any open modal
  if (key === 'Escape') {
    var shortcuts = document.getElementById('shortcutsModal');
    if (shortcuts) { closeShortcutsHelp(); return; }
    // Agent modal and settings modal have their own handlers
    return;
  }

  // d - toggle dark mode
  if (key === 'd') {
    toggleDarkMode();
    return;
  }

  // s - toggle sound
  if (key === 's') {
    toggleSound();
    return;
  }

  // r - reset project (only when complete or error)
  if (key === 'r') {
    if (state.phase === 'complete' || state.phase === 'error') {
      resetProject();
    }
    return;
  }

  // 1-9 - open agent modal
  if (key >= '1' && key <= '9') {
    var idx = parseInt(key) - 1;
    if (state.agents && idx < state.agents.length) {
      openAgentModal(idx);
    }
    return;
  }

  // f - focus filter/search input
  if (key === 'f') {
    var filterInput = document.querySelector('.filter-input') || document.querySelector('.modal-search-input');
    if (filterInput) {
      e.preventDefault();
      filterInput.focus();
    }
    return;
  }

  // e - export ZIP
  if (key === 'e') {
    if (state.phase === 'complete') {
      exportProject();
    }
    return;
  }
});

// ── Init ─────────────────────────────────────────────────────
connect();
loadTemplates();
render();
</script>
